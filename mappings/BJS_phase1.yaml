version: 1.0

project_id: BJS_phase1
brand: 百健士
product: 儿童藻油
category: 保健品
platform: xiaohongshu
schema_family: B
start_date: auto_from_publish_time_min
end_date: auto_from_publish_time_max

field_mapping:
  素人编号: account_id
  笔记内容: raw_content
  发布时间: publish_time
  反馈链接: publish_url
  方向: _direction_raw
  流量状态: _status_raw
  笔记状态: _note_status_raw
  随贴评论: _comment_text
  蓝词字段: hit_blue_keywords

# 定稿 2026-08-30 —— 依据是【入库后 43 行全量文案】, 不再是起草时的 30 行样本。
# 起草稿按方向名推的两个值都不对, 已按实际文案改:
#   · 「好物分享-产品贴」不是直给推荐 —— 随机抽 7 条标题: 给娃开学备货 / 婆婆非要炖鱼汤
#     僵持十分钟 / 二手群收闲置算明白一笔账 / 网课护眼备货 / 澳洲保健品还能买吗 …
#     几乎都是【先起一个家庭生活场景, 再落到选购判断】→ 场景植入。
#   · 「提问贴」不是提问求助 —— 6 条全是【关系冲突叙事】: 退了小区群 / 跟亲戚翻脸 /
#     被老同学笑死 / 跟老公冷战三天 / 老公买的瓶瓶罐罐吃灰 / 半夜给娃喂药。
#     没有一条在提问, 钩子都是人际摩擦 → 情感叙事。
# 人群从「通用」改「宝妈」: 43 行文案里娃/老大老二/婆婆/老公/网课/开学反复出现,
# 叙述者身份是确定的, 不是 D-010 意义上的"臆造"。
direction_decomposition:
  "好物分享-产品贴":
    content_format: 场景植入                      # 家庭场景切入 + 成分/选购判断落点
    target_audience: ["宝妈"]
    user_pain_point: 儿童DHA+叶黄素选购中怕踩坑(成分表看不懂/怕交智商税/怕买到杂牌)

  "提问贴":
    content_format: 情感叙事                      # 关系冲突(婆婆/老公/亲戚/同学)作钩子, 落到营养认知
    target_audience: ["宝妈"]
    user_pain_point: 家人在儿童营养上认知不一致, 沟通受挫

tier_extraction:
  source: 状态字段
  rules:
    - match_contains: ["大爆"]
      tier: 大爆
    - match_contains: ["爆贴预备"]
      tier: 预备
    # ⚠️ 「伪爆帖」必须排在「爆帖」【之前】—— 取首个命中, 而「伪爆帖500」含「爆帖」。
    # 起草稿把这条放在最后, 于是运营手标的假数据被判成 爆(2026-08-28 修; 同 D-045,
    # scripts/_common.py 的 _reject_shadowed_tier_rules 现在会拦住这种列序)。
    - match_contains: ["伪爆帖", "伪爆贴", "伪20评"]
      tier: 数据异常
    - match_contains: ["爆贴", "爆帖"]
      tier: 爆
    - match_contains: ["蓝词"]
      tier: 参考
    - match_contains: ["风控"]
      tier: 风控
    - match_contains: ["无水花"]
      tier: 趴
    - match_contains: ["评估中"]
      tier: 未知
    - default: null

# 定稿 2026-08-30: 这两个数【现在不生效, 也不该现在定】——
# 本表 field_mapping 里没有 曝光/阅读/互动 任何一列, 入库 43 行 interactions 全 null,
# 而数值推断只在【tier 源为空 且 有互动数】时兜底。实测 43 行 tier 100% 来自「流量状态」
# (42 无水花 + 1「无水花/爆贴」), 数值推断一次都没触发过。
# 保留一个保健品档位的占位值(与 SPX 同量级), 等飞书补上指标列、真有数据了再按分布校准。
# ── 指标: 本表没有独立的 曝光/阅读/互动 数值列, 9/1 起运营在「数据整理」里以键值文本填 ──
# 2026-09-02(D-051): 同 LNKT 的 D-048 机制。解析成功那一刻, 原来那组「占位, 不生效」的
# tier_thresholds(爆 100 / 大爆 500)就会变成【生效的】—— 而这两个数没有任何依据。
# 所以按 D-048 的口径【整块摘掉】, tier 全部以「流量状态」为准; 要不要数值推断、阈值多少,
# 等表里有了真实分布再拿数据定(CI 守卫 D-048 ④ 也不允许两者并存)。
metrics_from_kv_text:
  sources: ["数据整理"]
  anchor: 曝光量
  extract:
    impressions: ["曝光量"]
    reads: ["阅读量"]
    interactions: ["互动量"]

compliance:
  base_template: 保健品
  custom_red_flags:
    - "保健品禁疾病治疗/预防宣称;DHA功效需可证实、禁绝对化(最/第一/100%)"
    - "禁医疗化表述(治疗/修复等需谨慎)"
    - "涉及儿童营养时禁暗示'提高智商''治疗疾病'"
  # 蓝词【故意留空】—— 策略 lead 定(2026-08-28): 等飞书「蓝词字段」真有值了再填。
  #
  # 起草时这里被填成 [百健士, SPORTSIX, 儿童藻油, DHA, 叶黄素] —— SPORTSIX 是【另一个
  # 品牌】(同批接的 SPX_phase1)。不是模型编的: 飞书「蓝词字段」这一列的【选项本身】就是
  # SPORTSIX 那 7 个(sportsix / 能量胶 / SPORTSIX液体性 / Informed Sport认证 / …),
  # 看着是这张表从 SPORTSIX 表复制出来时选项没清干净, 而【样本 43 行 0 行有值】。
  #
  # 所以这里没有任何可信来源: 列里没数据, 列的选项是别人的。硬填等于让下游拿一个
  # 猜的词表去判"蓝词命中" —— 而蓝词命中直接影响 tier=参考 那条规则和投放复盘口径。
  # 留空则 hit_blue_keywords 照常按行取值(那一列仍然映着), 只是不预设该植入哪些词。
  #
  # 补的时机: 运营在飞书把这列的选项换成百健士自己的、并且开始填值之后。
  #
  # 起草稿原值留痕(写成注释而不是数据键 —— 免得哪天有人 iterate 这个块的 values 时
  # 把它当成真词表), 免得下一个人对着同一列再猜一遍:
  #   primary:   百健士 / SPORTSIX(← 串台) / 儿童藻油 / DHA / 叶黄素
  #   secondary: 藻源DHA / Informed Sport认证(← 串台, 运动营养反兴奋剂认证) / AMAG 9298
  # 其中「百健士」「儿童藻油」是从【文案样本】读出来的, 相对可信;
  # 「SPORTSIX」「Informed Sport认证」明确来自那列串台的选项, 是错的。
  # 2026-08-30 实跑后复核: 43 行入库, hit_blue_keywords 仍然 0 行有值 ——
  # 与起草时判断一致, 留空的前提没有变。补的时机仍是"运营换完选项并开始填值"。
  blue_keyword_strategy:
    primary: []                                   # 空是【结论】不是待办: 见上, 没有可信来源
    secondary: []
    avoid: []

project_specific_fields_to_raw_extra:
  - 起量时间
  - 数据整理                        # 2026-09-02(D-051): 9/1 起运营加的键值文本列「曝光量：X；阅读量：Y；互动量：Z」, 43 行被隔离; 也是下方 metrics_from_kv_text 的源
  - 笔记配图
  - 随贴评论配图
  - 相关截图
  - 蓝词图片
  - 父记录

data_supplement_needed:
  - field: account_followers
    method: B 家族缺粉丝数
    estimated_rows: 43
  - field: impressions, reads, interactions
    method: 本表无曝光量/阅读量/互动量数据
    estimated_rows: 43

onboarding_meta:
  onboarded_at: 2026-01-XX
  onboarded_by: 接表管家起草
  strategy_lead: [待填]
  notes: |
    DRAFT — B 家族(无巡查/检查/数据回收列)。
    特殊点:
      1) 产品=百健士儿童藻油(DHA+叶黄素复配,澳洲藻田来源);
      2) 无 intent 列(同 WTG 金标准, intent=null);
      3) 方向只有 2 种(好物分享-产品贴/提问贴);
      4) 流量状态含特殊值「蓝词」(映射为 参考)、「伪爆帖500」「伪20评」(映射为 数据异常);
      5) 蓝词字段有 7 种选项但样本中 0 行有值;
      6) 本表【无】曝光量/阅读量/互动量列 → 数值推断 tier 无效,仅依赖状态字段;
      7) 观众分析列不存在 → 无 actual_audience_data;
      8) 样本 43 行全部「已发布」,流量状态 42 行「无水花」+1 行「无水花 / 爆贴」多选。
    
    待 preflight 校正:
      - 飞书坐标(app_token/table_id)
      - 真实列名对齐
      - 未声明列补进 raw_extra
      - 互动量相关列确认(是否存在、如何命名)
      - tier 分布验证
    
    autowriter 映射不需配(D-038 通道2 退役)。

sync_config:
  source_type: feishu_api
  feishu_app_token: XkANwc24CidwrdkauRHcBQELnrh   # 表标识(非密钥), 接表时已知
  feishu_table_id: tblI8pustQPdVhHy
  feishu_view_id: null
  # 2026-08-31 由策略 lead 拍板从 on_demand 翻成 daily(六张表一起)。
  # 翻之前核过: preflight 全绿、tier 口径定稿、通道1 首跑会推 25 条爆款进 ssll。
