      10) 「数据整理」列是人工录入的结构化文本(曝光量：X；阅读量：Y；互动量：Z),
          但表里同时有独立的 曝光量/阅读量/互动量 数值列 → 用数值列, 数据整理进 raw_extra。
    preflight 后:
