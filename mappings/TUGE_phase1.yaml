# ════════════════════════════════════════════════════════════════════
# 途鸽求职 · TUGE_phase1 —— Onboarding 草稿(DRAFT · A 家族)
# ════════════════════════════════════════════════════════════════════
# 产品: 留学生归国求职辅导服务(T计划)
# 投放策略: 小红书素人铺量, 以留学生求职焦虑/上岸经历切入, 评论区引导品牌认知
# 真实列名 / 方向取值 / 未声明列 已据 preflight 样本(40 行)起草, 待 preflight 实跑校正。
# ════════════════════════════════════════════════════════════════════

version: 1.0

# ── 项目元数据 ──
project_id: TUGE_phase1
brand: 途鸽                      # [待确认] 品牌名(途鸽求职 / TogoCareer)
product: 留学生归国求职辅导(T计划)  # [待确认]
category: 教育                   # [待确认] 求职辅导/职业教育 → 受控闭集「教育」
platform: xiaohongshu
schema_family: A                 # A 家族(有巡查状态/最近检查时间/主页链接/是否巡查/已确认存活)
start_date: auto_from_publish_time_min
end_date: auto_from_publish_time_max

# ── 字段映射 ── [据 preflight 样本 42 列全覆盖]
field_mapping:
  素人编号: account_id
  笔记内容: raw_content            # 本表内容列叫「笔记内容」(非「文案」)
  发布时间: publish_time
  反馈链接: publish_url
  方向: _direction_raw              # → direction_decomposition(9 基础方向, 多选组合)
  流量状态: _status_raw             # tier 源(多选; 含「关注后续流量 / 爆贴」等组合值)
  曝光量: impressions
  阅读量: reads
  互动量: interactions
  观众分析: _audience_raw           # → actual_audience_data(sync 确定性解析; 样本 14 行有值, 格式符合)
  随贴评论: _comment_text           # → comments 表(Phase2 LLM 解析)
  笔记状态: _note_status_raw        # 工作流状态(非 tier 源; 可检测异常)

# ── intent ──
# 本表【无】「发布笔记」intent 列 → 不做意图分类, notes.intent 留空(WTG 金标准 intent=null)。

# ── 方向拆解 ── [待确认]
# 飞书「方向」9 种基础选项(多选), 实测 14 种取值(含组合)。
# 按 SOP: 只给每个基础方向各写一条, 多选组合由 sync 拆分套用。
# content_format / target_audience / user_pain_point 全标 [待确认]。
direction_decomposition:

  "要不要找机构":                     # 3 条单选 + 3 条组合(含「客资可能」)
    content_format: 提问求助          # [待确认] 纠结要不要报名 → 提问求助/认知重构
    target_audience: ["通用"]         # [待确认] 留学生群体(年轻女性/年轻男性/学生党?)
    user_pain_point: 留学生求职迷茫, 纠结是否需要机构辅导

  "上岸反馈":                         # 9 条单选 + 3 条组合; 数量最多
    content_format: 情感叙事          # [待确认] 上岸经历分享 → 情感叙事
    target_audience: ["通用"]         # [待确认]
    user_pain_point: 求职上岸后的经验复盘与背书

  "服务细节拆解":                     # 8 条单选 + 1 条组合
    content_format: 教程攻略          # [待确认] 拆解服务流程/承诺书 → 教程攻略/认知重构
    target_audience: ["通用"]         # [待确认]
    user_pain_point: 机构服务到底包含什么/如何确认靠谱

  "情绪价值与社会化":                 # 3 条单选 + 1 条组合
    content_format: 情感叙事          # [待确认] 情绪/成长叙事
    target_audience: ["通用"]         # [待确认]
    user_pain_point: 求职过程中的社会化焦虑/情绪崩溃

  "offer 谈薪":                       # 3 条单选 + 1 条组合
    content_format: 教程攻略          # [待确认] 谈薪技巧/信息差科普 → 教程攻略
    target_audience: ["通用"]         # [待确认]
    user_pain_point: 拿到offer后不懂谈薪/被HR压价

  "付款与签约提问帖":                 # 2 条单选 + 2 条组合(含「严格控评」)
    content_format: 提问求助          # [待确认] 付款后求证/求安慰 → 提问求助
    target_audience: ["通用"]         # [待确认]
    user_pain_point: 付费决策焦虑/签约后的不安感

  "客资可能":                         # 0 条单选(仅作组合标签出现)
    content_format: 提问求助          # [待确认] 高转化潜力帖(运营标签)
    target_audience: ["通用"]         # [待确认]
    user_pain_point: 有明确付费意向的求职咨询

  "严格控评":                         # 0 条单选(仅作组合标签出现)
    content_format: 提问求助          # [待确认] 需严格管理评论区(运营标签)
    target_audience: ["通用"]         # [待确认]
    user_pain_point: 高热度帖需评论区维护(运营属性标签)

  "签约顾虑正面答":                   # 2 条单选 + 2 条组合
    content_format: 认知重构          # [待确认] 正面回应签约顾虑 → 认知重构
    target_audience: ["通用"]         # [待确认]
    user_pain_point: 签约前的退费/信任顾虑

tier_extraction:
  source: 状态字段                    # 指示用 _status_raw(即「流量状态」列)
  rules:
    - match_contains: ["大爆"]
      tier: 大爆
    - match_contains: ["爆贴"]        # 匹配「爆贴」(飞书选项; 样本: 关注后续流量 / 爆贴)
      tier: 爆
    - match_contains: ["风控"]        # 匹配「风控中」
      tier: 风控
    - match_contains: ["无水花"]
      tier: 趴
    - match_contains: ["评估中"]      # 匹配「评估中」(样本: 关注后续流量 / 评估中)
      tier: 未知
    - match_contains: ["观察中"]      # TUGE 独有: 冷启动窗口内 → 未知
      tier: 未知
    - match_contains: ["关注后续流量"]  # 单独出现时(不含爆贴/大爆) → 参考
      tier: 参考
    - default: null

# ── 数值推断阈值 ── [待确认]
# 据互动量分布: median≈7, P90≈105, max=209。
# 爆贴样本(流量状态含"爆贴"): 互动 52–209(曝光 387–5721)。
# 推荐起点: 爆=50 / 大爆=200。
tier_thresholds:
  爆: 50                              # [待确认]
  大爆: 200                           # [待确认]

# ── 合规 ── [待确认]
compliance:
  base_template: null                 # [待确认] 教育/职业培训无强制合规模板; 有客户红线再填
  custom_red_flags:                   # [待确认]
    - "禁止虚假就业承诺(如'包就业''100%上岸'等绝对化表述)"
    - "禁止贬低竞品机构(对比可以, 但不能捏造负面)"
    - "价格/退费条款需与合同一致, 禁止夸大或隐瞒"
    - "禁止使用虚假学历/offer截图作为素材"
  blue_keyword_strategy:
    primary: ["途鸽求职", "途鸽", "TogoCareer途鸽求职"]   # [待确认] 据评论关键词列
    secondary: ["T计划", "途鸽T计划"]                     # [待确认]
    avoid: []                                            # [待确认]

# ── 项目专属字段(进 raw_extra) ──
project_specific_fields_to_raw_extra:
  - 主页链接
  - 账号名
  - 笔记ID
  - 平台
  - 笔记链接                # type=20 URL 字段(标题+链接)
  - 已确认存活
  - 笔记配图
  - 维护评论50条            # 预制水军评论(大量文本)
  - 随贴评论配图
  - 评论关键词              # 运营定义的评论区关键词(途鸽/途鸽求职)
  - 评论状态
  - 置顶状态
  - 评论区快照
  - 负面词
  - 负面状态
  - 负面评论快照
  - 相关截图
  - 是否巡查
  - 排队刷新
  - 实时数据.评论数
  - 上次评论数
  - 点赞数
  - 上次点赞数
  - 收藏数
  - 上次收藏数
  - 巡查状态
  - 最近检查时间
  - 数据整理
  - 父记录
  - 诊断信息
  - 连续失败次数

data_supplement_needed:
  - field: account_followers
    method: 本表有「主页链接」但无粉丝数列 → 可通过主页链接调小红书 API 或人工补录
    estimated_rows: 0

# ── Sync 配置 ── (飞书坐标待用户提供)
onboarding_meta:
  onboarded_at: 2025-07-28
  onboarded_by: 接表 agent 起草
  strategy_lead: Ziao / 周哥
  notes: |
    DRAFT —— A 家族(有巡查/检查/主页链接/已确认存活/排队刷新 列)。
    特殊点:
      1) 产品=留学生归国求职辅导(教育/职业培训), 非消费品;
      2) 无 intent 列(同 WTG 金标准, intent=null);
      3) 方向 9 种基础选项(多选), 含运营属性标签「客资可能」「严格控评」;
      4) 流量状态多选(如「关注后续流量 / 爆贴」「重点控评 / 爆贴」);
         tier 提取用 match_contains 按优先级命中(大爆>爆贴>风控>无水花>评估中>观察中>关注后续流量);
      5) 内容列叫「笔记内容」(非「文案」);
      6) 有大量运营监控列(诊断信息/连续失败次数/排队刷新/评论区快照/负面监控等);
      7) 有「维护评论50条」列(预制水军评论, 大文本, 进 raw_extra);
      8) 观众分析格式与 WTG/OKMAN 一致(可解析), 14 行有值;
      9) 评论关键词列(多选: 途鸽/途鸽求职)= 运营定义的蓝词;
      10) 「数据整理」列是人工录入的结构化文本(曝光量：X；阅读量：Y；互动量：Z),
          但表里同时有独立的 曝光量/阅读量/互动量 数值列 → 用数值列, 数据整理进 raw_extra。
    preflight 后:
      - field_mapping 真实列名对齐(确认 42 列全覆盖);
      - 方向多选组合值全命中(14 种取值);
      - 未声明列 → 补进 raw_extra(避免 D-021 整行 quarantine);
      - tier 多选值优先级逻辑验证。
    autowriter 映射不需配(D-038 通道2 退役)。
    合入后: 显式 Daily TV sync(dry_run → 实跑验证) → 验证 OK 再翻 sync_interval=daily → backfill essence。

