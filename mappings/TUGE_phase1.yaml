data_supplement_needed:
  - field: account_followers
    method: 本表有「主页链接」但无粉丝数列 → 可通过主页链接调小红书 API 或人工补录
    estimated_rows: 0

# ── Sync 配置 ── (飞书坐标待用户提供)
onboarding_meta:
  onboarded_at: 2025-07-28
  onboarded_by: 接表 agent 起草
  strategy_lead: Ziao / 周哥
  notes: |
    DRAFT —— A 家族(有巡查/检查/主页链接/已确认存活/排队刷新 列)。
    特殊点:
      1) 产品=留学生归国求职辅导(教育/职业培训), 非消费品;
      2) 无 intent 列(同 WTG 金标准, intent=null);
      3) 方向 9 种基础选项(多选), 含运营属性标签「客资可能」「严格控评」;
      4) 流量状态多选(如「关注后续流量 / 爆贴」「重点控评 / 爆贴」);
         tier 提取用 match_contains 按优先级命中(大爆>爆贴>风控>无水花>评估中>观察中>关注后续流量);
      5) 内容列叫「笔记内容」(非「文案」);
      6) 有大量运营监控列(诊断信息/连续失败次数/排队刷新/评论区快照/负面监控等);
