# ════════════════════════════════════════════════════════════════════
# 途鸽求职 · TUGE_phase1 —— Onboarding 草稿(DRAFT · A 家族)
# ════════════════════════════════════════════════════════════════════
# 产品: 留学生归国求职辅导服务(T计划)
# 投放策略: 小红书素人铺量, 以留学生求职焦虑/上岸经历切入, 评论区引导品牌认知
# 真实列名 / 方向取值 / 未声明列 已据 preflight 样本(40 行)起草, 待 preflight 实跑校正。
# ════════════════════════════════════════════════════════════════════

version: 1.0

# ── 项目元数据 ──
project_id: TUGE_phase1
# 定稿 2026-08-30(依据 40 行入库全量文案)。
# 文案里出现的自称是「途鸽」(「刚给途鸽打了款」), 品牌名确认。
# category 维持「教育」: 受控闭集 14 个值里没有「职业培训」这一档, 最近的就是「教育」——
# 这是闭集的限制不是判断的模糊, 硬造一个新值会撞 notes.category 的 CHECK 约束。
# 本表是全库第一个教育类项目, 后面如果教育类多起来、闭集要不要加档, 是词表侧的议题。
brand: 途鸽
product: 留学生归国求职辅导(T计划)
category: 教育
platform: xiaohongshu
schema_family: A                 # A 家族(有巡查状态/最近检查时间/主页链接/是否巡查/已确认存活)
start_date: auto_from_publish_time_min
end_date: auto_from_publish_time_max

# ── 字段映射 ── [据 preflight 样本 42 列全覆盖]
field_mapping:
  素人编号: account_id
  笔记内容: raw_content            # 本表内容列叫「笔记内容」(非「文案」)
  发布时间: publish_time
  反馈链接: publish_url
  方向: _direction_raw              # → direction_decomposition(9 基础方向, 多选组合)
  流量状态: _status_raw             # tier 源(多选; 含「关注后续流量 / 爆贴」等组合值)
  曝光量: impressions
  阅读量: reads
  互动量: interactions
  观众分析: _audience_raw           # → actual_audience_data(sync 确定性解析; 样本 14 行有值, 格式符合)
  随贴评论: _comment_text           # → comments 表(Phase2 LLM 解析)
  笔记状态: _note_status_raw        # 工作流状态(非 tier 源; 可检测异常)

# ── intent ──
# 本表【无】「发布笔记」intent 列 → 不做意图分类, notes.intent 留空(WTG 金标准 intent=null)。

# ── 方向拆解 ── 定稿 2026-08-30(依据 40 行入库全量文案)
# 飞书「方向」9 种基础选项(多选), 实测 14 种取值(含组合)。
#
# 人群全部由「通用」改「学生党」: 40 行文案里身份是明写的 ——
# 硕士 / 美本top50绩点2.9 / 港硕秋招 / 澳八大 / 25fall悉尼大学传媒硕 / 英硕学市场GPA3.7 /
# 留子 / 秋招 / 网申 / 模拟面试。这不是按"求职辅导应该面向学生"推的, 是文案自己说的。
#
# content_format 起草时是按方向【名字】推的, 这次按真实文案改了 3 个:
# 要不要找机构 / 服务细节拆解 / offer 谈薪 三个方向的文案都不是"教学"或"提问",
# 而是"我原来以为…后来发现…"的认知翻转 → 认知重构。逐条依据写在各条目上面。
direction_decomposition:

  "要不要找机构":                     # 3 条单选 + 3 条组合(含「客资可能」)
    # 起草的「提问求助」不对: 6 条标题没有一条在提问, 全是想明白之后的复盘 ——
    # 「投30份简历无回音, 真的需要人帮」「自己投到害怕....还是得听劝」
    # 「以为工程美硕好进大厂, 脸都打肿了」「简历投了三个月, 发现还不如找求职机构」→ 认知重构。
    content_format: 认知重构
    target_audience: ["学生党"]
    user_pain_point: 留学生求职迷茫, 纠结是否需要机构辅导

  "上岸反馈":                         # 9 条单选 + 3 条组合; 数量最多
    content_format: 情感叙事          # 确认: 爸妈以为我在上海找到工作了其实我一直住青旅 / 低GPA逆袭 / 绩点2.9进四大
    target_audience: ["学生党"]
    user_pain_point: 求职上岸后的经验复盘与背书

  "服务细节拆解":                     # 8 条单选 + 1 条组合
    # 起草的「教程攻略」不对: 不是教人怎么做, 是把签之前看不到的东西揭出来 ——
    # 「扒一扒求职机构服务细节, 有些事不签不知道」「刚拿到承诺书, 大家帮我看看这能信吗」
    # 「留子求职机构的服务承诺书是真要签」→ 认知重构。
    content_format: 认知重构
    target_audience: ["学生党"]
    user_pain_point: 机构服务到底包含什么/如何确认靠谱

  "情绪价值与社会化":                 # 3 条单选 + 1 条组合
    content_format: 情感叙事          # 确认: 重度拖延+社恐被老师硬拽着走到终面 / 我怎么说服我妈交钱
    target_audience: ["学生党"]
    user_pain_point: 求职过程中的社会化焦虑/情绪崩溃

  "offer 谈薪":                       # 3 条单选 + 1 条组合
    # 起草的「教程攻略」不对: 3 条都是"差点吃亏"的信息差揭示, 不是谈薪步骤教学 ——
    # 「差四千块的定级, 这信息差值回票价」「差点被HR坑了!!多亏了求职机构老师拦住我」→ 认知重构。
    content_format: 认知重构
    target_audience: ["学生党"]
    user_pain_point: 拿到offer后不懂谈薪/被HR压价

  "付款与签约提问帖":                 # 2 条单选 + 2 条组合(含「严格控评」)
    content_format: 提问求助          # 确认: 刚给途鸽打了款有报过的来说说吗 / 半夜发疯刚打款有点慌大家快来骂醒我
    target_audience: ["学生党"]
    user_pain_point: 付费决策焦虑/签约后的不安感

  # ⚠️「客资可能」「严格控评」的独立条目已于 2026-08-30 删除。
  # 起草时给它们各建了一条(content_format 只能瞎填一个「提问求助」)。入库 40 行实测:
  # 这两个值【一次都没有单独出现过】, 只作为组合里的第二个词出现 ——
  # 它们是运营标签(转化潜力 / 评论区要盯), 不描述内容形式。
  # 留着等于给一个不存在的方向预置了一个猜的内容形式: 哪天真单独出现了, 会被静默套上
  # 「提问求助」而没人发现。删掉之后若真出现, preflight 会报 dirs_missing(非阻断),
  # 那时看真实文案再建 —— 这条反馈路本来就是设计好的。
  # (组合键仍然保留在下面, 那些行照常拿到 content_format。)

  "签约顾虑正面答":                   # 2 条单选 + 2 条组合
    content_format: 认知重构          # 确认: 逐条审完合同家里才让我付 / 理智分析为什么我最后签了这家
    target_audience: ["学生党"]
    user_pain_point: 签约前的退费/信任顾虑

  # ── 多选组合键(2026-08-30 按 preflight run #24 实测补) ──────────────
  # 飞书「方向」是多选; sync 侧把多选 cell 用 ", " 拼成【一个键】去查
  # direction_decomposition(_common._direction_key), 【不会】自动拆成基础方向
  # ——「多选拆成基础方向分别套用」在 onboarder/README 里还是待办, 没实现。
  # 所以组合值必须显式建键, 否则那些行拿不到 content_format/target_audience。
  # 先例: RIO/TXQ 的「多选组合取基础方向口径」。
  #
  # 下面 4 条的第二个词是【运营标签】(客资可能 / 严格控评), 不描述内容形式,
  # 所以直接沿用前面那个【内容方向】的口径 —— 机械套用, 不是新判断。
  # 2026-08-30 定稿: 前面那些内容方向的 content_format 已按全量文案改过,
  # 这里同步跟着改(要不要找机构 → 认知重构)。
  "要不要找机构, 客资可能":          # 3 条 —— 同「要不要找机构」
    content_format: 认知重构          # 随基础方向「要不要找机构」
    target_audience: ["学生党"]
    user_pain_point: 纠结要不要报机构(附:有客资转化潜力)

  "付款与签约提问帖, 严格控评":      # 2 条 —— 同「付款与签约提问帖」
    content_format: 提问求助          # 随基础方向「付款与签约提问帖」
    target_audience: ["学生党"]
    user_pain_point: 付款/签约后的求证与求安慰(附:需严格控评)

  "上岸反馈, 客资可能":              # 1 条 —— 同「上岸反馈」
    content_format: 情感叙事          # 随基础方向「上岸反馈」
    target_audience: ["学生党"]
    user_pain_point: 上岸后的经历复盘(附:有客资转化潜力)

  "签约顾虑正面答, 严格控评":        # 1 条 —— 同「签约顾虑正面答」
    content_format: 认知重构          # 随基础方向「签约顾虑正面答」
    target_audience: ["学生党"]
    user_pain_point: 签约前的退费/信任顾虑(附:需严格控评)

  # ── 两个【内容方向】相组合的 3 条 —— 2026-08-30 补齐 ──────────────
  # 起草时故意没建这 3 个键, 理由是"取哪个当口径是真判断, 不能机械套用"。
  # 那时只有 30 行样本、这 3 行一条都没抽到, 所以没法判。现在 40 行全在库里,
  # 逐条看真实标题就能定 —— 不再是二选一硬猜:
  "上岸反馈, offer 谈薪":            # 1 条 —— 「留子校招, 差点因为不懂定级少拿钱」
    # 上岸只是背景, 落点是"不懂定级差点少拿钱"这个信息差 → 随 offer 谈薪。
    content_format: 认知重构
    target_audience: ["学生党"]
    user_pain_point: 拿到offer后不懂定级/谈薪, 差点少拿钱

  "上岸反馈, 签约顾虑正面答":        # 1 条 —— 「绩点2.8的澳八大求职记录」
    # 通篇是"我这背景说实话…居然真的熬过来了"的经历复盘 → 随 上岸反馈。
    content_format: 情感叙事
    target_audience: ["学生党"]
    user_pain_point: 低绩点背景求职上岸的经历复盘(兼答签约值不值)

  "情绪价值与社会化, 服务细节拆解":  # 1 条 —— 「留学生秋招焦虑, 模拟面试哭到关麦」
    # 钩子是情绪崩溃现场, 服务细节只是背景 → 随 情绪价值与社会化。
    content_format: 情感叙事
    target_audience: ["学生党"]
    user_pain_point: 秋招压力下的情绪崩溃, 需要被推着走完流程

tier_extraction:
  source: 状态字段                    # 指示用 _status_raw(即「流量状态」列)
  rules:
    - match_contains: ["大爆"]
      tier: 大爆
    - match_contains: ["爆贴"]        # 匹配「爆贴」(飞书选项; 样本: 关注后续流量 / 爆贴)
      tier: 爆
    - match_contains: ["风控"]        # 匹配「风控中」
      tier: 风控
    - match_contains: ["无水花"]
      tier: 趴
    - match_contains: ["评估中"]      # 匹配「评估中」(样本: 关注后续流量 / 评估中)
      tier: 未知
    - match_contains: ["观察中"]      # TUGE 独有: 冷启动窗口内 → 未知
      tier: 未知
    # ⚠️「关注后续流量 → 参考」这条已于 2026-08-30 删除。
    # 入库 40 行实测: 这个值【从不单独出现】, 4 次全是组合 ——
    #   关注后续流量/爆贴 ×6 · 关注后续流量/无水花 ×1 · 关注后续流量/大爆 ×1 · 关注后续流量/评估中 ×1
    # 它是"这条后面还要盯"的关注标记, 不是质量判断。而多选取各 token 的最高档,
    # 于是它把运营亲口写的「无水花」和「评估中」两行【顶成了 参考】——
    # 参考是进飞轮的(fetch_pending_baokuan 收 爆/大爆/参考), 等于一条运营说"没水花"的帖
    # 被送进了写作引擎的参考池。删掉后这两行落回 趴 / 未知, 都不进飞轮, 与运营口径一致;
    # 与爆贴/大爆组合的 7 行不受影响(本来就由那个 token 定档)。
    # 若哪天它真的单独出现 → default: null(未定), 比造一个 参考 诚实。
    - default: null

# ── 数值推断阈值 ── 定稿 2026-08-30: 全量分布【证实】了起草值, 不改
# 40 行入库后按运营自己的标注对拍(口径同 SPX/XIWU: 阈值只在状态列为空时兜底,
# 职责是别把趴推成爆, 所以卡在"确定趴的上限"与"运营标爆的下限"之间):
#   确定趴(16 行)     互动最高 = 14
#   运营标爆的 7 行   = 52 / 102 / 103 / 105 / 113 / 149 / 152
#   运营标大爆的 1 行 = 209
#   → 14 与 52 之间无重叠, 爆=50 正落在空档里 ✓
#   → 152 与 209 之间无重叠, 大爆=200 正落在空档里 ✓
# 本表是三张有指标的表里唯一起草值就对的 —— 因为起草时的 40 行样本恰好就是全表。
tier_thresholds:
  爆: 50                              # 确定趴上限 14 < 50 ≤ 运营标爆下限 52
  大爆: 200                           # 运营标爆上限 152 < 200 ≤ 运营标大爆 209

# ── 合规 ── 定稿 2026-08-30
compliance:
  # base_template 维持 null: 本仓的 compliance 模板是按【品类】建的(处方药/OTC药/保健品/
  # 医疗器械/家居家电…), 教育类目前没有模板, 而本表是全库第一个教育项目。
  # 与其为一张表现造一个模板, 不如把红线写在 custom_red_flags 里 —— 等教育类再多两张,
  # 共性稳定了再抽模板。null 在这里是【结论】不是缺项。
  base_template: null
  # 前 4 条沿用起草稿(教育/求职服务的通用红线)。后 2 条是看完 40 行真实文案新加的:
  # 「上岸反馈」9 条全在晒 offer 与定级薪资(差四千块的定级 / 多出整整2k), 而
  # 「付款与签约提问帖」在晒具体金额(36800 / 34800 / 32800 / 晚上刷了三万多)。
  # 前者容易滑成就业与薪资承诺, 后者是真实价格外露 —— 都得明确划线。
  custom_red_flags:
    - "禁止虚假就业承诺(如'包就业''100%上岸'等绝对化表述)"
    - "禁止贬低竞品机构(对比可以, 但不能捏造负面)"
    - "价格/退费条款需与合同一致, 禁止夸大或隐瞒"
    - "禁止使用虚假学历/offer截图作为素材"
    - "晒 offer/定级/涨薪只能作个人经历陈述, 禁表述成机构可交付的结果(如'报了就能进四大''帮你多谈2k')"
    - "正文出现具体成交价必须与当期真实价格一致, 禁用已下线的价格或编造的折扣"
  # 定稿依据: 「评论关键词」列 40 行里 33 行有值, 取值【只有一种】: ["途鸽","途鸽求职"]。
  # 起草稿 primary 里的「TogoCareer途鸽求职」实测一次都没出现过(来自字段选项而非实际值),
  # 降到 secondary; secondary 原有的「T计划」「途鸽T计划」同样未在该列出现, 一并保留在
  # secondary —— 它们是产品名(product 字段里就是 T计划), 作次级词合理, 但不当主词用。
  blue_keyword_strategy:
    primary: ["途鸽", "途鸽求职"]
    secondary: ["TogoCareer途鸽求职", "T计划", "途鸽T计划"]
    avoid: []

# ── 项目专属字段(进 raw_extra) ──
project_specific_fields_to_raw_extra:
  - 主页链接
  # ── 2026-09-02 新列(D-051): 运营 8/31 起加的两列, 一出现整表 231 行全被 D-021 隔离(含原来 40 行好的)──
  - 下次巡查时间                    # 公式列(Excel 序列日), 每行都有值 → 不声明就全表隔离
  - 起量时间                        # 同 BJS/LNKT/XIWU 先例: 不作 tier 源, 进 raw_extra 留痕
  - 账号名
  - 笔记ID
  - 平台
  - 笔记链接                # type=20 URL 字段(标题+链接)
  - 已确认存活
  - 笔记配图
  - 维护评论50条            # 预制水军评论(大量文本)
  - 随贴评论配图
  - 评论关键词              # 运营定义的评论区关键词(途鸽/途鸽求职)
  - 评论状态
  - 置顶状态
  - 评论区快照
  - 负面词
  - 负面状态
  - 负面评论快照
  - 相关截图
  - 是否巡查
  - 排队刷新
  - 实时数据.评论数
  - 上次评论数
  - 点赞数
  - 上次点赞数
