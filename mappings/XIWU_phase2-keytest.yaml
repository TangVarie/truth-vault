# ════════════════════════════════════════════════════════════════════
# XIWU_phase2-keytest · 西屋 911GT 蓝词测试批 —— 接表草稿(DRAFT · A 家族)
# ════════════════════════════════════════════════════════════════════
# 起草依据: 本次给的【字段清单 52 列 + 全表 distinct + 8 行文案样本】。
# 同一个 base(P0YbbWpIUa6PsBsPi9pcApGknLf)下已有 XIWU_phase1(GT33)和 XIWU_phase2(911GT),
# 列结构基本沿用 phase2, 但这一张多出一整套「蓝词/评估/维护/整理」列 —— 见 review brief。
#
# 关键数字(全表 **165 行**, 由「文案」165 个不同值推出):
#   方向        流量贴 146 / 产品贴 19(两值合计 = 165, 每行恰好一个)
#   流量状态    无水花 107 / 观察中 32 / 大爆 1 = 140 行; 另 25 行空
#   笔记状态    已发布 140 / 可发布 25 = 165 行  → 25 行空状态 = 未发布的「可发布」行, 对得上
#   评论数      140 行有值, 除 1 行 130 外最高 19
#   互动数/互动量 最高 9(105 行有值), 典型早期铺量表
#   蓝词字段    74 个不同取值 / 选项 129 个 ← 本表是蓝词测试批, 这一列是主角
#
# ⚠️ 本表特殊点(与 phase1/phase2 的差异, 逐条在下面就近注明):
#   1) 多出「蓝词来源」「评估基线评论数/时间」「维护情况/时间/效果」「整理状态/整理时评论数/
#      整理时互动数」「作品ID」「已删除评论数/留底」—— 全部按 raw_extra 声明(漏一列整行 quarantine, D-021);
#   2) 「观众分析」只有 1 行有值且是【解析失败提示文案】(不是分布数据) → 按原列名进 raw_extra,
#      不映 _audience_raw(否则 sync 无条件消费、parse 出 None, 原始文本还没人接 —— 见 docs/03 该行条件);
#   3) 「笔记状态」的选项里有「重点关注⭐️」「一轮维护」—— 含「关注」二字, 会误触 WTG 那套
#      「_note_status_raw 含'关注' → synthetic(伪爆贴)」的判定, 已列为待拍板项;
#   4) 指标列同时有「互动量」和「互动数」两列, 实测逐条相等 —— 按 phase2 口径「互动数」进
#      interactions, 「互动量」进 raw_extra;
#   5) 蓝词状态「观察中」×32 疑与「蓝词来源」里的【观察中】标注同源(不是冷启动窗口), 已列入待确认。
# ════════════════════════════════════════════════════════════════════

version: 1.0

# ── 项目元数据 ──
# ⚠️ project_id 带连字符(-keytest), 与全库其余 project_id(下划线)写法不同。
#    草稿按给定值原样用; 是否该独立成一个 project(还是 phase2 的一个批次/视图)见 review brief 第 1 条。
project_id: XIWU_phase2-keytest
brand: 西屋                      # 沿用 XIWU_phase1/phase2 定稿(策略 lead 2026-08-28): 按摩椅算家居家电, 不按医疗器械
product: 按摩椅911GT             # [待确认] 本批文案样本全是 911GT; 但蓝词选项里 GT33(phase1 型号)也还在 —— 见 brief 第 6 条

brand_aliases:
  # 全部引自本表「蓝词字段」的实测取值(不是推的), 喂 feature_bank 的品牌词典。
  # ⚠️ 守卫 no_brand_dict 只在词典为空时触发, 挡不住「词典非空但一个词都匹配不上」。
  - 西屋911gt
  - 西屋911GT
  - 911gt
  - 911GT
  - 西屋的911GT
  - 911gt西屋按摩椅
  - 西屋按摩椅
category: 家居家电                 # 同 phase1/phase2(策略 lead 8-28 定: 按摩椅按家居家电, 不按医疗器械)
platform: xiaohongshu
schema_family: A                  # 指纹: 有「巡查状态」「最近检查时间」「是否巡查」「已确认存活」(A 家族巡查列族);
                                  # 无「主页链接」「数据回收情况」→ A 的另两枚指纹缺, 但 2/4 已足(同 XIWU_phase1 情形)。
                                  # ⚠️ 命名偏差: 本表指标用「量」(曝光量/阅读量/互动量)而非 docs/03 说的 A 家族「数」——
                                  #    A 家族里 phase1 是「数」、phase2/本表是「量」, 说明这一族本来就不统一, 按实际列名映即可。
start_date: auto_from_publish_time_min
end_date: auto_from_publish_time_max
# ⚠️ 「发布时间」13 个取值合计 151 行, 少于全表 165 行 → 约 14 行无发布时间(应与「可发布」未发布行重叠)。
#    auto_from_publish_time_min/max 照常可用, 但这些行 publish_time 会是 NULL。

# ── 标题怎么拿 (docs/28 §3 第 4 条, D-065 续) ──
# column = notes.title 列 / markers = 从 raw_content 的标记切 / none = 没有标题
title_extraction: markers          # 文案样本全部是「【标题】…【正文】…」, 解析器直接认

# ════════════════════════════════════════════════════════════════════
# 字段映射 — 52 列全部交代(13 进 typed 列/中间变量 + 39 进 raw_extra), 一条不漏
# ════════════════════════════════════════════════════════════════════
field_mapping:
  # ── 标识 ──
  素人编号: account_id              # → notes.account_id (FK to accounts); 140 个不同值 / 165 行(一人多篇)

  # ── 内容 ──
  发布时间: publish_time            # epoch ms
  反馈链接: publish_url             # 全为 xhslink.cn 短链
  文案: raw_content                 # 【标题】+【正文】, 165 行全有

  # ── tier 源 ──
  # 与 WTG/RIO表1/OKMAN/XIWU_phase1/phase2 同款: 状态拆两列, 「流量状态」= 表现/tier 源, 「笔记状态」= 工作流
  流量状态: _status_raw             # 多选; 实测 无水花107/观察中32/大爆1

  # ── 工作流状态(非 tier 源) ──
  笔记状态: _note_status_raw        # 已发布140/可发布25; ⚠️ 选项含「重点关注⭐️」「一轮维护」——见 brief 第 9 条

  # ── 方向 ──
  方向: _direction_raw              # 多选, 但实测每行只取一个值: 产品贴/流量贴 → direction_decomposition

  # ── 数据回收 ──
  # 三列都是 type=20(公式), 取值为纯数字(20/86/431…), parse_numeric 直接吃得下。
  曝光量: impressions               # 87 个不同值
  阅读量: reads                     # 47 个不同值
  互动数: interactions              # 9 个不同值(0–9); 「互动量」同列名并存, 按 phase2 口径留 raw_extra(见下)

  # ── 判爆依据 ──
  实时数据.评论数: comments_count   # D-062: 判爆只看评论数(巡查机器人实时抓); 140 行有值, 最高 130

  # ── 评论 ──
  随贴评论: _comment_text           # → comments 表(Phase 2 LLM 解析); 147 个不同值

  # ── 蓝词(事后命中) ──
  蓝词字段: hit_blue_keywords       # → notes.hit_blue_keywords; 74 个不同取值, 本表的核心维度

# ── intent ──
# 本表【无】「发布笔记」intent 列 → 不做意图分类, notes.intent 留空(WTG 金标准 intent=null)。
# 因此: 不写 intent_mapping(写了是死配置, sync 不会用), 也不给任何方向造 intent_override。

# ════════════════════════════════════════════════════════════════════
# 方向拆解 —— 2 个基础方向, 各一条(多选组合值不单独建条目, 由 sync 拆成基础方向分别套用)
# ════════════════════════════════════════════════════════════════════
# 「方向」是 type=4 多选, 但本表 distinct 只有两个值、且两值计数相加正好等于行数 → 实际全单选。
direction_decomposition:

  "产品贴":                         # 19 行; 8 行文案样本【全部】落在这一支, 所以这 19 行有实据可看
    # ⚠️ 草稿给「认知重构」而不是 phase2 定稿的「场景植入」, 理由在标题里、不在方向名里:
    #   「买按摩椅别图轻，懂行都看这个核心指标⚠️」/「扒一扒被懂行人疯抢的按摩椅，底气在哪？」/
    #   「给爸妈选按摩椅别踩坑！这几点要看清🛑」/「按摩椅带记忆🎉再也不用和家属抢设置」
    #   —— 结构统一是「先立一个大多数人的错误认知(越轻越好 / 网红牌子 / 只看品牌), 再拿参数打掉它
    #   (113kg 底盘 / 4D 齿轮弹簧机芯 / 5 区独立调力 / 记忆键)」, 落点是参数教育不是生活场景。
    #   而 phase2 那 19 篇是「产品已经在生活里被用起来」(爸妈天天按 / 老公当带薪休假)。
    #   两批同一运营、同一 base, 口径却不一致 —— 这是要拍板的第一项(见 brief 第 2 条), 不自行定死。
    content_format: 认知重构        # [待确认] phase2 先例为 场景植入
    target_audience: ["通用"]       # [待确认] 样本里叙述者身份是散的: 替爸妈买的子女 / 打工人 /
                                    #   1米9壮汉的家属 / 生理期的「怕疼星人」→ 闭集内无更准的档, 不臆造(D-010)
    user_pain_point: 花一万多买按摩椅前看不懂参数(机芯真假 / 底盘轻重 / 分区调力), 怕交智商税

  "流量贴":                         # 146 行; ⚠️ 本次 8 行样本里【一条都没有】, 下述为沿用 phase2 口径的占位
    content_format: 提问求助        # [待确认] 无样本, 沿用 XIWU_phase2 定稿; 待拉全表后按真实标题复核
    target_audience: ["通用"]       # [待确认] phase2 的结论(人群散, 不硬塞伴侣家人)
    user_pain_point: 花一万多买按摩椅前拿不准(力度合不合身 / 家人能不能共用 / 售后)   # [待确认]

# ════════════════════════════════════════════════════════════════════
# tier 抽取(流量状态 → tier)
# ════════════════════════════════════════════════════════════════════
# 本表 9 个选项: 无水花 / 风控中 / 爆帖预备 / 爆贴 / 大爆 / 蓝词 / 评估中 / 疑似限流 / 观察中
# 实测只出现 3 个: 无水花107 / 观察中32 / 大爆1(= 140 行, 与「已发布」行数一致);
# 25 行「可发布」无流量状态 → 走 default: null。
#
# ⚠️ 规则顺序有硬约束: 「爆帖预备」里含「爆帖」, 取首个命中 → 预备必须排在爆【之前】,
#    否则爆帖预备会被判成爆(BJS 就是这么静默失效的, D-045; 脚本 _reject_shadowed_tier_rules 会拦)。
tier_extraction:
  source: 状态字段                  # 指向「流量状态」→ _status_raw
  rules:
    - match_contains: ["大爆"]
      tier: 大爆
    - match_contains: ["爆帖预备", "爆贴预备"]      # 两种拼写均覆盖(本表选项是「爆帖预备」)
      tier: 预备
    - match_contains: ["爆贴", "爆帖"]              # 覆盖「爆贴」「爆帖」
      tier: 爆
    - match_contains: ["疑似限流"]                  # 本表独有选项 → 风控(同 HATHERINE「疑似限流」先例)
      tier: 风控
    - match_contains: ["风控"]                      # 覆盖「风控中」(放疑似限流之后, 两者都归风控)
      tier: 风控
    # ⚠️ [待确认] 「蓝词」这一档是本表的关键判断, 见 review brief 第 7 条:
    #    OKMAN 判 参考(参考会进飞轮 fetch_pending_baokuan), SPX 2026-08-30 改成 未知
    #    (蓝词是关键词覆盖信号, 不是内容质量判断, 不该喂写作引擎)。
    #    本表是蓝词测试批, 这个值大概率会大量出现, 影响面比 OKMAN/SPX 都大。
    #    草稿取 SPX 口径 = 未知(不下结论), 请策略 lead 定。
    - match_contains: ["蓝词"]
      tier: 未知
    - match_contains: ["无水花"]
      tier: 趴
    - match_contains: ["评估中"]
      tier: 评估中
    # ⚠️ [待确认] 「观察中」在本表可能与蓝词命中挂钩, 而不是冷启动窗口 ——
    #    「蓝词来源」的 3 行取值为「2026-10-23 16:11 【观察中】西屋911GT ← …」/「【大爆】西屋911GT ← …」,
    #    即观察中/大爆这两个标注是机器人按蓝词捕获时打上的。若确认同源, 这 32 行「观察中」的语义
    #    就是"蓝词观察中"而非"冷启动", 落到 未知 是否仍合适要重判(brief 第 8 条)。
    - match_contains: ["观察中"]      # 冷启动窗口 → 未知(同 HATHERINE_phase1 / XIWU_phase2)
      tier: 未知
    - default: null

# ── 数值推断阈值: 不配项目级覆盖(D-062, 2026-09-17)────────────────────────────
# 全库统一: 判爆只看 comments_count, 爆≥50 / 大爆≥100, 由同步脚本推断; 项目级互动量阈值整块作废。
# 顺带记一个实测(不是建议, 是核对结果): 本表 140 行有评论数, 除那 1 行 130 外最高只有 19 ——
# 统一阈值在这张表上正好只命中 130 那 1 行, 与运营手标的「大爆」是同一条, 没有误伤趴贴。
# 所以这里不需要任何本表专属的数; 有 row 级 tier 源在, 数值推断只是兜底。

# ════════════════════════════════════════════════════════════════════
# 合规配置 —— [待确认](沿用 phase1/phase2 模板 + 按本批真实文案补 3 条)
# ════════════════════════════════════════════════════════════════════
compliance:
  base_template: 家居家电           # 与 category 一致; 策略 lead 已定不走医疗器械档
  custom_red_flags:                 # [待确认]
    # —— 前 4 条沿用 phase1/phase2 定稿(同一类产品, 同一套风险)——
    - "家居家电/按摩椅: 禁止宣称医疗功效(治疗腰椎间盘突出/颈椎病等疾病)"
    - "禁止绝对化表述(最好用/唯一/根治)"
    - "禁对有基础病或植入器械的人群(心脏支架/起搏器/骨质疏松/椎间盘突出/术后)给出能不能用的判断, 一律引导问医生"
    - "涉及孕期/老人/儿童使用场景时, 只讲自身体验, 禁给使用时长与强度建议"
    # —— 后 3 条是看完本批 8 行文案新加的(不是模板抄的)——
    - "禁把机构/医师背书当卖点: 样本出现「中美医师的双重推荐」「深圳市人体工程学应用协会认证」—— 只能陈述真实有效的认证, 且不得演绎成'医生推荐使用'"
    - "禁解剖/穴位层面的功效化表述:样本有「穴位找得特别准」「避开容易受伤的骨头」「只往肌肉上发力」, 属把家电写成理疗器械的口吻"
    - "禁与竞品做贬损性对比:负面词列已挂 15 个竞品名(荣泰/奥佳华/邦乐健/东方神/艾力斯特/瑞多/osim/凯伦诗/荣康/松胜/ihoco/美凯龙/太阳神等), 贴词可以, 捏造负面不行"
  blue_keyword_strategy:            # [待确认] 见 review brief 第 6 条 —— 本表 129 个选项里约 40+ 是竞品词
    # 草稿只取【本品牌自己的】词, 全部来自「蓝词字段」的实测取值, 不是编的:
    primary: ["西屋911GT", "西屋911gt", "911gt", "西屋按摩椅"]
    secondary: ["西屋", "西屋的911GT", "911gt西屋按摩椅"]
    avoid: []                       # 故意留空: 竞品词该不该算"可投"还是"禁投", 是策略判断, 不替人拍
                                    # (先例: XIWU_phase1 直接没列竞品词; OKMAN 的 avoid 放的是违禁表述而非竞品)

# ════════════════════════════════════════════════════════════════════
# 项目专属字段 → raw_extra (allowlist · 39 列)
# ════════════════════════════════════════════════════════════════════
# 未在此声明又没进 field_mapping 的列 → 整行 quarantine(D-021), 会丢真笔记。52-13 = 39, 一条不漏。
project_specific_fields_to_raw_extra:
  # ── 图片/附件(不处理, 留痕) ──
  - 发布截图
  - 内容配图
  - 评论配图
  - 相关截图
  - 蓝词图片                        # 本期 0 行有值, 保留前向 allowlist
  - 已删除评论留底                  # 26 行有值(巡查删评截图), 与「已删除评论数」配套

  # ── 巡查/监控列族(A 家族机器人产物, 全部留痕) ──
  - 是否巡查
  - 巡查状态                        # 本期 正常×140
  - 已确认存活                      # True×140
  - 最近检查时间
  - 下次检查时间                    # 公式列(Excel 序列日 46321.67…)
  - 连续失败次数                    # 0×140
  - 排队刷新                        # False×140
  - 诊断信息                        # 机器人给的判据文本(如"发布 376 小时评论数仍只有 0 → 无水花")
  - 上次评论数                      # 上一轮快照(119/130 等), 与「实时数据.评论数」配对算增量
  - 是否截图                        # 未截图×99
  - 评论状态                        # 显示评论×90 / 没有显示×50
  - 置顶状态                        # 无置顶×139 / 置顶成功×1
  - 评论区快照
  - 负面状态                        # 无负面×133 / 有负面×7
  - 负面评论快照                    # 命中竞品评论的原文(7 行)
  - 负面词                          # 全表同一串 15 个词 → 是【列级配置】不是行级判断, 只留痕
  - 评论关键词                      # 运营定义的评论区蓝词(西屋 / 911×140)——同 TUGE/OKMAN/ANSHEN 先例, 不进 hit_blue_keywords
  - 已删除评论数                    # 1–5 条, 7 行有值(与「有负面」7 行一一对应)

  # ── 起量 ──
  - 起量时间                        # 仅 1 行; 不作 tier 源, 留痕(同 BJS/LNKT/XIWU_phase1 先例)

  # ── 指标副本/汇总 ──
  - 互动量                          # 与「互动数」并存, 实测逐条相等; 按 phase2 口径进 raw_extra
                                    # ⚠️ 两列【永不】同时映 interactions; 「永不」也适用于 曝光/阅读:
                                    #    本表没有「曝光副本/阅读副本」, 不必管
  - 数据整理                        # 键值文本「曝光量：X；阅读量：Y；互动量：Z」, 与三列数值实测一致。
                                    # 不作为 metrics_from_kv_text 源 —— 表里已有 typed 数值列, 用数值列
                                    # (同 TUGE 先例); 两处都接会变成两个来源互相覆盖
  - 整理状态                        # 已整理×88
  - 整理时评论数
  - 整理时互动数
  - 作品ID                          # 0 行有值, 前向 allowlist(小红书 note id 将来可能要回填)

  # ── 观众分析: 按【原列名】进 raw_extra —— 这里是有意的, 不是漏映 ──
  - 观众分析                        # 全表 1 行有值, 内容是「当前所有截图中未展示可提取的男女分布、年龄分布、
                                    # 城市分布相关有效数据，无对应内容输出。」= 解析失败提示, 不是分布数据。
                                    # 映 _audience_raw 的话 sync 会无条件消费它、parse 出 None, 该列既没解析
                                    # 也没留 raw_extra → 丢数据(docs/03 对该列的条件要求)。
                                    # 运营将来真填出「性别分布：…；年龄分布：…」时, 再上移成 _audience_raw
                                    # (先例: LNKT 可解析→_audience_raw; NUC 多空→raw_extra)。

  # ── 蓝词来源 ──
  - 蓝词来源                        # 3 行; 格式「2026-10-23 16:11 【观察中】西屋911GT ← 作者: 评论/正文片段」
                                    # → 记录了【哪条蓝词、以什么状态、从谁的哪句话】命中。是本表
                                    # 「观察中/大爆」标注的来源证据, 不要丢; 也可能就是 tier 判定的上游

  # ── 投流/维护三件套(2026-09-22 运营口径, 本表第一次在这个 base 出现) ──
  - 维护情况                        # 多选·多义: 铺评完成度(关注=已做20条 / 重点关注⭐️=已做50条 /
                                    # ✅=需要做50条待办) · 投流(日期+🍟) · 控评置顶。
                                    # 本表实测只有 1 个取值「一轮维护」→ 只是第一档铺评完成度。
                                    # ⚠️ 留空 = 没做维护(运营 2026-09-22 确认), paid_promoted 可判 false
  - 维护时间                        # 本表只有 1 行「10月19日」
  - 维护效果                        # 本表只有 1 行「20条评论」——是【条数】不是曝光差额, 与其它表的
                                    # 「投流前后曝光量差额」语义不同, 不要跨表当同名列洗数
                                    # ⚠️ 这三列【永不】映 impressions/reads/interactions/comments_count

  # ── 评估基线(新机制, 本表首见, 全空) ──
  - 评估基线评论数                  # 0 行有值。名字指向"按评论数做 tier 评估时的基线快照"——
                                    # 与 D-062 的评论数口径同向。哪天它开始有值并且被测,
                                    # 要考虑升 typed 列(它可能承载 tier 断点), 先声明防 quarantine
  - 评估基线时间                    # 0 行有值, 同上

  # ── 冗余列 ──
  - 平台                            # 小红书×140(已知 platform) —— 同 SPX/ANSHEN 先例

