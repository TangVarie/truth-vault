# ════════════════════════════════════════════════════════════════════
# XIWU_phase1 · 西屋按摩椅 —— Onboarding 草稿(DRAFT · A 家族)
# ════════════════════════════════════════════════════════════════════
# 产品: 西屋按摩椅(型号 GT33 为主力 SKU, 含白色款)
# 投放策略: 小红书素人铺量, 以提问求助/情感叙事切入, 评论区植入品牌/型号
# 真实列名 / 方向取值 / 未声明列 已据 30 行样本 + 字段清单起草;
# 待 preflight 拉全表校正(尤其 direction_decomposition 的真实组合取值)。
# ════════════════════════════════════════════════════════════════════

version: 1.0

# ── 项目元数据 ──
project_id: XIWU_phase1
# 定稿 2026-08-30(依据 300 行入库文案 + 83 行真实蓝词取值)。
# 蓝词实测 12 种取值全部指向同一型号: 西屋gt33 / 西屋GT33 / GT33 / GT33白色款 /
# 西屋按摩椅gt33 / 西屋的gt33 / gt33靠墙放 / 精钢机芯 / 西屋的腰背热敷功能。
# 本期在售只有 GT33 一个型号, 所以 product 带上型号比写成泛品类更准
# (项目本来就是 phase1 分期的, 换代时开 phase2)。
brand: 西屋
product: 按摩椅GT33
# 策略 lead 定(2026-08-28): 按摩椅【算家居家电】, 不按医疗器械。
# 即红线按家居家电这档走(禁宣称治疗腰椎间盘突出/颈椎病、禁绝对化),
# 不需要升级到医疗器械模板。
category: 家居家电
platform: xiaohongshu
schema_family: A                # 有「是否巡查」「巡查状态」「最近检查时间」「已确认存活」→ A 家族指纹成立
                                # ⚠️ 但本期这 4 列全部为空(distinct=0); 保留为前向 allowlist, 同 OKMAN_phase1 先例
start_date: auto_from_publish_time_min
end_date: auto_from_publish_time_max

# ════════════════════════════════════════════════════════════════════
# 字段映射 — 30 列全部交代(13 进 typed 列/中间变量 + 17 进 raw_extra), 一条不漏
# ════════════════════════════════════════════════════════════════════
field_mapping:
  # ── 标识 ──
  素人编号: account_id              # → notes.account_id (FK to accounts)

  # ── 内容 ──
  文案: raw_content                 # → notes.raw_content [NOT NULL]
  发布时间: publish_time            # → notes.publish_time (datetime)
  反馈链接: publish_url             # → notes.publish_url

  # ── tier 源 ──
  # 本表与 WTG/RIO表1/TXQ/OKMAN 同款: 状态拆两列(发布状态=工作流, 流量状态=表现/tier 源)
  流量状态: _status_raw             # → tier_extraction → notes.tier

  # ── 方向 ──
  方向: _direction_raw              # → direction_decomposition (流量贴 / 产品贴)

  # ── 数据回收(数字, parse_numeric 自动转) ──
  曝光数: impressions               # 本表用「数」(A 家族 WTG 表用「量」; 本表用「数」, 同 RIO表2/docs/03 先例)
  阅读数: reads
  互动数: interactions

  # ── 蓝词(事后命中蓝词) ──
  蓝词字段: hit_blue_keywords       # → notes.hit_blue_keywords (82 行有值; 13 种选项已知)

  # ── 评论 ──
  随贴评论: _comment_text           # → comments 表(Phase 2 LLM 解析)

  # ── 观众分析 → 确定性解析进 actual_audience_data ──
  # 样本中有值行格式为「性别分布：男性42%，女性58%；年龄分布：...；城市分布：...」
  # 与 WTG/TXQ/OKMAN 的 _audience_raw 格式一致, 可确定性解析。
  # ⚠️ 部分行观众分析内容为「性别分布：；年龄分布：；城市分布：」(键有值但数值空) —— sync 解析出 null 正常, 不影响入库
  观众分析: _audience_raw           # → notes.actual_audience_data (JSONB)

  # ── 笔记状态 → 检测伪爆贴 ──
  # 发布状态选项含「已发布/预备内容/待发布/定时发布/内容待定/待审稿/修改中」;
  # 30行样本全为「已发布」; 若出现「关注」等人工假数据信号 → synthetic flag
  发布状态: _note_status_raw        # → 含"关注"则 data_quality_flags.synthetic=true

# ── intent ──
# 本表【无】「发布笔记」intent 列 → 不做意图分类, notes.intent 留空(WTG/TXQ/OKMAN 金标准 intent=null)

# ════════════════════════════════════════════════════════════════════
# 方向拆解 —— 定稿 2026-08-30(见下方逐条依据)
# ════════════════════════════════════════════════════════════════════
# 飞书「方向」distinct: 流量贴×184 / 产品贴×38; 仅 2 种取值, 全单选无组合。
# 注意: 字段清单选项里有「提问帖」「产品贴(重复)」「流量贴」, 但 distinct 实际只出现「流量贴」「产品贴」。
# 「提问帖」在 distinct 中未出现 → 不建条目(出现时 preflight 会报 dirs_missing, 届时补)。
#
# 文案样本全部是「流量贴」, 风格高度一致: 提问求助(「求推荐」「有没有姐妹」「先斩后奏成功过吗」)
# + 情感场景(父母腰背/产后/送礼/打工人颈椎) + 评论区植入西屋品牌/GT33型号。
# 「产品贴」在样本中无例, 推断为直接产品介绍/横评; 待 preflight 看真实文案确认。
#
# ⚠️ 流量贴内部场景差异较大(送礼父母/产后宝妈/打工人/学生党/中奖选购)——
#    是否拆 sub_directions 是关键判断项, 留策略 lead 决定(见 review brief)。
#    草稿先按两个基础方向各写一条; 不为潜在场景造 sub_directions。

direction_decomposition:

  # ── 定稿 2026-08-30 ──────────────────────────────────────────────
  # 依据: 300 行全量入库文案(起草时只有 30 行样本, 且 38 条产品贴一条都没抽到)。
  #
  # 人群从「通用」改「伴侣家人」, 这是本次最实的一处修正: 随机抽 10 条流量贴标题,
  # 9 条的叙述者是【替父母/长辈买的子女】—— 我爸嘲笑按摩椅智商税 / 装了心脏支架
  # 可不可以用 / 想给奶奶买有没有能试用的 / 给我妈买她的脚够不着底 / 奶奶六十大寿
  # 全家反对 / 给爷爷买姑姑说肯定伤身体 / 90斤的排骨老妈死活不肯坐。
  # 产品贴同样(12 条里 7 条是买给家人)。受控闭集里「伴侣家人」正是这个位置 ——
  # OKMAN 的「家属代查 → 伴侣家人」是同一用法的先例, 不是我新造的口径。
  # 少数是自用(50平出租屋 / 打工人颈椎 / 插画师), 是次要人群, 不改主标注。
  #
  # 「流量贴」不拆 sub_directions: 184 行的主要差异轴是【谁在买】而不是内容形式,
  # 而"谁在买"已经由 target_audience 承载了。同量级先例 OKMAN「真实体验与求问」
  # 80 条也是不拆。真要拆是后面看飞轮回收效果再说, 现在拆等于先验地分好类。
  "流量贴":                         # 184 条(主力); 家庭场景切入, 不直接推产品
    # content_format 维持 提问求助: 10 条抽样里 4 条是字面提问(可不可以用/有没有能试用的/
    # 按摩能救回来吗/怎么劝), 其余 6 条是家庭分歧场景。两者都以"替长辈做决定时的不确定"
    # 为钩子, 与方向名「流量贴」(靠共鸣问题起量)一致。
    content_format: 提问求助
    target_audience: ["伴侣家人"]
    user_pain_point: 替父母长辈选按摩椅时的不确定(会不会伤身体/老人会不会用/身高体重合不合适/家人反对)

  "产品贴":                         # 38 条
    # 起草稿按方向名推的「直给推荐」不对。看真实文案: 爸妈把上万按摩椅当储物台(WiFi连不上) /
    # 县城走出来的孩子给老家父母寄按摩椅 / 老公说gt33是他送我的带薪休假 / 只有50平的出租屋
    # 我还塞了台按摩椅 / 师傅上门安装服务细节记录 / 我妈连拼音都不认学会用按摩椅 ——
    # 全是【产品在一段具体生活里被用起来】, 没有一条是摆参数推荐 → 场景植入。
    content_format: 场景植入
    target_audience: ["伴侣家人"]
    user_pain_point: 按摩椅买回家之后能不能真正用起来(老人不会操作/尺寸不合/安装顾虑/家人觉得费电)

# ════════════════════════════════════════════════════════════════════
# tier 抽取规则(流量状态 → tier)
# ════════════════════════════════════════════════════════════════════
# ════════════════════════════════════════════════════════════════════
# 方向列写坏时的正文兜底 —— 定稿 2026-08-31(D-049)
# ════════════════════════════════════════════════════════════════════
# 【为什么要这个】
# 2026-08-24 起入库的行, 「方向」列里全是「已发布」—— 那是「发布状态」的取值。
# 不是零星填错: 08/24 之前 0/30 行, 08/24 及之后 78/78 行, 一刀切干净。看着像
# 运营新建一批行时按列批量填, 点错了列头(飞书多选列会把粘进来的值自动收成新选项,
# 所以这一列吃得下「已发布」)。其余列全对 —— 正文/发布时间/链接/流量状态/曝光/互动
# 都在, 只有方向这一列是脏的, 所以【不是】整表错位。
#
# 结果是这 78 行 content_format / target_audience / user_pain_point 全空。
#
# 【为什么不在飞书改】
# 策略 lead 2026-08-31 定的口径: 方向列只会有「流量贴」「产品贴」两个值, 不新增;
# 要更细的区分, 由本仓自己拿正文做。所以这里不等飞书改, 直接按正文判。
#
# 【判据怎么来的】
# 拿 08/24 之前 222 行【运营手填的方向】当标注集试出来的, 不是拍脑袋:
#   · 正文点名「西屋/GT33」: 产品贴 33/38 = 86.8%, 流量贴 12/184 = 6.5% —— 信号很强,
#     但单用它整体只有 92.3%, 因为那 12 条流量贴是【还没买、正在纠结】的选购提问,
#     正文里把西屋 GT33 当候选款报价("西屋GT33大概七千"), 照样点名。
#   · 再叠一层「有选购提问词就不算产品贴」→ 整体 210/222 = 94.6%,
#     判成产品贴的 28 条里 27 条真是产品贴(96.4%)。
#   · 试过再加「安装/送装/开箱」这类已购信号: 多捞对 2 条、多判错 5 条, 更差, 弃用。
# 这条轴其实就是【买没买】: 产品贴是产品已经在生活里(→场景植入),
# 流量贴是还在问该不该买(→提问求助), 和上面 direction_decomposition 写的两个
# content_format 正好是同一根轴, 不是另起炉灶。
#
# ⚠️ 94.6% 是【在同一张表的标注集上量的】, 是自评不是外部验证; 真实错误率只会更高不会更低。
#    所以: (a) 只在方向查不到时才跑, 填对了的行一律不碰;
#          (b) 推断结果写 raw_extra._direction_inferred + data_quality_flags.direction_unmapped,
#              下游永远分得清哪些是运营填的、哪些是猜的;
#          (c) 推断出来的方向【不】参与 tier 判定(见 sync 脚本里的注释)。

direction_from_content:
  default: 流量贴                    # 两个方向里 184/222=83% 是流量贴, 兜底落这边
  rules:
    - direction: 产品贴
      require: ["西屋", "Westinghouse", "westinghouse", "GT33", "gt33"]
      unless: ["求推荐", "求助", "有没有", "该不该", "值不值", "怎么选", "哪个更",
               "纠结", "会不会", "能不能", "有用吗", "靠谱吗", "求问", "姐妹们",
               "求教", "怎么劝"]

# 流量状态 distinct(222 行):
#   无水花×184, 评估中/无水花×10, 爆贴×7, 评估中×3, 爆帖预备×2,
#   评估中/爆帖预备/无水花×1, 无水花/评估中×1, 爆帖预备/无水花×1,
#   无水花/爆帖预备×1, 评估中/爆帖预备×1, 评估中/爆帖预备/爆贴×1
# ⚠️ 字段清单选项里有「爆贴」「爆帖预备」「爆贴预备」三种近似写法(帖/贴/预备/预备混用);
#    distinct 实测只出现「爆贴」「爆帖预备」→ match_contains 规则需同时覆盖两种拼写以防万一。
# 字段清单还有「关注评论」「重点关注」「控评&置顶✅」「风控中」等选项, 本期 distinct 未出现;
#    保留 match_contains["风控"] 覆盖「风控中」; 其余选项 → default: null 兜底。
# 「起量时间」列(distinct 仅 9 行有值)→ 不作 tier 源, 进 raw_extra 留痕。

tier_extraction:
  source: 状态字段                  # 指示用 _status_raw (即「流量状态」列)
  rules:
    - match_contains: ["大爆"]
      tier: 大爆
    - match_contains: ["爆帖预备", "爆贴预备"]  # 两种拼写均覆盖
      tier: 预备
    - match_contains: ["爆贴", "爆帖"]          # 覆盖「爆贴」「爆帖」两种拼写
      tier: 爆
    - match_contains: ["风控"]                  # 覆盖「风控中」
      tier: 风控
    - match_contains: ["无水花"]
      tier: 趴
    - match_contains: ["评估中"]
      tier: 未知
    - default: null

# ════════════════════════════════════════════════════════════════════
# tier 数值阈值 —— 定稿 2026-08-30, 按 228 行真实互动分布校准
# ════════════════════════════════════════════════════════════════════
# 没有采用 scripts/recommend_tier_thresholds.py 的 P75/P90 口径: 它对本表算出
# 爆=11 / 大爆=31 —— 因为 78% 的行是趴, P75 直接落在趴里。那个口径默认分布健康,
# 前提在这张表上不成立(同 SPX)。
#
# 改按【运营自己画的线】。这里有一个必须先剥掉的干扰:
#   「趴」里互动最高的两条是 216 和 200, 看着与「爆」的下限 70 严重重叠 ——
#   但查它们的状态原值都是 ['评估中', '无水花'], 即运营【同时标了"还在评估"】,
#   不是拿定主意的趴。剥掉所有含「评估中」的未决行之后:
#     确定趴(222 行) 互动最高 = 38
#     预备                最高 = 95
#     运营标爆的 9 行 = 70 / 114 / 139 / 142 / 192 / 197 / 204 / 226 / 439
#   → 38 与 70 之间无重叠。爆取 70(直接用运营的最低标爆值, 不再往下放):
#     阈值只在【状态列为空】时兜底, 宁可漏标也不要凭空造爆款喂飞轮。
#   → 大爆取 400: 常规爆款封顶 226, 439 是唯一离群的一条, 400 卡在两者之间。
#
# 注: 起草的 爆=100 已经把 2 行(互动 171 / 213)推成了 tier_source=数值推断 的爆。
# 改成 70 后这两行仍是爆(更贴运营口径), 不是回退。
tier_thresholds:
  爆: 70                            # 确定趴上限 38 < 70 = 运营标爆的最低值
  大爆: 400                         # 常规爆上限 226 < 400 ≤ 离群值 439

# ════════════════════════════════════════════════════════════════════
# 合规配置 —— 定稿 2026-08-30
# ════════════════════════════════════════════════════════════════════
compliance:
  base_template: 家居家电           # 与 category 一致; 策略 lead 已定不走医疗器械档
  # 前两条是家居家电档的标准项(沿用起草稿)。第三条原本写的是"若归医疗器械类:…",
  # 那是品类还没定时的条件句 —— 已经定了不走器械档, 留着只会让人以为还没定, 删掉。
  # 后两条是【看完 300 行真实文案新加的】, 不是模板抄来的: 流量贴里反复出现
  # 「我爸前年装了心脏支架, 现在能不能用按摩椅」「脊椎退化去按摩店被按出裂痕」
  # 「我爸在按摩椅上吹空调按成急性腰扭伤」「姑姑说给爷爷用肯定伤身体」——
  # 这类帖的评论区天然会向"我这个情况能不能用"滑, 而那已经是医疗建议了。
  custom_red_flags:
    - "家居家电/按摩椅: 禁止宣称医疗功效(治疗腰椎间盘突出/颈椎病等疾病)"
    - "禁止绝对化表述(最好用/唯一/根治)"
    - "禁对有基础病或植入器械的人群(心脏支架/起搏器/骨质疏松/椎间盘突出/术后)给出能不能用的判断, 一律引导问医生"
    - "涉及孕期/老人/儿童使用场景时, 只讲自身体验, 禁给使用时长与强度建议"
  # 定稿依据: 300 行入库后 83 行命中蓝词, 实测 12 种取值 ——
  # 西屋gt33 / 西屋GT33 / GT33 / GT33白色款 / 西屋的gt33 / 西屋按摩椅 /
  # 西屋按摩椅gt33 / gt33靠墙放 / 按摩椅 / 精钢机芯 / 西屋的腰背热敷功能。
  # 起草稿的 primary/secondary 与实测吻合, 予以确认(大小写混写是运营习惯, 不必统一:
  # hit_blue_keywords 按行原样存, 这里只是投放侧的目标词)。
  blue_keyword_strategy:
    primary: ["西屋按摩椅", "西屋GT33", "西屋gt33"]
    secondary: ["按摩椅", "西屋按摩椅gt33", "精钢机芯"]
    avoid: []

# ════════════════════════════════════════════════════════════════════
# 项目专属字段 → raw_extra (allowlist · 17 列)
# ════════════════════════════════════════════════════════════════════
# 未列入此处且未在 field_mapping 声明的列 → 整行 quarantine (D-021)。
# 下列列全部进 raw_extra 留痕, 不做二次处理。
project_specific_fields_to_raw_extra:
  # ── 图片/附件列(不处理) ──
  - 内容配图
  - 评论配图
  - 发布截图
  - 相关截图
  - 蓝词图片
