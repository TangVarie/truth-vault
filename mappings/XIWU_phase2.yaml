# ════════════════════════════════════════════════════════════════════
# XIWU_phase2 · 西屋 911GT —— 接表草稿(A 家族, 2026-10-19)
# ════════════════════════════════════════════════════════════════════
# 写作台项目「西屋911gt」(9-30 建)的发布表。owner 10-19 给的表链接:
#   base P0YbbWpIUa6PsBsPi9pcApGknLf(和 XIWU_phase1 同一个 base)/ table tblcfQMfcUIh86NC / view vewHwaAcuq
# 起草方法: 接表 agent 9-17 之后两次都没跑通, 这次不走 LLM 起草 —— 同一个 base、同一拨运营,
# 先照 XIWU_phase1 的列结构起草, 再用 Preflight(只读飞书)对真表校正列名 / 方向 / tier 取值。
# 10-19 首次入库(71 篇, 10-07 ~ 10-18 发布)后看了真实文案: 产品是西屋 911GT 按摩椅(15999 档),
# 71 篇全部写按摩、绝大多数点名西屋 / 911GT, 主要拿来和另一家旗舰款比。下面的方向口径和合规按这个定。
# ════════════════════════════════════════════════════════════════════

version: 1.0

project_id: XIWU_phase2
brand: 西屋
product: 按摩椅911GT
brand_aliases:
  - 西屋911gt
  - 911gt
  - 911GT
  - 西屋911GT
category: 家居家电                  # 同 phase1(策略 lead 8-28 定: 按摩椅算家居家电, 不按医疗器械)
platform: xiaohongshu
schema_family: A
start_date: auto_from_publish_time_min
end_date: auto_from_publish_time_max

# ════════════════════════════════════════════════════════════════════
# 字段映射 — 14 进 typed 列/中间变量 + 33 进 raw_extra; 运营后加的「作品ID」「蓝词来源」没声明,
#            落 raw_extra._undeclared(I-24: SPX / TUGE / HATHERINE 也没声明, 不在这一张表单改)
# ════════════════════════════════════════════════════════════════════
# ── 标题怎么拿 (docs/28 §3 第 4 条, D-065 续; 09-19 实查 17 张表) ──
# column = notes.title 列 / markers = 从 raw_content 的标记切 / none = 没有标题
title_extraction: markers          # 文案里带标记, 解析器同时认「【标题】…【正文】…」和「标题：…(换行)正文：…」; 切不出来的单条标题类题目记 NULL

field_mapping:
  # ── 标识 ──
  素人编号: account_id              # → notes.account_id (FK to accounts)

  # ── 内容 ──
  文案: raw_content                 # → notes.raw_content [NOT NULL]
  发布时间: publish_time            # → notes.publish_time (datetime)
  反馈链接: publish_url             # → notes.publish_url

  # ── tier 源 ──
  # 本表与 WTG/RIO表1/TXQ/OKMAN 同款: 状态拆两列(发布状态=工作流, 流量状态=表现/tier 源)
  流量状态: _status_raw             # → tier_extraction → notes.tier

  # ── 方向 ──
  方向: _direction_raw              # → direction_decomposition (流量贴 / 产品贴)

  # ── 数据回收(数字, parse_numeric 自动转) ──
  # Preflight 10-19(113 行 / 71 行有正文)校正: 本表用「曝光量 / 阅读量」(phase1 是「数」); 互动有两列
  # 「互动数」「互动量」都在 —— 互动数沿用 phase1 / HATHERINE 的口径进 interactions, 互动量留 raw_extra。
  # 10-19 首次入库后核过: 71 篇两列逐条相等。
  曝光量: impressions
  阅读量: reads
  互动数: interactions
  实时数据.评论数: comments_count   # D-062: 判爆只看评论数(巡查机器人实时抓); phase1 表里没有这列

  # ── 蓝词(事后命中蓝词) ──
  蓝词字段: hit_blue_keywords       # → notes.hit_blue_keywords (82 行有值; 13 种选项已知)

  # ── 评论 ──
  随贴评论: _comment_text           # → comments 表(Phase 2 LLM 解析)

  # ── 观众分析 → 确定性解析进 actual_audience_data ──
  # 样本中有值行格式为「性别分布：男性42%，女性58%；年龄分布：...；城市分布：...」
  # 与 WTG/TXQ/OKMAN 的 _audience_raw 格式一致, 可确定性解析。
  # ⚠️ 部分行观众分析内容为「性别分布：；年龄分布：；城市分布：」(键有值但数值空) —— sync 解析出 null 正常, 不影响入库
  观众分析: _audience_raw           # → notes.actual_audience_data (JSONB)

  # ── 笔记状态 → 检测伪爆贴 ──
  # 发布状态选项含「已发布/预备内容/待发布/定时发布/内容待定/待审稿/修改中」;
  # 30行样本全为「已发布」; 若出现「关注」等人工假数据信号 → synthetic flag
  笔记状态: _note_status_raw        # 本表叫「笔记状态」(phase1 是「发布状态」); 含"关注"则 data_quality_flags.synthetic=true

# ── intent ──
# 本表【无】「发布笔记」intent 列 → 不做意图分类, notes.intent 留空(WTG/TXQ/OKMAN 金标准 intent=null)

# ════════════════════════════════════════════════════════════════════
# 方向拆解 —— 10-19 按首次入库的 71 篇定
# ════════════════════════════════════════════════════════════════════
# 「方向」只有两种取值(流量贴 52 / 产品贴 19), 全单选。
# 和 phase1 不一样的地方: phase1 九成是「替父母买」, 这一期人群是散的 —— 流量贴里写父母 / 公婆的 14 篇、
# 写自己上班久坐 / 教书久站的 12 篇、写伴侣的 9 篇, 所以人群记「通用」, 不硬塞进伴侣家人。
# 没有 direction_from_content(phase1 那套是给「方向列写坏」兜底的, 这张表方向列是好的)。
direction_decomposition:
  "流量贴":                         # 52 篇; 24 篇字面在问(求推荐 / 值不值 / 靠谱吗), 其余是选购纠结的场景
    content_format: 提问求助
    target_audience: ["通用"]
    user_pain_point: 花一万多买按摩椅前拿不准(力度合不合身 / 一家几口能不能共用 / 进不进得了门 / 售后)

  "产品贴":                         # 19 篇; 产品已经在生活里被用起来(笔记级 essence 会再细分)
    content_format: 场景植入
    target_audience: ["通用"]
    user_pain_point: 按摩椅买回家之后值不值、用不用得起来

# tier 抽取规则(流量状态 → tier) —— 照 phase1, Preflight 报出取值后核
tier_extraction:
  source: 状态字段                  # 指示用 _status_raw (即「流量状态」列)
  rules:
    - match_contains: ["大爆"]
      tier: 大爆
    - match_contains: ["爆帖预备", "爆贴预备"]  # 两种拼写均覆盖
      tier: 预备
    - match_contains: ["爆贴", "爆帖"]          # 覆盖「爆贴」「爆帖」两种拼写
      tier: 爆
    - match_contains: ["风控"]                  # 覆盖「风控中」
      tier: 风控
    - match_contains: ["无水花"]
      tier: 趴
    - match_contains: ["评估中"]
      tier: 评估中
    - match_contains: ["观察中"]      # 冷启动窗口 → 未知(同 HATHERINE_phase1); Preflight 10-19: 观察中×6
      tier: 未知
    - default: null

# tier_thresholds 已废(D-062): 判爆只看评论数。

# ════════════════════════════════════════════════════════════════════
# 合规配置 —— 同 phase1(同一类产品, 文案里同样有腰痛 / 颈椎 / 老人使用的场景)
# ════════════════════════════════════════════════════════════════════
compliance:
  base_template: 家居家电
  custom_red_flags:
    - "家居家电/按摩椅: 禁止宣称医疗功效(治疗腰椎间盘突出/颈椎病等疾病)"
    - "禁止绝对化表述(最好用/唯一/根治)"
    - "禁对有基础病或植入器械的人群(心脏支架/起搏器/骨质疏松/椎间盘突出/术后)给出能不能用的判断, 一律引导问医生"
    - "涉及孕期/老人/儿童使用场景时, 只讲自身体验, 禁给使用时长与强度建议"

# ════════════════════════════════════════════════════════════════════
# 项目专属字段 → raw_extra (allowlist · 33 列)
# ════════════════════════════════════════════════════════════════════
# 未列入此处且未在 field_mapping 声明的列 → 整行 quarantine (D-021)。
# 下列列全部进 raw_extra 留痕, 不做二次处理。
project_specific_fields_to_raw_extra:
  # Preflight 10-19 对真表核过: phase1 那几列(各种副本 / 起量时间 / 父记录 / 图片列)这张表没有, 不带;
  # 这张表多的是巡查机器人那一套(同 HATHERINE_phase1), 全部留痕不做二次处理。
  # (10-19 之后运营又加了维护三列和起量时间, 见本节末尾 I-24 那一组。)
  - 内容配图
  - 评论配图
  - 发布截图
  - 相关截图
  - 评论状态
  - 是否巡查
  - 巡查状态
  - 已确认存活
  - 最近检查时间
  - 下次检查时间
  - 数据整理
  - 平台                            # 冗余列
  - 互动量                          # 和「互动数」并存, 见 field_mapping 注释
  - 排队刷新
  - 置顶状态
  - 评论区快照
  - 诊断信息
  - 连续失败次数
  - 上次评论数                      # 巡查机器人上一轮快照
  - 评论关键词
  - 负面状态
  - 负面评论快照
  - 负面词
  - 整理时互动数
  - 整理时评论数
  - 整理状态
  - 是否截图
  - 已删除评论数
  - 已删除评论留底

  # ── 投流 / 维护 + 起量时间(2026-10-27 补声明, I-24; 照 HATHERINE 的 09-22 A5 和 I-13 补起量时间)──
  # 10-19 接表时真表还没有这四列; 运营后加之后落在 raw_extra._undeclared, 每轮进告警清单
  # (10-26 夜跑 run 40287828329 点名)。10-27 生产只读: 维护情况 1 行 / 维护时间 3 / 维护效果 2 /
  # 起量时间 1, 全在 _undeclared。声明之后下一次夜跑挪到 raw_extra 顶层, G-15 数「维护效果」就数得到这个项目。
  # 逐值语义同 BJS / SPX / HATHERINE(运营 2026-09-22 回填件): 关注=已做20条维护评论 · ✅=需要做50条(待办) ·
  # 重点关注⭐️=已做50条 · 控评&置顶✅/已评待置顶=对已起量帖的二次运营 ·
  # 日期+🍟=小红书薯条投流(日期即投流日) · 已投流，等回收数据=待二次回收。
  # 引擎按取值分路(sync 的 _CM_MV_* / _PAID_* 常量); 声明了「维护情况」之后, 没投流取值的篇
  # paid_promoted 记 false(运营 09-22: 留空 = 没做维护), 以前没声明时是缺键 = 不知道。
  # ⚠️ 这三列【永不】映 impressions/reads/interactions/comments_count(check_system_map G5)。
  - 维护情况                        # 多选, 多义列: 铺评完成度 + 投流日期 + 控评置顶
  - 维护时间                        # 日期粒度
  - 维护效果                        # 数字: 投流前后的曝光量差额(运营手算)
  - 起量时间                        # 巡查机器写: 首次「评论比上次涨≥50% 且多≥20」的时刻, 只写一次, 人工清空重判
                                    #    (运营 2026-10-22, ops-answers-2026-10-22.md 第 3-5 条)。不作 tier 源

