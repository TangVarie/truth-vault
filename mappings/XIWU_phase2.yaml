project_specific_fields_to_raw_extra:
  # Preflight 10-19 对真表核过: phase1 那几列(各种副本 / 起量时间 / 父记录 / 图片列)这张表没有, 不带;
  # 这张表多的是巡查机器人那一套(同 HATHERINE_phase1), 全部留痕不做二次处理。
  - 内容配图
  - 评论配图
  - 发布截图
  - 相关截图
  - 评论状态
  - 是否巡查
  - 巡查状态
  - 已确认存活
  - 最近检查时间
  - 下次检查时间
  - 数据整理
  - 平台                            # 冗余列
  - 互动量                          # 和「互动数」并存, 见 field_mapping 注释
  - 排队刷新
  - 置顶状态
  - 评论区快照
  - 诊断信息
  - 连续失败次数
  - 上次评论数                      # 巡查机器人上一轮快照
  - 评论关键词
  - 负面状态
  - 负面评论快照
  - 负面词
  - 整理时互动数
  - 整理时评论数
  - 整理状态
  - 是否截图
  - 已删除评论数
  - 已删除评论留底

