version: 1.0

# ── 项目元数据 ──
project_id: HATHERINE_phase1
brand: hatherine                # [待确认] 小韩/hatherine, 品牌英文名
product: 痘痘贴                 # [待确认] 分场景型号(粉色催熟/深蓝吸液/浅蓝76片日常)
category: 个护                  # [待确认] 痘痘贴属个护, 非医疗器械
platform: xiaohongshu
schema_family: A                # A 家族指纹: 有「是否巡查」「巡查状态」「最近检查时间」「已确认存活」
start_date: auto_from_publish_time_min
end_date: auto_from_publish_time_max

# ════════════════════════════════════════════════════════════════════
# 字段映射 — 41 列全部交代(14 进 typed 列/中间变量 + 27 进 raw_extra), 一条不漏
# ════════════════════════════════════════════════════════════════════
field_mapping:
  # ── 标识 ──
  素人编号: account_id

  # ── 内容 ──
  笔记内容: raw_content           # 本表内容列叫「笔记内容」(非「文案」)
  发布时间: publish_time
  反馈链接: publish_url

  # ── tier 源 ──
  流量状态: _status_raw           # tier 源(A 家族; 多选; 含「重点控评」「关注后续流量」等)

  # ── 方向 ──
  方向: _direction_raw            # → direction_decomposition(8 种基础方向)

  # ── 数据回收(数字) ──
  曝光量: impressions
  阅读量: reads
  互动数: interactions            # 本表用「互动数」(非「互动量」)
  实时数据.评论数: comments_count # D-062: 判爆依据(巡查机器人实时抓取)

  # ── 蓝词(事后命中蓝词) ──
  蓝词字段: hit_blue_keywords     # → notes.hit_blue_keywords(40 行有值; 14 种选项)

  # ── 评论 ──
  随贴评论: _comment_text         # → comments 表(Phase 2 LLM 解析)

  # ── 笔记状态 → 检测伪爆贴 ──
  笔记状态: _note_status_raw      # 工作流状态(非 tier 源; 可检测异常)

# ── intent ──
# 本表【无】「发布笔记」intent 列 → 不做意图分类, notes.intent 留空(WTG 金标准)

# ════════════════════════════════════════════════════════════════════
# 方向拆解 —— [待确认] 按方向名 + 文案样本起草
# ════════════════════════════════════════════════════════════════════
# 飞书「方向」8 种取值(全单选, 无组合):
#   产品-全家桶×35 / 产品-76贴囤货×34 / 产品-功能说明×31 / 流量-不破皮痘×31 /
#   产品-微针×27 / 产品-oly上架×19 / 流量-破皮痘×11 / 产品-对比×7
#
# ⚠️ content_format / target_audience / user_pain_point 全标 [待确认],
#    需策略 lead review(我按文案样本推的, 不是拍板)。

direction_decomposition:

  "产品-全家桶":                    # 35 条(最多); 粉色+深蓝+浅蓝三盒组合
    content_format: 直给推荐        # [待确认] 产品组合推荐
    target_audience: ["通用"]       # [待确认]
    user_pain_point: 不同阶段痘痘需要不同处理方案, 一次备齐   # [待确认]

  "产品-76贴囤货":                  # 34 条; 浅蓝76片组合装(圆形+方形双尺寸)
    content_format: 直给推荐        # [待确认] 囤货方案
    target_audience: ["通用"]       # [待确认]
    user_pain_point: 小包装用着用着就没了, 需要大包量囤货   # [待确认]

  "产品-功能说明":                  # 31 条
    content_format: 教程攻略        # [待确认] 产品功能说明/使用方法
    target_audience: ["通用"]       # [待确认]
    user_pain_point: 不知道痘痘贴怎么分场景使用   # [待确认]

  "流量-不破皮痘":                  # 31 条; 粉色款(没破痘专用, 催熟)
    content_format: 场景植入        # [待确认] 未破痘急救场景
    target_audience: ["通用"]       # [待确认]
    user_pain_point: 红肿硬块痘, 需要催熟不能闷   # [待确认]

  "产品-微针":                      # 27 条
    content_format: 直给推荐        # [待确认] 微针型痘痘贴产品推荐
    target_audience: ["通用"]       # [待确认]
    user_pain_point: 需要促进吸收的微针痘痘贴   # [待确认]

  "产品-oly上架":                   # 19 条; Olive Young 上架/测评
    content_format: 横评对比        # [待确认] OliveYoung 店内横评对比
    target_audience: ["通用"]       # [待确认]
    user_pain_point: Olive Young 里痘痘贴选择困难   # [待确认]

  "流量-破皮痘":                    # 11 条; 深蓝款(破痘专用, 吸液隔菌)
    content_format: 场景植入        # [待确认] 已破痘急救场景
    target_audience: ["通用"]       # [待确认]
    user_pain_point: 破痘有渗液, 需要封口防感染   # [待确认]

  "产品-对比":                      # 7 条; 与竞品对比
    content_format: 横评对比        # [待确认] 竞品对比
    target_audience: ["通用"]       # [待确认]
    user_pain_point: 不知道选哪个品牌的痘痘贴   # [待确认]

# ════════════════════════════════════════════════════════════════════
# tier 抽取规则(流量状态 → tier)
# ════════════════════════════════════════════════════════════════════
# 流量状态 distinct(169 行):
#   无水花×145, 观察中×23, 评估中×1
# 字段清单选项还有: 重点控评/关注后续流量/风控中/爆贴/大爆/疑似限流(本期未出现)
# ⚠️ 流量状态为多选字段, 按 match_contains 优先级命中

tier_extraction:
  source: 状态字段
  rules:
    - match_contains: ["大爆"]
      tier: 大爆
    - match_contains: ["爆贴"]
      tier: 爆
    - match_contains: ["风控", "疑似限流"]   # 「风控中」「疑似限流」都算风控(docs/05 §10: 被平台限流或风控)
      tier: 风控
    - match_contains: ["无水花"]
      tier: 趴
    - match_contains: ["评估中"]
      tier: 评估中
    - match_contains: ["观察中"]    # 冷启动窗口 → 未知
      tier: 未知
    - default: null

# tier_thresholds 已废(D-062, 2026-09-17): 判爆只看评论数, 全项目统一 爆≥50/大爆≥100,
# 由同步脚本按 comments_count 推断; 不再按项目配互动量阈值。

# ════════════════════════════════════════════════════════════════════
# 合规配置 —— [待确认]
# ════════════════════════════════════════════════════════════════════
compliance:
  base_template: null             # [待确认] 个护无强制模板; 有客户红线再填
  custom_red_flags:               # [待确认]
    - "个护/痘痘贴: 禁止宣称医疗功效(治疗/治愈痤疮/消除痘印等)"
    - "禁止绝对化表述(最好用/唯一/根治/100%)"
    - "禁止暗示替代医疗(严重痘痘需就医, 不能暗示贴片可替代)"
  blue_keyword_strategy:          # [待确认] 据蓝词字段实测 14 种选项起草
    primary: ["hatherine", "hatherine痘痘贴"]
    secondary: ["老虎痘痘贴", "痘痘贴", "小韩OY", "hatherine圆贴"]
    avoid: []

