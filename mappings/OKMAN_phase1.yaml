# ════════════════════════════════════════════════════════════════════
# OKMAN · OKMAN_phase1 —— Onboarding 草稿(DRAFT · A 家族)
# ════════════════════════════════════════════════════════════════════
# 产品: 西地那非口溶膜(男性健康 OTC/处方药, 品牌 OKMAN/艾时达/科伦)
# 投放策略: 小红书素人铺量, 以情感/两性场景切入, 评论区引导产品认知
# 真实列名 / 方向取值 / 未声明列 已据 preflight 样本(202 行)起草, 待 preflight 实跑校正。
# ════════════════════════════════════════════════════════════════════

version: 1.0

# ── 项目元数据 ──
project_id: OKMAN_phase1
brand: OKMAN                    # 策略 lead 定(2026-07-20)
product: 西地那非口溶膜          # 策略 lead 定(2026-07-20)
category: 处方药                # 策略 lead 定(2026-07-20): 西地那非=Rx, 走处方药级合规
platform: xiaohongshu
schema_family: A               # A 家族工作流列(巡查状态/最近检查时间/数据回收情况/是否巡查)在 field schema 存在但本期均空(preflight 报"声明了但表里无数据", 正常, 保留作前向 allowlist)
start_date: auto_from_publish_time_min
end_date: auto_from_publish_time_max

# ── 字段映射 ── [据 preflight 样本 30 列全覆盖]
field_mapping:
  素人编号: account_id
  文案: raw_content
  发布时间: publish_time
  反馈链接: publish_url
  方向: _direction_raw            # → direction_decomposition(11 种取值)
  流量状态: _status_raw           # tier 源(WTG/RIO 表1 式)
  曝光量: impressions
  阅读量: reads
  互动量: interactions
  数据回收情况: data_quality_status
  观众分析: _audience_raw          # → actual_audience_data(sync 确定性解析; 样本 98 行有值, 格式符合)
  随贴评论: _comment_text          # → comments 表(Phase2 LLM 解析)
  蓝词字段: hit_blue_keywords      # → notes.hit_blue_keywords(事后命中蓝词)
  笔记状态: _note_status_raw       # 工作流状态(非 tier 源; 可检测异常)

# ── intent ──
# 本表【无】「发布笔记」intent 列 → 不做意图分类, notes.intent 留空(WTG 金标准 intent=null)。

# ── 方向拆解 ── (策略 lead 定 2026-07-20)
# 飞书「方向」11 种取值, 全部单选无组合。「测试版」7 条 → excluded_directions(⑦C, 不进飞轮)。
# 人群: 除 D6-家属代查=伴侣家人 外, 其余统一 年轻男性+中年男性(ED 产品真实受众)。
# 「真实体验与求问」80 条暂不拆 sub_directions(④A), 数据多了再议。
direction_decomposition:

  "D1-物拟人双关":                    # 3 条; 用物品/食物双关暗示产品
    content_format: 反差破圈          # 双关/谐音梗制造反差记忆点
    target_audience: ["年轻男性", "中年男性"]
    user_pain_point: 以物拟人双关撬动流量(隐晦暗示男性需求)

  "D2-第三方目击":                    # 6 条; 第三者视角(室友/同事/朋友)目击/发现产品
    content_format: 情感叙事          # 第三方叙事
    target_audience: ["年轻男性", "中年男性"]
    user_pain_point: 第三方视角发现/目击(降低广告感, 增加可信度)

  "D5-兄弟暗语":                      # 1 条; 男性之间的暗语推荐
    content_format: 情感叙事
    target_audience: ["年轻男性", "中年男性"]
    user_pain_point: 男性社交场景中的隐晦推荐(兄弟间的默契)

  "D6-家属代查":                      # 3 条; 妻子/女友视角代为查询/发现
    content_format: 情感叙事          # 家属情感叙事
    target_audience: ["伴侣家人"]     # 策略 lead: 家属/伴侣视角(唯一非男性人群)
    user_pain_point: 伴侣发现另一半状态问题, 代为寻找解决方案

  "D7-男性crush":                     # 20 条; 男性视角暗恋/追求, 为"表现"做准备
    content_format: 情感叙事          # 暗恋/心动情感叙事
    target_audience: ["年轻男性", "中年男性"]
    user_pain_point: 暗恋/追求中的表现焦虑(怕关键时刻掉链子)

  "D8-男性奔现":                      # 8 条; 异地恋/网恋奔现场景
    content_format: 情感叙事          # 奔现情感叙事
    target_audience: ["年轻男性", "中年男性"]
    user_pain_point: 异地奔现/久别重逢的表现焦虑

  "D9-男性被评价":                    # 36 条; 被女性评价"不行"/被比较
    content_format: 情感叙事          # 被评价的情感痛点
    target_audience: ["年轻男性", "中年男性"]
    user_pain_point: 被伴侣/前任评价表现差的自尊焦虑

  "D10-产品贴":                       # 33 条; 直接产品介绍/科普
    content_format: 直给推荐          # 产品直给
    target_audience: ["年轻男性", "中年男性"]
    user_pain_point: "直接产品认知(口溶膜剂型优势: 15分钟起效/不用等)"

  "硬核民间专家":                     # 5 条; 以"专家"/过来人口吻科普
    content_format: 认知重构          # 专家科普 → 认知重构
    target_audience: ["年轻男性", "中年男性"]
    user_pain_point: 男性健康知识盲区/用药认知误区

  "真实体验与求问":                   # 80 条(最多); 以真实经历求助/分享体验
    content_format: 提问求助          # 求问/求推荐格式
    target_audience: ["年轻男性", "中年男性"]
    user_pain_point: 真实两性场景中的功能焦虑/求助(不想等/状态差/怕不行)

# ── 排除方向(不进训练/飞轮) ── (策略 lead 定 2026-07-20 · ⑦C)
excluded_directions:
  - direction: "测试版"
    count: 7
    reason: 早期测试期内容, 风格混杂(异地奔现/二婚/直给), 质量不稳
    handling: 不进训练数据/飞轮(策略 lead ⑦C 决议)

tier_extraction:
  source: 状态字段                  # 指示用 _status_raw(即「流量状态」列)
  rules:
    - match_contains: ["大爆"]
      tier: 大爆
    - match_contains: ["爆帖预备"]    # 注: 飞书选项写「爆帖预备」(帖, 非贴)
      tier: 预备
    - match_contains: ["爆贴"]        # 飞书选项「爆贴」+ 实际多选含「爆贴」
      tier: 爆
    - match_contains: ["小爆"]        # OKMAN 独有状态「小爆」→ 映射为 爆(受控词表无"小爆")
      tier: 爆
    - match_contains: ["蓝词"]        # OKMAN 独有: 纯蓝词命中(表现尚可但非爆) → 参考
      tier: 参考
    - match_contains: ["风控"]
      tier: 风控
    - match_contains: ["无水花"]
      tier: 趴
    - match_contains: ["评估中"]
      tier: 未知
    - default: null

# ── 数值推断阈值 ──
# 据互动副本分布: median≈2, P90≈14, P99≈274, max=3737。
# 爆贴样本(流量状态含"爆贴"): 互动 374(77066 曝光)级别。
# 推荐起点: 爆=100 / 大爆=1000。(策略 lead 定 2026-07-20 · ⑥)
tier_thresholds:
  爆: 100                            # 策略 lead 定; 起点, 跑50条后可再校准
  大爆: 1000                         # 策略 lead 定

# ── 合规 ──
compliance:
  base_template: 处方药              # 策略 lead 定(2026-07-20): 处方药级合规
  custom_red_flags:                  # 策略 lead 定(2026-07-20): 按草稿
    - "禁止直接出现'西地那非'药名(需用暗语/品牌名替代)"
    - "禁止剂量数字(mg)出现在正文(仅评论区可提)"
    - "禁止'治疗ED''壮阳''伟哥'等直接医疗/违禁表述"
    - "禁止向未成年人暗示"
    - "禁止绝对化功效承诺('根治''永久'等)"
    - "内容需以情感/生活场景为主, 产品露出控制在评论区"
  blue_keyword_strategy:
    primary: ["艾时达口溶膜", "西地那非口溶膜", "快充口溶膜"]    # 策略 lead 定(2026-07-20): 按草稿
    secondary: ["okman口溶膜", "小超人口溶膜", "科伦西地那非"]   # 策略 lead 定: 按草稿
    avoid: ["伟哥", "壮阳", "治疗", "ED"]                       # 策略 lead 定: 按草稿

# ── 项目专属字段(进 raw_extra) ──
project_specific_fields_to_raw_extra:
  - 内容配图
  - 链接文本                        # 2026-09-02(D-051): 8/21 起运营加的列(= 反馈链接 的纯文本副本), 350 行全被隔离、一条没进
  - 评论配图
  - 评论状态
  - 相关截图
  - 蓝词图片
  - 数据整理
  - 是否巡查
  - 巡查状态
  - 已确认存活
  - 最近检查时间
  - 曝光副本
  - 阅读副本
  - 互动副本
  - 父记录

data_supplement_needed:
  - field: account_followers
    method: 本表无粉丝数/帐号昵称/主页链接列 → 需通过 publish_url 调小红书 API 或人工补录
    estimated_rows: 0

# ── Sync 配置 ── (飞书坐标待用户提供)
onboarding_meta:
  onboarded_at: 2026-07-20
  onboarded_by: 接表 agent 起草 + 结构审校; 策略判断项由策略 lead Ziao 拍板(2026-07-20)
  strategy_lead: Ziao / 周哥
  notes: |
    DRAFT —— A 家族(有巡查/检查/数据回收列), 结构近 WTG/RIO 表1。
    特殊点:
      1) 产品=西地那非口溶膜(男性健康处方药), 合规要求极高;
      2) 无 intent 列(同 WTG 金标准, intent=null);
      3) 方向 11 种全单选(无多选组合), 含「测试版」早期方向;
      4) 流量状态含非标值「小爆」「蓝词」(其它表没有) → tier 规则已特殊映射;
      5) 蓝词字段有值(49 行), 蓝词丰富(27 种选项);
      6) 观众分析格式与 WTG 一致(可解析), 98 行有值。
    preflight 结果(2026-07-20, 全表 202 行, ✅ 无阻断问题, 可真跑):
      - ✅ 无未声明列(D-021 不会整行 quarantine); ✅ 11 方向全命中; ✅ 14 种多选组合值全覆盖
      - 全 202 行都入库(有正文), 0 占位丢失; intent 空(符合预期); 伪爆贴标记 0
      - tier: 趴140/风控43/爆15/大爆3/未知1 → 爆+大爆(燃料)=18
      - ⚠️ 6 列声明但本期无数据: 巡查状态/是否巡查/最近检查时间/已确认存活/数据回收情况/父记录(保留作前向 allowlist)
    策略 lead(Ziao)决策已定(2026-07-20): ①category=处方药 ②brand=OKMAN·product=西地那非口溶膜
      ③人群统一 年轻男性+中年男性(D6=伴侣家人) ④「真实体验与求问」不拆 sub_directions
      ⑤小爆→爆·蓝词→参考 ⑥阈值 爆100/大爆1000 ⑦「测试版」7 条→excluded_directions ⑧合规红线+蓝词按草稿。
    autowriter 映射不需配(D-038 通道2 退役)。
    合入后: 显式 Daily TV sync(dry_run → 实跑验证) → 验证 OK 再翻 sync_interval=daily → backfill essence。

