# ════════════════════════════════════════════════════════════════════
# 岸深冲牙器 · ANSHEN_phase1 —— Onboarding 草稿(DRAFT)
# ════════════════════════════════════════════════════════════════════
# 产品: 岸深冲牙器 C10(便携式水牙线)
# 投放策略: 小红书素人铺量, 以口腔痛点场景切入(口气/正畸/敏感牙/送礼/差旅)
# 真实列名 / 方向取值 据 preflight 样本(99 行, 16 列)起草。
# ⚠️ 本表特殊点:
#    - 无曝光/阅读/互动数据列(早期铺量表, 尚未回收流量数据)
#    - 无 tier 源(「流量状况」列 100% 为空; 无「备注」列)
#    - 「笔记状态」是内容形式标(直出贴/提问贴), 非工作流/tier 源
#    - 方向全部单选(5 种), 无多选组合
# ════════════════════════════════════════════════════════════════════

version: 1.0

# ── 项目元数据 ──
project_id: ANSHEN_phase1
# 定稿 2026-08-30: 99 行入库文案里品牌名一律写「岸深」, 型号一律写「C10」,
# 没有出现过第二种写法, 也没有英文名 —— 起草值与实表一致, 予以确认。
brand: 岸深
product: 冲牙器C10
# category 定「个护」—— 2026-08-28 由接表侧判定(用户把这条的判断权交回, 非模型自作主张)。
# 判据不是"冲牙器一般算个护", 而是【这个品牌自己的合规姿态】:
#   品牌反馈明确要求把「紫外线杀菌 / 流血 / 滋血 / 出血」替换掉。持械字号的品牌可以在
#   注册范围内做临床向表述, 而这家在【主动清掉】功效词 —— 这是按消费级个护在卖的做法。
#   5 个方向也全是生活场景(社交焦虑 / 送礼 / 正畸日常 / 差旅便携), 没有一个是临床向。
# 先例: WTG 洗护 = 个护。
# ⚠️ 会推翻这条的唯一事实: C10 拿到了【械字号注册证】。真有的话 category 改「医疗器械」、
#   base_template 改「医疗器械」、红线整套升级 —— 改这一条要连着改那两处, 别只改这里。
category: 个护
platform: xiaohongshu
schema_family: B               # 无巡查状态/最近检查时间/主页链接typed列/数据回收情况 → 非 A; 无日期化结算列 → 非 C; 有方向列+缺粉丝数 → B 家族
start_date: auto_from_publish_time_min
end_date: auto_from_publish_time_max

# ── 字段映射 ── [声明 15 列: 8 进 typed/中间变量 + 7 进 raw_extra]
# 注: 起草稿这里写的是"16 列全覆盖", 但它自己列的是 7+8=15 —— 那个 16 对不上, 别照抄。
# 真实列数以 preflight 拉全表为准(D-021: 未声明列会 quarantine 整行, 所以宁可先按 15
# 声明、preflight 报出缺的再补, 也不要凑一个数字)。
field_mapping:
  素人编号: account_id
  笔记内容: raw_content           # 本表内容列叫「笔记内容」(非「文案」)
  发布日期: publish_time           # 本表日期列叫「发布日期」(非「发布时间」); epoch ms
  笔记链接: publish_url            # 本表链接列叫「笔记链接」(非「反馈链接」); type=15 URL 字段
  方向: _direction_raw             # → direction_decomposition(5 种单选)
  随贴评论: _comment_text          # → comments 表(Phase2 LLM 解析)
  笔记状态: _intent_raw            # 本表「笔记状态」实为内容形式(直出贴/提问贴) → 走 intent_mapping
  # 「流量状况」= 本表的 tier 源(B 家族「流量状态」的同义列名, 只是叫"状况")。
  # 2026-08-28 从 raw_extra 上移到这里: 起草稿把它留在 raw_extra, 却在 tier_extraction
  # 和 brief 里写着"未来运营填值后自动生效" —— 那是假的, 不映就永远喂不到 _status_raw,
  # 运营填了值 tier 还是 null, 而且没有任何症状。现在映上, 那句话才成立。
  # 当前 100% 为空 → 每行走 rules 的 default=null, 与之前行为完全一致(不是新风险)。
  流量状况: _status_raw

# ── intent 映射 ──
# 「笔记状态」选项: 直出贴 / 提问贴 / 可发布(选项里有但实际 0 行)
# 直出贴=直接种草内容 → conversion; 提问贴=提问求助撬流量 → traffic
intent_mapping:
  直出贴: conversion
  提问贴: traffic
  可发布: other                    # 定稿: 99 行实测仍 0 行出现; 留着做兜底, 真出现时映 other 不会误判成意图

# ── 方向拆解 ── 定稿 2026-08-30(5 种单选方向, 全覆盖, 无多选组合)
# 依据是 99 行全量入库文案。起草时人群一律给 ["通用"] 是因为只有 30 行样本、不敢认;
# 现在能看全表, 其中两个方向的人群是文案里明写的, 不再是猜:
#   · 「送礼 · 情侣夫妻」8 条全是替另一半或家人买(送男友/送老公/朋友送我/他牙龈敏感
#     我送了这个) → 伴侣家人。受控闭集里就有这一档, OKMAN「家属代查」是同一用法先例。
#   · 「敏感牙 · 牙龈出血 · 新手/儿童/孕期」31 条里孕期与儿童场景是主体(孕晚期刷牙必见血 /
#     10岁小孩总长蛀牙医生建议用水冲) → 宝妈; 但这个方向同时装着"敏感牙新手"这一支
#     并不限于宝妈, 所以并列保留 通用, 不把整支人群窄化掉。
# 另外三个方向的人群文案里没有可靠信号(上班族/约会/正畸/出差都不指向闭集里某一档),
# 维持 通用 —— 这是结论, 不是占位。
direction_decomposition:
  "口气 · 社交焦虑":                  # 35 条(最多)
    # 起草的「场景植入」不对: 随机抽的 4 条标题有 3 条直接以求助收尾 ——
    # 「上班族求推荐!牙缝刷不干净导致口气, 开会超尴尬」「早起口气太重被嫌弃, 牙缝残渣
    # 怎么清? 求推荐」「约会前怎么快速去口气?」。社交场景是钩子, 文体是提问。
    content_format: 提问求助
    target_audience: ["通用"]         # 上班族/约会/开会, 性别年龄无指向, 闭集内无更准的档
    user_pain_point: 口气重/牙缝塞食物残渣导致社交尴尬

  "敏感牙 · 牙龈出血 · 新手 / 儿童 / 孕期":  # 31 条
    # 起草的「直给推荐」不对: 实际是"用了之后终于敢/终于能"的体验型场景 ——
    # 「牙龈极度敏感星人, 终于敢饭后冲牙了」「孕晚期刷牙必见血, 全靠它续命」
    # 「冲牙器新手避雷成功! 终于找到不流血的」→ 场景植入。
    content_format: 场景植入
    target_audience: ["宝妈", "通用"]  # 孕期/儿童是主体, 但敏感牙新手不限于宝妈, 见上
    user_pain_point: 牙龈敏感/出血, 传统冲牙器水柱太猛不敢用

  "正畸牙套党":                       # 21 条
    content_format: 场景植入          # 确认: 托槽发炎/挂皮筋后槽牙塞菜叶/啃完排骨对镜崩溃, 全是正畸日常场景
    target_audience: ["通用"]         # 文案未透露性别年龄; 「隐适美主力是年轻女性」是行业印象不是本表证据, 不写
    user_pain_point: 正畸期间托槽/牙套缝隙清洁困难

  "送礼 · 情侣夫妻":                 # 8 条
    content_format: 情感叙事          # 确认: 8 条全是送礼动机叙事
    target_audience: ["伴侣家人"]     # 见上: 8 条全是替男友/老公/朋友买
    user_pain_point: 送实用健康礼物/伴侣家人口腔护理

  "职场党 · 差旅便携":               # 4 条
    content_format: 场景植入          # 确认: 露营没水源/酒店杯子不敢用/高铁盒饭味/包里焊死了它
    target_audience: ["通用"]         # 出差打工人, 闭集内无对应档
    user_pain_point: 出差/职场午休口腔清洁不便, 需便携方案

# ── tier 抽取 ──
# 本表「流量状况」列 100% 为空(0 个取值) → 当前无任何 tier 信号。
# 仍按 B 家族标准声明 source=状态字段(指向「流量状况」→ _status_raw),
# 但因该列为空, 所有行 tier 将走 default=null → 数值推断兜底。
# ⚠️ 由于本表【也无】曝光/阅读/互动列, 数值推断同样无法触发 → 全表 tier=未知。
# 这是早期铺量表常态(内容先行, 数据后补)。待运营回收流量数据后再校准。
tier_extraction:
  source: 状态字段                  # 指向「流量状况」列(当前空; 未来运营填值后自动生效)
  rules:
    - match_contains: ["大爆"]
      tier: 大爆
    - match_contains: ["爆贴预备"]
      tier: 预备
    - match_contains: ["爆贴"]
      tier: 爆
    - match_contains: ["参考"]
      tier: 参考
    - match_contains: ["风控"]
      tier: 风控
    - match_contains: ["无水花"]
      tier: 趴
    - match_contains: ["评估中"]
      tier: 未知
    - default: null

# ── 数值推断阈值 ──
# 本表无互动量列 → 数值推断实际不会触发。占位写标准保守值, 待数据回收后校准。
# 定稿 2026-08-30: 99 行入库后复核, interactions 仍然 100% 为 null(本表确实没有指标列),
# 且「流量状况」列 99 行全空 → tier 也 100% 为 null。数值推断【一次都不会触发】。
# 这两个数是占位, 现在定了也没有意义; 等飞书补上指标列、真有数据了再按分布校准。
tier_thresholds:
  爆: 100                            # 占位, 不生效(无指标列且 tier 源全空)
  大爆: 500                          # 占位, 不生效

# ── 合规 ──
compliance:
  base_template: null               # 个护小家电无强制模板(同 WTG); 见上方 category 那段注释
  # 红线按【品牌自己已经提出的要求】写死, 不只是"谨慎"——「杀菌」是功效宣称、「出血」是
  # 症状描述, 这两类正是把个护产品推向医疗器械口径的词, 而品牌明确要求清掉它们。
  custom_red_flags:
    - "禁功效/杀菌宣称: 紫外线杀菌、灭菌、除菌率等 —— 品牌已明确要求替换(非'谨慎', 是禁)"
    - "禁症状描述: 流血、滋血、出血 —— 同上, 用 emoji 或同义表达替代"
    - "禁医疗化宣称: 治疗牙周炎/牙龈炎、治愈口臭、替代洗牙"
    - "禁绝对化表述(100%去除/彻底根治/最)"
    - "孕期/儿童/正畸场景禁任何医疗建议口吻(这三类方向占本表 52/99 行, 是高危区)"
  blue_keyword_strategy:
    # 定稿 2026-08-30: 本表【没有蓝词列】, hit_blue_keywords 99 行全空 —— 这里的词表
    # 不参与入库判定, 只是投放侧的目标词。起草值与文案里出现的品牌表述一致
    # (「岸深冲牙器」「岸深C10」在正文里反复出现), 予以确认。
    primary: ["岸深冲牙器", "岸深C10", "便携式冲牙器"]
    secondary: ["牙缝清洁工", "冲牙器推荐"]
    avoid: []

# ── 项目专属字段(进 raw_extra) ──
project_specific_fields_to_raw_extra:
  - 主页链接              # 账号主页 URL(type=15)
  - 账号名                # 账号昵称(非编号)
  - 笔记配图              # 笔记图片附件(type=17)
  - 品牌反馈              # 品牌修改意见(运营备注)
  - 随贴评论配图          # 评论区配图附件(type=17)
  - 相关截图              # 截图附件(type=17)
  - 图片统计              # 当前 100% 空
  # 已交代 15 列 = 8 field_mapping(含「流量状况」→ _status_raw、「笔记状态」→ _intent_raw)
  #              + 7 raw_extra。真实列数以 preflight 为准, 见上方 field_mapping 那段注释。

data_supplement_needed:
  - field: impressions, reads, interactions
    method: 本表无任何流量数据列(曝光/阅读/互动) → 需运营后续回收或通过笔记链接调小红书 API 补录
    estimated_rows: 99
  - field: account_followers
    method: 本表无粉丝数列 → 需通过主页链接调小红书 API 或人工补录
    estimated_rows: 0

# ── Sync 配置 ── (飞书坐标待用户提供)
onboarding_meta:
  onboarded_at: 2026-07-22
  onboarded_by: 接表管家起草
  strategy_lead: Ziao / 周哥
  notes: |
    DRAFT —— B 家族(有方向+缺粉丝数; 无巡查/检查 → 非 A; 无日期化结算 → 非 C)。
    本表特殊点(早期铺量表):
      1) 无曝光/阅读/互动列 → notes.impressions/reads/interactions 全 null;
      2) 「流量状况」100% 空 → tier 全 null(无数值推断基础); 待运营回收;
      3) 「笔记状态」实为内容形式(直出贴53/提问贴46) → 映 _intent_raw → intent_mapping;
      4) 方向 5 种全单选, 无多选组合;
      5) 「品牌反馈」列含修改意见(emoji 替换/配图修改等) → 进 raw_extra 留痕;
      6) 99 行(44 素人 × ~2.25 篇/人), 全部有笔记内容(raw_content NOT NULL 可满足)。
    待策略 lead 拍板:
      - brand/product/category 确认(岸深/冲牙器C10/个护 or 医疗器械?)
      - 5 方向的 content_format + target_audience
      - 合规模板(null or 医疗器械?)+ 红线 + 蓝词
      - intent_mapping: 直出贴→conversion / 提问贴→traffic 是否正确?
      - tier_thresholds 占位(当前不生效)
    下一步: 用户提供飞书坐标 → preflight → PR → 验证。

sync_config:
  source_type: feishu_api
  feishu_app_token: UWafwphKHiJTr4ksMnWcodvHnXc   # 表标识(非密钥), 接表时已知
  feishu_table_id: tblObopEQwBvMF41
  feishu_view_id: null
  sync_interval: on_demand