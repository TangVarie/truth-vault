# ════════════════════════════════════════════════════════════════════
# SPX_phase1 · SPORTSIX 能量胶 —— Onboarding 草稿(DRAFT)
# ════════════════════════════════════════════════════════════════════
# 产品: SPORTSIX 能量胶(韩国运动营养品牌,液体能量补给)
# 投放策略: 小红书素人铺量,以运动场景(跑步/骑行/健身/冲浪等)切入,
#          强调液体形态便捷性 + 不伤胃 + 快速补能
# 样本 30 行(294 总行):提问贴 139 / 好物分享-产品贴 103 / 抖音 50
# ════════════════════════════════════════════════════════════════════

version: 1.0

# ── 项目元数据 ──
project_id: SPX_phase1
# 定稿 2026-08-30(依据 244 行入库文案 + 36 行真实蓝词取值)。
# brand 保留英文原名: 蓝词列实测取值全是英文(SPORTSIX / sportsix / SPORTSIX能量胶 /
# SPORTSIX液体性 / SPORTSIX的PRO版), 文案里也没有出现过任何中文品牌名 → 没有中文名可用。
# category 保持 保健品: 运动营养(能量胶/HBCD/电解质)按保健品档合规, 不按食品饮料 ——
# 文案反复出现 Informed Sport 反兴奋剂认证、成分表、赛前补给剂量, 是功能性宣称语境。
brand: SPORTSIX
product: 能量胶                # 液体能量补给(文案里与"厚糖浆胶"作对比的就是这个形态差异)
category: 保健品
platform: xiaohongshu
schema_family: B               # 无巡查/检查/主页链接列 → B 家族;有 曝光量/阅读量/互动量
start_date: auto_from_publish_time_min
end_date: auto_from_publish_time_max

# ── 字段映射 ── [30 列全覆盖]
field_mapping:
  素人编号: account_id
  笔记内容: raw_content          # 【标题】+【正文】结构化文案
  发布时间: publish_time
  笔记链接: publish_url
  方向: _direction_raw            # → direction_decomposition(3 种:提问贴/好物分享-产品贴/抖音)
  流量状态: _status_raw           # tier 源(B 家族;10 种取值含伪爆帖500等)
  曝光量: impressions
  阅读量: reads
  互动量: interactions
  观众分析: _audience_raw          # → actual_audience_data(sync 确定性解析;93 行有值)
  随贴评论: _comment_text          # → comments 表(Phase2 LLM 解析)
  蓝词字段: hit_blue_keywords      # → notes.hit_blue_keywords(12 种取值,SPORTSIX/能量胶/Informed Sport认证)
  笔记状态: _note_status_raw       # 工作流状态(非 tier 源;检测伪爆贴)

# ── intent ──
# 本表【无】「发布笔记」intent 列 → 不做意图分类,notes.intent 留空(同 WTG 金标准)

# ── 方向拆解 ── 定稿 2026-08-30(依据 244 行入库文案全量, 不再是 30 行样本)
# 实测「方向」只有 2 种取值: 提问贴 139 / 好物分享-产品贴 103, 另有 2 行方向为空。
#
# ⚠️ 起草稿写的第三个方向「抖音(50 条)」在实表里【一行都没有】—— 那个数来自字段清单的
#    选项列表, 不是实际取值。已删除该条目: 留着等于给一个不存在的方向预设了内容形式,
#    真出现时反而会被静默套上一个猜的值。它若哪天真出现, preflight 会报 dirs_missing
#    (非阻断), 届时看真实文案再建 —— 这条路本来就是设计好的反馈闸。
#
# 人群维持「通用」是【结论不是占位】: 244 行覆盖 跑马/骑行/篮球/滑板/CrossFit/HYROX/
# 徒步/健身, 性别与年龄都不集中(既有"退伍十一年的体能教练"也有"减脂期"), 受控闭集里
# 没有"运动人群"这一档, 硬塞 年轻男性/年轻女性 就是 D-010 说的臆造。
direction_decomposition:

  "提问贴":                         # 139 条(最多); 真实训练/比赛场景 + 痛点 + 提问收尾
    # 随机抽 7 条标题验证: 减脂期还在硬加有氧的你们练前吃什么? / 能量胶喝下去要多久才有感觉? /
    # 夏天跑步吃能量胶反胃是天气的原因吗? / 第三局为什么突然跑不动? —— 方向名与文体一致。
    content_format: 提问求助
    target_audience: ["通用"]       # 见上: 跨运动项目、性别年龄不集中, 闭集内无更准的档
    user_pain_point: 运动中途体能崩溃 / 空腹跑不适 / 补给难下咽 / 胃不舒服(渗透压) / 持久力不足

  "好物分享-产品贴":                # 103 条
    # 起草稿按方向名推的「直给推荐」不对。随机抽 7 条标题: 感谢继科让HYROX小伙伴重视补给 /
    # 用军体训练的眼光看张继科输在哪 / 打了半年篮球为什么第三节总是跑不动 / 球球各大厂家
    # 都按这个标准设计包装(掏胶掏不出来) / CrossFit的Murph连做两遍 / 跑马也会被能量胶甜到崩溃
    # —— 全是【把产品放进一次具体训练或赛事里】讲, 不是摆参数推荐 → 场景植入。
    content_format: 场景植入
    target_audience: ["通用"]
    user_pain_point: 运动补给选择困难 / 传统能量胶口感差齁嗓子 / 赛中取用不便 / 液体形态便捷需求

tier_extraction:
  source: 状态字段                  # 指示用 _status_raw(即「流量状态」列)
  rules:
    - match_contains: ["大爆"]
      tier: 大爆
    - match_contains: ["爆帖预备"]
      tier: 预备
    # ⚠️ 假数据标记排在【爆】之前 —— 取首个命中。本表目前靠「伪爆帖」的 帖 与「爆贴」的
    # 贴 不同字才侥幸正确, 但同批的 BJS_phase1 正是往 爆 规则里加了「爆帖」就静默失效了
    # (D-045)。调到前面之后与列序无关, 谁再加字都不会翻车。
    # 针也从「伪爆帖500」放宽成「伪爆帖」前缀: 伪爆帖300 之类同属人工伪数据。
    - match_contains: ["伪爆帖", "伪爆贴", "伪20评"]  # SPX 独有:人工伪数据标记
      tier: 数据异常
    - match_contains: ["爆贴"]        # 注:飞书选项「爆贴」(贴非帖)
      tier: 爆
    # 定稿 2026-08-30: 由 参考 改 未知。
    # 「蓝词」讲的是【这条命中了蓝词】, 是关键词覆盖情况, 不是内容质量判断;
    # 而 参考 在本仓的定义是"运营人工判断这条值得参考", 且 参考【会进飞轮】
    # (fetch_pending_baokuan 收 爆/大爆/参考)。拿一个关键词覆盖标记去喂写作引擎,
    # 是把两种完全不同的信号混成一个。改判 未知 = 不下结论, 也不进飞轮。
    # 244 行实测【一次都没出现】这个值, 所以本次改动对现有数据零影响, 只影响将来。
    - match_contains: ["蓝词"]
      tier: 未知
    - match_contains: ["风控"]
      tier: 风控
    - match_contains: ["无水花"]
      tier: 趴
    - match_contains: ["评估中"]
      tier: 未知
    - default: null

# ── 数值推断阈值 ── 定稿 2026-08-30, 按 235 行真实互动分布校准
#
# ⚠️ 起草的 爆=50 是【错的, 会造假爆款】: 运营自己标「无水花」的 222 行里, 互动最高到 66 ——
#    50 卡在趴的区间【里面】, 于是任何一条状态列为空、互动 50~66 的行都会被数值推断
#    自动升成 爆, 而运营对同样量级的行判的是趴。这正是 D-047 那类"没有症状"的错。
#
# 没有采用 scripts/recommend_tier_thresholds.py 的 P75/P90 口径 —— 它对本表会算出
# 爆=4 / 大爆=16(全表 P75=4, P90=16)。原因是那个口径默认分布健康, 而本表 96% 的行是趴,
# P75 直接落在趴里。这不是脚本坏了, 是它的前提在这张表上不成立。
#
# 改用【运营自己画的那条线】—— 阈值本来就只在"状态列为空"时兜底, 它的职责是别把趴推成爆:
#   确定趴(排除同时标了「评估中」的未决行)互动最高 = 66
#   预备                                       最高 = 56
#   运营标爆的 5 行                = 108 / 127 / 130 / 136 / 325
#   → 66 与 108 之间【无重叠】, 爆取 100: 落在空档里, 且不高于运营的最低标爆值。
#   → 大爆取 300: 常规爆款封顶 136, 325 是唯一离群的一条, 300 卡在两者之间。
tier_thresholds:
  爆: 100                           # 确定趴上限 66 < 100 ≤ 运营标爆下限 108
  大爆: 300                         # 常规爆上限 136 < 300 ≤ 离群值 325

# ── 合规 ──
compliance:
  base_template: 保健品            # 定稿: 与 category 同档, 见文件抬头的理由
  # 定稿 2026-08-30。前三条沿用起草稿(保健品模板的标准三件套, 无需改);
  # 第四条是看完 244 行文案【新加】的 —— 多条帖子在讲赛中吃胶反胃/胃里翻江倒海/
  # 齁到想吐, 属于身体反应描述, 容易滑向"缓解/改善肠胃"这类功效暗示, 明确划掉。
  custom_red_flags:
    - "保健品禁疾病治疗功效宣称;能量补给功效需可证实,禁绝对化(最/第一/100%)"
    - "Informed Sport 认证可提及,但需确保真实性"
    - "禁向未成年人营销运动补给"
    - "描述赛中肠胃反应(反胃/胀气/渗透压)时只讲自身体验, 禁宣称缓解或改善肠胃功能"
  # 定稿 2026-08-30: 与百健士那张不同, 本表蓝词列【真有值】—— 244 行里 36 行命中,
  # 实测取值 11 种: SPORTSIX / sportsix / SPORTSIX能量胶 / SPORTSIX液体性 /
  # SPORTSIX的PRO版 / SPORTSIX常规款 / Informed Sport / Informed Sport认证 /
  # Informed Sport官网 / Informed Sport反兴奋剂认证 / 能量胶。
  # 起草稿的 primary 三个词与实测完全吻合, 予以确认; secondary 里的「液体能量胶」
  # 「运动补给」实测未出现, 但属于合理的次级词, 保留。
  blue_keyword_strategy:
    primary: ["SPORTSIX", "SPORTSIX能量胶", "Informed Sport认证"]
    secondary: ["能量胶", "液体能量胶", "运动补给"]
    avoid: []

# ── 项目专属字段(进 raw_extra) ── [30 列已全覆盖 field_mapping,此处仅图片/附件类]
# ── 抖音行沿用小红书文案 ── 2026-09-02 owner 口径(D-052)
# 表里 50 行 方向=「抖音」、链接是 v.douyin.com、有指标、没有「笔记内容」。运营的录入约定:
# 一条小红书文案拿去发抖音, 就在那行【下面】加一条抖音记录, 不重复写文案。
# 引擎按视图顺序拿【紧挨着】的上一行: 上一行是小红书 → 沿用它的文案; 上一行还是抖音 → 这条判不了,
# 隔离并点名 inherit_prev_row_is_same_kind(owner: "中间乱了一次"就是抖音接抖音那段; 与素人编号无关)。
# 方向也一并继承(抖音行自己的「抖音」留在 raw_extra._inherited_overrides), platform 标成 douyin。
content_inherit_from_previous_row:
  when: {方向: 抖音}
  also_inherit: [方向]
  platform_override: douyin

project_specific_fields_to_raw_extra:
  - 笔记配图                        # 图片 URL/附件(188 个不同值)
  - 随贴评论配图                    # 评论配图(46 个不同值)
  - 相关截图                        # 截图(289 个不同值)
  - 蓝词图片                        # 蓝词截图(12 个不同值,含 image.png×25)
  - 数据汇总                        # 文本汇总列(292 个不同值)
  - 父记录                          # 飞书内部关联字段
  - 平台                            # 单值「小红书」×84(冗余列,已知 platform=xiaohongshu)

data_supplement_needed:
  - field: account_followers
    method: 本表【无】粉丝数/帐号昵称列 → 需通过 publish_url 调小红书 API 或人工补录
    estimated_rows: 0

# ── Sync 配置 ── (飞书坐标待用户提供)
onboarding_meta:
  onboarded_at: 2026-07-21
  onboarded_by: 接表 agent 起草;策略判断项待策略 lead 拍板
  strategy_lead: (待指定)
  notes: |
    DRAFT —— B 家族,30 行样本起草。流程同 HXZ/RIO/TXQ:
      1) 飞书坐标待用户提供 → 补 sync_config.feishu_app_token / feishu_table_id;
      2) preflight 拉全表(show=50)→ 修 field_mapping(核对 30 列真实列名) + 
         补「未声明列」进 raw_extra;
      3) 「方向」3 种取值 → direction_decomposition 已按样本起草,待策略 lead 确认
         content_format / target_audience / user_pain_point;
      4) tier 阈值 爆50/大爆200 按样本保守推荐,入库后复核;
      5) brand=SPORTSIX / product=能量胶 / category=保健品 待策略 lead 确认;
      6) preflight 干净 → PR → 显式 Daily TV sync(dry_run → 实跑)→ backfill essence。
    特殊点:
      - 产品=SPORTSIX 能量胶(韩国运动营养,液体形态,区别传统胶状);
      - 无 intent 列(同 WTG 金标准,intent=null);
      - 方向 3 种(提问贴主力 139 条 / 好物分享-产品贴 103 / 抖音 50);
      - 流量状态含非标值「蓝词」「伪爆帖500」「伪20评」(其它表少见)→ tier 规则已特殊映射;
      - 蓝词字段有值(样本 30 行中 5 行),12 种选项(SPORTSIX/Informed Sport 认证等);
      - 观众分析格式与 WTG 一致(可解析),93 行有值(全表 294 行)。
    autowriter 映射不需配(D-038 通道2 退役)。

sync_config:
  source_type: feishu_api
  feishu_app_token: PLB3wBG1eiiOfXkApE2cerOonKu   # 表标识(非密钥), 接表时已知
  feishu_table_id: tbl4cA6tdO4CIE6F
