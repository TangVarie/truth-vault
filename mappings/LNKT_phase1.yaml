# ════════════════════════════════════════════════════════════════════
# LNKT_phase1 · 雷诺考特鼻喷 —— Onboarding 草稿(DRAFT · schema 演化)
# ════════════════════════════════════════════════════════════════════
#
# ⚠️ 本表三处与全部历史表不同:
#   (1) 方向拆成两列:「人群方向」(3 选项) + 「内容方向」(18 选项), 无单一「方向」列
#       —— 【仍待策略 lead 拍板】, 见下方 direction_decomposition 那段;
#   (2) 平台是抖音(v.douyin.com 链接), 不是小红书 —— ✅ 已定(2026-08-28): 就按抖音接;
#   (3) 无曝光量/阅读量/互动量独立列 —— 数据汇总以文本形式散在「数据汇总-第N次」列。
# 草稿起点 = A 家族(WTG/RIO/TXQ 式双状态列骨架)。
# 品类 ✅ 已定 = OTC药(2026-08-28); 飞书坐标已由批量流程从链接算出并写入 sync_config。
# ════════════════════════════════════════════════════════════════════

version: 1.0

# ── 项目元数据 ──
project_id: LNKT_phase1
# 定稿 2026-08-30: 299 行入库文案里两个名字都是【正文明写】的, 不再是从蓝词反推 ——
# 「每次刚喷完雷诺考特, 鼻子就一阵发痒」「面试前鼻塞…结论是雷诺考特完胜」
# 「求助! 驾校教练以为我哭, 布地奈德喷完多久起效?」。
brand: 雷诺考特
product: 布地奈德鼻喷
# 策略 lead 定(2026-08-28): 雷诺考特【只是 OTC】, 不是处方药。
# 起草稿按"布地奈德鼻用制剂国内属 Rx"推成了处方药 —— 那是按通用成分推的, 而实际按什么
# 销售由这个品牌的注册证决定, 只有业务侧知道。这正是 R-009 当年在力克雷 NRT 上定过的
# 同一类问题(成分看着像 Rx, 实际按 OTC 卖)。
# ⚠️ base_template 仍留在【处方药】那档, 见下方 compliance —— 品类是 OTC, 合规按药品级走。
category: OTC药
# 全库第一个非小红书项目。策略 lead 定(2026-08-28): 就按抖音接, 不改。
# 接表侧核过下游, TV 这半是通的(不是"应该能跑"):
#   · notes.platform / accounts.platform 都是 TEXT NOT NULL DEFAULT 'xiaohongshu', 无 CHECK
#   · ensure_account_exists(platform=...) 收参数, sync 传 note['platform'] → 建 douyin 素人账号 OK
#   · sync_truth_vault_baokuan_to_sanshengliubu 的 _PLATFORM_EN_TO_SSLL 里【已有】
#     "douyin" → "抖音"(未知平台那里是直接 raise 的, 所以有没有这行是硬判据)
#   · parse_audience_analysis 是按文本格式解析(；分段 ：分键值), 与平台无关 →「观众分析」照常解析
# 三生六部那一环已核(2026-08-30, 由用户在 ssll 仓核实):
#   list_reference_packs 对 platform 是【纯字符串精确匹配】—— 一句 eq("platform", x),
#   裸 TEXT 列, 没有枚举/白名单/大小写或中英别名折叠。库里存的是中文「抖音」。
#   → 【写入侧安全】: _platform_for_ssll 把 douyin 翻成「抖音」再写, 精确命中。这条路通。
#
# ⚠️ 但那边【读取侧】有个既有隐患, 而本表会是第一个让它显形的项目:
#   ssll 的 vibe loop 取样本时把 prompt_matrix 格子里的 platform 原样透传给
#   list_reference_packs, 中间零转换; 而格子的平台名上游【两套写法并存】——
#   crown_prince.md 的 schema 示例用英文 slug ["xiaohongshu","douyin"], 中书省
#   有时输出中文。格子若写成 "douyin", 查库就是 eq("platform","douyin"), 对着库里的
#   「抖音」行 0 命中 —— 不报错, 静默退回静态兜底样本, 只在日志留一条 R-022 警告
#   (platforms_missed 里出现英文 slug、platforms_hit 为空 = 就是这个)。
#   在本表之前库里没有抖音行, 写 "douyin" 查 0 条本来就"正常", 坑不显形;
#   本表灌进抖音数据之后, 同样查 0 条就变成【真的漏掉了本可用的样本】。
#   这是 ssll 仓的事(TV 这边改不了), 翻 daily 时值得同步提醒那边对齐平台名写法。
platform: douyin                 # 样本链接全为 v.douyin.com → 抖音,非小红书
schema_family: A                 # A 家族(有流量状态/笔记状态/数据回收情况/观众分析);
                                 # ⚠️ schema 演化标注:方向拆两列(人群方向+内容方向),
                                 # 无单一「方向」列,无 impressions/reads/interactions 独立列 ——
                                 # 与 WTG/RIO/TXQ 先例不同,策略 lead 确认后再定
start_date: auto_from_publish_time_min
end_date: auto_from_publish_time_max

# ════════════════════════════════════════════════════════════════════
# 字段映射 —— 全表 53 列逐一交代
# ════════════════════════════════════════════════════════════════════
#
# ⚠️ 重要:本表【无】独立的曝光量/阅读量/互动量列;数据汇总以非结构化文本散在
#    「数据汇总-第N次」里(如"播放量：8；点赞量：0；…")。
#    → impressions / reads / interactions 本期无法直接入库,全部为 null。
#    → 「数据汇总-第N次」进 raw_extra,留待后续 annotation pass 解析。
#
# ⚠️ 本表有「人群方向」+「内容方向」两列,无单一「方向」列。
#    草稿策略(待策略 lead 拍板):
#      - 「内容方向」→ _direction_raw(走 direction_decomposition,对应内容形式)
#      - 「人群方向」→ _audience_direction_raw(进 raw_extra,同时作为 target_audience 参考)
#    原因:direction_decomposition 的 target_audience 字段按「人群方向」值预填,
#    可省去 LLM 在 essence 层二次推断人群;但「人群方向」本身不能映成已有的类型化列,
#    只能留 raw_extra。—— 2026-08-30 定稿: 维持这个处理, 判据(18 个方向里 16 个人群唯一)
#    见 direction_decomposition 抬头那段。

field_mapping:
  # ── 标识 ──
  素人编号: account_id              # → notes.account_id (FK to accounts)
  素人ID: _account_name             # 实为账号 ID/昵称文本,暂映 _account_name(进 raw_extra 兜底)
  反馈链接: publish_url             # → notes.publish_url (抖音链接,非飞书 URL 字段)

  # ── 内容 ──
  文案: raw_content                 # → notes.raw_content [NOT NULL]
  发布时间: publish_time            # → notes.publish_time (datetime)

  # ── tier 源 ──
  流量状态: _status_raw             # → tier_extraction → notes.tier (WTG/RIO 式)

  # ── 工作流状态(非 tier 源) ──
  笔记状态: _note_status_raw        # 工作流状态;检测异常(非 tier 源,同 WTG/RIO/TXQ 先例)

  # ── 方向(双列新模式) ──
  内容方向: _direction_raw          # → direction_decomposition(18 种内容形式取值)
  # 人群方向:无对应类型化列,进 raw_extra(见 project_specific_fields_to_raw_extra)

  # ── 数据健康度(A 家族) ──
  数据回收情况: data_quality_status  # → notes.data_quality_status

  # ── 观众分析(确定性解析) ──
  观众分析: _audience_raw            # → notes.actual_audience_data(sync 解析;样本格式符合)

  # ── 蓝词 ──
  蓝词字段: hit_blue_keywords        # → notes.hit_blue_keywords(事后命中蓝词,7 行有值)

  # ── 评论 ──
  随贴评论: _comment_text            # → comments 表(Phase 2 LLM 解析)

# ── intent ──
# 本表【无】「发布笔记」intent 列 → 不做意图分类,notes.intent 留空(WTG 金标准 intent=null)。

# ════════════════════════════════════════════════════════════════════
# 方向拆解 —— 以「内容方向」18 种取值为基础方向
# ════════════════════════════════════════════════════════════════════
#
# ⚠️ 「内容方向」18 个实际出现值(distinct 统计):
#   流量贴×74 / 极简提问×32 / 踩坑坦白×21 / 智商税清单体×19 / 问医生实录×19 /
#   就医流水账×18 / 包里床头×18 / 戒药日记×16 / 和平共处×15 / 互助求助×10 /
#   和平共处体×9 / 压箱底经验体×9 / 摊牌自查×9 / 育儿分享体×7 / 育儿分享×7 /
#   压箱底经验×6 / 互助求助体×5 / 摊牌自查体×5
#
# 注意:部分内容方向存在「体」/非「体」两种写法(如"和平共处"与"和平共处体"),
# 飞书单选选项包含两者 → 须各建一条确保全命中(sync 按精确键匹配)。
#
# ── 人群方向怎么处理: 定稿 2026-08-30, 维持「进 raw_extra, 不单开字段」 ──
# 起草时留的问题是"人群这一维丢进 raw_extra 会不会导致按人群检索不到"。
# 299 行入库后把「方向」×「人群方向」拉了个交叉表, 答案很干净:
#   18 个方向里 16 个的人群是【唯一的】—— 踩坑坦白 21/21 都市打工人、问医生实录 19/19
#   妈妈人群、包里床头 18/18 学生考研党、就医流水账 18/18 妈妈、戒药日记 16/16 打工人、
#   和平共处 15/15 打工人、互助求助 10/10 学生、摊牌自查 9/9 学生、压箱底经验 6/6 妈妈…
#   只有 2 个是混的: 流量贴(打工55/妈妈16/学生4)、极简提问(妈妈17/学生11/打工4)。
# 也就是说人群在绝大多数方向上【由方向本身决定】, 不需要拼 18×3 的联合键, 也不需要
# 单开一个 audience 字段 —— 把它写进各方向的 target_audience 就已经检索得到了;
# 那 2 个混合方向用多值 target_audience 表达。原始值仍留在 raw_extra.人群方向, 可追溯。
#
# ⚠️ 一处闭集缺档: 「都市打工人」在受控词表(docs/05)的 11 个 target_audience 里
#    没有对应档(既不是学生党也不是宝妈, 更不是银发/中年), 只能落 通用。
#    这是词表的缺口不是本表的判断模糊 —— 要不要加一档是词表侧的议题, 不在这里造值。
#
# content_format 逐条按【入库后的真实标题】定, 依据写在每条上面(起草时只有 30 行样本)。

direction_decomposition:

  "流量贴":                          # 74 条(最多)
    # 实测标题: 被医生批评偏方不能乱用 / 打喷嚏把crush的咖啡吹飞了 / 老公把猫接回来我躲进卧室
    content_format: 情感叙事
    target_audience: ["通用", "宝妈"]
    user_pain_point: 鼻炎困扰(堵/打喷嚏/依赖药物)的通用流量钩子

  "极简提问":                         # 32 条
    # 实测标题: 有鼻炎上体育课会缺氧吗 / 产后重感冒引发鼻炎晚上憋醒咋办 / 早起背书鼻子堵求问
    content_format: 提问求助
    target_audience: ["宝妈", "学生党", "通用"]
    user_pain_point: 鼻炎用药/症状的简短求助

  "踩坑坦白":                         # 21 条
    # 实测标题: 喷药带血丝我差点去投诉 / 我发现之前鼻喷全用错了(坑一坑二坑三) / 以为以毒攻毒结果流鼻血
    content_format: 认知重构
    target_audience: ["通用"]
    user_pain_point: 鼻炎用药方法错误/踩坑经历(喷法错/当救急用/越喷越频)

  "智商税清单体":                     # 19 条
    # 实测标题: 鼻炎用偏方塞蒜 / 跟风买的维生素鼻喷其实是生理盐水 / 以为避开过敏原就行
    content_format: 认知重构
    target_audience: ["通用"]
    user_pain_point: 鼻炎周边产品踩坑(洗鼻器/通鼻棒/喷剂依赖)

  "问医生实录":                       # 19 条
    # 实测标题: 当着娃面撒谎被大夫拆穿 / 选药排雷榜哪些鼻炎药不能碰 / 娃被我拖成腺样体肥大
    content_format: 认知重构
    target_audience: ["宝妈"]
    user_pain_point: 看诊流程不清/不知该挂哪科/用药方法不对

  "就医流水账":                       # 18 条
    # 实测标题: 带娃打疫苗顺路看鼻炎 / 婆婆把医生开的药藏起来了 / 避雷鼻炎贴把娃贴进了医院
    content_format: 情感叙事
    target_audience: ["宝妈"]
    user_pain_point: 反复就医未果/辗转多科最终确诊过敏性鼻炎

  "包里床头":                         # 18 条
    # 实测标题: 运动腰包装一支 / 图书馆里怎么拥有方圆两米结界 / 我包里终于不用带那瓶了
    content_format: 场景植入
    target_audience: ["学生党"]
    user_pain_point: 随身携带/睡前必备的鼻炎用药习惯

  "戒药日记":                         # 16 条
    # 实测标题: 地铁开到一半发现没带药差点按报警器 / Day1把枕头底下那瓶扔了 / 不再害怕鼻炎发作
    content_format: 情感叙事
    target_audience: ["通用"]
    user_pain_point: 依赖一喷就通型药物/换抗过敏鼻喷的戒药历程

  "和平共处":                         # 15 条
    # 实测标题: 坐飞机耳朵堵 / 别再以为打喷嚏能把药清空 / 跟空调房和平共处了
    content_format: 场景植入
    target_audience: ["通用"]
    user_pain_point: 长期鼻炎不能根治/寻找与之共存方式

  "互助求助":                         # 10 条
    # 实测标题: 被图书馆冷气吹到怀疑人生 / 求助喷完多久起效 / 我张嘴睡觉的丑照被发宿舍群了
    content_format: 提问求助
    target_audience: ["学生党"]
    user_pain_point: 压箱底经验征集/互相排雷

  "和平共处体":                       # 9 条(同「和平共处」,写法含"体"字)
    # 实测标题: 以前出差半箱药这次就带了一支 / 出差三天酒店空调正对着床 / 午睡第一次睡满一小时
    content_format: 场景植入
    target_audience: ["通用"]
    user_pain_point: 长期鼻炎不能根治/寻找与之共存方式

  "压箱底经验体":                     # 9 条
    # 实测标题: 给青春期娃用成人喷雾减量喷 / 做好记录能少跑医院 / 差点去割腺样体捡回一刀
    content_format: 教程攻略
    target_audience: ["宝妈"]
    user_pain_point: 鼻炎用药经验积累/踩坑后找到正确方法

  "摊牌自查":                         # 9 条
    # 实测标题: 面试前鼻塞喷雾和口服药哪个不犯困 / 什么药膏鼻炎贴不如几十块的喷雾 / 摊牌了鼻炎当感冒
    content_format: 认知重构
    target_audience: ["学生党"]
    user_pain_point: 鼻炎症状自查/确认是过敏还是感冒

  "育儿分享体":                       # 7 条
    # 实测标题: 娃睡觉打呼噜差点窒息 / 扔了一抽屉鼻炎药只留一样 / 治鼻炎花的冤枉钱够报兴趣班
    content_format: 情感叙事
    target_audience: ["宝妈"]
    user_pain_point: 娃的鼻炎用药选择/就医经历分享

  "育儿分享":                         # 7 条(同「育儿分享体」,写法无"体"字)
    # 实测标题: 娃上体育课终于不喘了 / 把家里改成低敏模式 / 斗智斗勇的喷鼻大戏终于结局
    content_format: 情感叙事
    target_audience: ["宝妈"]
    user_pain_point: 娃的鼻炎用药选择/就医经历分享

  "压箱底经验":                       # 6 条(同「压箱底经验体」,写法无"体"字)
    # 实测标题: 300块电动洗鼻器吃灰娃遭罪 / 不用再交代老师帮娃喷鼻子 / 鼻喷盖子记得盖
    content_format: 教程攻略
    target_audience: ["宝妈"]
    user_pain_point: 鼻炎用药经验积累/踩坑后找到正确方法

  "互助求助体":                       # 5 条(同「互助求助」,写法含"体"字)
    # 实测标题: 自习室最吵的不是翻书声是患鼻炎的我 / 鼻炎患者互助我先坦白求压箱底
    content_format: 提问求助
    target_audience: ["学生党"]
    user_pain_point: 压箱底经验征集/互相排雷

  "摊牌自查体":                       # 5 条(同「摊牌自查」,写法含"体"字)
    # 实测标题: 摊牌我把鼻炎当感冒两年了 / 室友你考研怎么天天半夜哭 / 养猫三年找到平衡点
    content_format: 认知重构
    target_audience: ["学生党"]
    user_pain_point: 鼻炎症状自查/确认是过敏还是感冒

# ════════════════════════════════════════════════════════════════════
# tier 抽取规则(流量状态 → tier)
# ════════════════════════════════════════════════════════════════════
#
# 流量状态真实取值(distinct):
#   无水花×187 / 风控中×27 / 无水花 / 评论待删除×5 /
#   评估中 / 无水花×3 / 无水花 / 待调整×2 / 爆贴×1 / 小爆×1
#
# 特殊处理:
#   - 「小爆」(同 OKMAN 先例) → 映射为 爆(受控词表无"小爆")
#   - 组合值含「评论待删除」/「待调整」→ 按 match_contains 优先顺序,
#     风控 > 爆 > 趴 > 未知,复合值取最高风险级

tier_extraction:
  source: 状态字段                   # 指示用 _status_raw(即「流量状态」列)
  rules:
    - match_contains: ["大爆"]
      tier: 大爆
    - match_contains: ["爆帖预备"]   # 飞书选项含「爆帖预备」(帖)
      tier: 预备
    - match_contains: ["爆贴预备"]   # 兼容「爆贴预备」(贴)
      tier: 预备
    - match_contains: ["爆贴"]
      tier: 爆
    # 定稿 2026-08-30: 由 爆 改 参考, 与 OKMAN 先例分道。
    # 起草时的理由是"沿用 OKMAN 的 小爆→爆"。但入库 299 行给出了一个 OKMAN 那边没有的
    # 内部证据: 【本表同时使用「爆贴」和「小爆」两个值】(各 1 行)。同一个运营在同一列里
    # 既写爆贴又写小爆, 说明在他们的口径里这两个不是一回事, 小爆是更低的一档 ——
    # 把两个都映成 爆 等于抹掉他们自己做的区分。
    # 落到 参考 而不是 预备: 预备(源自「爆帖预备」)说的是【还没起量的候选】,
    # 小爆说的是【起了, 但不大】, 语义不同。参考 正是本仓"够不上爆款但值得参考"那一档,
    # 下游权重也低(通道1 里 参考 的 quality_score=0)。
    # 只影响 1 行; 若日后确认两个项目确实同一套运营口径, 这里是要回看的那一行。
    - match_contains: ["小爆"]
      tier: 参考
    - match_contains: ["风控"]       # 匹配「风控中」
      tier: 风控
    - match_contains: ["无水花"]
      tier: 趴
    - match_contains: ["评估中"]
      tier: 未知
    - default: null

# ── 数值推断阈值 —— 定稿 2026-08-30(结论: 现在定不了, 也不该硬定) ──
# 299 行入库后复核: interactions 仍然 100% 为 null, 数值推断一次都不会触发。
# 起草时留的问题是"本期接受无互动量入库吗 / 后面要不要写个 pass 把指标解析回填"。
# 两个答案:
#
# ① 本期接受 —— 已经接受了, 299 行正文/方向/人群都在库里, 内容语料完整可用,
#    缺的只是指标。这不阻塞任何下游(essence 标注、经验卡都不读 interactions)。
#
# ② 该写, 而且已经勘明可行 —— 指标不是没有, 是在【非结构化文本】里:
#    raw_extra 的「数据汇总-第N次」299 行里有 214 行有值, 格式高度规整:
#      播放量:2187;点赞量:77;评论量:11;分享量:0;收藏量:2;划走率:49.18%;…
#    这与本仓已有的 parse_audience_analysis(「；分段 ：分键值」)是同一形状,
#    可【确定性解析】, 不需要 LLM。落库口径:
#      播放量 → impressions ; 点赞+评论+分享+收藏 → interactions
#      (后者正是已有的 computed_fields.sum, TGV_phase1 就是这么做的)
#    唯一要定的细节: 「第N次」是多轮快照, 取【有值的最大 N】作当期值。
#    这是一次引擎侧改动(给 mapping 加一种"键值文本 → 数值列"的解析), 不在本次
#    定稿范围内 —— 本次只把结论和口径钉下来, 免得下一个人再勘一遍。
#
# 在那之前, 下面两个数是占位, 不生效。等指标真回填了再按分布校准
# (口径见 XIWU/SPX: 卡在"确定趴的上限"与"运营标爆的下限"之间, 不用 P75/P90)。
tier_thresholds:
  爆: 50                             # 占位, 不生效(interactions 全 null)
  大爆: 500                          # 占位, 不生效

# ════════════════════════════════════════════════════════════════════
# 合规
# ════════════════════════════════════════════════════════════════════
compliance:
  # category 是 OTC药, 但模板仍走【处方药】这档 —— 这不是漏改, 是 NRT 立的先例:
  # NRT_phase2/3 同样 category: OTC药 + base_template: 处方药(R-009)。
  # 即"按 OTC 卖"决定的是品类, 不降低合规档位; 药品内容的红线按药品级走。
  # 往松改是有代价的方向, 真要改请连 NRT 那两张一起议。
  base_template: 处方药
  # 定稿 2026-08-30。前 5 条沿用起草稿(药品级红线, 措辞予以确认);
  # 后 2 条是看完 299 行真实文案新加的 —— 文案里反复出现「喷完多久起效」
  # 「喷药带血丝」「给青春期娃用成人喷雾减量喷」「差点去割腺样体」,
  # 已经踩到起效时间承诺、不良反应处置、儿童减量用法这三条线上了。
  custom_red_flags:
    - "鼻用激素类 OTC 药;禁直接宣称'治疗鼻炎''根治'"
    - "禁剂量数字(mg/μg)出现在正文"
    - "禁暗示替代医疗/暗示不需就医直接自购"
    - "禁绝对化功效('一定有效'/'彻底好了')等"
    - "禁向未成年人直接营销(含儿童鼻炎场景需谨慎合规)"
    - "禁承诺起效时间与见效程度('几天就通''喷完立刻通气'), 只能陈述个人体感"
    - "出现出血/刺激等不良反应时只能陈述并引导就医, 禁给自行调整用法用量的建议(含给儿童减量分喷)"
  # 定稿 2026-08-30: 起草值来自蓝词字段的选项列表, 予以确认(本表 hit_blue_keywords
  # 入库后仍无值, 该列在本期没被运营填过, 所以只能以选项为准 —— 与百健士不同的是,
  # 这些选项本身就是本品牌的, 没有串台问题)。
  # avoid 里的四个词与上面的红线是同一件事的两端: 红线管写作时禁说, avoid 管投放时禁投。
  blue_keyword_strategy:
    primary: ["雷诺考特鼻喷", "布地奈德喷雾", "抗过敏鼻喷"]
    secondary: ["布地奈德鼻喷", "鼻炎用药", "鼻炎克星", "鼻炎喷雾"]
    avoid: ["治疗", "根治", "治愈", "处方药"]

