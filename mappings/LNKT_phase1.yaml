# 合规
# ════════════════════════════════════════════════════════════════════
compliance:
  base_template: 处方药              # [待确认] 布地奈德鼻喷=处方药级合规;策略 lead 拍板
  custom_red_flags:                  # [待确认]
    - "布地奈德/雷诺考特属鼻用激素类处方药;禁直接宣称'治疗鼻炎''根治'"
    - "禁剂量数字(mg/μg)出现在正文"
    - "禁暗示替代医疗/暗示不需就医直接自购"
    - "禁绝对化功效('一定有效'/'彻底好了')等"
    - "禁向未成年人直接营销(含儿童鼻炎场景需谨慎合规)"
  blue_keyword_strategy:
    primary: ["雷诺考特鼻喷", "布地奈德喷雾", "抗过敏鼻喷"]  # [待确认] 据蓝词字段取值
    secondary: ["布地奈德鼻喷", "鼻炎用药", "鼻炎克星", "鼻炎喷雾"]  # [待确认]
    avoid: ["治疗", "根治", "治愈", "处方药"]                  # [待确认]

