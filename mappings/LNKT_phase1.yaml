# ════════════════════════════════════════════════════════════════════
# tier 抽取规则(流量状态 → tier)
# ════════════════════════════════════════════════════════════════════
#
# 流量状态真实取值(distinct):
#   无水花×187 / 风控中×27 / 无水花 / 评论待删除×5 /
#   评估中 / 无水花×3 / 无水花 / 待调整×2 / 爆贴×1 / 小爆×1
#
# 特殊处理:
#   - 「小爆」(同 OKMAN 先例) → 映射为 爆(受控词表无"小爆")
#   - 组合值含「评论待删除」/「待调整」→ 按 match_contains 优先顺序,
#     风控 > 爆 > 趴 > 未知,复合值取最高风险级

tier_extraction:
  source: 状态字段                   # 指示用 _status_raw(即「流量状态」列)
  rules:
    - match_contains: ["大爆"]
      tier: 大爆
    - match_contains: ["爆帖预备"]   # 飞书选项含「爆帖预备」(帖)
      tier: 预备
    - match_contains: ["爆贴预备"]   # 兼容「爆贴预备」(贴)
      tier: 预备
    - match_contains: ["爆贴"]
      tier: 爆
    - match_contains: ["小爆"]       # LNKT 独有状态 → 映射为 爆(OKMAN 先例)
      tier: 爆
    - match_contains: ["风控"]       # 匹配「风控中」
      tier: 风控
    - match_contains: ["无水花"]
      tier: 趴
    - match_contains: ["评估中"]
      tier: 未知
    - default: null

# ── 数值推断阈值 ──
# ⚠️ [待确认] 本表无独立互动量列 → 数值推断实际无法生效(interactions=null)。
# 此处按 WTG 保守值起草作占位,入库后跑 scripts/recommend_tier_thresholds.py 校准。
tier_thresholds:
  爆: 50                             # [待确认] 占位;本表互动量来自抖音「播放量」量级,
  大爆: 500                          # [待确认] 待策略 lead 确认互动量口径后重设

