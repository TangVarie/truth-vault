# ════════════════════════════════════════════════════════════════════
# LNKT_phase1 · 雷诺考特鼻喷 —— Onboarding 草稿(DRAFT · schema 演化)
# ════════════════════════════════════════════════════════════════════
#
# ⚠️ 本表有两处新模式(与全部历史表不同), 须策略 lead 拍板后才能最终确认:
#   (1) 方向拆成两列:「人群方向」(3 选项) + 「内容方向」(18 选项), 无单一「方向」列;
#   (2) 平台是抖音(v.douyin.com 链接), 不是小红书;
#   (3) 无曝光量/阅读量/互动量独立列 —— 数据汇总以文本形式散在「数据汇总-第N次」列。
# 草稿起点 = A 家族(WTG/RIO/TXQ 式双状态列骨架); 飞书坐标、品类待补。
# ════════════════════════════════════════════════════════════════════

version: 1.0

# ── 项目元数据 ──
project_id: LNKT_phase1
brand: 雷诺考特                  # [待确认] 据蓝词/话题标签推断(雷诺考特鼻喷);LNKT 为内部代号
product: 布地奈德鼻喷            # [待确认] 据蓝词推断;实际产品线待策略 lead 确认
category: 处方药                 # [待确认] 布地奈德鼻喷国内属处方药(Rx);策略 lead 拍板
platform: douyin                 # 样本链接全为 v.douyin.com → 抖音,非小红书
schema_family: A                 # A 家族(有流量状态/笔记状态/数据回收情况/观众分析);
                                 # ⚠️ schema 演化标注:方向拆两列(人群方向+内容方向),
                                 # 无单一「方向」列,无 impressions/reads/interactions 独立列 ——
                                 # 与 WTG/RIO/TXQ 先例不同,策略 lead 确认后再定
start_date: auto_from_publish_time_min
end_date: auto_from_publish_time_max

# ════════════════════════════════════════════════════════════════════
# 字段映射 —— 全表 53 列逐一交代
# ════════════════════════════════════════════════════════════════════
#
# ⚠️ 重要:本表【无】独立的曝光量/阅读量/互动量列;数据汇总以非结构化文本散在
#    「数据汇总-第N次」里(如"播放量：8；点赞量：0；…")。
#    → impressions / reads / interactions 本期无法直接入库,全部为 null。
#    → 「数据汇总-第N次」进 raw_extra,留待后续 annotation pass 解析。
#
# ⚠️ 本表有「人群方向」+「内容方向」两列,无单一「方向」列。
#    草稿策略(待策略 lead 拍板):
#      - 「内容方向」→ _direction_raw(走 direction_decomposition,对应内容形式)
#      - 「人群方向」→ _audience_direction_raw(进 raw_extra,同时作为 target_audience 参考)
#    原因:direction_decomposition 的 target_audience 字段按「人群方向」值预填,
#    可省去 LLM 在 essence 层二次推断人群;但「人群方向」本身不能映成已有的类型化列,
#    只能留 raw_extra 加 _audience_direction_raw 中间变量(待确认处理方式)。

field_mapping:
  # ── 标识 ──
  素人编号: account_id              # → notes.account_id (FK to accounts)
  素人ID: _account_name             # 实为账号 ID/昵称文本,暂映 _account_name(进 raw_extra 兜底)
  反馈链接: publish_url             # → notes.publish_url (抖音链接,非飞书 URL 字段)

  # ── 内容 ──
  文案: raw_content                 # → notes.raw_content [NOT NULL]
  发布时间: publish_time            # → notes.publish_time (datetime)

  # ── tier 源 ──
  流量状态: _status_raw             # → tier_extraction → notes.tier (WTG/RIO 式)

  # ── 工作流状态(非 tier 源) ──
  笔记状态: _note_status_raw        # 工作流状态;检测异常(非 tier 源,同 WTG/RIO/TXQ 先例)

  # ── 方向(双列新模式) ──
  内容方向: _direction_raw          # → direction_decomposition(18 种内容形式取值)
  # 人群方向:无对应类型化列,进 raw_extra(见 project_specific_fields_to_raw_extra)

  # ── 数据健康度(A 家族) ──
  数据回收情况: data_quality_status  # → notes.data_quality_status

  # ── 观众分析(确定性解析) ──
  观众分析: _audience_raw            # → notes.actual_audience_data(sync 解析;样本格式符合)

  # ── 蓝词 ──
  蓝词字段: hit_blue_keywords        # → notes.hit_blue_keywords(事后命中蓝词,7 行有值)

  # ── 评论 ──
  随贴评论: _comment_text            # → comments 表(Phase 2 LLM 解析)

# ── intent ──
# 本表【无】「发布笔记」intent 列 → 不做意图分类,notes.intent 留空(WTG 金标准 intent=null)。

# ════════════════════════════════════════════════════════════════════
# 方向拆解 —— 以「内容方向」18 种取值为基础方向
# ════════════════════════════════════════════════════════════════════
