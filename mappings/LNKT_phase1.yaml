# ⚠️ 「内容方向」18 个实际出现值(distinct 统计):
#   流量贴×74 / 极简提问×32 / 踩坑坦白×21 / 智商税清单体×19 / 问医生实录×19 /
#   就医流水账×18 / 包里床头×18 / 戒药日记×16 / 和平共处×15 / 互助求助×10 /
#   和平共处体×9 / 压箱底经验体×9 / 摊牌自查×9 / 育儿分享体×7 / 育儿分享×7 /
#   压箱底经验×6 / 互助求助体×5 / 摊牌自查体×5
#
# 注意:部分内容方向存在「体」/非「体」两种写法(如"和平共处"与"和平共处体"),
# 飞书单选选项包含两者 → 须各建一条确保全命中(sync 按精确键匹配)。
