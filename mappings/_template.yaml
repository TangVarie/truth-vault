# ════════════════════════════════════════════════════════════════════
# Truth Vault · Project Mapping Template
# ════════════════════════════════════════════════════════════════════
#
# 复制这个模板到 mappings/<project_id>.yaml 然后填写。
# 见 docs/04-onboarding-sop.md 的 7 步 SOP。
#
# 必填字段标 [REQUIRED]，可选字段标 [OPTIONAL]
# ════════════════════════════════════════════════════════════════════

version: 1.0

# ── 项目元数据 [REQUIRED] ──
project_id: PROJECT_PHASE      # 形式: 品牌缩写_phase号，如 NUC_phase1, NRT_phase3
brand: 品牌中文全名
product: 具体产品名
category: 保健品                # 见 docs/05 §9 统一词表: 处方药/OTC药/保健品/医疗器械/美妆/个护/酒类/食品饮料/母婴/3C数码/家居家电/服饰鞋包/教育/其他
platform: xiaohongshu          # xiaohongshu / douyin
schema_family: B               # A / B / C (见 docs/03-mapping-protocol.md)
start_date: 2025-XX-XX
end_date: 2026-XX-XX            # 可填预估或留空

# ════════════════════════════════════════════════════════════════════
# 字段映射 [REQUIRED]
# ════════════════════════════════════════════════════════════════════
# 
# 左边: 飞书表里的原始列名（精确匹配）
# 右边: 映射到 schema 的字段
# 
# - 以 _ 开头的是中间变量，进入二次处理
# - 其他直接映射到 notes 表的对应字段
# - 在 field_mapping 和 project_specific_fields_to_raw_extra 中
#   声明过的字段才会入库。
# - **未声明的新字段不会静默进 raw_extra**——按 D-021 它们整行进入
#   `truth_vault.undeclared_fields_quarantine` 等待人工 review。
#   这样飞书表新加字段时不会被默默吞掉。

# ════════════════════════════════════════════════════════════════════
# 标题怎么拿 [内容特征层 docs/28 §3 第 4 条, D-065 续]
# ════════════════════════════════════════════════════════════════════
# column  = 飞书有独立标题列, field_mapping 把它映到 title (TGV)
# markers = 标题写在文案里, 带标记。一个解析器同时认两种写法:
#           「【标题】…【正文】…」 和 「标题：…(换行)正文：…」(冒号全角半角都行, 前面可带【xx】)
#           切不出来的单条, 标题类题目 (title_is_question / title_len_bucket / …) 记 NULL, 不猜
# none    = 没有标题, 标题类题目一律 NULL
title_extraction: markers

# 品牌词 / 产品词补充 (可选, 运营 Q3 回来后填): brand_in_title / brand_first_position 的词典 =
# projects.brand + product + 笔记 target_blue_keywords + 这里的别名。正式名文案里不用时在这补口语写法。
# brand_aliases: [锐澳, RIO轻享]

field_mapping:
  # ── 标识 ──
  # account_id → truth_vault.accounts(account_id) FK
  # note_id 不在这里映射，由 sync 脚本按 f"{project_id}_{feishu_record_id}" 生成
  素人编号: account_id
  
  # ── 内容 ──
  文案: raw_content
  发布时间: publish_time
  反馈链接: publish_url
  
  # ── A/B 家族通用 ──
  状态: _status_raw                    # 走 tier_extraction
  方向: _direction_raw                  # 走 direction_decomposition
  
  # ── 数据回收（按家族字段命名）──
  # A 家族:
  # 曝光数: impressions
  # 阅读数: reads
  # 互动数: interactions
  # B 家族:
  曝光量: impressions
  阅读量: reads
  互动量: interactions
  
  # ── 蓝词 ──
  关键词: target_blue_keywords          # 目标蓝词（投放前定）
  蓝词记录: hit_blue_keywords           # 实际命中（事后回收）
  
  # ── 评论 ──
  实时数据.评论数: comments_count   # D-062: 判爆的唯一依据(实时总评论数, 含铺评), 巡查机器人抓的
  爆帖置顶评论: pinned_comment
  随贴评论: _comment_text                # 进 comments 表
  随贴评论素人: _comment_text_persona    # 进 comments 表
  
  # ── 账号信息 ──
  # 注: truth_vault.notes 表没有 account_name / account_followers 直接列，
  # 这两个字段属于 truth_vault.accounts（账号实体）的属性。
  # 当前 sync 脚本 v1 不会拆分这两列到 accounts 表（只 upsert account_id），
  # 所以这里用下划线前缀变量名 → 进 raw_extra 而不是 notes 列，避免插入报错。
  # 后续版本如果加了 account_name / account_followers 到 truth_vault.accounts，
  # 改成 _account_name → accounts 表的两步处理。
  帐号昵称: _account_name                # 进 raw_extra；未来扩展进 accounts
  粉丝数: _account_followers             # 进 raw_extra；未来扩展进 account_snapshots
  
  # ── 意图 ──
  发布笔记: _intent_raw                  # 走 intent_mapping
  
  # ── 数据健康度（仅 A 家族）──
  数据回收情况: data_quality_status

# ════════════════════════════════════════════════════════════════════
# Intent 映射 [REQUIRED if has _intent_raw]
# ════════════════════════════════════════════════════════════════════
# 
# 飞书原值 → schema enum
# 飞书原值可能多种，需要逐一列出

intent_mapping:
  流量帖: traffic
  钓鱼帖: traffic
  直给笔记: conversion
  小红书下单: conversion
  淘宝下单: conversion
  科普贴: educational
  截图: other
  大字报: other

# ════════════════════════════════════════════════════════════════════
# 方向拆解 [REQUIRED]
# ════════════════════════════════════════════════════════════════════
# 
# 飞书「方向」字段的每个不同取值，映射到多个标准维度
# 这是 onboarding 最关键的部分 —— 必须策略 lead 决定
# 
# 详见 docs/04-onboarding-sop.md Step 3

direction_decomposition:
  
  "方向取值1":
    content_format: 情感叙事            # [REQUIRED] 见 docs/05-controlled-vocab.md
    intent_override: null               # [OPTIONAL] 覆盖项目级 intent
    target_audience: ["中年女性"]       # [REQUIRED] 多选，受控词表
    user_pain_point: 衰老焦虑            # [OPTIONAL] 自由文本
    product_focus: null                 # [OPTIONAL] 项目专属（如 NRT 的"咀嚼胶"）
  
  "方向取值2":
    content_format: 直给推荐
    target_audience: ["通用"]
    user_pain_point: null

  # NRT 风格组合标签示例
  "为爱助戒, 咀嚼胶":
    content_format: 情感叙事
    target_audience: ["伴侣家人"]
    user_pain_point: 为伴侣戒烟
    product_focus: 咀嚼胶

# ════════════════════════════════════════════════════════════════════
# Tier 抽取规则 [REQUIRED]
# ════════════════════════════════════════════════════════════════════
# 
# A/B 家族通常用 "状态字段"
# C 家族用 "备注字段"

tier_extraction:
  source: 状态字段                       # 状态字段 / 备注字段
  
  # A/B 家族标准规则（见 docs/03-mapping-protocol.md）
  rules:
    - match_contains: ["大爆"]
      tier: 大爆
    - match_contains: ["爆贴预备"]
      tier: 预备
    - match_contains: ["爆贴"]
      tier: 爆
    - match_contains: ["参考"]      # 够不上爆款但值得参考: 也进飞轮(低权重), 不计爆款统计
      tier: 参考
    - match_contains: ["风控"]
      tier: 风控
    - match_contains: ["无水花"]
      tier: 趴
    - match_contains: ["评估中"]
      tier: 评估中
    - default: null
  
  # C 家族示例（TGV_1）:
  # rules:
  #   - match_exact: ["新爆", " 新爆"]
  #     tier: 爆
  #   - match_exact: ["淘汰"]
  #     tier: 趴
  #   - match_contains: ["删0", "他自己删了"]
  #     tier: 删除
  #   - default: null

# ════════════════════════════════════════════════════════════════════
# Tier 数值阈值 [REQUIRED]
# ════════════════════════════════════════════════════════════════════
# 
# 用于"数值推断"兜底（人工 tier 缺失时按互动数判定）
# 数值参考: 见 docs/04-onboarding-sop.md Step 5

# tier_thresholds 已废(D-062, 2026-09-17): 判爆只看评论数, 全项目统一 爆≥50/大爆≥100,
# 由同步脚本按 comments_count 推断; 不再按项目配互动量阈值(那把尺子和运营的不是一把)。

# ════════════════════════════════════════════════════════════════════
# 合规配置 [OPTIONAL but recommended]
# ════════════════════════════════════════════════════════════════════

compliance:
  base_template: null                   # 处方药/保健品/美妆/null
  custom_red_flags:
    - "项目专属红线 1"
    - "项目专属红线 2"
  
  blue_keyword_strategy:
    primary: []                          # 主推蓝词
    secondary: []                        # 次推
    avoid: []                            # 禁词

# ════════════════════════════════════════════════════════════════════
# 项目专属字段（进 raw_extra）[OPTIONAL]
# ════════════════════════════════════════════════════════════════════
# 
# 这是一个 **allowlist** —— 飞书表里的项目独有字段，必须显式列在这里
# 才会被收入 notes.raw_extra JSONB。
# 
# 未列入这里且未在 field_mapping 中映射的字段 → 整行进 quarantine（D-021），
# 不会静默进库。设计目的：飞书表加新字段时，团队必须显式决定它是入库
# 还是忽略，而不是默默吞下导致后续 schema 漂移。
# 
# 即使当时不知道有什么用，列在这里仍是合理选择（永远存 JSONB，将来可能发现价值）。

project_specific_fields_to_raw_extra:
  # ── 投流(2026-09-17 运营对齐 Q7, 见 data-analysis/ops-answers-2026-09-17.md)──
  # 运营定的三个人工列, 机器不得覆盖。先按 allowlist 收进 raw_extra 留痕;
  # 等飞书里真建出来、「维护情况」的多选取值定了, 再升成 typed 列(D-062)。
  # 现在声明是为了它们一出现就有名有姓, 不落进 _undeclared 天天告警。
  # 2026-09-22 运营回填件给了逐值语义, 注释按它重写(A7)。旧注释写「多选: 准备/已做投流」
  # 是【错的】—— 这一列至少承载三种语义, 投流只是其中一种。
  - 维护情况                # 多选·多义: ① 铺评完成度 关注=已做20条 / 重点关注⭐️=已做50条 /
                            #            ✅=【需要】做50条(待办, 不算已铺)
                            #         ② 投流   日期+🍟(如 9/15🍟, 日期即投流日) / 已投流，等回收数据
                            #         ③ 控评置顶 控评&置顶✅(两个动作都做完) / 已评待置顶
                            #    ⚠️ 同一行会同时出现多类(BJS 6 行「控评&置顶✅」100% 同时带「关注+✅」)。
                            #    ⚠️ 留空 = 没有做维护(运营 2026-09-22 确认), 所以 paid_promoted 可判 false。
                            #    引擎按取值分路, 见 sync 的 _CM_MV_* / _PAID_* 常量。
  - 维护时间                # 日期粒度。⚠️ 实测生产 9 行全是控评/维护动作的时间, 与投流标记零重叠 ——
                            #    投流日期目前写在「维护情况」的 9/15🍟 值里, 不在这一列。
  - 维护效果                # 数字: 投流【前后的曝光量差额】(运营 2026-09-22; 2026-09-17 原话是
                            #    "曝光量增长情况", 两次都是增量。《字段定义》docx 写"投流后12h的曝光量"
                            #    是孤证)。⚠️ 生产全库 0 行, 连 key 都不存在。
                            #    ⚠️ 这三列【永不】映 impressions/reads/interactions/comments_count。
  - 父记录 2
  - 父记录 3
  - 父记录 4
  - 临时-评论修改对比
  - 临时用—爆帖tag添加
  - 项目阶段
  - 打款金额
  - 是否留存
  - 理论金额结算
  - 数据汇总
  - 观众分析
  - 巡查状态
  - 最近检查时间
# 注: autowriter 回灌 lineage 列 (R-031) —— `_source_autowriter_project_id`/`_batch_id`/
#     `_item_id`/`_version_id` · `_ai_engine` · `_exported_at` —— 【不用】列在这里。sync 脚本
#     已对这 6 列全局特殊处理 (`_LINEAGE_FK_COLS`/`_LINEAGE_RAW_EXTRA_COLS`): 两个 UUID 自动进
#     notes 的 FK 列、其余进 raw_extra、6 列都不会 quarantine。飞书表直接加即可, 详见 docs/11。

# ════════════════════════════════════════════════════════════════════
# 数据补录需求 [OPTIONAL]
# ════════════════════════════════════════════════════════════════════
# 
# 这个项目缺失但需要后续补录的字段

data_supplement_needed:
  - field: account_followers
    method: 通过 publish_url 调小红书 API 或人工补录
    estimated_rows: 0

# ════════════════════════════════════════════════════════════════════
# 结构性产不出的要害字段 [OPTIONAL · 慎用] (D-056 续, owner 2026-09-17)
# ════════════════════════════════════════════════════════════════════
#
# D-056: 曝光量/阅读量/互动量/爆款分级/发布时间/内容形态/账号 这 7 个要害字段, 哪个整列
# 产不出, 同步就红、不给认领。但早期表可能【结构上】就没有某列(TGV 没有曝光/阅读/方向)。
# 这种情况在这里带理由声明 → 只降为醒目告警(每轮都喊)。规矩:
#   · 只能填这 7 个字段名; 理由非空(给审 PR 的人看); 不能同时在 field_mapping 里映了列到它。
#   · 豁免会自动过期: 声明为产不出的字段哪一轮真有值了 → 同步判红, 提醒把声明删掉。
#   · 这不是「认领」: 认领是逐行的待办(D-053), 豁免是逐列的结构事实, 必须进 PR 被人看见。
# capabilities_absent:
#   impressions: 早期表未回收曝光, 飞书表无此列
#   content_format: 本表无「方向」列, 内容形态由 essence 标注事后填

# ════════════════════════════════════════════════════════════════════
# Sync 配置 [OPTIONAL]
# ════════════════════════════════════════════════════════════════════

sync_config:
  # 真实 sync 脚本（truth-vault/scripts/sync_feishu_notes_to_truth_vault.py）
  # 走 feishu_api 路径。manual_xlsx 路径不在自动 sync 脚本范围内。
  source_type: feishu_api               # feishu_api / manual_xlsx
  feishu_app_token: null                # 飞书表 app_token, 例 bascnXXXXX
  feishu_table_id: null                 # 飞书表 table_id, 例 tblXXXXX
  feishu_view_id: null                  # 可选
  # ── 多表合并 [OPTIONAL] ──────────────────────────────────────────────
  # 同一 project 要合并【多张飞书表】(如同一期分两张表)时, 改用 tables: 列表(与上面单表
  # 的 feishu_app_token/table_id 二选一; 填了 tables 就以 tables 为准)。两表都写进本
  # project_id, note_id={project_id}_{record} 仍唯一, 看板只出一条战线。各表【共用】本
  # mapping 的 field_mapping/raw_extra → 列结构须一致(对每张表都 preflight, 见 RIO_phase1)。
  # tables:
  #   - feishu_app_token: bascnAAAA
  #     feishu_table_id: tblAAAA
  #     feishu_view_id: null
  #   - feishu_app_token: bascnBBBB        # 可为另一个 base(机器人须是该 base 协作者)
  #     feishu_table_id: tblBBBB
  #     feishu_view_id: null
  # sync_interval: on_demand = 夜间 cron【不碰】(安全默认, 接表填坐标后先 preflight + 显式跑验证,
  #   验证 OK 再改 daily 才进夜间 cron, PR#67)。daily = 每日 02:00 cron 自动同步。
  sync_interval: on_demand              # on_demand(默认, cron 跳过) / daily(进夜间 cron) / weekly
  
# ════════════════════════════════════════════════════════════════════
# Onboarding 元数据 [REQUIRED]
# ════════════════════════════════════════════════════════════════════

onboarding_meta:
  onboarded_at: 2026-XX-XX
  onboarded_by: 项目经理姓名
  strategy_lead: Ziao / 周哥
  notes: |
    Onboarding 过程中的备忘 / 边界情况说明 / 待澄清问题
