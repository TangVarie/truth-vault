# 闸二 · 有区分度 (docs/28 §6.2, D-093): 手动触发, 在有 service key 的 runner 上跑 scripts/gate2_run.py。
# 本仓的开发容器没有 SUPABASE_*, 正式跑只能在这里 (D-105 ⑤)。
# 默认只出报告 (打进 job log + step summary + artifact), 看过报告再把 write 勾成 true 写 feature_validation。
# 预注册在脚本里, 这里不放水: 题库必须 status: frozen 且 --sha 与 frozen_sha256 一致、占位题显著则整跑作废 (退出码 2);
# gate1_status: fail 的题自动 unreliable (D-103 / D-105), 不用手传。
# bank=reader 走副题库 fq-v0.2-cand-reader 那条路 (D-128, docs/28 §6.2b): 只读进了仓库的名单 (manifests), 先 counts_only=true
# 只数行数和覆盖, 第二波定了之后 counts_only=false 读一次; 永远不写 feature_validation (write 必须 false), 不跑组合对比。
# 读完 (退出码 0) 报告另以 gate2-reader-read-<合并名单 sha 前 12 位> 为名传 artifact; 再读同一份名单, Guard 按这个名字查到就拒
# (补记 7: 报告提交进仓库之前, 重跑 job / 再点一次也读不了第二次)。
name: Gate 2 run (feature discrimination · docs/28 §6.2)

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "bank_sha256 前缀 (≥8 位), 快照的一半; 必须是题库 frozen_sha256 的前缀 (D-105: ba0f570c)"
        required: false
        default: "ba0f570c"
      extractors:
        description: "逗号分隔, 快照的另一半。D-106: 只用 Sonnet 5.5 一个 LLM 抽取器 —— 混着 Opus 4.6 时 NUC / NRT 的正例几乎全是 Opus、负例全是 Sonnet, 抽取器和标签混在一起"
        required: false
        default: "code:v1,llm:claude-sonnet-5-5"
      run_tag:
        description: "feature_validation.gate2_run 标签 ([A-Za-z0-9][A-Za-z0-9_.-]{0,39}); 留空 = gate2-<今天 UTC>"
        required: false
        default: ""
      projects:
        description: "逗号分隔只看这些项目 (如 WTG_phase1,SPX_phase1); 留空 = 全部"
        required: false
        default: ""
      unreliable:
        description: "额外打 unreliable 的题号, 逗号分隔 (题库 gate1_status: fail 的自动算, 不用写)"
        required: false
        default: ""
      write:
        description: "true = 写 feature_validation (upsert, 主键含 gate2_run)。先跑一次 false 看报告, 再带 reviewed_rows_sha 跑 true"
        required: false
        default: "false"
      reviewed_rows_sha:
        description: "write=true 时必填: 看过的那次 run 报告末尾 / 日志里的 rows_sha256 前 ≥12 位。这次重算的行摘要对不上就不写 (中间夜跑 / 回填改了数据), 写进库的永远是看过的那份"
        required: false
        default: ""
      ignore_placebo_alarm:
        description: "true = 占位题显著也出报告 (只为排查; 脚本不许同时 write)"
        required: false
        default: "false"
      bank:
        description: "primary = 主题库 fq-v0.1 (照旧); reader = 副题库 fq-v0.2-cand-reader (D-128: sha 填 9f2cf1c9e7de, 只出报告、永远不写库)"
        required: false
        default: "primary"
      manifests:
        description: "bank=reader 才用: 逗号分隔、进了仓库的名单 CSV (仓库根目录相对路径), 如 data-analysis/gate2-reader-holdout-2026-10-27.csv (第二波另加一份)"
        required: false
        default: ""
      counts_only:
        description: "bank=reader 才用: true = 只数行数 / 覆盖 / 名单 (不出 y 的交叉表、OR、p; 读之前只许跑这个); false = 正式读, 同一份名单只读一次 (D-128 补记 6 / 7)"
        required: false
        default: "true"

# 同时只允许一个闸二在跑: 同一个 run_tag 两个 run 互相覆盖 feature_validation 行。
concurrency:
  group: gate2-run
  cancel-in-progress: false

jobs:
  gate2:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # actions: read 给 Guard 查「这份名单读过没有」的 artifact (gh api); 其余照默认只读
    permissions:
      contents: read
      actions: read
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      IN_SHA: ${{ github.event.inputs.sha }}
      IN_EXTRACTORS: ${{ github.event.inputs.extractors }}
      IN_RUN_TAG: ${{ github.event.inputs.run_tag }}
      IN_PROJECTS: ${{ github.event.inputs.projects }}
      IN_UNRELIABLE: ${{ github.event.inputs.unreliable }}
      IN_WRITE: ${{ github.event.inputs.write }}
      IN_REVIEWED: ${{ github.event.inputs.reviewed_rows_sha }}
      IN_IGNORE_PLACEBO: ${{ github.event.inputs.ignore_placebo_alarm }}
      IN_BANK: ${{ github.event.inputs.bank || 'primary' }}
      IN_MANIFESTS: ${{ github.event.inputs.manifests }}
      IN_COUNTS_ONLY: ${{ github.event.inputs.counts_only || 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps (lockfile)
        run: |
          if [ -f scripts/requirements.lock ]; then
            pip install -r scripts/requirements.lock
          else
            pip install -r scripts/requirements.txt
          fi
      - name: Guard secrets + inputs
        working-directory: scripts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -n "$SUPABASE_URL" ] || { echo "::error::缺 secret SUPABASE_URL"; exit 1; }
          [ -n "$SUPABASE_SERVICE_ROLE_KEY" ] || { echo "::error::缺 secret SUPABASE_SERVICE_ROLE_KEY"; exit 1; }
          echo "$IN_SHA" | grep -Eq '^[0-9a-f]{8,64}$' || { echo "::error::sha 要是 ≥8 位十六进制前缀, 收到 '$IN_SHA'"; exit 1; }
          case "$IN_BANK" in primary|reader) ;; *) echo "::error::bank 只能是 primary / reader, 收到 '$IN_BANK'"; exit 1;; esac
          if [ "$IN_BANK" = "reader" ]; then
            # 副题库 (D-128): 永远不写库、不许忽略占位题报警、范围由名单定; 名单必须是进了仓库的文件
            [ "$IN_WRITE" = "false" ] || { echo "::error::bank=reader 不写 feature_validation (D-128), write 必须是 false"; exit 1; }
            [ "$IN_IGNORE_PLACEBO" = "false" ] || { echo "::error::bank=reader 不许忽略占位题报警: 报警 = 这次读作废 (D-128 补记 2)"; exit 1; }
            if [ -n "$IN_PROJECTS" ] || [ -n "$IN_UNRELIABLE" ]; then
              echo "::error::bank=reader 的范围由名单定、闸一裁决在题库里: projects / unreliable 要留空"; exit 1
            fi
            case "$IN_COUNTS_ONLY" in true|false) ;; *) echo "::error::counts_only 只能是 true / false, 收到 '$IN_COUNTS_ONLY'"; exit 1;; esac
            [ -n "$IN_MANIFESTS" ] || { echo "::error::bank=reader 要给 manifests (进了仓库的名单 CSV)"; exit 1; }
            TAG="${IN_RUN_TAG:-gate2-reader-$(date -u +%Y-%m-%d)}"
            echo "$TAG" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9_.-]{0,39}$' || { echo "::error::run_tag 不合法: '$TAG'"; exit 1; }
            MANS=""
            IFS=',' read -ra MS <<< "$IN_MANIFESTS"
            for m in "${MS[@]}"; do
              m="$(echo "$m" | xargs)"
              echo "$m" | grep -Eq '^data-analysis/[A-Za-z0-9._-]+[.]csv$' || { echo "::error::名单要是 data-analysis/ 下的 csv, 收到 '$m'"; exit 1; }
              git ls-files --error-unmatch "../$m" > /dev/null 2>&1 || { echo "::error::名单 $m 没进仓库 —— 只读进了仓库的名单 (D-128 补记)"; exit 1; }
              MANS="$MANS $m"
            done
            # 副题库必须冻结、sha 必须是它的 frozen_sha256 前缀、跨库校验过 (load_bank_pair) —— 脚本自己也拒, 这里只是把原因说清楚
            python -c "import sys, feature_bank as fb; b, p = fb.load_bank_pair(fb.BANKS['reader']); sha = sys.argv[1]; fs = b.get('frozen_sha256') or ''
          assert b.get('status') == 'frozen', f'副题库 status={b.get(\"status\")!r}, 不是 frozen'
          assert fs.startswith(sha), f'sha {sha} 不是副题库 frozen_sha256 {fs[:12]}… 的前缀 (D-128: 9f2cf1c9e7de)'
          print(f'✅ 副题库 {b[\"bank_version\"]} frozen, digest {fs[:12]}…; 钉的主题库 {p[\"bank_version\"]} {p[\"_sha256\"][:12]}…')" "$IN_SHA"
            if [ "$IN_COUNTS_ONLY" = "false" ]; then
              # 只读一次 (补记 7) 在这层也守: 读完的报告以 gate2-reader-read-<合并名单 sha 前 12 位> 为名传了 artifact, 有这个名字
              # 就是读过 (报告还没提交进仓库时, 重跑 job / 再点一次都在这里拒); 查不了 artifact 也不读 (fail closed)
              KEY="$(python -c "import sys, gate2_run as G; ms = G.load_manifests(['../' + m for m in sys.argv[1:]]); print(G.combined_manifest_sha(r['note_id'] for m in ms for r in m['rows'])[:12])" $MANS)" \
                || { echo "::error::合并名单 sha 算不出"; exit 1; }
              N="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=gate2-reader-read-$KEY&per_page=1" --jq .total_count)" \
                || { echo "::error::查不了之前读过没有 (actions artifacts), 不读 (fail closed)"; exit 1; }
              [ "$N" = "0" ] || { echo "::error::这份名单 (sha $KEY…) 已经读过: 有 $N 个 artifact gate2-reader-read-$KEY —— 留出半只读一次 (D-128 补记 7)"; exit 1; }
              echo "READ_KEY=$KEY" >> "$GITHUB_ENV"
            fi
            echo "TAG=$TAG" >> "$GITHUB_ENV"
            echo "MANIFESTS=$MANS" >> "$GITHUB_ENV"
            echo "✅ bank=reader sha=$IN_SHA run_tag=$TAG manifests=$MANS counts_only=$IN_COUNTS_ONLY write=false"
            exit 0
          fi
          [ -n "$IN_EXTRACTORS" ] || { echo "::error::extractors 不能为空"; exit 1; }
          TAG="${IN_RUN_TAG:-gate2-$(date -u +%Y-%m-%d)}"
          echo "$TAG" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9_.-]{0,39}$' || { echo "::error::run_tag 不合法: '$TAG'"; exit 1; }
          case "$IN_WRITE" in true|false) ;; *) echo "::error::write 只能是 true / false, 收到 '$IN_WRITE'"; exit 1;; esac
          case "$IN_IGNORE_PLACEBO" in true|false) ;; *) echo "::error::ignore_placebo_alarm 只能是 true / false"; exit 1;; esac
          if [ "$IN_WRITE" = "true" ] && [ "$IN_IGNORE_PLACEBO" = "true" ]; then
            echo "::error::ignore_placebo_alarm 与 write 不能同时 true (反证没过的结果不进库, 脚本也会拒)"; exit 1
          fi
          if [ "$IN_WRITE" = "true" ]; then
            echo "$IN_REVIEWED" | grep -Eq '^[0-9a-f]{12,64}$' || { echo "::error::write=true 要带 reviewed_rows_sha (看过的那次的 rows_sha256 前 ≥12 位十六进制), 收到 '$IN_REVIEWED'"; exit 1; }
          fi
          # --projects 里的项目先在 mappings/ 下核一遍 (拼错在这里就拦; 有 mapping 但没标签的项目脚本自己会拒)
          if [ -n "$IN_PROJECTS" ]; then
            IFS=',' read -ra PJS <<< "$IN_PROJECTS"
            for p in "${PJS[@]}"; do
              p="$(echo "$p" | xargs)"
              [ -f "../mappings/${p}.yaml" ] || { echo "::error::projects 里的 '${p}' 不是项目: mappings/${p}.yaml 不存在"; exit 1; }
            done
          fi
          # 题库必须冻结、sha 必须是它的 frozen_sha256 前缀 —— 脚本自己也拒, 这里只是把原因说清楚
          python -c "import sys, feature_bank as fb; b = fb.load_bank(); errs = fb.validate_bank(b); st = b.get('status'); fs = b.get('frozen_sha256') or ''; sha = sys.argv[1]
          assert not errs, f'题库不合法: {errs}'
          assert st == 'frozen', f'题库 status={st!r}, 不是 frozen —— 闸二只跑冻结的题库 (预注册, docs/28 §6.2)'
          assert fs.startswith(sha), f'sha {sha} 不是题库 frozen_sha256 {fs[:12]}… 的前缀 —— 别拿旧快照跑'
          print(f'✅ 题库 {b[\"bank_version\"]} frozen, digest {fs[:12]}…; gate1 fail 自动 unreliable: ' + ', '.join(sorted(q[\"id\"] for q in fb.llm_questions(b) if q.get(\"gate1_status\") == \"fail\")))" "$IN_SHA"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "✅ sha=$IN_SHA extractors=$IN_EXTRACTORS run_tag=$TAG projects='${IN_PROJECTS:-(all)}' unreliable='${IN_UNRELIABLE:-(none)}' write=$IN_WRITE"
      - name: Run gate2_run.py (报告 + feature_validation 行; write=true 才写库)
        if: env.IN_BANK == 'primary'
        working-directory: scripts
        run: |
          set +e
          OUT="../data-analysis/feature-gate2-${TAG}.md"
          ROWS="../data-analysis/feature-gate2-${TAG}.rows.json"
          FLAGS=()
          [ -n "$IN_PROJECTS" ] && FLAGS+=(--projects "$IN_PROJECTS")
          [ -n "$IN_UNRELIABLE" ] && FLAGS+=(--unreliable "$IN_UNRELIABLE")
          [ "$IN_WRITE" = "true" ] && FLAGS+=(--write --expect-rows-sha256 "$IN_REVIEWED")
          [ "$IN_IGNORE_PLACEBO" = "true" ] && FLAGS+=(--ignore-placebo-alarm)
          python gate2_run.py --sha "$IN_SHA" --extractors "$IN_EXTRACTORS" --run-tag "$TAG" --out "$OUT" --rows-out "$ROWS" "${FLAGS[@]}"
          rc=$?
          if [ "$rc" = "2" ]; then
            echo "::error::闸二没跑或没写 —— 预注册拒跑 (题库没冻结 / sha 对不上 / --projects 对不上取数 / 快照内 (笔记, 题) 不唯一 / 占位题显著) 或行摘要与 reviewed_rows_sha 对不上, 原因在上面 stderr。一行没写。"
            exit 2
          elif [ "$rc" != "0" ]; then
            echo "::error::gate2_run.py 退出码 $rc"
            exit "$rc"
          fi
          echo "── 报告 $OUT ──"
          cat "$OUT"
          {
            echo "## 闸二 · run_tag \`$TAG\` · sha \`$IN_SHA\` · extractors \`$IN_EXTRACTORS\` · write=$IN_WRITE"
            echo
            cat "$OUT"
          } >> "$GITHUB_STEP_SUMMARY"
          DIGEST="$(grep -oE 'rows_sha256. = .[0-9a-f]{64}' "$OUT" | grep -oE '[0-9a-f]{64}' | tail -1)"
          if [ "$IN_WRITE" != "true" ]; then
            echo "::notice::只出了报告, 没写库。rows_sha256=${DIGEST:-?}。看过报告、记完 DECISIONS 再用 write=true + reviewed_rows_sha=${DIGEST:0:12} 跑一次 (同一个 run_tag 会 upsert; 中间数据变了摘要就对不上, 会拒)。"
          else
            echo "::notice::已写库, 写的就是摘要 ${DIGEST:0:12}… 那份 (与 reviewed_rows_sha 核过)。"
          fi
      # 占位题反证没过时 (ignore_placebo_alarm=true 只为排查) 不出"进不进 L2"的正式判定: 预注册说反证过了才看正式结果
      # (docs/28 §6.2; codex review on #174)。
      - name: 副题库闸二 (bank=reader; counts_only=true 只数行数, false 读一次; 永远不写库)
        if: env.IN_BANK == 'reader'
        working-directory: scripts
        run: |
          set +e
          FLAGS=()
          for m in $MANIFESTS; do FLAGS+=(--manifest "../$m"); done
          if [ "$IN_COUNTS_ONLY" = "true" ]; then
            OUT="../data-analysis/feature-gate2-${TAG}-counts.md"
            FLAGS+=(--counts-only)
          else
            OUT="../data-analysis/feature-gate2-${TAG}.md"
          fi
          python gate2_run.py --bank reader --sha "$IN_SHA" --run-tag "$TAG" --out "$OUT" "${FLAGS[@]}"
          rc=$?
          VOID="${OUT%.md}-void.md"
          if [ "$rc" = "3" ]; then
            echo "::error::占位题报警, 这次读作废 (D-128 补记 2): $VOID 只有报警和计数, 确认族两行没算。查清原因、记进 DECISIONS 之后可以重读"
            cat "$VOID"
            { echo "## 闸二 (副题库) 作废 · run_tag \`$TAG\`"; echo; cat "$VOID"; } >> "$GITHUB_STEP_SUMMARY"
            exit 3
          elif [ "$rc" = "2" ]; then
            echo "::error::闸二 (副题库) 没跑 —— 预注册 / 名单 / 半区 / D-129 映射表 / 快照 / 缺答案超 3% / 这份名单已经读过, 原因在上面 stderr。"
            exit 2
          elif [ "$rc" != "0" ]; then
            echo "::error::gate2_run.py 退出码 $rc"
            exit "$rc"
          fi
          echo "── 报告 $OUT ──"
          cat "$OUT"
          {
            echo "## 闸二 (副题库) · run_tag \`$TAG\` · sha \`$IN_SHA\` · counts_only=$IN_COUNTS_ONLY"
            echo
            cat "$OUT"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$IN_COUNTS_ONLY" = "true" ]; then
            echo "::notice::只数了行数和覆盖, 不是闸二的读。"
          else
            echo "::notice::读完了: 从 artifact 下载 $(basename "$OUT") 提交进 data-analysis/ —— workflow 这层靠 artifact gate2-reader-read-${READ_KEY} 拒第二次读, 本地跑和 90 天之后靠仓库里这份报告守 (D-128 补记 7)。"
          fi
      # 读过的记号 (补记 7): 正式读退出码 0 才传 (作废 3 / 拒跑 2 不传, 作废那次不算读过); Guard 按这个名字查
      - name: 副题库读过的记号 (artifact gate2-reader-read-<合并名单 sha>)
        if: success() && env.IN_BANK == 'reader' && env.IN_COUNTS_ONLY == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: gate2-reader-read-${{ env.READ_KEY }}
          path: data-analysis/feature-gate2-${{ env.TAG }}.md
          if-no-files-found: error
          retention-days: 90
      - name: 组合对比跳过 (占位题反证被忽略的排查跑)
        if: success() && env.IN_BANK == 'primary' && env.IN_IGNORE_PLACEBO == 'true'
        run: echo "::notice::ignore_placebo_alarm=true 是排查跑, 不出组合进不进 L2 的判定 (反证没过的结果不作数)。"
      - name: 组合进不进 L2 (gate2_combo.py · 附录 B.3 留一项目 AUC + 自助 + B.4 置换; 只出报告)
        if: success() && env.IN_BANK == 'primary' && env.IN_IGNORE_PLACEBO != 'true'
        working-directory: scripts
        run: |
          set +e
          COMBO="../data-analysis/feature-gate2-combo-${TAG}.md"
          FLAGS=()
          [ -n "$IN_PROJECTS" ] && FLAGS+=(--projects "$IN_PROJECTS")
          # 与 gate2_run 同一份 unreliable: 单特征报告里判 unreliable 的题, 组合对比里也不许当特征用
          [ -n "$IN_UNRELIABLE" ] && FLAGS+=(--unreliable "$IN_UNRELIABLE")
          python gate2_combo.py --sha "$IN_SHA" --extractors "$IN_EXTRACTORS" --out "$COMBO" --json-out "../data-analysis/feature-gate2-combo-${TAG}.json" "${FLAGS[@]}"
          rc=$?
          if [ "$rc" != "0" ]; then
            echo "::error::gate2_combo.py 退出码 $rc (2 = 预注册 / 快照 / 评估集拒跑, 原因在上面 stderr)"
            exit "$rc"
          fi
          cat "$COMBO"
          { echo; cat "$COMBO"; } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload report + rows
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate2-${{ env.TAG }}
          path: |
            data-analysis/feature-gate2-${{ env.TAG }}.md
            data-analysis/feature-gate2-${{ env.TAG }}.rows.json
            data-analysis/feature-gate2-combo-${{ env.TAG }}.md
            data-analysis/feature-gate2-combo-${{ env.TAG }}.json
            data-analysis/feature-gate2-${{ env.TAG }}-void.md
            data-analysis/feature-gate2-${{ env.TAG }}-counts.md
          if-no-files-found: warn
          retention-days: 90
