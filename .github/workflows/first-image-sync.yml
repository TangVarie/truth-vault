# 每晚的首图步骤 (I-29, D-158, 2026-11-16; 读法在 docs/34-first-image-pass.md)。
# 做什么: 问库要这一晚该做的帖 (经验卡背后的帖 + 11-16 之后入库的新帖; RIO / TXQ / WTG 先不做) → 用夜跑同步的飞书凭证把首图
#         下载到 runner 的内存 → 缩图 → 只用便宜档模型答题库 fi-v0.3 → 结果写进库。老帖不回头补。
# 开关: owner 跑过 schemas/notes_v1_28_first_image.sql 之后它才真的做事; 没跑之前每晚打一行「迁移还没跑」就结束, 不花钱。
#       要停: 在 Actions 里把这个 workflow 停用 (Disable workflow)。看门狗认得「手动停用」, 不会因此报红。
#       停用期间改了题库里的名单 (先不做的项目 / 确认过封面的项目), 手动点一次干跑 (默认就是) 把名单同步进库。
# 钱: 上限写死在 scripts/first_image_pass.py —— 每晚最多 40 张图、750,000 输入当量 token (按假设价约 0.97 元);
#     手动的 mode=cards (一次性做经验卡背后的帖) 最多 60 张、1,500,000 token (约 1.94 元)。每次调用之前查, 输入只能把上限调低。
#     只调便宜档模型, 没有换模型的输入。只走主中转站 (RELAY_FORCE=primary, 不传备用站的钥匙): 备用站那条路一次调用会发
#     两个请求, 第二个不在账上; 主站不通的那一晚就不做。定时一天只起一趟 (上限是按一趟算的, check_first_image_pass.py 钉着 cron)。
# 不拦任何夜跑: 这是单独的 workflow, 和 daily-sync / features-sync 不共用 job、锁和行; 首图那一步自己也不会让 job 变红
#     (脚本没做成也退出 0, 步骤另带 continue-on-error)。它做没做成看这次运行的 Summary。
# 图片只在内存里: 不写盘、不进 artifact (这里没有上传步骤)、不进日志; 打出来的只有计数和状态词。
name: First image sync (nightly · cheap tier only · capped)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "nightly = 每晚那一趟 (经验卡的帖 + 新帖) · cards = 只做经验卡背后的帖 (一次性, 上限约 2 元)"
        required: false
        default: "nightly"
      dry_run:
        description: "true = 不下载、不调模型、不写结果, 只同步题库里的名单、报这一趟有几篇要做 (默认)。真做改成 false"
        required: false
        default: "true"
      max_images:
        description: "这一趟最多做几张图; 0 = 用写死的上限 (nightly 40 / cards 60)。只能调低"
        required: false
        default: "0"
  schedule:
    # 15:37 UTC = 23:37 北京时间。排在夜跑同步 (实际 09–14 点 UTC) 之后; 起跑会漂, 漂了也不要紧: 它和别的夜跑不共用任何东西,
    # 今晚没赶上的帖明晚做。非整点分钟同 D-064。
    - cron: '37 15 * * *'

concurrency:
  group: first-image-sync
  cancel-in-progress: false

jobs:
  first-image:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
      FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
      # 只走主中转站 (D-148 的备用站这一步不用, 钥匙也不传): 一次预留对一个真发出去的请求, 上限才是实的
      RELAY_FORCE: primary
      IN_MODE: ${{ github.event.inputs.mode || 'nightly' }}
      # 定时触发没有输入 → 真做; 手动触发缺省是干跑
      IN_DRY_RUN: ${{ github.event.inputs.dry_run || (github.event_name == 'schedule' && 'false' || 'true') }}
      IN_MAX_IMAGES: ${{ github.event.inputs.max_images || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps (夜跑的 lockfile + 首图自己的两个图片库; 装不上不红, 下一步自己会报没装)
        continue-on-error: true
        timeout-minutes: 10
        run: |
          pip install -r scripts/requirements.lock
          pip install -r scripts/requirements-first-image.txt
      - name: 首图步骤 (只用便宜档 · 有上限 · 不会让 job 变红)
        continue-on-error: true
        # 脚本自己 40 分钟不再开新图; 这里再兜一道 (中转站挂住不回的时候), 超时也只是这一步结束, job 不红
        timeout-minutes: 55
        working-directory: scripts
        run: |
          ok=1
          case "$IN_MODE" in nightly|cards) ;; *) ok=0;; esac
          case "$IN_DRY_RUN" in true|false) ;; *) ok=0;; esac
          echo "$IN_MAX_IMAGES" | grep -Eq '^[0-9]{1,3}$' || ok=0
          if [ "$ok" != "1" ]; then
            echo "::warning::首图步骤: 输入不对 (mode 只能是 nightly / cards, dry_run 只能是 true / false, max_images 是 0–999), 什么都没做"
            exit 0
          fi
          ARGS=(--mode "$IN_MODE" --max-images "$IN_MAX_IMAGES")
          [ "$IN_DRY_RUN" = "true" ] && ARGS+=(--dry-run)
          # 打出来的只有计数和状态词 (scripts/check_first_image_pass.py 钉着); 同一份进这次运行的 Summary
          python first_image_pass.py "${ARGS[@]}" > "$RUNNER_TEMP/first-image-pass.txt" || echo "::warning::首图步骤没有正常结束 (不影响别的夜跑)"
          cat "$RUNNER_TEMP/first-image-pass.txt"
          cat "$RUNNER_TEMP/first-image-pass.txt" >> "$GITHUB_STEP_SUMMARY"
