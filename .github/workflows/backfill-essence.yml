# 一键把【某个项目】的 essence 标注灌满 —— 内部循环直跑 annotate_essence_pass.py (直连中转站, D-100),直到该项目没有
# 未标注笔记为止。解决"daily-sync 每天只标一批、大表标到天荒地老"的问题。
#
# 与 daily-sync 的分工:
#   - daily-sync(每日 cron):稳态增量,每轮一小批(WORKER_LIMIT),处理每天新增的少量笔记。
#   - 本工作流(手动):初次/补量,一次触发把整张表灌完(多轮循环)。
#
# 每轮是一次 pass 调用 (--limit batch), 单轮 batch 上限 60 (失败重跑的粒度); 整张表靠循环多轮灌完。
# 2026-06 ~ 2026-10-09 曾经 Railway worker 跑 (旧中转站 GitHub 连不上); 换站后 runner 直连得上, D-100 搬回直跑。
name: Backfill essence (drain a project)

on:
  workflow_dispatch:
    inputs:
      project:
        description: "项目 (如 WTG_phase1)"
        required: true
      batch:
        description: "每轮多少条 (一轮 = 一次 annotate_essence_pass.py --limit N, 直连中转站 D-100, 没有 Railway 边缘 5min 墙了)。一条 1–2 次 LLM 调用; 上限 60 (一轮 ≤ ~20min, 失败重跑的粒度)。"
        required: false
        default: "12"
      max_batches:
        description: "最多循环几轮。一轮上限≈batch×max_batches 条,且受 GitHub 6h job 上限(batch=12 时一轮约能灌 ~1400 条)。更大的表灌不完会在末尾警告→再触发一次接着灌(幂等)。"
        required: false
        default: "120"
      mode:
        description: "pending = 标还没标过 essence 的(默认); missing_subtype = 只重标「已标 essence 但 direction_subtype 空且飞书给了方向原文」的篇(审计 C-03, NUC 10-08 实查 206 篇; 会重做整篇 essence, 每篇一次 LLM 调用)。"
        required: false
        default: "pending"
        type: choice
        options: [pending, missing_subtype]

# 同一项目同时只允许一个 backfill 在跑 —— 否则两个 run 会各自快照同一批未标注笔记、
# 重复烧 LLM 且非确定性地互相覆盖 essence(codex PR#43 review r3355530533)。
# cancel-in-progress: false = 第二次触发排队等第一次跑完(幂等续作),不打断在飞的批次。
concurrency:
  group: backfill-essence-${{ github.event.inputs.project }}
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # D-100: 直连中转站, 不再经 Railway worker
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
      ESSENCE_MODEL: ${{ vars.ESSENCE_MODEL }}
      PROJECT: ${{ github.event.inputs.project }}
      BATCH: ${{ github.event.inputs.batch }}
      MAXB: ${{ github.event.inputs.max_batches }}
      MODE: ${{ github.event.inputs.mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps (lockfile)
        run: |
          if [ -f scripts/requirements.lock ]; then
            pip install -r scripts/requirements.lock
          else
            pip install -r scripts/requirements.txt
          fi

      - name: Guard secrets
        run: |
          [ -n "$ANTHROPIC_API_KEY" ] || { echo "::error::缺 secret ANTHROPIC_API_KEY (D-100 直连中转站)"; exit 1; }
          [ -n "$ANTHROPIC_BASE_URL" ] || { echo "::error::缺 secret ANTHROPIC_BASE_URL (中转站地址)"; exit 1; }
          [ -n "$SUPABASE_URL" ] || { echo "::error::缺 secret SUPABASE_URL"; exit 1; }
          [ -n "$SUPABASE_SERVICE_ROLE_KEY" ] || { echo "::error::缺 secret SUPABASE_SERVICE_ROLE_KEY"; exit 1; }

      - name: Validate inputs (项目已知 + batch/max_batches 为正整数)
        working-directory: scripts
        run: |
          # batch / max_batches 必须是正整数:workflow_dispatch 输入是自由字符串,非数字会让
          # `seq 1 "$MAXB"` 产 0 次迭代 → 循环体一次都不执行、却绿着退出(codex review r3355530527)。
          case "$BATCH" in ''|*[!0-9]*) echo "::error::batch 必须是正整数,收到 '$BATCH'"; exit 1;; esac
          case "$MAXB"  in ''|*[!0-9]*) echo "::error::max_batches 必须是正整数,收到 '$MAXB'"; exit 1;; esac
          [ "$BATCH" -ge 1 ] || { echo "::error::batch 必须 ≥1"; exit 1; }
          # batch 硬上限 60: 直连后没有 Railway 边缘 5min 墙 (D-100), 上限只是失败重跑的粒度 (一轮 ≤ ~20min)。
          # 别只写在描述里靠自觉,这里强制(codex review r3356930643)。
          [ "$BATCH" -le 60 ] || { echo "::error::batch=$BATCH 太大 —— 上限 60 (一轮就是失败重跑的粒度)。请用 ≤60。"; exit 1; }
          [ "$MAXB"  -ge 1 ] || { echo "::error::max_batches 必须 ≥1"; exit 1; }
          # project 必须是已知项目(有 mapping)。否则拼错的名字会查到 remaining=0 → 被当成
          # "已灌完"绿着退出、一条没处理(codex review r3355530520)。
          if [ ! -f "../mappings/${PROJECT}.yaml" ]; then
            echo "::error::未知项目 '${PROJECT}':mappings/${PROJECT}.yaml 不存在(拼错了?)"
            echo "可选项目:"
            for f in ../mappings/*.yaml; do b=$(basename "$f" .yaml); [ "$b" = "_template" ] || echo "  - $b"; done
            exit 1
          fi
          case "${MODE:-pending}" in pending|missing_subtype) ;; *) echo "::error::mode 只能是 pending / missing_subtype, 收到 '$MODE'"; exit 1;; esac
          echo "✅ inputs OK: project=$PROJECT batch=$BATCH max_batches=$MAXB mode=${MODE:-pending}"

      - name: Loop annotate_essence_pass.py until project essence is fully annotated (直连中转站, D-100)
        working-directory: scripts
        run: |
          # 关掉 errexit:本步靠下面【显式检查退出码】决定 retry/exit。
          set +e
          # GitHub 把没设的 variable 注成空串, os.environ.get(..., default) 对空串不回默认 —— 空就 unset (走代码默认 claude-sonnet-5-5, D-098)。
          [ -n "$ESSENCE_MODEL" ] || unset ESSENCE_MODEL
          # mode=missing_subtype (审计 C-03): remaining 和 pass 用【同一个 flag】切到"direction_subtype 空"那条判据
          # (count_unannotated_essence 直接调 annotate_essence_pass.subtype_backfill_candidates, 判据只有一处, codex review on #169),
          # 两边同一判据才能收敛; 标上子方向的下一轮就不再选中, 判不出的靠下面"两轮没下降就停"。
          COUNT_FLAG=""
          if [ "${MODE:-pending}" = "missing_subtype" ]; then COUNT_FLAG="--only-missing-subtype"; fi
          prev=-1
          for i in $(seq 1 "$MAXB"); do
            rem=$(python count_unannotated_essence.py "$PROJECT" $COUNT_FLAG) || { echo "::error::查 remaining 失败"; exit 1; }
            echo "── batch $i/$MAXB · project=$PROJECT · remaining(before)=$rem ──"
            if [ "$rem" = "0" ]; then
              echo "✅ $PROJECT essence 已全部标注完。"
              break
            fi
            # 两轮 remaining 没下降 = 这批全失败(余额耗尽 / 限流 / vocab 校验全挂)→ 停,别空转。
            if [ "$rem" = "$prev" ]; then
              echo "::error::remaining 连续两轮停在 $rem(没下降)→ 这批 essence 全失败。"
              echo "常见原因:中转站余额耗尽 / 限流 / 词表校验。看上面 pass 的日志 (Done 行 / failed_essence_queue)。"
              exit 1
            fi
            prev=$rem
            # 直连: 一批 = 一次 pass 调用 (--limit BATCH)。脚本自己按 essence_annotated_at IS NULL 续作、单条各重试一次,
            # 只有全军覆没 / hygiene 漂移才退非零 —— 那时等 60s 再试一次 (中转站瞬断), 还不行就停; 已标的不丢 (幂等)。
            rc=1
            for attempt in 1 2; do
              python annotate_essence_pass.py "$PROJECT" --limit "$BATCH" $COUNT_FLAG > /tmp/b.log 2>&1; rc=$?
              grep -E 'Found [0-9]+ notes|Done:|全部失败|卫生断言|有 [0-9]+ 条失败' /tmp/b.log | tail -4
              [ "$rc" = "0" ] && break
              echo "::warning::batch $i try $attempt 退出码 $rc; 等 60s 再试一次 (中转站瞬断 / 限流)"
              tail -n 8 /tmp/b.log
              sleep 60
            done
            if [ "$rc" != "0" ]; then
              echo "::error::pass 连续 2 次退出码非零 (最后 $rc) —— 停止 backfill。已标的不丢,修好后重跑接着灌。"
              exit 1
            fi
          done
          rem=$(python count_unannotated_essence.py "$PROJECT" $COUNT_FLAG 2>/dev/null || echo "?")
          echo "── 结束 · project=$PROJECT · mode=${MODE:-pending} · remaining(final)=$rem ──"
          if [ "$rem" != "0" ] && [ "$rem" != "?" ]; then
            echo "::warning::还剩 $rem 条未标注(到达 max_batches=$MAXB)。再触发一次本工作流接着灌,或调大 max_batches。"
          fi
