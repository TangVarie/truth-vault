# 一键把【某个项目】的内容特征抽取灌满 (docs/28 §5, D-070) —— 仿 backfill-essence.yml:
# 内部循环调 Railway worker 的 /annotate-features, 直到该项目没有未抽取的笔记为止。
# daily-sync 每晚只跑一小批增量 (FEATURE_LIMIT); 全库回填 (P2 闸二前) 用本工作流手动触发。
# 「跑过」的判据在 annotate_feature_pass.py (DONE_MARKER_QUESTION 那一行), 幂等续作。
name: Backfill features (drain a project · docs/28 D-070)

on:
  workflow_dispatch:
    inputs:
      project:
        description: "项目 (如 WTG_phase1)"
        required: true
      batch:
        description: "每轮多少条。⚠️ 受 Railway 边缘【单请求 ~5min 超时】约束:一批必须 ~4min 内跑完否则 502。一篇 = 6 次分组 LLM 调用(+重问), ~6 篇≈3-4min 稳;别超 8。"
        required: false
        default: "6"
      max_batches:
        description: "最多循环几轮。一轮上限≈batch×max_batches 条,且受 GitHub 6h job 上限(batch=6 时一轮约能灌 ~700 篇)。更大的表灌不完会在末尾警告→再触发一次接着灌(幂等)。"
        required: false
        default: "120"
      note_ids:
        description: "只跑这些 note_id(逗号分隔, ≤200, 形如 NUC_phase1_recXXXX)。给了就按 id 前缀自动分项目、每 batch 篇一请求, 忽略 max_batches; project 只作并发组名(填 gate1 之类)。闸一 D-081 用。batch 建议 2(D-077: 一篇 53–81s)。"
        required: false
        default: ""
      run_tag:
        description: "只在 note_ids 模式生效。答案落哪个 run_tag(默认 primary)。⚠️ pass 的「跑过」判据按 (extractor, run_tag) 看标记题: 这几篇在 primary 下已经答过就会被整篇跳过、0 次调用 —— 重跑已答过的篇必须换一个 run_tag(如 gate1-v2), 旧答案原样保留。[A-Za-z0-9][A-Za-z0-9_.-]{0,39}"
        required: false
        default: "primary"
      bank_sha:
        description: "只在 note_ids 模式生效, 可空。期望 worker 用的问题库 sha256 前缀(≥8 位; feature_bank.load_bank()['_sha256'])。探针会打出 worker 日志里的 bank=… sha=…, 对不上就停 —— 题库刚升版时 Railway 可能还没部署完, 别拿旧题面烧钱。"
        required: false
        default: ""
      reannotate:
        description: "只在 note_ids 模式生效。true = 忽略「跑过」标记, 这几篇在当前题库下整篇重抽、同 (question_id, question_version, extractor, run_tag) 的旧行被覆盖(bank_sha256 跟着换成当前), 旧版本号的行(如 opening_type v1)原样留着。闸二前把旧 sha 下的 361 篇拉到当前快照用(D-090; 配 bank_sha 一起用, 别拿旧题面重抽)。默认 false。"
        required: false
        default: "false"
      code_only:
        description: "true = 只跑代码题 (code:v1: 长度 / 数字 / 品牌位置等 + 占位题), 不调模型、不花钱; 「跑过」按 code:v1 的 body_len_bucket 判 (count_unannotated_features --code-only)。品牌词典改了之后给 on_demand 项目补算用 (I-19)。整项目和 note_ids 两种模式都认, 不能配 model; batch 上限放宽到 100。默认 false。"
        required: false
        default: "false"
      model:
        description: "只在 note_ids 模式生效, 可空。覆盖 worker 的 FEATURE_MODEL (如 claude-haiku-5-5), 闸一影子跑用: 同一批篇、换个模型、落到别的 run_tag, 再用 gate1_agreement.py 对 Jev / owner 裁决算一致率 (D-098: 换站后主抽取器要重过闸一)。pass 写的抽取器是 llm:<model>; 只能配非 primary 的 run_tag。[A-Za-z0-9][A-Za-z0-9_.:/-]{0,79}"
        required: false
        default: ""
      bank:
        description: "只在 note_ids 模式生效。题库键 (D-128, feature_bank.BANKS): primary = 冻结的主题库 fq-v0.1 (默认); reader = 副题库 fq-v0.2-cand-reader。非 primary 必须: run_tag 以 fqr- 开头、给 bank_sha 和 model、code_only=false、reannotate=false; 探针还要 worker 回显 bank、日志里 bank=<该库版本>, 否则停 (旧 worker 会吞掉 bank 按主题库跑)。"
        required: false
        default: "primary"

# 同一项目同时只允许一个 backfill 在跑 —— 否则两个 run 会各自快照同一批未抽取笔记、
# 重复烧 LLM 且非确定性地互相覆盖 essence(codex PR#43 review r3355530533)。
# cancel-in-progress: false = 第二次触发排队等第一次跑完(幂等续作),不打断在飞的批次。
concurrency:
  group: backfill-features-${{ github.event.inputs.project }}
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      WORKER_URL: ${{ secrets.WORKER_URL }}
      WORKER_API_KEY: ${{ secrets.WORKER_API_KEY }}
      PROJECT: ${{ github.event.inputs.project }}
      BATCH: ${{ github.event.inputs.batch }}
      MAXB: ${{ github.event.inputs.max_batches }}
      NOTE_IDS: ${{ github.event.inputs.note_ids }}
      RUN_TAG: ${{ github.event.inputs.run_tag }}
      BANK_SHA: ${{ github.event.inputs.bank_sha }}
      REANNOTATE: ${{ github.event.inputs.reannotate }}
      MODEL: ${{ github.event.inputs.model }}
      CODE_ONLY: ${{ github.event.inputs.code_only }}
      BANK: ${{ github.event.inputs.bank }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps (lockfile)
        run: |
          if [ -f scripts/requirements.lock ]; then
            pip install -r scripts/requirements.lock
          else
            pip install -r scripts/requirements.txt
          fi

      - name: Guard secrets
        run: |
          [ -n "$WORKER_URL" ] || { echo "::error::缺 secret WORKER_URL(Railway worker 地址)"; exit 1; }
          [ -n "$WORKER_API_KEY" ] || { echo "::error::缺 secret WORKER_API_KEY"; exit 1; }
          [ -n "$SUPABASE_URL" ] || { echo "::error::缺 secret SUPABASE_URL"; exit 1; }
          [ -n "$SUPABASE_SERVICE_ROLE_KEY" ] || { echo "::error::缺 secret SUPABASE_SERVICE_ROLE_KEY"; exit 1; }

      - name: Validate inputs (项目已知 + batch/max_batches 为正整数)
        working-directory: scripts
        run: |
          # batch / max_batches 必须是正整数:workflow_dispatch 输入是自由字符串,非数字会让
          # `seq 1 "$MAXB"` 产 0 次迭代 → 循环体一次都不执行、却绿着退出(codex review r3355530527)。
          case "$BATCH" in ''|*[!0-9]*) echo "::error::batch 必须是正整数,收到 '$BATCH'"; exit 1;; esac
          case "$MAXB"  in ''|*[!0-9]*) echo "::error::max_batches 必须是正整数,收到 '$MAXB'"; exit 1;; esac
          [ "$BATCH" -ge 1 ] || { echo "::error::batch 必须 ≥1"; exit 1; }
          case "$CODE_ONLY" in true|false) ;; *) echo "::error::code_only 只能是 true / false, 收到 '$CODE_ONLY'"; exit 1;; esac
          [ -n "$BANK" ] || BANK=primary
          case "$BANK" in primary|reader) ;; *) echo "::error::bank 只能是 primary / reader (feature_bank.BANKS 的键), 收到 '$BANK'"; exit 1;; esac
          if [ "$CODE_ONLY" = "true" ]; then
            # 代码题不调模型, 一篇毫秒级; 上限只防一次请求塞太多篇 (I-19)。
            [ "$BATCH" -le 100 ] || { echo "::error::code_only 时 batch 上限 100, 收到 $BATCH"; exit 1; }
            [ -z "$MODEL" ] || { echo "::error::code_only 不调模型, 不能配 model (收到 '$MODEL')"; exit 1; }
          else
            # batch 硬上限 8: 一篇 6 次分组调用, Railway 边缘【单请求 ~5min 超时】, >8 篇/批会跑超时 → 502。
            # 别只写在描述里靠自觉,这里强制(codex review r3356930643)。
            [ "$BATCH" -le 8 ] || { echo "::error::batch=$BATCH 太大 —— 上限 8(一篇 6 次调用, >8 篇会撞 Railway 边缘 ~5min 超时 → 502)。请用 ≤8。"; exit 1; }
          fi
          [ "$MAXB"  -ge 1 ] || { echo "::error::max_batches 必须 ≥1"; exit 1; }
          if [ -n "$NOTE_IDS" ]; then
            # 指定 note_id 模式: 每个 id 形如 <project>_rec<record>, 项目从前缀推, 必须有 mapping;
            # project 输入只当并发组名, 不查 mapping (填 gate1 就行)。
            case "$PROJECT" in ''|*[!A-Za-z0-9_-]*) echo "::error::project 只能是 [A-Za-z0-9_-]"; exit 1;; esac
            n=0
            for id in $(echo "$NOTE_IDS" | tr ',' ' '); do
              n=$((n+1))
              case "$id" in *_rec*) ;; *) echo "::error::note_id '$id' 不像 <project>_rec<record>"; exit 1;; esac
              case "$id" in *[!A-Za-z0-9_-]*) echo "::error::note_id '$id' 含非法字符"; exit 1;; esac
              proj="${id%_rec*}"
              [ -f "../mappings/${proj}.yaml" ] || { echo "::error::note_id '$id' 的项目 '$proj' 没有 mapping"; exit 1; }
            done
            [ "$n" -ge 1 ] && [ "$n" -le 200 ] || { echo "::error::note_ids 要 1–200 个, 收到 $n"; exit 1; }
            # run_tag 会拼进 worker 的 subprocess 参数, 这里和 worker 用同一条正则; 空 = primary。
            [ -n "$RUN_TAG" ] || RUN_TAG=primary
            echo "$RUN_TAG" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9_.-]{0,39}$' || { echo "::error::run_tag '$RUN_TAG' 不合 [A-Za-z0-9][A-Za-z0-9_.-]{0,39}"; exit 1; }
            if [ -n "$BANK_SHA" ]; then
              echo "$BANK_SHA" | grep -Eq '^[0-9a-f]{8,64}$' || { echo "::error::bank_sha '$BANK_SHA' 要是 8–64 位小写十六进制"; exit 1; }
            fi
            case "$REANNOTATE" in true|false) ;; *) echo "::error::reannotate 只能是 true / false, 收到 '$REANNOTATE'"; exit 1;; esac
            if [ -n "$MODEL" ]; then
              # 和 worker 的 _MODEL_RE 同一条正则; jev:/llm:/code:/human: 是抽取器标签不是模型名 (pass 自己写 llm:<model>, D-085)。
              echo "$MODEL" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9_.:/-]{0,79}$' || { echo "::error::model '$MODEL' 不合 [A-Za-z0-9][A-Za-z0-9_.:/-]{0,79}"; exit 1; }
              case "$MODEL" in jev:*|llm:*|code:*|human:*) echo "::error::model '$MODEL' 是抽取器标签, 不是模型名"; exit 1;; esac
              # primary 是夜跑主抽取器的快照: 混进第二个 llm:* 抽取器, 闸二按 (篇, 题) 唯一性会拒跑 (gate2_run §5)。换模型只能落别的 run_tag。
              [ "$RUN_TAG" != "primary" ] || { echo "::error::model 只能配非 primary 的 run_tag (如 gate1-haiku55), 收到 run_tag=primary"; exit 1; }
            fi
            if [ "$BANK" != "primary" ]; then
              # 副题库 (D-128): 主键不含 bank_sha256, primary 会盖掉主题库的行; worker 和 pass 也各拦一道
              echo "$RUN_TAG" | grep -Eq '^fqr-[A-Za-z0-9]' || { echo "::error::bank=$BANK 的 run_tag 必须以 fqr- 开头 (D-128), 收到 '$RUN_TAG'"; exit 1; }
              [ "$CODE_ONLY" = "false" ] || { echo "::error::bank=$BANK 不收 code_only (代码题只属于主题库)"; exit 1; }
              [ "$REANNOTATE" = "false" ] || { echo "::error::bank=$BANK 不收 reannotate (重跑换一个 fqr- run_tag, 旧答案留着)"; exit 1; }
              [ -n "$BANK_SHA" ] || { echo "::error::bank=$BANK 必须给 bank_sha (探针对不上就停, 别拿旧题面烧钱)"; exit 1; }
              [ -n "$MODEL" ] || { echo "::error::bank=$BANK 必须给 model (续跑按精确的 llm:<model> 判)"; exit 1; }
            fi
            echo "✅ inputs OK (note_ids 模式): $n 篇 · batch=$BATCH · bank=$BANK · run_tag=$RUN_TAG · bank_sha=${BANK_SHA:-(不查)} · reannotate=$REANNOTATE · model=${MODEL:-(worker 默认)} · 并发组=$PROJECT"
            exit 0
          fi
          [ -z "$RUN_TAG" ] || [ "$RUN_TAG" = "primary" ] || { echo "::error::run_tag 只在 note_ids 模式生效(整项目回填永远落 primary, count_unannotated_features 也只数 primary), 收到 '$RUN_TAG'"; exit 1; }
          [ -z "$BANK_SHA" ] || { echo "::error::bank_sha 只在 note_ids 模式生效, 收到 '$BANK_SHA'"; exit 1; }
          [ -z "$MODEL" ] || { echo "::error::model 只在 note_ids 模式生效 (整项目回填永远用 worker 的 FEATURE_MODEL 落 primary), 收到 '$MODEL'"; exit 1; }
          [ "$BANK" = "primary" ] || { echo "::error::bank=$BANK 只在 note_ids 模式生效 (整项目回填永远是主题库), 收到 '$BANK'"; exit 1; }
          # project 必须是已知项目(有 mapping)。否则拼错的名字会查到 remaining=0 → 被当成
          # "已灌完"绿着退出、一条没处理(codex review r3355530520)。
          if [ ! -f "../mappings/${PROJECT}.yaml" ]; then
            echo "::error::未知项目 '${PROJECT}':mappings/${PROJECT}.yaml 不存在(拼错了?)"
            echo "可选项目:"
            for f in ../mappings/*.yaml; do b=$(basename "$f" .yaml); [ "$b" = "_template" ] || echo "  - $b"; done
            exit 1
          fi
          echo "✅ inputs OK: project=$PROJECT batch=$BATCH max_batches=$MAXB"

      - name: Run only the given note_ids (闸一 · D-081)
        if: ${{ github.event.inputs.note_ids != '' }}
        working-directory: scripts
        run: |
          set +e
          # 先用 dry_run 探一下 worker 认不认识 note_ids: 旧版本会把这个键吞掉、按 project+limit
          # 去跑【别的】笔记 —— 真跑之前必须确认响应里有 note_ids_count。dry_run 不调模型不写库。
          probe_id=$(echo "$NOTE_IDS" | tr ',' '\n' | sed 's/^ *//;s/ *$//' | grep -v '^$' | head -1)
          probe_proj="${probe_id%_rec*}"
          [ -n "$RUN_TAG" ] || RUN_TAG=primary
          [ -n "$BANK" ] || BANK=primary
          body=$(jq -nc --arg p "$probe_proj" --arg id "$probe_id" --arg t "$RUN_TAG" --arg m "$MODEL" --arg b "$BANK" --argjson c "$([ "$CODE_ONLY" = "true" ] && echo true || echo false)" '{project:$p, limit:1, dry_run:true, note_ids:[$id], run_tag:$t} + (if $m != "" then {model:$m} else {} end) + (if $c then {code_only:true} else {} end) + (if $b != "primary" then {bank:$b} else {} end)')
          code=$(curl -sS -w '%{http_code}' -o /tmp/probe.json --max-time 300 \
            -X POST "${WORKER_URL%/}/annotate-features" \
            -H "X-Worker-Key: $WORKER_API_KEY" -H 'content-type: application/json' -d "$body") || code=000
          nc=$(jq -r '.note_ids_count // empty' /tmp/probe.json 2>/dev/null)
          if [ "$code" != "200" ] || [ -z "$nc" ]; then
            echo "::error::worker 探针失败或不认识 note_ids (HTTP $code, note_ids_count='$nc') —— 旧版本会按 project+limit 跑别的笔记, 停。等 Railway 部署带 note_ids 的版本再触发。"
            jq -r '.stderr_tail // .detail // ""' /tmp/probe.json 2>/dev/null | tail -4
            exit 1
          fi
          echo "✅ worker 认识 note_ids (探针 note_ids_count=$nc)"
          # worker 跑的是它自己部署里的问题库 (Railway 从 main 自动部署)。pass 一开始就打
          # "bank=<版本> sha=<前 12 位>… model=… run_tag=…", 这里把它捞出来放进日志; 给了 bank_sha 就对前缀,
          # 对不上 = 部署还没跟上或跑错分支, 停 —— 拿旧题面烧一遍 100 篇是白烧 (D-082 升版之后尤其)。
          bank_line=$(jq -r '(.stderr_tail // "") + "\n" + (.stdout_tail // "")' /tmp/probe.json 2>/dev/null | grep -o 'bank=[^ ]* sha=[0-9a-f]*[^ ]* model=[^ ]* run_tag=[^ ]*' | tail -1)
          echo "worker: ${bank_line:-(日志里没找到 bank=… 行)}"
          if [ -n "$BANK_SHA" ]; then
            want="sha=${BANK_SHA:0:12}"
            case "$bank_line" in *"$want"*) echo "✅ 问题库 sha 前缀对上 ($want)";;
              *) echo "::error::worker 的问题库不是期望的 ($want): 探针打的是 '${bank_line:-空}'。Railway 还没部署到带这版题库的 main? 等部署完再触发。"; exit 1;;
            esac
          fi
          echo "$bank_line" | grep -q "run_tag=$RUN_TAG" || { echo "::error::worker 没按 run_tag=$RUN_TAG 跑 (探针打的是 '${bank_line:-空}') —— 旧版 worker 会吞掉 run_tag 落到 primary。停。"; exit 1; }
          if [ -n "$MODEL" ]; then
            # 探针那行带 model=…: 旧版 worker 会吞掉 model 字段、用自己的 FEATURE_MODEL 跑 —— 影子跑成了主模型的重复, 停。
            case "$bank_line" in *"model=$MODEL run_tag="*) echo "✅ worker 按 model=$MODEL 跑";;
              *) echo "::error::worker 没按 model=$MODEL 跑 (探针打的是 '${bank_line:-空}') —— 旧版 worker 会吞掉 model 字段。停。"; exit 1;; esac
          fi
          if [ "$BANK" != "primary" ]; then
            # 副题库 (D-128): 旧版 worker 会吞掉 bank、按主题库跑 (6 组 31 行, ≈3× 钱) —— 响应要回显 bank, 日志那行要是该库的版本
            pb=$(jq -r '.bank // empty' /tmp/probe.json 2>/dev/null)
            [ "$pb" = "$BANK" ] || { echo "::error::worker 没回显 bank=$BANK (收到 '${pb:-空}') —— 旧版 worker 会按主题库跑。等 Railway 部署带 bank 的版本再触发。"; exit 1; }
            bv=$(python -c 'import sys, feature_bank as fb; print(fb.load_bank(fb.BANKS[sys.argv[1]])["bank_version"])' "$BANK") || { echo "::error::读不出 bank=$BANK 的 bank_version"; exit 1; }
            case "$bank_line" in "bank=$bv "*) echo "✅ worker 按 bank=$bv 跑";;
              *) echo "::error::worker 日志不是 bank=$bv (探针打的是 '${bank_line:-空}')。停。"; exit 1;; esac
          fi

          mapfile -t ids < <(echo "$NOTE_IDS" | tr ',' '\n' | sed 's/^ *//;s/ *$//' | grep -v '^$' | sort -u)
          total=${#ids[@]}; sent=0; ok_chunks=0; bad_chunks=0; gf_total=0
          for proj in $(printf '%s\n' "${ids[@]}" | sed 's/_rec.*$//' | sort -u); do
            mapfile -t plist < <(printf '%s\n' "${ids[@]}" | grep "^${proj}_rec")
            for ((i=0; i<${#plist[@]}; i+=BATCH)); do
              chunk=("${plist[@]:i:BATCH}")
              # reannotate 只在真跑时带(探针是 dry_run, 不需要); worker 把它翻成 --reannotate (app.py 的 flag 闭集)。
              body=$(printf '%s\n' "${chunk[@]}" | jq -R . | jq -sc --arg p "$proj" --argjson n "$BATCH" --arg t "$RUN_TAG" --arg m "$MODEL" --arg b "$BANK" --argjson r "$([ "$REANNOTATE" = "true" ] && echo true || echo false)" --argjson c "$([ "$CODE_ONLY" = "true" ] && echo true || echo false)" '{project:$p, limit:$n, note_ids:., run_tag:$t} + (if $r then {reannotate:true} else {} end) + (if $m != "" then {model:$m} else {} end) + (if $c then {code_only:true} else {} end) + (if $b != "primary" then {bank:$b} else {} end)')
              echo "── $proj · 第 $((i/BATCH+1)) 批 (${#chunk[@]} 篇) · 已发 $sent/$total ──"
              ok=false; code=000
              for attempt in 1 2 3 4 5 6; do
                code=$(curl -sS -w '%{http_code}' -o /tmp/b.json --max-time 900 \
                  -X POST "${WORKER_URL%/}/annotate-features" \
                  -H "X-Worker-Key: $WORKER_API_KEY" -H 'content-type: application/json' -d "$body") || code=000
                ok=$(jq -r '.ok // false' /tmp/b.json 2>/dev/null)
                nc=$(jq -r '.note_ids_count // empty' /tmp/b.json 2>/dev/null)
                echo "   [try $attempt] HTTP $code · ok=$ok · note_ids_count=${nc:-?} · returncode=$(jq -r '.returncode // "?"' /tmp/b.json 2>/dev/null)"
                jq -r '.stdout_tail // ""' /tmp/b.json 2>/dev/null | grep -E "Found|Done|ok=|failed|· systemic |· gateway_filtered " | tail -4
                if [ "$BANK" != "primary" ] && [ "$code" = "200" ]; then
                  # 探针只查一次: 之后 Railway 换回不认 bank 的 worker, 它会吞掉 bank 按主题库跑 (≈3× 钱、fqr- 下混进主题库的题)。每批都对回显; 重试也一样错, 当场停
                  cb=$(jq -r '.bank // empty' /tmp/b.json 2>/dev/null)
                  [ "$cb" = "$BANK" ] || { echo "::error::$proj 第 $((i/BATCH+1)) 批: worker 没回显 bank=$BANK (收到 '${cb:-空}') —— 探针之后换成了不认 bank 的 worker, 这批按主题库跑了。停, 不重试; 查 Railway, 再按 docs/28 §6.2b 的 ① 查 run_tag=$RUN_TAG 下有没有别的题。"; exit 1; }
                fi
                { [ "$code" = "200" ] && [ "$ok" = "true" ] && [ -n "$nc" ]; } && break
                # 409 = worker 正被别的调用占着(features-sync / 另一个 backfill): 等锁, 不算失败 (D-077)
                echo "::warning::$proj 第 $((i/BATCH+1)) 批 try $attempt 失败 (HTTP $code, ok=$ok);等 60s 重试"
                jq -r '.stderr_tail // ""' /tmp/b.json 2>/dev/null | tail -4
                sleep 60
              done
              sent=$((sent+${#chunk[@]}))
              if [ "$code" = "200" ] && [ "$ok" = "true" ] && [ -n "$nc" ]; then ok_chunks=$((ok_chunks+1)); else bad_chunks=$((bad_chunks+1)); fi
              gf=$(jq -r '.stdout_tail // ""' /tmp/b.json 2>/dev/null | grep -o 'Done: .*' | tail -1 | sed 's/^Done: //' | jq -r '.gateway_filtered // 0' 2>/dev/null || true); case "$gf" in ''|*[!0-9]*) gf=0;; esac   # D-125 gf
              { [ "$code" = "200" ] && [ "$ok" = "true" ]; } || gf=0   # 失败的批不落行; /tmp/b.json 可能还是上一批的
              gf_total=$((gf_total + gf))
              # 到 3 篇就停: 再跑下去只是多写 NULL (D-125)
              [ "$gf_total" -lt 3 ] || { echo "::error::$gf_total 篇有题被中转站敏感词拦截、记 NULL 已落库 (D-125) —— 中转站还在拦, 停。找中转站。"; [ "$bad_chunks" = "0" ] || echo "::error::另有 $bad_chunks 批连续 6 次都没成 —— 查 Railway worker 日志。"; exit 1; }
            done
          done
          echo "── 结束 · $total 篇 · 成功 $ok_chunks 批 · 失败 $bad_chunks 批 ──"
          echo "已答过的篇 pass 自己会跳过 (按 (extractor, run_tag) 幂等; 本次 run_tag=$RUN_TAG), 失败的批再触发一次接着跑。"
          [ "$bad_chunks" = "0" ] || { echo "::error::$bad_chunks 批连续 6 次都没成 —— 查 Railway worker 日志。"; exit 1; }

      - name: 重抽过 primary 答案 → 清掉带规律命中的馆员缓存 (D-116)
        # 规律命中按 primary 答案算; reannotate 改了答案却不改书架 / 批准层 / 闸二标签, 版本串不变, 旧缓存会一直回旧的
        # 命中标记 (codex review on truth-vault#195)。中途失败也清: 失败前的批已经覆盖了一部分答案。
        if: ${{ always() && github.event.inputs.note_ids != '' && github.event.inputs.reannotate == 'true' && (github.event.inputs.run_tag == '' || github.event.inputs.run_tag == 'primary') }}
        working-directory: scripts
        run: python prune_librarian_cache.py --delivery-only

      - name: Loop worker until project essence is fully annotated
        if: ${{ github.event.inputs.note_ids == '' }}
        working-directory: scripts
        run: |
          # 关掉 errexit:本步靠下面【显式检查 $code/$ok】决定 retry/exit。若保留 bash -e,
          # worker 重启吐空/坏响应时 `ok=$(jq …)` 解析失败会触发 errexit 直接杀掉整步、
          # 绕过重试循环(实测:整步 exit 5、连 [try 1] 都没打印 → 重试从没机会跑)。
          set +e
          prev=-1; gf_total=0
          # code_only: 计数和 worker 都按代码题的「跑过」判据 (code:v1 的 body_len_bucket), 两边一个口径 (I-19)。
          CO_FLAG=""; CO_JSON=""
          if [ "$CODE_ONLY" = "true" ]; then CO_FLAG="--code-only"; CO_JSON=",\"code_only\":true"; fi
          for i in $(seq 1 "$MAXB"); do
            rem=$(python count_unannotated_features.py "$PROJECT" $CO_FLAG) || { echo "::error::查 remaining 失败"; exit 1; }
            echo "── batch $i/$MAXB · project=$PROJECT · remaining(before)=$rem ──"
            if [ "$rem" = "0" ]; then
              echo "✅ $PROJECT 特征已全部抽完。"
              break
            fi
            # 两轮 remaining 没下降 = 这批全失败(余额耗尽 / 限流 / vocab 校验全挂)→ 停,别空转。
            if [ "$rem" = "$prev" ]; then
              echo "::error::remaining 连续两轮停在 $rem(没下降)→ 这批特征抽取全失败。"
              echo "常见原因:中转站余额耗尽 / 限流 / 词表校验。查 Railway worker 日志或 failed_essence_queue。"
              exit 1
            fi
            prev=$rem
            # 单批最多试 3 次:worker 偶发重启 / 瞬断时,等一下重试 —— 标注幂等
            # (按 essence_annotated_at IS NULL 续作),重试只会接着标、不会重复烧已标的。
            # 实测:连续多批后 Railway worker 会重启一次(注解已落库但 HTTP 响应没回)→ 重试可续。
            # 重试是【安全网】:把 batch 调到 ~12(每批 ~3min)< Railway 边缘单请求 ~5min 超时后,
            # 正常每批就稳 200、不该再 502。但偶发边缘 502 / 网关瞬断仍可能 —— 等一下重试。
            # ⚠️ 实测:502 时 worker【不崩】、后台仍把这批标完、注解照常落库(标注幂等);重试只接着标没标的。
            ok=false; code=000
            for attempt in 1 2 3 4 5 6; do
              code=$(curl -sS -w '%{http_code}' -o /tmp/b.json --max-time 900 \
                -X POST "${WORKER_URL%/}/annotate-features" \
                -H "X-Worker-Key: $WORKER_API_KEY" -H 'content-type: application/json' \
                -d "{\"project\":\"$PROJECT\",\"limit\":${BATCH}${CO_JSON}}") || code=000
              ok=$(jq -r '.ok // false' /tmp/b.json 2>/dev/null)
              echo "   [try $attempt] HTTP $code · ok=$ok · returncode=$(jq -r '.returncode // "?"' /tmp/b.json 2>/dev/null)"
              jq -r '.stdout_tail // ""' /tmp/b.json 2>/dev/null | tail -4
              { [ "$code" = "200" ] && [ "$ok" = "true" ]; } && break
              echo "::warning::batch $i try $attempt 失败 (HTTP $code, ok=$ok);等 60s 重试(边缘 502 / 网关瞬断;worker 不崩、注解仍会落库)"
              jq -r '.stderr_tail // ""' /tmp/b.json 2>/dev/null | tail -6
              sleep 60
            done
            if [ "$code" != "200" ] || [ "$ok" != "true" ]; then
              echo "::error::worker 调用连续 3 次失败 (HTTP $code, ok=$ok) —— 停止 backfill。已标的不丢,修好后重跑接着灌。"
              exit 1
            fi
            gf=$(jq -r '.stdout_tail // ""' /tmp/b.json 2>/dev/null | grep -o 'Done: .*' | tail -1 | sed 's/^Done: //' | jq -r '.gateway_filtered // 0' 2>/dev/null || true); case "$gf" in ''|*[!0-9]*) gf=0;; esac   # D-125 gf
            gf_total=$((gf_total + gf))
            [ "$gf_total" -lt 3 ] || { echo "::error::本次 $gf_total 篇有题被中转站敏感词拦截、记 NULL 已落库 (D-125) —— 像中转站整体在拦, 停。找中转站。"; exit 1; }
          done
          rem=$(python count_unannotated_features.py "$PROJECT" $CO_FLAG 2>/dev/null || echo "?")
          echo "── 结束 · project=$PROJECT · code_only=$CODE_ONLY · remaining(final)=$rem ──"
          if [ "$rem" != "0" ] && [ "$rem" != "?" ]; then
            echo "::warning::还剩 $rem 条未标注(到达 max_batches=$MAXB)。再触发一次本工作流接着灌,或调大 max_batches。"
          fi
