name: Daily TV sync

# 2026-06-01 (Session #15): schedule 已启用 (每日 02:00 UTC = 10:00 北京时间).
# 2026-09-18 (D-064): 改成 02:17 UTC 非整点 —— 整点排程在 GitHub 是高负载时段, 之前最近 20 次
#   实际 06:36–08:33 UTC 才起跑, 落在写作台 tv-sync cron (04:00 UTC) 之后, 新笔记隔天才对上。
# secrets 已配齐, 手动 dry-run / 真跑验证过 (通道1 已通, MF65 已同步).
# ⚠️ GitHub 定时任务只从【默认分支】的 workflow 文件触发 —— 所以本改动必须
#    合并进默认分支 (main) 后 cron 才真正开始跑; 停在 feature 分支上不会触发.
#
# (历史) 原启用步骤, 留作配置参考:
#   1. Settings → Secrets and variables → Actions → New repository secret 配齐:
#        SUPABASE_URL
#        SUPABASE_SERVICE_ROLE_KEY
#        FEISHU_APP_ID, FEISHU_APP_SECRET
#        ANTHROPIC_API_KEY, ANTHROPIC_BASE_URL   (essence / curate 直连中转站; D-100)
#        (注: 2026-06 曾因旧中转站 GitHub 连不上把 essence/curate 搬去 Railway worker (docs/17 §7-D), 2026-10-09 换站后
#         runner 直连得上, D-100 搬回; Railway worker 现在只跑特征层 (features-sync.yml 带 WORKER_URL)。
#         模型用 repo variable ESSENCE_MODEL / FLYWHEEL_CURATOR_MODEL 覆盖, 不设 = 代码默认 claude-sonnet-5-5)
#        (注: AUTOWRITER_SYNC_USER_ID / AUTOWRITER_INJECTION_* 随通道2 push
#         退役已移除 — D-038; 详见下方 steps 中退役注释)
#   2. 在下方 on: 块里把 schedule 那段取消注释
#   3. 第一次手动 Run workflow 验证一遍 (dry_run=true)
#
# 失败告警 (2026-05-22 audit 改进):
#   - 每个 sync 步骤跑完后会汇总失败计数; 任何一个 sync 失败都让 workflow
#     退出非零 → GitHub 默认给 repo owner / 触发者发邮件 (无需额外 webhook).
#   - 老版本用 "|| warning" 吞错误, 表面上 workflow 永远成功, cron 静默漂移.
#     新版用 continue-on-error: true + 最后 "Fail job on any sync failure"
#     step 聚合, 保证失败可见.

on:
  workflow_dispatch:
    inputs:
      project:
        description: "只跑某个项目 (如 WTG_phase1). 留空 = 跑 mappings/ 下全部项目"
        type: string
        default: ""
      dry_run:
        description: "Dry run (no writes to Supabase)"
        type: boolean
        default: false
      skip_essence:
        description: "Skip Mode A essence annotation (saves Anthropic spend)"
        type: boolean
        default: false
      allow_mass_tier_flip:
        description: "放行整批 tier 翻转闸 (D-091)。默认一个项目一晚超过 max(15, 10% 存量) 篇在 爆/大爆/参考 与非正例之间翻转, 这些篇只写内容不写 tier 并红 (08-18 OKMAN 285 篇误标那种)。去飞书确认是真的批量改标之后, 勾上它再跑一次。"
        type: boolean
        default: false
  schedule:
    # 02:17 UTC = 10:17 北京时间. 飞书表通常这之前已经填好昨日数据.
    # 非整点分钟是故意的 (GitHub 文档: 整点是 schedule 高负载时段, 会排队几小时)。
    # ⚠️ 实际起跑 08:04–09:00 UTC (2026-10-01 ~ 10-08 八次实测), 跑 45–55 分钟; 写作台的 tv-sync cron
    # 2026-10-08 起挪到 14:00 UTC 排在它后面 (原 04:00 在它前面, 每天对的是前一天的笔记, 审计 A-05)。
    - cron: '17 2 * * *'

# 同一时刻只允许一个 daily-sync 在跑。cron 与手动 workflow_dispatch 会撞:
# 两个 run 各自快照同一批 essence_annotated_at IS NULL 的笔记 → 重复烧 LLM、
# 且非确定性互相覆盖 essence(与 backfill-essence.yml:30 同一类事故)。
# cancel-in-progress: false = 后来者排队等前一个跑完(sync/标注都幂等), 不打断在飞的批次。
# ⚠️ 本 group 只挡 daily-sync 自己; 与 backfill-essence 的跨 workflow 相撞由
#    worker 侧的每脚本互斥锁兜底(worker/app.py _script_lock → 409 busy)。
concurrency:
  group: daily-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # 2026-09-20 (D-073) 240min。原来是 120min, 注释写着"实测 15-38min(近 30 次 run), 120 ≈ 3x
    # 观测上限" —— 那句在 9 月已经彻底过时了, 而没人回头量过。真实测(近 20 次 schedule 跑):
    #   41 / 47 / 53 / 53 / 63 / 67 / 69 / 73 / 73 / 76 / 79 / 79 / 85 / 92 / 99 / 100 / 112 / 119.4 min
    # 09-08 那趟(run #161, 特征层还不存在)job 实跑 119.4min —— 离 120 的天花板只剩 35 秒。
    # 也就是说超时不是特征层"压垮"的, 它只是让一件早就注定的事当晚发生: 09-20 run #177
    # (feishu 5.3 + comments 41.7 + essence 37.5 + features 35.4 ≈ 120)被 cancel, 策展 / 通道1 /
    # 人工审稿同步一步没跑; 而 job 结论是 cancelled, 末尾那道失败聚合闸只看 outcome=failure,
    # 于是这一整晚静默丢三步、没有任何告警。
    # 所以这次两件事一起做: 特征层拆去 features-sync.yml, 且把上限提到 240 ≈ 2x 真实观测上限。
    # 仍远小于 GitHub 默认 360 —— 某次 curl/worker 挂死不至于白烧 6h runner。
    # ⚠️ 大头是 comments(44min) 和 essence(67min), 两者都随语料增长; 240 也不是永久答案,
    #    哪天再逼近就该拆 comments/essence 而不是继续往上加数字。
    timeout-minutes: 240
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
      FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
      # essence/curate 的 LLM 调用已搬到 Railway worker(GitHub 海外 runner 连不上中转站;
      # D-038 / docs/17 §7-D)。GitHub 这边只【触发】worker —— 不再需要 ANTHROPIC_*/ESSENCE_MODEL。
      # 未配 WORKER_URL → essence/curate 优雅跳过(不再因 GitHub 连不上网关而红)。
      # D-100: essence / curate 直连中转站 (worker 只剩特征层, 在 features-sync.yml)
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
      # essence 每日上限/项目。essence 步骤会【循环多个 ≤15 的子批】凑够这个数 —— 因为单个
      # worker 请求受 Railway 边缘【~5min 超时】约束,每请求最多 ~15 条(≈3.5min;>15 会 502)。
      # 想每天标更多就在 repo Variables 调大 WORKER_LIMIT(如 50 = 每天每项目最多 50,内部
      # 自动拆成 ≤15 的多轮)。curate 待办是爆款数量级、远少,每请求封顶 15 不随之放大。
      WORKER_LIMIT: ${{ vars.WORKER_LIMIT || '15' }}
      # 只跑某项目 (workflow_dispatch 的 project 输入); 空 = 全部. cron 触发时为空.
      PROJECT_FILTER: ${{ github.event.inputs.project }}
      # schedule(夜间 cron)触发时为 'true' → feishu sync 跳过 sync_interval=on_demand 的【未启用】
      # 项目(新接的表填了坐标但还没 preflight 验证, 不该被 cron 自动灌; codex PR#67 review)。
      # 显式 Run workflow(workflow_dispatch)→ 'false' → 照常跑(包括 on_demand)。
      TV_SCHEDULED_RUN: ${{ github.event_name == 'schedule' }}
    steps:
      # ⚠️ 必须是【第一步】: 原来它排在 checkout + setup-python + pip install 之后,
      #    用时灯的分子就系统性地少算了装环境那一段(codex-代班 review on #144)。
      - name: 记下开跑时刻 (给下面那盏"离超时还有多远"的灯用, D-073)
        run: echo "TV_JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps (from lockfile for reproducibility)
        run: |
          if [ -f scripts/requirements.lock ]; then
            pip install -r scripts/requirements.lock
          else
            pip install -r scripts/requirements.txt
          fi

      - name: Check secrets are configured (gracefully skip if not; scheduled runs go red)
        id: check
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            # 定时跑缺 secret 必须红(D-090): 六个阻塞步全跳过时 aggregate 把 skipped 当合法、
            # 看门狗只看 conclusion=success —— 一把 secret 被删 / 过期, 夜跑会【永远静默绿】,
            # 没有任何灯会亮。手动 / push 触发保留优雅跳过(本地分支、fork 上没 secret 是正常的)。
            if [ "${{ github.event_name }}" = "schedule" ]; then
              echo "::error::SUPABASE_URL/KEY not configured on a scheduled run — nothing would sync and the watchdog would still see green. Fix repo secrets."
              exit 1
            fi
            echo "::warning::SUPABASE_URL/KEY not configured; skipping sync."
            echo "See .github/workflows/daily-sync.yml header for setup steps."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
          # ANTHROPIC_API_KEY / ANTHROPIC_BASE_URL 同理 (codex review on #169 抓的是 WORKER_URL; D-100 直连后换成这两把):
          # essence 与 curate 两步都是 `env.ANTHROPIC_API_KEY != ''` 才跑, 定时跑少了会静默跳过、整轮照绿 ——
          # 和上面 SUPABASE 那条是同一种"永远静默绿"。手动触发仍允许只同步不跑 LLM。
          # (措辞里别出现「斜杠 + curate」这个子串: ci.yml 的 D-047 守卫按它找策展那一步, 会先撞到这里。)
          if [ "${{ github.event_name }}" = "schedule" ] && { [ -z "$ANTHROPIC_API_KEY" ] || [ -z "$ANTHROPIC_BASE_URL" ]; }; then
            echo "::error::ANTHROPIC_API_KEY/ANTHROPIC_BASE_URL not configured on a scheduled run — essence and curate would be skipped silently. Fix repo secrets."
            exit 1
          fi

      - name: feishu → TV (per project from mappings/)
        id: feishu_sync
        continue-on-error: true
        if: steps.check.outputs.skip != 'true' && env.FEISHU_APP_ID != ''
        working-directory: scripts
        run: |
          DRYRUN=""
          [ "${{ github.event.inputs.dry_run }}" = "true" ] && DRYRUN="--dry-run"
          # D-091: 整批 tier 翻转闸的放行开关只在手动触发时可能为 true; 定时跑永远不放行。
          ALLOWFLIP=""
          [ "${{ github.event.inputs.allow_mass_tier_flip }}" = "true" ] && ALLOWFLIP="--allow-mass-tier-flip"
          fail_count=0
          for f in ../mappings/*.yaml; do
            p=$(basename "$f" .yaml)
            [ "$p" = "_template" ] && continue
            [ -n "$PROJECT_FILTER" ] && [ "$p" != "$PROJECT_FILTER" ] && continue
            echo "─── feishu → TV · project=$p ───"
            python sync_feishu_notes_to_truth_vault.py "$p" $DRYRUN $ALLOWFLIP || {
              echo "::error::feishu sync failed for $p"
              fail_count=$((fail_count + 1))
            }
          done
          if [ $fail_count -gt 0 ]; then
            echo "::error::feishu sync failed for $fail_count project(s)"
            exit 1
          fi

      - name: comments raw_extra → truth_vault.comments
        id: comments_sync
        continue-on-error: true
        if: steps.check.outputs.skip != 'true'
        working-directory: scripts
        run: |
          # D-092: 脚本自己按 TV_SCHEDULED_RUN + mapping 的 sync_interval 跳过 on_demand 项目(与入库步同一份判据),
          # 已入库评论每项目读一次而不是每篇读一次, 「源被清空」对账失败非零退出 —— 这一步因此会红。
          DRYRUN=""
          [ "${{ github.event.inputs.dry_run }}" = "true" ] && DRYRUN="--dry-run"
          fail_count=0
          for f in ../mappings/*.yaml; do
            p=$(basename "$f" .yaml)
            [ "$p" = "_template" ] && continue
            [ -n "$PROJECT_FILTER" ] && [ "$p" != "$PROJECT_FILTER" ] && continue
            echo "─── comments parse · project=$p ───"
            python sync_comments_from_raw_extra.py "$p" $DRYRUN || {
              echo "::error::comments parse failed for $p"
              fail_count=$((fail_count + 1))
            }
          done
          if [ $fail_count -gt 0 ]; then
            echo "::error::comments parse failed for $fail_count project(s)"
            exit 1
          fi

      - name: essence + sub_direction annotation (Mode A, D-028) · 直连中转站 (D-100)
        id: essence_sync
        continue-on-error: true
        if: steps.check.outputs.skip != 'true' && env.ANTHROPIC_API_KEY != '' && github.event.inputs.skip_essence != 'true'
        working-directory: scripts
        env:
          ESSENCE_MODEL: ${{ vars.ESSENCE_MODEL }}
        run: |
          # 直连中转站 (D-100): 2026-10-09 换站后 GitHub runner 连得上 (gateway-probe http=200), essence 从 Railway worker
          # 搬回来直跑 (2026-06 搬去 worker 只因旧站 GitHub 连不上, docs/17 §7-D)。以前 ESS_REQ_MAX=8 的分批循环、
          # worker_fail_kind 的瞬时/系统性分类、409 锁, 都是 Railway 边缘 ~5 min 超时和跨 run 共用一个 worker 才有的
          # 东西 —— 直跑没有那道墙: 每项目【一次】调用, --limit 给整份日预算; 脚本自己按 essence_annotated_at IS NULL
          # 续作、单条失败各重试一次、只有全军覆没 / hygiene 漂移才退非零 (_exit_code_for_stats, 可单测)。
          # 跨 workflow 的互斥改由 concurrency.group 兜: backfill-essence / recurate-lessons 和本 workflow 同一个组,
          # 排队不并跑 (以前靠 worker 的每脚本锁)。
          # 模型: repo variable ESSENCE_MODEL 覆盖; 没设 = 代码默认 claude-sonnet-5-5 (D-098)。GitHub 会把没设的
          # variable 注成空串, 而 os.environ.get(..., default) 对空串不回默认 —— 所以空就 unset。
          [ -n "$ESSENCE_MODEL" ] || unset ESSENCE_MODEL
          DRY_FLAG=""; [ "${{ github.event.inputs.dry_run }}" = "true" ] && DRY_FLAG="--dry-run"
          fail_count=0
          for f in ../mappings/*.yaml; do
            p=$(basename "$f" .yaml)
            [ "$p" = "_template" ] && continue
            [ -n "$PROJECT_FILTER" ] && [ "$p" != "$PROJECT_FILTER" ] && continue
            # ── on_demand 闸 (D-047) ──
            # 入库那一步早就跳过 on_demand 项目了(防没验证过的表被自动灌), 但这一步
            # 以前是裸遍历 —— 于是笔记一落库, 当晚就被 LLM 按【还没拍板】的方向拆解标注,
            # 而标注按 essence_annotated_at IS NULL 取, 标完即固化、顺着经验卡 →
            # 三生六部 → autowriter 传下去。那道闸的本意只实现了一半。
            # 判据走 skip_on_cron.py(内部就是入库那步用的同一个函数), 不在这儿重写一遍。
            # exit 2 = 判不了 → 照跑(静默少干活比多干一次更难查)。
            # ⚠️ 不能写成 `python skip_on_cron.py "$p"; rc=$?` —— 步骤默认 `bash -e`, 退出码 1
            #    (= 照跑)会在 rc=$? 之前就把整步掐死, 一行输出都没有(D-051, 8/31~9/2 连红三晚)。
            rc=0; python skip_on_cron.py "$p" || rc=$?
            if [ "$rc" = "0" ]; then
              echo "  ⏭  $p sync_interval=on_demand → 夜间 cron 跳过 essence(与入库同一道闸, D-047)"
              continue
            fi
            rem=$(python count_unannotated_essence.py "$p" 2>/dev/null || echo "?")
            [ "$rem" = "0" ] && { echo "  ✅ $p essence 已全部标完"; continue; }
            echo "─── essence annotate (直连) · project=$p · 待标=$rem · 每日上限=$WORKER_LIMIT ───"
            rc=0; python annotate_essence_pass.py "$p" --limit "$WORKER_LIMIT" $DRY_FLAG > /tmp/ess.log 2>&1 || rc=$?
            grep -E 'Found [0-9]+ notes|Done:|全部失败|卫生断言|有 [0-9]+ 条失败' /tmp/ess.log | tail -4 || true
            if [ "$rc" != "0" ]; then
              tail -n 12 /tmp/ess.log
              # 脚本退非零 = 全军覆没 / hygiene 漂移 / 参数错 —— 多半是模型名 · 中转站 · 余额这类系统性问题, 判红排查。
              # 零星单条失败脚本自己退 0 并告警, 下轮幂等续标, 不拖红 (对齐 best-effort 富集定位)。
              echo "::error::essence $p 退出码 $rc —— 全军覆没 / hygiene 漂移 / 配置 (模型名 · 中转站 · 余额), 需排查; 已标的不丢, 下轮幂等续标。"
              fail_count=$((fail_count + 1))
            fi
          done
          if [ $fail_count -gt 0 ]; then
            echo "::error::essence annotation failed for $fail_count project(s)"
            exit 1
          fi

      - name: 策展 flywheel 经验卡 (pull 馆员书架, D-038 / docs/14) · 直连中转站 (D-100)
        id: curate_sync
        continue-on-error: true
        if: steps.check.outputs.skip != 'true' && env.ANTHROPIC_API_KEY != '' && github.event.inputs.skip_essence != 'true'
        working-directory: scripts
        env:
          FLYWHEEL_CURATOR_MODEL: ${{ vars.FLYWHEEL_CURATOR_MODEL }}
        run: |
          # 把合格爆款(爆/大爆/参考, 非 synthetic)提炼成"经验卡", 喂 pull 模型的 LLM 馆员书架。
          # 直连中转站 (D-100), 同 essence 步。CUR_REQ_MAX=5 的分批 (D-094) 是为 Railway 边缘超时存在的, 直跑不需要:
          # 每项目一次调用, --limit 给剩余的共享预算。四条纪律不变 (ci.yml 的 D-047 守卫钉着): on_demand 闸 /
          # 预算全局共享且随实际策展数递减 / 预算用完点名谁被推迟 / 一个项目挂了不带走其余项目但收尾判红。
          # 尊重 workflow 的 project 输入: 定向跑某项目时只策展该项目(PR#30 review r3338862087)。
          # 复用 skip_essence flag(同属 LLM 花费, 一起跳)。书架空时 0 卡, no-op。
          # 预算: curate 待办是【爆款数】量级(远少于笔记), 15/天足够; 共享预算不随项目数放大 (加闸门不该顺手把账单乘以项目数)。
          [ -n "$FLYWHEEL_CURATOR_MODEL" ] || unset FLYWHEEL_CURATOR_MODEL
          CUR_LIMIT=$WORKER_LIMIT; [ "$CUR_LIMIT" -gt 15 ] && CUR_LIMIT=15
          DRY_FLAG=""; [ "${{ github.event.inputs.dry_run }}" = "true" ] && DRY_FLAG="--dry-run"
          # ── on_demand 闸 (D-047 第二张嘴) ──
          # curate 以前是【全局单次调用】: fetch_uncurated_cards() 只按 is_curated=false 取, 不看 sync_interval;
          # 而它的候选视图 v_flywheel_lesson_cards 的 WHERE 只有 tier/tier_source/publish_time —— 【不要求先有 essence】。
          # 所以 essence 那道闸挡不住它: 没验证过的表一落库, 它的爆款当晚就被策展成经验卡进书架 → 三生六部 → autowriter。
          # 判据走 skip_on_cron.py, 按项目循环 (脚本只收单个 --project, 没有"排除某些")。
          remaining=$CUR_LIMIT
          fail_count=0
          done_any=0
          deferred=""
          for f in ../mappings/*.yaml; do
            p=$(basename "$f" .yaml)
            [ "$p" = "_template" ] && continue
            [ -n "$PROJECT_FILTER" ] && [ "$p" != "$PROJECT_FILTER" ] && continue
            # ⚠️ 不能写成 `python skip_on_cron.py "$p"; rc=$?` —— 步骤默认 `bash -e`, 退出码 1
            #    (= 照跑)会在 rc=$? 之前就把整步掐死, 一行输出都没有(D-051, 8/31~9/2 连红三晚)。
            rc=0; python skip_on_cron.py "$p" || rc=$?
            if [ "$rc" = "0" ]; then
              echo "  ⏭  $p sync_interval=on_demand → 夜间 cron 跳过 curate(与入库/essence 同一道闸)"
              continue
            fi
            # 预算耗尽: 不静默截断 —— 明说还剩谁没跑, 否则日志看着像"全都策展过了"。
            if [ "$remaining" -le 0 ]; then deferred="$deferred $p"; continue; fi
            echo "─── curate (直连) · project=$p · 本轮剩余预算=$remaining ───"
            rc=0; python curate_flywheel_lessons.py --project "$p" --limit "$remaining" $DRY_FLAG > /tmp/cur.log 2>&1 || rc=$?
            grep -E 'Done:|全部失败|有 [0-9]+ 张失败' /tmp/cur.log | tail -3 || true
            if [ "$rc" = "0" ]; then
              done_any=1
              # 扣掉这个项目真策展了几张 (Done: {"ok": N,...}); 取不到就保守按 0 扣, 宁可多跑一轮也别把预算算没了
              # 导致后面的项目被静默跳过。只认 `"ok": <数字>` (至少一位数字, 否则 `"ok": true` 会匹配出空串)。
              n=$(grep -o '"ok": *[0-9][0-9]*' /tmp/cur.log | tail -1 | grep -o '[0-9][0-9]*$' || true)
              [ -n "$n" ] && remaining=$((remaining - n))
            else
              tail -n 8 /tmp/cur.log
              # 脚本退非零 = 全军覆没 (ok=0 且有失败) / 参数错 —— 系统性, 判红; 零星单卡失败脚本退 0 并告警,
              # 失败卡 is_curated=false 下轮幂等重试。一个项目挂了不带走其余项目, 但收尾判红。
              echo "::error::curate $p 退出码 $rc —— 全军覆没 / 配置 (模型名 · 中转站 · 余额), 需排查; 失败卡下轮幂等重试。"
              fail_count=$((fail_count + 1))
            fi
          done
          [ -n "$deferred" ] && echo "::notice::curate 本轮预算($CUR_LIMIT)用完, 这些项目留到下轮 cron:$deferred"
          [ "$done_any" = "0" ] && [ "$fail_count" = "0" ] && echo "  (本轮没有项目需要 curate 或全被 on_demand 闸跳过)"
          if [ "$fail_count" -gt 0 ]; then
            echo "::error::curate failed for $fail_count project(s)"
            exit 1
          fi

      - name: TV 爆款 → sanshengliubu.reference_samples (通道 1)
        id: ssll_sync
        continue-on-error: true
        if: steps.check.outputs.skip != 'true'
        working-directory: scripts
        run: |
          DRYRUN=""
          [ "${{ github.event.inputs.dry_run }}" = "true" ] && DRYRUN="--dry-run"
          # workflow 的 project 输入写着"只跑某个项目", 但这一步以前不认它 —— 定向跑
          # 一个项目照样全局推。补上(脚本本来就有 --project)。
          PROJ=""
          [ -n "$PROJECT_FILTER" ] && PROJ="--project $PROJECT_FILTER"
          # ── on_demand 闸 (D-047 第三张嘴) ──
          # 这道闸【在脚本里】, 不在这儿的 bash 里: 本脚本跑在 GitHub runner 上, 判据
          # (mapping 的 sync_interval)读得到; 不像 curate 跑在 Railway worker 上、
          # 只能在调用方按项目循环。判据在哪儿跑决定闸装在哪儿。
          # 也不看 TV_SCHEDULED_RUN —— 与 essence/curate 那两道故意不同: 那两道写在
          # truth_vault 自己家里、幂等, 只挡 cron 不挡人工就够; 这一道跨库单向
          # (写进三生六部生产检索池, 推过去追不回来), 手动触发并不会让 mapping 里的
          # [待确认] 变成已拍板, 所以【任何一次跑】都挡, 直到该项目翻 daily。
          # 要单推某个还没翻 daily 的项目: 加 --include-on-demand(指名道姓的那条路)。
          python sync_truth_vault_baokuan_to_sanshengliubu.py $DRYRUN $PROJ

      # 通道2 push 已退役 (D-038 / docs/15): TV 不再写 autowriter.items;
      # aw 改为 write-time 主动 pull 馆员书架 (见上 curate_sync 步骤策展经验卡)。
      # 历史脚本 sync_truth_vault_baokuan_to_autowriter_items.py 保留在 repo 备查。

      - name: autowriter 人工审稿决定 → truth_vault.prepublish_evaluations
        id: prepublish_sync
        continue-on-error: true
        if: steps.check.outputs.skip != 'true'
        working-directory: scripts
        run: |
          DRYRUN=""
          [ "${{ github.event.inputs.dry_run }}" = "true" ] && DRYRUN="--dry-run"
          # 时间窗 = created_at OR updated_at (D-043, 2026-08-23)。
          # updated_at 是 aw 仓 migrations/001_deskcore.sql 加的 —— 生产库已应用;
          # 没有这列的库会降级回只按 created_at 并告警, 不会把这一步打死。
          # 默认 365 天窗口足够日 cron 抓到迟到决策; 月度可以跑一次
          # --since-days 0 全扫补漏 (在另一个 workflow / 手动 cron)。
          # 本步在下方「Fail job on any sync failure」的聚合闸里, 真挂了会红+发邮件。
          python sync_autowriter_decisions_to_prepublish.py $DRYRUN


      # (2026-10-08 D-090 退灯: 「positive pool 饱和度检查」原来在这里。它量的是 items.external_source_id
      #  那条路, 而那条路没人写(push 没跑过、deskcore 明说不碰), 所以从上线起每晚 rc=2 "无法评估"。
      #  步骤、脚本、登记册行、CI 冒烟一起摘掉; v1_8 的视图留着不碍事。)

      - name: prune 馆员旧缓存 (advisory, 不 fail)
        if: steps.check.outputs.skip != 'true' && always()
        working-directory: scripts
        run: |
          # flywheel_librarian_cache 里 library_version 过期的死行会无限累积;
          # 删掉 >30 天没命中的(advisory,删不动也不影响整轮)。
          # dry_run 时只数不删 —— 对齐本 workflow "dry_run=不写 Supabase" 的承诺(codex review)。
          DRY=""
          [ "${{ github.event.inputs.dry_run }}" = "true" ] && DRY="--dry-run"
          python prune_librarian_cache.py --ttl-days 30 $DRY || true

      - name: 通道 2 借阅流量检查 · 写作台生成了但没来借就告警 (advisory, 不 fail)
        if: steps.check.outputs.skip != 'true' && always()
        working-directory: scripts
        run: |
          # D-063 (2026-09-17): 通道 2(pull/馆员)暗了三个月没人知道 —— aw 那边 fail-open 静默返 [],
          # TV 这边只印 →ssll。判据只有一条: 过去 48h 写作台有 batch、馆员却没被写作台调过 → ::warning。
          # (48h = 与每日 cron 重叠, 漏跑一天也不留空档; 只数 autowriter/deskcore 两个 consumer,
          #  ssll / 诊断 curl 的流量不算 —— codex review on #133。窗口别在这里传小于 24 的值。)
          # advisory 不拖红: 修在 aw 仓(接线/env), TV 红了也改不好(D-053: 天天红的 CI 等于没有 CI)。
          # 崩了要看得见: 靠哨兵行判定, 不靠退出码(同上面饱和度检查)。只读, dry_run 也照跑。
          set +e
          python check_librarian_traffic.py 2>&1 | tee /tmp/librarian_traffic.log
          set -e
          if ! grep -q '^LIBRARIAN_TRAFFIC_CHECK_DONE rc=' /tmp/librarian_traffic.log; then
            echo "::warning title=通道 2 借阅流量检查崩了::脚本没跑到底(没有哨兵行), \
          上面的 traceback 是真问题 —— advisory 不拖红, 但通道 2 的监控现在是瞎的, 去修。"
          fi

      - name: 外部语料新鲜度 · Jev 周跑这周有没有进账本 (advisory, 不 fail)
        if: steps.check.outputs.skip != 'true' && always()
        working-directory: scripts
        run: |
          # D-094 (审计 B-23): external-corpus.yml 在 Jev 仓, 红了只发邮件给改过 cron 的人; "绿但空"在哪都看不见。
          # 这盏灯看 truth_vault.external_notes 最新一行的 fetched_at, 超过 8 天 (周更 + 1 天余量) 就 rc=1。
          # 修在 Jev 仓, advisory 不拖红; 崩了靠哨兵行判定 (同其它灯)。
          set +e
          python check_external_corpus_fresh.py 2>&1 | tee /tmp/external_corpus.log
          set -e
          if ! grep -q '^EXTERNAL_CORPUS_CHECK_DONE rc=' /tmp/external_corpus.log; then
            echo "::warning title=外部语料新鲜度检查崩了::脚本没跑到底(没有哨兵行), \
          上面的 traceback 是真问题 —— advisory 不拖红, 但这盏灯现在是瞎的, 去修。"
          elif grep -q '^EXTERNAL_CORPUS_CHECK_DONE rc=1' /tmp/external_corpus.log; then
            echo "::warning title=外部语料超过 8 天没进新货::去 Jev 仓看 external-corpus 最近一次 run (修在 Jev 仓)。"
          elif grep -q '^EXTERNAL_CORPUS_CHECK_DONE rc=2' /tmp/external_corpus.log; then
            # rc=2 = 判不了 (表空 / 时间认不出): "从没进过货"正是这盏灯要抓的那种"绿但空", 不能只躺在日志里 (codex review on #169)
            echo "::warning title=外部语料新鲜度判不了::external_notes 是空的或最新时间认不出 —— 外部语料可能从没写进过 TV, 去 Jev 仓看 external-corpus 有没有成功过一次。"
          fi

      - name: 角度台账漏账检查 · 发了牌没走到成稿就告警 (advisory, 不 fail)
        if: steps.check.outputs.skip != 'true' && always()
        working-directory: scripts
        run: |
          # D-071 (2026-09-20): deskcore /health 的 pipeline 指标报 91% 泄漏, 但那一个百分比把两种
          # 完全不同的形状糊在一起, 而且没排除 tv-sync 导入的副本(同窗口 1507 条指纹里 1468 条是导入的,
          # 本来就没有 angle_key)。本脚本把两种形状分开报: 「抽完没写」(会话停在发牌之后) 与
          # 「写了不带坐标」(稿子进了指纹库、台账销不了账 → 同一个故事下一批会被再抽一次)。
          # advisory 不拖红: 修在 aw 仓(协议 / 使用习惯), TV 红了也改不好(同通道 2 那盏灯)。
          # 崩了要看得见: 靠哨兵行判定, 不靠退出码。只读, dry_run 也照跑。
          set +e
          python check_angle_ledger_leak.py 2>&1 | tee /tmp/angle_leak.log
          set -e
          if ! grep -q '^ANGLE_LEDGER_CHECK_DONE rc=' /tmp/angle_leak.log; then
            echo "::warning title=角度台账检查崩了::脚本没跑到底(没有哨兵行), \
          上面的 traceback 是真问题 —— advisory 不拖红, 但这盏灯现在是瞎的, 去修。"
          fi

      - name: Show flywheel status (truth_vault.v_flywheel_sync_status)
        if: steps.check.outputs.skip != 'true' && always()
        working-directory: scripts
        run: |
          python - <<'PY' || true
          from _common import get_supabase_client
          sb = get_supabase_client()
          res = sb.schema("truth_vault").table("v_flywheel_sync_status").select("*").execute()
          for r in (res.data or []):
              print(
                f"  {r['project_id']:<16} "
                f"baokuan={r['total_baokuan']:>3} | "
                f"→ssll {r['synced_to_ssll']:>3}/{r['pending_ssll_sync']:>3} "
                # v1.19 (D-087): gated = 被闸挡的、没推是对的; stale = 推过但现在不合格的, 回收每晚清, 非零要人看。
                # .get: 迁移还没 apply 的库上照常打印, 不让这一行把整段 try 掉。
                f"(gated {r.get('gated_ssll_sync', '?')}, stale {r.get('stale_in_ssll', '?')}) | "
                f"ref={r['total_reference']:>3}(→ssll {r['synced_reference_to_ssll']}/{r['pending_reference_ssll']}) | "
                f"last_ssll={r['last_baokuan_sync_to_ssll_at']}"
              )
          PY

      - name: "夜跑用时离超时还有多远 (advisory, 不 fail · D-073)"
        if: always()
        # 2026-09-20 的教训: timeout-minutes 旁边那句"实测 15-38min"过期了好几个月, 没人回头量,
        # 直到 run #177 真的撞上去、静默丢了三步才发现 09-08 就已经只剩 35 秒余量了。
        # 「等它再逼近时我们就去拆」不是个能执行的触发条件 —— 没有人天天看 job 用了多久。
        # 所以把"回头量一次"这件事从人身上挪到这儿: 每晚自己报用时占比, 过 70% 就喊。
        # 不 fail: 用时长本身不是故障, 是"该动手拆 comments/essence 了"的预告(D-053 不许天天红)。
        # ⚠️ BUDGET_MIN 必须和上面 job 的 timeout-minutes 一致 —— ci.yml 有守卫钉这件事,
        #    改了一个不改另一个会被判红(否则这盏灯会按错的分母报一个让人安心的假比例)。
        run: |
          BUDGET_MIN=240
          if [ -z "${TV_JOB_STARTED_AT:-}" ]; then
            echo "::warning title=用时灯没数据::拿不到开跑时刻, 这轮不报用时(灯瞎了, 不是夜跑坏了)"
            exit 0
          fi
          used_min=$(( ( $(date +%s) - TV_JOB_STARTED_AT ) / 60 ))
          pct=$(( used_min * 100 / BUDGET_MIN ))
          echo "夜跑用时 ${used_min}min / 上限 ${BUDGET_MIN}min = ${pct}%"
          if [ "$pct" -ge 70 ]; then
            msg="用了 ${used_min}min / ${BUDGET_MIN}min。大头是 comments 和 essence, 两者都随语料增长。"
            msg="$msg 到这个水位就该动手【拆 comments/essence】, 而不是再把 timeout 往上加"
            msg="$msg —— 上一次把数字往上加之前, 那句过期的注释让它裸奔了几个月(D-073)。"
            echo "::warning title=夜跑用时已达上限的 ${pct}%::$msg"
          fi

      # ── 失败聚合: 任一 sync step 失败 → 整 workflow 失败 → GitHub 默认发邮件 ──
      # 2026-05-22 audit 改进: 老版本每个 sync 步骤用 "|| echo warning" 吞错误,
      # workflow 永远 success, cron 静默漂移到 ssll/aw 没数据也没告警. 现在每个
      # sync step 用 continue-on-error: true 单独跑完, 最后这步聚合所有 outcome,
      # 任一 failure 就 exit 1, GitHub 自动给 repo owner / actor 发邮件.
      - name: Fail job on any sync failure (so GitHub notifies)
        if: steps.check.outputs.skip != 'true' && always()
        run: |
          # outcome 既认 failure 也认 cancelled。
          # 2026-09-20 (D-073) run #177 的实况: job 撞了 timeout-minutes, 特征那步 outcome=cancelled,
          # 它后面的【策展 / 通道1 / 人工审稿同步】三步 conclusion=skipped 一步没跑 —— 而本步只查
          # "= failure", 于是照样打印了 "✅ All sync steps succeeded"。丢了三步, 日志里却写着全绿。
          # ⚠️ 老实说清楚这条补丁能做到什么: 它让本步打出 ::error 并点名, 不再假报绿。
          #    它【不能】让邮件发出来 —— job 被 cancel 时结论就是 cancelled, 本步 exit 1 也盖不过去。
          #    真正防这件事的是上面那个 timeout-minutes: 240 和把特征层拆去 features-sync.yml。
          failed_steps=""
          for kv in "feishu_sync:${{ steps.feishu_sync.outcome }}" \
                    "comments_sync:${{ steps.comments_sync.outcome }}" \
                    "essence_sync:${{ steps.essence_sync.outcome }}" \
                    "curate_sync:${{ steps.curate_sync.outcome }}" \
                    "ssll_sync:${{ steps.ssll_sync.outcome }}" \
                    "prepublish_sync:${{ steps.prepublish_sync.outcome }}"; do
            name="${kv%%:*}"; outcome="${kv#*:}"
            case "$outcome" in
              failure)   failed_steps="$failed_steps $name" ;;
              cancelled) failed_steps="$failed_steps $name(cancelled)" ;;
            esac
          done
          if [ -n "$failed_steps" ]; then
            echo "::error::Daily TV sync failed steps:$failed_steps"
            echo "Repo owner will get an email via GitHub default notifications."
            echo "Investigate: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            exit 1
          fi
          echo "✅ All sync steps succeeded."
