          # 运营在「流量状态」里手写的假数据标记 —— 命中就必须 synthetic=true, 否则人工假爆款
          # 【以真爆款身份】进飞轮 + 进看板爆款率。这道网【独立】于 tier 取值, 正因为 tier 规则的
          # match_contains「爆帖」会把「伪爆帖500」先命中成 爆(BJS_phase1 实测)。
          # 本 guard 的非空转证明: 旧实现是 `"伪爆贴" in s`, 对下面标 ← 的两个用例返回 False,
          # 断言会红 —— 帖/贴 是两个字, 运营两种都写(库里 mapping 的 tier 规则早就两个都收)。
          import re, sync_feishu_notes_to_truth_vault as s
          RE = s._SYNTHETIC_TIER_SRC_RE
          hit = [
              "伪爆贴500",   # RIO 式(旧实现也认)
              "伪爆帖500",   # ← BJS/SPX 实测写法, 旧实现漏
              "伪20评",      # ← 人工补的假评论数, 旧实现漏
              "伪50评",
              "无水花 / 伪爆帖500",   # 多选串里也要认
          ]
          miss = ["无水花", "爆贴", "爆帖", "蓝词", "评估中", "大爆", "无水花 / 爆贴", ""]
          bad = [v for v in hit if not RE.search(v)] + [v for v in miss if RE.search(v)]
          assert not bad, f"synthetic 标记判定错: {bad}"
          # 旧实现确实漏 —— 证明本 guard 不是空转
          legacy_missed = [v for v in hit if "伪爆贴" not in v]
          assert legacy_missed, "旧实现 `'伪爆贴' in s` 应至少漏一个用例, 否则本 guard 无意义"
          print(f"  ✓ 命中 {len(hit)} / 放行 {len(miss)}; 旧实现会漏 {legacy_missed}")

          # synthetic_reason 要点名命中的原串(排查时不用回飞书翻)
          import inspect
          src = inspect.getsource(s.transform_row)
          assert "_SYNTHETIC_TIER_SRC_RE" in src, "transform_row 必须走这个正则, 不许再写死字符串"
          assert '"伪爆贴" in tier_src_str' not in src, "旧的写死判定没删干净"
          print("  ✓ transform_row 走 _SYNTHETIC_TIER_SRC_RE, 无写死字符串残留")
          print("\nsynthetic 伪爆帖/伪爆贴: all checks passed")
          PY
      - name: on_demand 闸对【每一个】自动处理步骤都生效 (D-047)
        working-directory: scripts
        run: |
          python - <<'PY'
          # 那道闸的本意是"没经 preflight 验证的表不许被夜间 cron 自动处理"。
          # 2026-08-30 之前它只挡住了【入库】: essence 那步是裸 `for f in mappings/*.yaml`
          # 全遍历, sync_interval 在整个 essence 路径里一次都没出现。后果不是多跑一点 ——
          # 笔记一落库, 当晚就被 LLM 按【还没拍板】的方向拆解标注, 而标注按
          # essence_annotated_at IS NULL 取, 标完即固化, 再顺着经验卡 → 三生六部 →
          # autowriter 传下去。判断权那道人工闸(README 原则 1)就这么被绕过了。
          import os, subprocess, sys, yaml, pathlib
          import _common as c

          # ① 判据必须只有【一份】—— 入库那步用的和 essence 那步用的是同一个函数
          import sync_feishu_notes_to_truth_vault as s
          assert s._skip_on_demand_on_cron is c.skip_on_demand_on_cron, \
              "入库那步没用 _common 里那份判据 —— 两份判据迟早漂开, 而漂开没有症状"

          # ② 真值表
          f = c.skip_on_demand_on_cron
          assert f("on_demand", True)  is True,  "cron + on_demand → 必须跳过"
          assert f("on_demand", False) is False, "显式 dispatch → 不许挡人工"
          assert f("daily", True)      is False, "daily 项目照跑"
          assert f(None, True)         is False, "没写 sync_interval → 保守照跑"
          print("  ✓ 判据单一来源 + 真值表")

          # ③ CLI shim 的退出码语义(bash 循环按它分支)
          env = dict(os.environ, PYTHONPATH=os.getcwd())
          def rc(project, scheduled):
              e = dict(env); e["TV_SCHEDULED_RUN"] = "true" if scheduled else ""
              return subprocess.run([sys.executable, "skip_on_cron.py", project],
                                    capture_output=True, env=e).returncode
          on_demand = next(p.stem for p in pathlib.Path("../mappings").glob("*.yaml")
                           if not p.stem.startswith("_")
                           and ((yaml.safe_load(p.read_text()).get("sync_config") or {})
                                .get("sync_interval") == "on_demand"))
          daily = next(p.stem for p in pathlib.Path("../mappings").glob("*.yaml")
                       if not p.stem.startswith("_")
                       and ((yaml.safe_load(p.read_text()).get("sync_config") or {})
                            .get("sync_interval") == "daily"))
          assert rc(on_demand, True)  == 0, "on_demand + cron 应 exit 0(跳过)"
          assert rc(on_demand, False) == 1, "on_demand + 显式 应 exit 1(照跑)"
          assert rc(daily, True)      == 1, "daily + cron 应 exit 1(照跑)"
          # 判不了时【照跑】而不是【跳过】: 静默少干活查不出来, 多干一次是幂等的
          assert rc("NO_SUCH_PROJECT_xyz", True) == 2, "读不出 mapping 应 exit 2"
          print("  ✓ CLI 退出码: 0=跳过 / 1=照跑 / 2=判不了(调用方照跑)")

          # ④ essence 那一步真的接上了这道闸 —— 只写工具不接线是这类护栏最常见的死法
          wf = yaml.safe_load(pathlib.Path("../.github/workflows/daily-sync.yml").read_text())
          steps = [s for s in wf["jobs"]["sync"]["steps"] if s.get("run")]
          ess = [s for s in steps if "annotate-essence" in s["run"]]
          assert ess, "找不到 essence 那一步"
          body = ess[0]["run"]
          assert "skip_on_cron.py" in body, "essence 步骤没接 on_demand 闸(D-047 回归)"
          assert body.index("skip_on_cron.py") < body.index("annotate-essence"), \
              "闸必须在真正发起标注请求之前"
          print("  ✓ daily-sync 的 essence 步骤已接闸, 且在发请求之前")

          # ⑤ curate 是同一泄漏口的【第二张嘴】—— 它的候选视图 v_flywheel_lesson_cards
          #    不要求 essence(WHERE 只有 tier/tier_source/publish_time), 所以 essence
          #    那道闸挡不住它。只挡一张嘴比不挡更危险: 会让人以为已经挡住了。
          cur = [s for s in steps if "/curate" in s["run"]]
          assert cur, "找不到 curate 那一步"
          cbody = cur[0]["run"]
          assert "skip_on_cron.py" in cbody, "curate 步骤没接 on_demand 闸(D-047 回归)"
          # 判据钉在【真正发请求那一行】上, 不是任何出现 "/curate" 的地方 ——
          # 注释里也会提到 /curate, 拿它比位置会把守卫变成在考注释怎么写。
          POST = '-X POST "${WORKER_URL%/}/curate"'
          assert POST in cbody, "找不到 curate 的 curl 请求行(改了写法就同步改这条守卫)"
          assert cbody.index("skip_on_cron.py") < cbody.index(POST), \
              "闸必须在真正发起 curate 请求之前"
          # 必须是【按项目循环】: 全局单次调用没法排除某些项目(/curate 只收单个 project)
          assert 'for f in ../mappings/*.yaml' in cbody, "curate 必须按项目循环, 否则闸无处可插"
          assert '\\"project\\":\\"$p\\"' in cbody, "循环里必须把当前项目传给 /curate"
          # 预算必须【共享】而不是每项目各给一份 —— 加闸门不该顺手把账单乘以项目数
          assert "remaining=$CUR_LIMIT" in cbody, "curate 预算要全局共享(remaining), 不是每项目各 CUR_LIMIT"
          assert "remaining - n" in cbody or "remaining-n" in cbody, "预算没有随实际策展数递减"
          # 预算截断不许静默 —— 必须说清谁被推迟到下轮
          assert "deferred" in cbody and "留到下轮" in cbody, "预算用完要点名哪些项目被推迟, 不许静默截断"
          # 一个项目挂了不该带走其余项目, 但收尾仍要判红
          assert "fail_count" in cbody and "exit 1" in cbody, "curate 失败要计数并在收尾判红"
          print("  ✓ curate 步骤: 已接闸 / 按项目循环 / 预算共享递减 / 截断不静默 / 逐项目隔离")

          # ⑥ 通道1(TV 爆款 → 三生六部 reference_samples)是【第三张嘴】, 也是唯一跨库的一张。
          #    前两张的后果还留在 truth_vault 自己家里, 这张把内容写进另一个 Supabase 的
          #    检索池、直接喂写作引擎 —— 推过去就追不回来(只有 synthetic 有自愈回收路径)。
          #    它在 daily-sync 里【连项目循环都没有】: 一句全局调用, 而 fetch_pending_baokuan
          #    只按 tier/publish_time/synced_to_ssll_at 取, sync_interval 全程不出现。
          ssll = [s for s in steps if "sync_truth_vault_baokuan_to_sanshengliubu.py" in s["run"]]
          assert ssll, "找不到通道1(→ 三生六部)那一步"
          import sync_truth_vault_baokuan_to_sanshengliubu as ss
          import inspect
          # 闸装在脚本里而不是 bash 循环里: 这个脚本【跑在 GitHub runner 上】(不像 curate 在
          # Railway worker 上), TV_SCHEDULED_RUN 拿得到, 不必把调用拆成按项目循环。
          src = inspect.getsource(ss)
          assert "TV_SCHEDULED_RUN" in src, \
              "通道1 脚本读不到 TV_SCHEDULED_RUN → 闸永远不会触发(D-047 回归)"
          m = inspect.getsource(ss.main)
          for probe in ("retract_stale_synthetic_from_ssll(", "drop_on_demand_under_cron(",
                        "insert_reference_sample("):
              assert probe in m, f"main() 里找不到 {probe} —— 改了结构就同步改这条守卫"
          assert m.index("drop_on_demand_under_cron(") < m.index("insert_reference_sample("), \
              "闸必须在真正往三生六部写之前"
          # 回收【不】受闸管: 闸挡的是"往外推", 不是"把推错的拉回来"
          assert m.index("retract_stale_synthetic_from_ssll(") < m.index("drop_on_demand_under_cron("), \
              "synthetic 回收不该被 on_demand 闸挡住(任何时候都该跑)"

          #    行为(非空跑): 拿真 mappings 里的 on_demand / daily 各一个项目对拍。
          rows = [{"project_id": on_demand, "note_id": "a"},
                  {"project_id": daily, "note_id": "b"},
                  {"project_id": "NO_SUCH_PROJECT_xyz", "note_id": "c"}]
          kept, gated = ss.drop_on_demand_under_cron(rows, False)
          assert len(kept) == 3 and gated == {}, "显式 dispatch 不许挡人工"
          kept, gated = ss.drop_on_demand_under_cron(rows, True)
          assert [n["note_id"] for n in kept] == ["b", "c"], \
              "夜间 cron 应只拦 on_demand;判不了的项目要【照推】(静默少推查不出来)"
          assert gated == {on_demand: 1}, f"被拦下的项目要点名报出来, 实际 {gated}"
          print("  ✓ 通道1(跨库)步骤: 闸在写入前 / 回收不受闸管 / on_demand 拦下且点名 / 判不了照推")
          print("\non_demand 闸覆盖: all checks passed")
          PY
      - name: 库结构前置闸:代码写的列必须先落库 (D-046, 2026-08-27 实测连红 4 天)
        working-directory: scripts
        run: |
          python - <<'PY'
          # 2026-08-27: PR #109 让每条 note upsert 都带 notes.last_seen_at, 而迁移
          # notes_v1_9 从没在生产库跑过 → 【每一条 upsert 各失败一次】(不是降级),
          # 几百条一样的 traceback 淹掉唯一有用那行, daily sync 连红 4 天才被发现。
          # 本 guard 守的是那道闸: 缺列必须在【开跑前】一次性点名, 且说清该跑哪个迁移。
          import inspect, _common as c

          # ① 清单本身别退化成空(有人删空了 = 闸门失效, 但测试仍会"通过")
          assert len(c._REQUIRED_COLUMNS) >= 6, "必核的表少于 6 张, 清单八成被删残了"
          notes_cols = c._REQUIRED_COLUMNS["notes"]
          assert len(notes_cols) >= 30, f"notes 只列了 {len(notes_cols)} 列, 太少"
          for must in ("last_seen_at", "last_seen_run_id", "raw_content", "tier"):
              assert must in notes_cols, f"notes 必核列漏了 {must}"

          # ② 用假 client 精确复现那次事故, 断言"会红"
          class FakeQ:
              def __init__(s, have): s.have = have
              def select(s, cols): s.req = cols.split(","); return s
              def limit(s, n): return s
              def execute(s):
                  miss = [x for x in s.req if x not in s.have]
                  if miss: raise RuntimeError(f"column does not exist: {miss[0]}")
                  return {"data": []}
          class FakeClient:
              def __init__(s, m): s.m = m
              def schema(s, _): return s
              def table(s, t): return FakeQ(s.m.get(t, set()))

          full = {t: set(v) for t, v in c._REQUIRED_COLUMNS.items()}
          c.assert_db_schema_ready(FakeClient(full))          # 列齐 → 必须静默通过

          broken = {t: set(v) for t, v in c._REQUIRED_COLUMNS.items()}
          broken["notes"] -= {"last_seen_at", "last_seen_run_id"}
          try:
              c.assert_db_schema_ready(FakeClient(broken))
              raise SystemExit("✗ 空转: 缺列没被拦 —— 这正是 4 天没人发现的那个场景")
          except RuntimeError as e:
              msg = str(e)
              # 两个列都要点名: PostgREST 一次只报第一个, 逐列复探就是为了这个
              assert "last_seen_at" in msg and "last_seen_run_id" in msg, \
                  f"没把缺的列点全(只报第一个 = 一次修一个, 要来回好几轮): {msg}"
              assert "notes_v1_9_last_seen_reconcile.sql" in msg, "没说清该跑哪个迁移文件"
          print("  ✓ 复现 2026-08-27 事故 → 被拦, 两列都点名 + 指出迁移文件")

          # ③ 未知来源的缺列不能静默 —— 要落回 README Step 0 提示
          b2 = {t: set(v) for t, v in c._REQUIRED_COLUMNS.items()}
          b2["comments"] -= {"comment_role"}
          try:
              c.assert_db_schema_ready(FakeClient(b2)); raise SystemExit("✗ 空转")
          except RuntimeError as e:
              assert "comments.comment_role" in str(e) and "Step 0" in str(e)
          print("  ✓ 不在迁移映射里的缺列: 仍点名 + 落回 Step 0 提示")

          # ④ 闸必须真的接在 sync 的 main() 上, 且在【写入之前】——
          #    只写函数不接线, 是这类护栏最常见的死法。
          import sync_feishu_notes_to_truth_vault as s
          src = inspect.getsource(s.main)
          assert "assert_db_schema_ready" in src, "sync main() 没调用这道闸"
          assert src.index("assert_db_schema_ready") < src.index("ensure_project_exists"), \
              "闸必须在第一次写库(ensure_project_exists)之前"
          print("  ✓ 已接在 sync main() 里, 且排在第一次写库之前")
          print("\n库结构前置闸: all checks passed")
          PY
      - name: tier 规则列序:短针不许遮死长针 (2026-08-28)
        working-directory: scripts
        run: |
          python - <<'PY'
          # `_first_matching_tier` 取首个命中 → 短针排在长针前面 = 长针整条不可达。
          # BJS_phase1 起草稿实测踩到: 「爆帖」(→爆) 排在 「伪爆帖」(→数据异常) 前面,
          # 于是运营手标的假数据「伪爆帖500」被判成【爆】。纯静态可查, 故做成 load_mapping 的 lint。
          import glob, pathlib, _common
          # ① 全部既有 mapping 必须仍 load 得过(零误报, 否则这 lint 会挡住所有 sync)
          ok = 0
          for f in sorted(glob.glob('../mappings/*.yaml')):
              pid = pathlib.Path(f).stem
              if pid.startswith('_'):
                  continue
              _common.load_mapping(pid)
              ok += 1
          assert ok >= 10, f"只扫到 {ok} 个 mapping, 路径不对?"
          print(f"  ✓ {ok} 个既有 mapping 零误报")
          # ② 非空转证明: 出问题的那个列序必须被拒
          bad = [{"match_contains": ["爆贴", "爆帖"], "tier": "爆"},
                 {"match_contains": ["伪爆帖", "伪20评"], "tier": "数据异常"}]
          try:
              _common._reject_shadowed_tier_rules("x.yaml", bad)
              raise SystemExit("✗ 空转: 被遮死的列序没被拒")
          except ValueError as e:
              assert "伪爆帖" in str(e) and "上移" in str(e), f"报错没说清怎么修: {e}"
          print("  ✓ 遮死的列序被拒, 且报错直接给出修法")
          # ③ 修好的列序(长针上移)必须放行 —— 别把 lint 写成"永远拒"
          _common._reject_shadowed_tier_rules("x.yaml", [
              {"match_contains": ["伪爆帖", "伪20评"], "tier": "数据异常"},
              {"match_contains": ["爆贴", "爆帖"], "tier": "爆"}])
          # ④ 同针重复出现在多条规则里不算遮死(prev == needle 时跳过)
          _common._reject_shadowed_tier_rules("x.yaml", [
              {"match_contains": ["爆贴"], "tier": "爆"},
              {"match_contains": ["爆贴"], "tier": "爆"}])
          print("  ✓ 列序修好后放行 / 同针重复不误报")
          print("\ntier 规则列序 lint: all checks passed")
          PY
      - name: Supabase key validation self-check
        working-directory: scripts
        run: |
          python - <<'PY'
          import os, sys
          import _common
          # Stub create_client so we exercise validation, not network.
          captured = []
          _common.create_client = lambda url, key, opts=None: captured.append(key) or "fake"

          os.environ['SUPABASE_URL'] = 'https://test.supabase.co'
          cases = [
              ("sb_secret_abc123def456", True, "new sb_secret_ format"),
              ("sb_publishable_abc123", False, "publishable rejected"),
              ("anon-key-12345", False, "'anon' substring rejected"),
              ("xx", False, "too short rejected"),
              ("eyJhbGciOiJIUzI1NiJ9.eyJyb2xlIjoic2VydmljZV9yb2xlIn0.fake", True,
               "legacy JWT service_role"),
              ("eyJhbGciOiJIUzI1NiJ9.eyJyb2xlIjoiYW5vbiJ9.fake", False,
               "legacy JWT anon rejected"),
              ("some_future_opaque_" + "x" * 50, True,
               "unrecognized-but-long passes fallback"),
          ]
          failed = []
          for key, should_succeed, desc in cases:
              os.environ['SUPABASE_SERVICE_ROLE_KEY'] = key
              try:
                  _common.get_supabase_client()
                  ok = True
              except RuntimeError:
                  ok = False
              if ok != should_succeed:
                  failed.append(desc)
                  print(f"  FAIL {desc}: ok={ok} expected={should_succeed}")
              else:
                  print(f"  ok {desc}")
          if failed:
              sys.exit(f"{len(failed)} key validation case(s) failed")
          print(f"\nkey validation: {len(cases)}/{len(cases)} passed")
          PY
      - name: load_mapping tier_source whitelist self-check
        working-directory: scripts
        run: |
          python - <<'PY'
          # Regression: tier_extraction.source previously fell back to "状态字段"
          # via .get(default) on any unknown value, silently dropping tier for
          # C-family projects whose source is "备注字段". Now validated up-front.
          import tempfile, os
          from pathlib import Path
          import yaml
          import _common

          with tempfile.TemporaryDirectory() as td:
              td_path = Path(td)
              _common._MAPPINGS_DIR = td_path

              def write(name, body):
                  (td_path / f"{name}.yaml").write_text(
                      yaml.safe_dump(body, allow_unicode=True), encoding="utf-8"
                  )

              # 1. valid source 状态字段
              write("p1", {
                  "project_id": "p1",
                  "field_mapping": {"a": "raw_content"},
                  "tier_extraction": {"source": "状态字段", "rules": []},
              })
              assert _common.load_mapping("p1")["project_id"] == "p1"
              print("  ✓ source=状态字段 accepted")

              # 2. valid source 备注字段
              write("p2", {
                  "project_id": "p2",
                  "field_mapping": {"a": "raw_content"},
                  "tier_extraction": {"source": "备注字段", "rules": []},
              })
              _common.load_mapping("p2")
              print("  ✓ source=备注字段 accepted")

