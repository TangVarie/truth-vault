          assert s.inherit_content_from_previous_row(xhs, None, None, spec, col) == (xhs, None, None)
          assert s.inherit_content_from_previous_row(dict(dy, **{col: "自己有"}), xhs, "r", spec, col)[1] is None
          # 没配 spec 的项目 → 完全不动
          assert s.inherit_content_from_previous_row(dy, xhs, "r", None, col) == (dy, None, None)
          # 主循环里 prev 【每一条】都更新 —— 判的是紧挨着的上一条, 抖音接抖音必须能被看见
