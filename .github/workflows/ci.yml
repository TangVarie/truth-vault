      - name: Apply v1.8 positive-pool saturation blind-spot fix (+ idempotency)
        # v1_8 修掉一个让 check_positive_saturation.py 从上线起就没真正生效过的
        # 盲点: 原 view 的 WHERE 里有 `AND i.external_source='truth_vault'`,
        # 只统计 push 通道写的正例 —— 而 push 从没真跑过, 生产库那列全 NULL,
        # 于是脚本永远打印 "No active positive examples"。
        # 它测不到运营手标的 native 正例, 而那才是真正在注入 prompt 的池子。
        run: |
          psql -v ON_ERROR_STOP=1 -f schemas/notes_v1_8_positive_pool_saturation_fix.sql
          psql -v ON_ERROR_STOP=1 -f schemas/notes_v1_8_positive_pool_saturation_fix.sql
      - name: Sanity-check v1.8 (native visible / unmeasurable ≠ healthy / per-user pools)
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          -- ① 回归: 上一步 CI_SAT 那 5 条 TV 正例的结论必须原样成立。
          --    (v1_8 只放宽了 WHERE + 追加了 3 列, 不该改变已有口径)
          DO $$
          DECLARE r RECORD;
          BEGIN
              SELECT * INTO r FROM truth_vault.v_autowriter_positive_pool_saturation
                  WHERE aw_project_id = '00000000-0000-0000-0000-000000aaaa01'::uuid;
              IF r.active_positive_count != 5 OR r.top_lever_count != 3
                 OR ABS(r.dominant_lever_ratio - 0.60) > 0.01 THEN
                  RAISE EXCEPTION 'v1_8 regressed CI_SAT: active=% top=% ratio=%',
                      r.active_positive_count, r.top_lever_count, r.dominant_lever_ratio;
              END IF;
              IF r.tv_positive_count != 5 OR r.native_positive_count != 0 THEN
                  RAISE EXCEPTION 'v1_8 origin split wrong: tv=% native=%',
                      r.tv_positive_count, r.native_positive_count;
              END IF;
              RAISE NOTICE 'v1_8 CI_SAT regression OK (ratio=%)', r.dominant_lever_ratio;
          END $$;

          -- ② 新行为: native 正例(external_source IS NULL)必须能被看见。
          --    v1_8 之前这个项目在 view 里【根本不存在】。
          INSERT INTO autowriter.batches (id, project_id) VALUES
              ('00000000-0000-0000-0000-000000c10002'::uuid,
               '00000000-0000-0000-0000-000000aaaa02'::uuid);
          INSERT INTO autowriter.items (id, batch_id, example_label, created_at)
          VALUES
              (gen_random_uuid(), '00000000-0000-0000-0000-000000c10002'::uuid,
               'positive', NOW() - INTERVAL '1 hour'),
              (gen_random_uuid(), '00000000-0000-0000-0000-000000c10002'::uuid,
               'positive', NOW() - INTERVAL '2 hour');
          DO $$
          DECLARE r RECORD;
          BEGIN
              SELECT * INTO r FROM truth_vault.v_autowriter_positive_pool_saturation
                  WHERE aw_project_id = '00000000-0000-0000-0000-000000aaaa02'::uuid;
              IF NOT FOUND THEN
                  RAISE EXCEPTION 'native-only project still invisible — the blind spot is not fixed';
              END IF;
              IF r.active_positive_count != 2 OR r.native_positive_count != 2 THEN
                  RAISE EXCEPTION 'expected 2 native positives, got active=% native=%',
                      r.active_positive_count, r.native_positive_count;
              END IF;
              -- native 正例没有 external_source_id, join 不到 truth_vault.notes,
              -- 所以拿不到 lever。关键: ratio 必须是 NULL(测不了) 而不是 0(看起来健康)。
              IF r.lever_measurable_count != 0 THEN
                  RAISE EXCEPTION 'expected lever_measurable_count=0, got %', r.lever_measurable_count;
              END IF;
              -- 分母是可测条数; 一条都测不到时必须报 NULL。若这里返回 0,
              -- 脚本会把"没测到"显示成"多样性很好", 正是要避免的假阴性。
              IF r.dominant_lever_ratio IS NOT NULL THEN
                  RAISE EXCEPTION 'unmeasurable pool must report NULL ratio (not a healthy-looking number), got %',
                      r.dominant_lever_ratio;
              END IF;
              RAISE NOTICE 'v1_8 native visibility OK (pool=2, measurable=0, ratio=NULL)';
          END $$;

          -- ③ 按 user 分区: 同一项目里两个人各有各的私有注入池。
          --    deskcore 注入正例时按 user_id 过滤(正负例是个人风格资产), 所以
          --    混算出来的"最近 5 条"两个人谁都没在用 —— 会掩盖某个人的饱和。
          --    用户 a: 3 条全同一个 lever  → ratio 1.00 (严重饱和, 该告警)
          --    用户 b: 3 条三种不同 lever  → ratio 0.33 (健康)
          --    不分区的话混算成 ratio 0.60, 恰好卡在阈值上, a 的饱和被藏起来。
          INSERT INTO truth_vault.notes (note_id, project_id, raw_content, tier, emotional_lever) VALUES
              ('MU_a1','CI_SAT','x','爆','焦虑撬动'),
              ('MU_a2','CI_SAT','x','爆','焦虑撬动'),
              ('MU_a3','CI_SAT','x','爆','焦虑撬动'),
              ('MU_b1','CI_SAT','x','爆','造梦投射'),
              ('MU_b2','CI_SAT','x','爆','共鸣释放'),
              ('MU_b3','CI_SAT','x','爆','好奇驱动');
          INSERT INTO autowriter.batches (id, project_id) VALUES
              ('00000000-0000-0000-0000-000000c10003'::uuid,
               '00000000-0000-0000-0000-000000aaaa03'::uuid);
          INSERT INTO autowriter.items
              (id, batch_id, user_id, example_label, external_source, external_source_id, created_at)
          VALUES
              (gen_random_uuid(),'00000000-0000-0000-0000-000000c10003'::uuid,
               '00000000-0000-0000-0000-00000000000a'::uuid,'positive','truth_vault','MU_a1',NOW()-INTERVAL '1 hour'),
              (gen_random_uuid(),'00000000-0000-0000-0000-000000c10003'::uuid,
               '00000000-0000-0000-0000-00000000000a'::uuid,'positive','truth_vault','MU_a2',NOW()-INTERVAL '2 hour'),
              (gen_random_uuid(),'00000000-0000-0000-0000-000000c10003'::uuid,
               '00000000-0000-0000-0000-00000000000a'::uuid,'positive','truth_vault','MU_a3',NOW()-INTERVAL '3 hour'),
              (gen_random_uuid(),'00000000-0000-0000-0000-000000c10003'::uuid,
               '00000000-0000-0000-0000-00000000000b'::uuid,'positive','truth_vault','MU_b1',NOW()-INTERVAL '4 hour'),
              (gen_random_uuid(),'00000000-0000-0000-0000-000000c10003'::uuid,
               '00000000-0000-0000-0000-00000000000b'::uuid,'positive','truth_vault','MU_b2',NOW()-INTERVAL '5 hour'),
              (gen_random_uuid(),'00000000-0000-0000-0000-000000c10003'::uuid,
               '00000000-0000-0000-0000-00000000000b'::uuid,'positive','truth_vault','MU_b3',NOW()-INTERVAL '6 hour');
          DO $$
          DECLARE ra RECORD; rb RECORD; n_rows INT;
          BEGIN
              SELECT count(*) INTO n_rows
                FROM truth_vault.v_autowriter_positive_pool_saturation
               WHERE aw_project_id = '00000000-0000-0000-0000-000000aaaa03'::uuid;
              IF n_rows != 2 THEN
                  RAISE EXCEPTION 'expected one row per user (2), got % — view is not partitioned by user', n_rows;
              END IF;

              SELECT * INTO ra FROM truth_vault.v_autowriter_positive_pool_saturation
               WHERE aw_project_id = '00000000-0000-0000-0000-000000aaaa03'::uuid
                 AND pool_user_id = '00000000-0000-0000-0000-00000000000a'::uuid;
              SELECT * INTO rb FROM truth_vault.v_autowriter_positive_pool_saturation
               WHERE aw_project_id = '00000000-0000-0000-0000-000000aaaa03'::uuid
                 AND pool_user_id = '00000000-0000-0000-0000-00000000000b'::uuid;

              IF ra.active_positive_count != 3 OR ABS(ra.dominant_lever_ratio - 1.00) > 0.01 THEN
                  RAISE EXCEPTION 'user a pool wrong: pool=% ratio=% (expected 3 / 1.00 saturated)',
                      ra.active_positive_count, ra.dominant_lever_ratio;
              END IF;
              IF rb.active_positive_count != 3 OR ABS(rb.dominant_lever_ratio - 0.33) > 0.02 THEN
                  RAISE EXCEPTION 'user b pool wrong: pool=% ratio=% (expected 3 / 0.33 healthy)',
                      rb.active_positive_count, rb.dominant_lever_ratio;
              END IF;
              RAISE NOTICE 'v1_8 per-user partition OK (a=1.00 saturated, b=0.33 healthy; '
                           'mixing them would have reported 0.60 — a number neither user sees)';
          END $$;
          SQL
      - name: v1.8 rollback path actually works (codex review)
        # 本文件给视图追加了 4 列, 而 CREATE OR REPLACE VIEW 不能删列。
        # 后果不只是"回滚说明写错": 在已应用 v1_8 的库上【重跑基线
        # notes_v1_2_cross_schema_views.sql 会 ERROR: cannot drop columns from view】——
        # 而那个文件是按可重复执行设计的。所以 v1_8 改成了 DROP + CREATE,
        # 这一步把"回滚→再前滚"的整条路钉死, 免得以后有人改回 CREATE OR REPLACE。
        run: |
          set -e
          cols() {
            psql -tAc "SELECT count(*) FROM information_schema.columns
                        WHERE table_schema='truth_vault'
                          AND table_name='v_autowriter_positive_pool_saturation';" | tr -d ' '
          }
          [ "$(cols)" = "10" ] || { echo "前置状态应为 v1_8 的 10 列, 实际 $(cols)"; exit 1; }

          echo "— 回滚: DROP 后重跑基线, 应回到 6 列"
          psql -v ON_ERROR_STOP=1 -c "DROP VIEW IF EXISTS truth_vault.v_autowriter_positive_pool_saturation;"
          psql -v ON_ERROR_STOP=1 -f schemas/notes_v1_2_cross_schema_views.sql
          [ "$(cols)" = "6" ] || { echo "回滚后应为 6 列, 实际 $(cols)"; exit 1; }

          echo "— 再前滚: 重新应用 v1_8, 应回到 10 列"
          psql -v ON_ERROR_STOP=1 -f schemas/notes_v1_8_positive_pool_saturation_fix.sql
          [ "$(cols)" = "10" ] || { echo "再前滚后应为 10 列, 实际 $(cols)"; exit 1; }

          echo "— 反证: 不先 DROP 直接重跑基线【必须失败】"
          if psql -v ON_ERROR_STOP=1 -f schemas/notes_v1_2_cross_schema_views.sql 2>/dev/null; then
            echo "基线在 v1_8 之上竟然应用成功了 —— v1_8 大概被改回 CREATE OR REPLACE 了?"
            echo "(那样回滚路径和基线重跑都会静默留下错误的列集)"
            exit 1
          fi
          echo "  ok: 如预期报 cannot drop columns from view"

          echo "— 收尾: 恢复到 v1_8 状态供后续步骤使用"
          psql -v ON_ERROR_STOP=1 -c "DROP VIEW IF EXISTS truth_vault.v_autowriter_positive_pool_saturation;"
          psql -v ON_ERROR_STOP=1 -f schemas/notes_v1_2_cross_schema_views.sql
          psql -v ON_ERROR_STOP=1 -f schemas/notes_v1_8_positive_pool_saturation_fix.sql
          [ "$(cols)" = "10" ] || { echo "收尾后应为 10 列"; exit 1; }
          echo "v1_8 rollback round-trip OK"
