               '00000000-0000-0000-0000-00000000000a'::uuid,'positive','truth_vault','MU_a1',NOW()-INTERVAL '1 hour'),
              (gen_random_uuid(),'00000000-0000-0000-0000-000000c10003'::uuid,
               '00000000-0000-0000-0000-00000000000a'::uuid,'positive','truth_vault','MU_a2',NOW()-INTERVAL '2 hour'),
              (gen_random_uuid(),'00000000-0000-0000-0000-000000c10003'::uuid,
               '00000000-0000-0000-0000-00000000000a'::uuid,'positive','truth_vault','MU_a3',NOW()-INTERVAL '3 hour'),
              (gen_random_uuid(),'00000000-0000-0000-0000-000000c10003'::uuid,
               '00000000-0000-0000-0000-00000000000b'::uuid,'positive','truth_vault','MU_b1',NOW()-INTERVAL '4 hour'),
              (gen_random_uuid(),'00000000-0000-0000-0000-000000c10003'::uuid,
               '00000000-0000-0000-0000-00000000000b'::uuid,'positive','truth_vault','MU_b2',NOW()-INTERVAL '5 hour'),
              (gen_random_uuid(),'00000000-0000-0000-0000-000000c10003'::uuid,
               '00000000-0000-0000-0000-00000000000b'::uuid,'positive','truth_vault','MU_b3',NOW()-INTERVAL '6 hour');
          DO $$
