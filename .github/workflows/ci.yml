          psql -v ON_ERROR_STOP=1 -f schemas/notes_v1_11_evaluator_provenance.sql
      - name: Sanity-check v1.11 (unverified 可写 / 唯一索引覆盖同步三类且不误伤 persona / 回填能跑)
        run: |
          # ① 'unverified' 进了 CHECK —— 这是 TV-01 的核心: 来源未知 ≠ 人工
          psql -v ON_ERROR_STOP=1 -c "INSERT INTO truth_vault.prepublish_evaluations
            (autowriter_item_id, evaluator_type, decision)
            VALUES ('00000000-0000-0000-0000-0000000000aa','unverified','pass');"
          # ② 唯一索引不再只管 human, 但也【不是】全类型: 只覆盖本同步会写的三类。
          #    同一 item 的同一 unverified 必须被拒 —— 而 persona 多行必须仍然允许
          #    (第 19 步就造了同一 item 两条 persona, 扩到全类型会让建索引直接失败)。
          #    ⚠️ 用显式 if, 【不要】写成 `! cmd || (echo; exit 1)` —— 那个 exit 在子 shell 里,
          #    退的是子 shell 不是本步骤, 断言会变成空跑(本守卫第一版就是这么写的, 反证没红)。
          if psql -q -v ON_ERROR_STOP=1 -c "INSERT INTO truth_vault.prepublish_evaluations
              (autowriter_item_id, evaluator_type, decision)
              VALUES ('00000000-0000-0000-0000-0000000000aa','unverified','revise');" 2>/dev/null; then
            echo "❌ 重复的 (item, unverified) 被写进去了 —— 唯一索引没覆盖非 human 类型 (TV-01)"
            exit 1
          fi
          # ③ 不同类型仍可并存(人工评价 + 未来的 model critic)
          psql -v ON_ERROR_STOP=1 -c "INSERT INTO truth_vault.prepublish_evaluations
            (autowriter_item_id, evaluator_type, decision)
            VALUES ('00000000-0000-0000-0000-0000000000aa','model','pass');"
          # ④ 索引【不得】误伤 persona 这类"一条 item 多行"的合法用法。
          #    这正是第一版扩到全类型时 CI 炸掉的原因, 必须钉住。
          psql -v ON_ERROR_STOP=1 -c "INSERT INTO truth_vault.prepublish_evaluations
            (autowriter_item_id, evaluator_type, evaluator_id, decision) VALUES
            ('00000000-0000-0000-0000-0000000000ab','persona','p1','pass'),
            ('00000000-0000-0000-0000-0000000000ab','persona','p2','revise');" \
            || { echo "❌ 同一 item 的多条 persona 评价被索引挡住了 —— 那是合法用法"; exit 1; }
          # ④ 回填分支: 造一个 autowriter.items 让 DO 块真的走进回填, 而不是每次都走
          #    "跳过(CI 空库)" —— 写了分支就得有用例真的走进去。
          # ⚠️ 本步骤跑在「Apply integration migration packs」【之后】, 那时
          #    autowriter.items 已经是个 stub(id/status/example_label/user_id + 002/003 加的列),
          #    既【不是】我们要的形状, 也【没有】决策来源三列。所以:
          #      · CREATE 用 IF NOT EXISTS(已存在就是 no-op);
          #      · 三列用 ADD COLUMN IF NOT EXISTS 补上 —— 不补的话迁移会走"跳过"分支,
          #        下面的断言就永远测不到真正的回填逻辑(写了分支就得有用例真的走进去);
          #      · INSERT 必须【显式列名】, 位置插入会因为 stub 的列序/列数不同而错位或报错。
          psql -v ON_ERROR_STOP=1 -c "CREATE SCHEMA IF NOT EXISTS autowriter;
            CREATE TABLE IF NOT EXISTS autowriter.items (id UUID PRIMARY KEY, status TEXT,
              user_id UUID);
            ALTER TABLE autowriter.items ADD COLUMN IF NOT EXISTS decision_source TEXT;
            ALTER TABLE autowriter.items ADD COLUMN IF NOT EXISTS reviewer_id UUID;
            ALTER TABLE autowriter.items ADD COLUMN IF NOT EXISTS decided_at TIMESTAMPTZ;
            INSERT INTO autowriter.items (id, status, decision_source, reviewer_id, decided_at) VALUES
              ('00000000-0000-0000-0000-0000000000b1','approved',NULL,NULL,NULL),
              ('00000000-0000-0000-0000-0000000000b2','approved','auto_dedup',NULL,now()),
              ('00000000-0000-0000-0000-0000000000b3','approved','human',
               '00000000-0000-0000-0000-0000000000c9',now()),
              -- 没见过的新取值 / 空串: 同步脚本的 _provenance() 给的是 unverified,
              -- 回填必须给同一个答案(codex review P2: 旧版一律 rule_based, 两头打架)。
              ('00000000-0000-0000-0000-0000000000b4','approved','auto_v2_2027',NULL,now()),
              ('00000000-0000-0000-0000-0000000000b5','approved','   ',NULL,now()),
              -- 已经被写歪成 rule_based 的行, 再跑一次迁移必须能纠回来
              ('00000000-0000-0000-0000-0000000000b6','approved',NULL,NULL,NULL)
              ON CONFLICT DO NOTHING;
            INSERT INTO truth_vault.prepublish_evaluations
              (autowriter_item_id, evaluator_type, evaluator_id, decision) VALUES
              ('00000000-0000-0000-0000-0000000000b1','human','author-1','pass'),
              ('00000000-0000-0000-0000-0000000000b2','human','author-2','pass'),
              ('00000000-0000-0000-0000-0000000000b3','human','author-3','pass'),
              ('00000000-0000-0000-0000-0000000000b4','human','author-4','pass'),
              ('00000000-0000-0000-0000-0000000000b5','human','author-5','pass'),
              ('00000000-0000-0000-0000-0000000000b6','rule_based','auto_v2_2027','pass')
              ON CONFLICT DO NOTHING;"
          psql -v ON_ERROR_STOP=1 -f schemas/notes_v1_11_evaluator_provenance.sql
          # ⑤ 回填逐条对着 _provenance() 的口径验, 外加"能自愈"。
          #    用 evaluator_type||'/'||evaluator_id 一起验 —— 只验 type 的话,
          #    "类型对了但 evaluator_id 还留着作者"这种半拉子修复会蒙混过关。
          GOT=$(psql -v ON_ERROR_STOP=1 -t -A -c "SELECT string_agg(
              right(autowriter_item_id::text,2) ||'='|| evaluator_type
              ||'/'|| coalesce(evaluator_id,'-'), ' ' ORDER BY autowriter_item_id)
            FROM truth_vault.prepublish_evaluations
            WHERE autowriter_item_id IN (
              '00000000-0000-0000-0000-0000000000b1','00000000-0000-0000-0000-0000000000b2',
              '00000000-0000-0000-0000-0000000000b3','00000000-0000-0000-0000-0000000000b4',
              '00000000-0000-0000-0000-0000000000b5','00000000-0000-0000-0000-0000000000b6');")
          WANT="b1=unverified/- b2=rule_based/auto_dedup b3=human/00000000-0000-0000-0000-0000000000c9 b4=unverified/auto_v2_2027 b5=unverified/- b6=unverified/-"
          if [ "$GOT" != "$WANT" ]; then
            echo "❌ 回填口径与同步脚本 _provenance() 不一致。"
            echo "   期望: $WANT"
            echo "   实得: $GOT"
            echo "   (空→unverified/空 · 机器三种→rule_based/规则名 · human→reviewer ·"
            echo "    没见过的新取值→unverified 但留痕 · 空白串→unverified · 写歪的行要能自愈)"
            exit 1
          fi
          echo "✓ v1.11: unverified 可写, 唯一索引覆盖同步三类(persona 多行不受影响), 回填与 _provenance 同口径且可自愈"
