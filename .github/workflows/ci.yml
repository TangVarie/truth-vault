              END IF;
              IF r.active_positive_count != 2 OR r.native_positive_count != 2 THEN
                  RAISE EXCEPTION 'expected 2 native positives, got active=% native=%',
                      r.active_positive_count, r.native_positive_count;
              END IF;
              -- native 正例没有 external_source_id, join 不到 truth_vault.notes,
              -- 所以拿不到 lever。关键: ratio 必须是 NULL(测不了) 而不是 0(看起来健康)。
              IF r.lever_measurable_count != 0 THEN
                  RAISE EXCEPTION 'expected lever_measurable_count=0, got %', r.lever_measurable_count;
              END IF;
              -- 分母是可测条数; 一条都测不到时必须报 NULL。若这里返回 0,
              -- 脚本会把"没测到"显示成"多样性很好", 正是要避免的假阴性。
              IF r.dominant_lever_ratio IS NOT NULL THEN
