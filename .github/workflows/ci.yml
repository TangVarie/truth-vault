      - name: metric_snapshots hours_since_publish + window_label heuristic
        working-directory: scripts
        run: |
          python - <<'PY'
          # _derive_metric_window 把 publish_time → (hours_since_publish,
          # window_label) 的转换是后续做 Layer 4 时序分析的基础. 边界 case
          # 必须严丝合缝, 否则 metric_snapshots.window_label 会跟 CHECK
          # constraint 冲突或者落到 'ad_hoc' 兜底 (失去时序意义).
          from datetime import datetime, timedelta
          import sync_feishu_notes_to_truth_vault as s

          def at(delta):
              return (datetime.utcnow() - delta).isoformat(timespec="seconds")

          cases = [
              (at(timedelta(hours=1)),    "2h"),
              (at(timedelta(hours=12)),   "24h"),
              (at(timedelta(hours=48)),   "72h"),
              (at(timedelta(days=6)),     "7d"),
              (at(timedelta(days=13)),    "14d"),
              (at(timedelta(days=25)),    "30d"),
              (at(timedelta(days=60)),    "final"),
              (at(timedelta(days=400)),   "ad_hoc"),  # past 1y → ad_hoc
              (at(timedelta(hours=-1)),   "ad_hoc"),  # future → ad_hoc
              (None,                      "ad_hoc"),
              ("not a date",              "ad_hoc"),
          ]
          for pt, expected in cases:
              hrs, win = s._derive_metric_window(pt)
              assert win == expected, f"pt={pt!r} expected {expected}, got {win}"
          print(f"  ✓ all {len(cases)} hours-since-publish window cases pass")

          # COR-017: 同一时刻带 +08:00 与带 Z 的串必须落到同一个窗口。
          # 旧实现 .replace(tzinfo=None) 把 +08:00 的墙钟直接当 UTC 减, 同一瞬间
          # 会偏 8 小时。取 2 小时前: Z 串落在 "2h"(0-3h), 旧代码对 +08 串会算成
          # 负小时 → "ad_hoc"(未来), 新代码两者都是 "2h"。
          from datetime import timezone as _tz
          base = datetime.now(_tz.utc) - timedelta(hours=2)
          z_str = base.isoformat(timespec="seconds").replace("+00:00", "Z")
          plus8_str = base.astimezone(_tz(timedelta(hours=8))).isoformat(timespec="seconds")
          hz, wz = s._derive_metric_window(z_str)
          hp, wp = s._derive_metric_window(plus8_str)
          assert (wz, wp) == ("2h", "2h"), f"Z={wz} +08={wp}"
          assert hz == hp, f"同一时刻 Z={hz}h +08={hp}h 小时数不同"
          print("  ✓ 同一时刻 Z / +08:00 落在同一窗口 (COR-017)")
          PY
      - name: Autowriter injection diversity filter self-check (D-036)
        working-directory: scripts
        run: |
          python - <<'PY'
          # Diversity filter must:
          #   1. Prefer first-occurrence of each lever (top-score wins per lever)
          #   2. Fill remaining slots by score order if max_n not yet reached
          #   3. Degrade gracefully to plain top-N when essence unannotated
          #   4. Handle fewer-than-cap candidates without error
          import sync_truth_vault_baokuan_to_autowriter_items as s

          # Case A: 7 candidates, 3 distinct levers (焦虑/造梦/共鸣), max 5
          # Expected: n1(焦虑) n3(造梦) n5(共鸣) n2(焦虑) n4(焦虑)
          # n6/n7 don't make it (lever already saturated and quota full)
          A = [
              {"note_id": "n1", "emotional_lever": "焦虑撬动", "injection_score": 1.9},
              {"note_id": "n2", "emotional_lever": "焦虑撬动", "injection_score": 1.8},
              {"note_id": "n3", "emotional_lever": "造梦投射", "injection_score": 1.7},
              {"note_id": "n4", "emotional_lever": "焦虑撬动", "injection_score": 1.6},
              {"note_id": "n5", "emotional_lever": "共鸣释放", "injection_score": 1.5},
              {"note_id": "n6", "emotional_lever": "焦虑撬动", "injection_score": 1.4},
              {"note_id": "n7", "emotional_lever": "造梦投射", "injection_score": 1.3},
          ]
          got = [c["note_id"] for c in s.apply_diversity_filter(A, max_n=5, min_levers=3)]
          assert got == ["n1", "n3", "n5", "n2", "n4"], got
          print("  ✓ diverse pool: 3 distinct levers picked first, then fill by score")

          # Case B: essence unannotated everywhere → plain top-N by score
          B = [{"note_id": f"u{i}", "emotional_lever": None,
                "injection_score": 2.0 - i*0.1} for i in range(8)]
          got = [c["note_id"] for c in s.apply_diversity_filter(B, max_n=5)]
          assert got == ["u0", "u1", "u2", "u3", "u4"], got
          print("  ✓ unannotated essence: clean degrade to score-DESC top N")

          # Case C: dominant single lever — should still pick all from same lever
