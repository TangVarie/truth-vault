name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

jobs:
  python:
    name: Python syntax + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install scripts dependencies (from lockfile for reproducibility)
        run: |
          python -m pip install --upgrade pip
          # Prefer the lockfile so CI reproduces exactly what production runs.
          # requirements.txt is the high-level "what we depend on"; .lock is
          # "the resolved versions we tested against". If .lock drifts from
          # .txt (e.g. someone adds a new dep without regenerating), CI will
          # install stale versions for the new dep until lock is refreshed.
          if [ -f scripts/requirements.lock ]; then
            pip install -r scripts/requirements.lock
          else
            pip install -r scripts/requirements.txt
          fi
      - name: Compile all scripts
        run: |
          python -m py_compile \
            service_auth.py \
            scripts/_common.py \
            scripts/sync_feishu_notes_to_truth_vault.py \
            scripts/sync_comments_from_raw_extra.py \
            scripts/annotate_essence_pass.py \
            scripts/sync_truth_vault_baokuan_to_sanshengliubu.py \
            scripts/sync_truth_vault_baokuan_to_autowriter_items.py \
            scripts/extract_negative_examples_from_autowriter.py \
            scripts/check_flywheel_health.py \
            scripts/curate_flywheel_lessons.py \
            scripts/count_unannotated_essence.py \
            scripts/prune_librarian_cache.py \
            scripts/preflight_mapping.py \
            librarian/__init__.py \
            librarian/clients.py \
            librarian/core.py \
            librarian/cli.py \
            librarian/app.py \
            onboarder/__init__.py \
            onboarder/app.py \
            onboarder/batch.py \
            onboarder/cli.py \
            onboarder/clients.py \
            onboarder/core.py \
            onboarder/corpus.py \
            onboarder/links.py \
            onboarder/vocab.py \
            onboarder/eval_wtg.py \
            worker/__init__.py \
            worker/app.py \
            sanshengliubu-patches/import_truth_vault_baokuan.py
      - name: 本工作流里每个内联 python 块都有结束符 (防"守卫被静默吞掉")
        run: |
          python - <<'PY'
          # 这一步守的是**本文件自己**。
          #
          # 下面几十个 step 的内联自检长这样:
          #
          #     run: |
          #       python - <<'PY'      ← 开
          #       ...断言...
          #       PY                   ← 关
          #
          # 结束符掉了会怎样? bash 不会报错 —— 它只打一句 warning, 然后把
          # heredoc 一直读到脚本 EOF。所以**这一个块**照样跑。真正的危险有两
          # 层, 都很安静:
          #
          #   ① 之后往同一个 run 块里再追加任何命令, 都会被吞进上一段 python
          #      的源码里, 变成语法错误或者干脆不执行 —— 而不是"多跑一条";
          #   ② 任何靠"开-关配对"抽块来审计本工作流的工具(包括做审计
          #      时用的那种)会直接**看不见**这个块, 于是报"N 个块, 0 个失败",
          #      而 N 少了一个。守卫在统计里消失, 比守卫变红危险得多。
          #
          # ②就是这条 CI 步骤存在的原因: 2026-08-26 合并时发现 main 上
          # COR-008 那个块的结束符已经掉了一段时间, 是靠"块数没涨"才发现的。
          # 靠人数数不可靠, 所以钉进 CI。
          #
          # 判据是**配对**, 不是计数相等 —— 计数相等挡不住"A 少一个、B 多一个"。
          import pathlib
          import re
          import sys

          import yaml

          OPEN = re.compile(r"<<'PY'\s*$")
          path = pathlib.Path(".github/workflows/ci.yml")
          wf = yaml.safe_load(path.read_text(encoding="utf-8"))

          bad = []
          checked = 0
          for job_name, job in (wf.get("jobs") or {}).items():
              for idx, step in enumerate(job.get("steps") or []):
                  script = step.get("run")
                  if not script:
                      continue
                  where = f"{job_name} / {step.get('name') or f'step #{idx}'}"
                  lines = script.split("\n")
                  i = 0
                  while i < len(lines):
                      if OPEN.search(lines[i]):
                          checked += 1
                          start = i + 1
                          i += 1
                          while i < len(lines) and lines[i].strip() != "PY":
                              i += 1
                          if i >= len(lines):
                              bad.append(f"{where}: 第 {start} 行开的 heredoc 没有 PY 结束符")
                      i += 1

          if bad:
              print("以下内联块缺结束符 —— 后续命令会被吞进 python 源码, 且审计工具看不见它们:")
              for b in bad:
                  print("  ✗ " + b)
              sys.exit(1)

          assert checked > 20, f"只找到 {checked} 个内联块, 抽块逻辑八成坏了"
          print(f"  ✓ {checked} 个内联 python 块, 每个都有配对的 PY 结束符")
          PY

      - name: controlled vocab JSON ↔ docs/05 consistency (D-041)
        run: |
          python - <<'PY'
          # schemas/controlled_vocab_v0_2.json 是词表的【机器可读权威导出】。
          # 消费方(autowriter/deskcore 等)原样 vendor 它并记校验和, 不手抄 ——
          # 所以这份 JSON 一旦跟 docs/05 漂移, 下游全部跟着错, 而且是安静地错:
          # 发牌会抽到闭集外的值, 不报错、直接产出脏数据。
          #
          # ⚠️ 只比【集合大小】是不够的(codex review): 一个错别字或等长替换能原样
          # 通过。所以这里【逐值】比对 —— 解析 docs/05 每节表格第一列反引号里的值。
          import json, re, sys
          from onboarder import vocab as ov

          doc = open("docs/05-controlled-vocab.md", encoding="utf-8").read()
          data = json.load(open("schemas/controlled_vocab_v0_2.json", encoding="utf-8"))
          sets = data["sets"]
          bad = []

          # ── ① 逐值比对 docs/05 ──
          # docs/05 不成表格、因而无法解析的集合必须显式列在这里并写明理由,
          # 不允许静默跳过(静默跳过正是这次要修的毛病)。
          NOT_IN_DOC = {
              # tier_source 是 mapping 协议的概念, docs/05 没有它的章节;
              # 它已被下面 ② 的 onboarder/vocab.py 逐值比对覆盖。
              "tier_source",
          }

          def section_for(field):
              for part in re.split(r"\n(?=## )", doc):
                  if f"`{field}`" in part.split("\n", 1)[0]:
                      return part
              return None

          def doc_values(field):
              sec = section_for(field)
              if sec is None:
                  return None
              out, seen = [], set()
              for line in sec.splitlines():
                  m = re.match(r"^\|\s*`([^`]+)`", line)
                  if m and m.group(1).strip() not in seen:
                      seen.add(m.group(1).strip())
                      out.append(m.group(1).strip())
              return out or None

          for name, spec in sorted(sets.items()):
              js = list(spec["values"])
              dv = doc_values(name)
              if dv is None:
                  if name in NOT_IN_DOC:
                      print(f"  {name:24s} (docs/05 无此章节, 已在 NOT_IN_DOC 登记; 由 onboarder 比对覆盖)")
                  else:
                      bad.append(f"{name}: docs/05 里解析不到它的表格 —— 要么表格格式变了, "
                                 f"要么这个集合该登记进 NOT_IN_DOC 并写明理由")
                  continue
              # 比集合而非序列: 顺序在 docs/05 与 onboarder 之间本就不同(如 tier),
              # 而闭集的语义只关心成员。
              if set(dv) != set(js):
                  only_doc = sorted(set(dv) - set(js))
                  only_js = sorted(set(js) - set(dv))
                  bad.append(f"{name}: docs/05 独有={only_doc} JSON 独有={only_js}")
              else:
                  print(f"  {name:24s} ✓ 逐值一致 ({len(js)})")

          # ── ② 与 onboarder/vocab.py 重叠的组: 逐值【且保序】 ──
          overlap = {
              "content_format":  ov.CONTENT_FORMATS,
              "target_audience": ov.TARGET_AUDIENCES,
              "intent":          ov.INTENTS,
              "tier":            ov.TIERS,
              "tier_source":     ov.TIER_SOURCES,
              "category":        ov.CATEGORIES,
          }
          for name, expected in overlap.items():
              if tuple(sets[name]["values"]) != tuple(expected):
                  bad.append(f"{name}: JSON 与 onboarder/vocab.py 逐值不一致")

          # ── ③ 派生表完整性 ──
          levers = set(sets["emotional_lever"]["values"])
          if set(data["derivations"]["lever_to_valence"]) != levers:
              bad.append("lever_to_valence 没覆盖全部 emotional_lever")
          if not set(data["derivations"]["lever_to_valence"].values()) <= set(sets["emotional_valence"]["values"]):
              bad.append("lever_to_valence 派生出了闭集外的 valence")
          if sets["trend_dependencies"].get("exclusive_value") not in sets["trend_dependencies"]["values"]:
              bad.append("trend_dependencies.exclusive_value 不在其闭集内")

          # ── ④ surface 衰减规则 ↔ notes_v1_7 实现 ──
          # 半衰期【不是】逐值属性, 是按组合求值的规则。此前导出成逐值 tier 映射,
          # 把「平台话术」标成 2-3 年档、「行业事件」标成短期档 —— 而 v1_7 的注释
          # 明说这两个【不在】短期集、落 12 月默认档。下游照那个映射排序会把
          # 平台特定话术留得远超策略允许的时长。(codex review)
          sql = open("schemas/notes_v1_7_surface_three_tier_decay.sql", encoding="utf-8").read()
          decay = data["surface_decay"]
          short_json = set(decay["short_term_set"])
          m = re.search(r"ARRAY\[((?:'[^']+',?)+)\]::text\[\]", sql)
          if not m:
              bad.append("在 notes_v1_7 里找不到短期集的 ARRAY 字面量 —— SQL 结构变了?")
          else:
              short_sql = {x.strip().strip("'") for x in m.group(1).split(",") if x.strip()}
              if short_json != short_sql:
                  bad.append(f"short_term_set 与 notes_v1_7 不符: "
                             f"JSON 独有={sorted(short_json - short_sql)} "
                             f"SQL 独有={sorted(short_sql - short_json)}")
              else:
                  print(f"  short_term_set          ✓ 与 notes_v1_7 一致 ({len(short_sql)})")
          # 这两个必须【不在】短期集, 且没有被当成范式档
          for v in ("行业事件", "平台话术"):
              if v in short_json:
                  bad.append(f"{v} 不该在 short_term_set 里(v1_7: 落 12 月默认档)")
          months = {r["halflife_months"] for r in decay["rules_in_order"]}
          for want in (60, 30, 9, 12):
              if want not in months:
                  bad.append(f"surface_decay 规则缺少 {want} 月这一档(v1_7 有四档)")

          if bad:
              raise SystemExit("\n词表漂移:\n  - " + "\n  - ".join(bad))
          print("\ncontrolled vocab JSON in sync with docs/05 + notes_v1_7")
          PY
      - name: Comment parser unit tests
        working-directory: scripts
        run: |
          python - <<'PY'
          from sync_comments_from_raw_extra import parse_comment_text

          cases = [
              ("1. 用户A: 第一条\n2. 用户B: 第二条",
               [("素人", "第一条"), ("素人", "第二条")]),
              ("贴主: 谢谢姐妹\n素人小红: 好用吗",
               [("贴主", "谢谢姐妹"), ("素人", "好用吗")]),
              ("用户A | 第一条\n用户B | 第二条",
               [("素人", "第一条"), ("素人", "第二条")]),
              ("好用\n不好用",
               [("素人", "好用"), ("素人", "不好用")]),
              ("\n1.\n用户: 内容\n\n",
               [("素人", "内容")]),
              ("贴主:感谢",
               [("贴主", "感谢")]),
          ]
          failed = []
          for i, (text, expected) in enumerate(cases, 1):
              actual = list(parse_comment_text(text))
              if actual != expected:
                  failed.append((i, expected, actual))
                  print(f"  case {i}: FAIL\n    expected: {expected}\n    got:      {actual}")
              else:
                  print(f"  case {i}: ok")
          if failed:
              raise SystemExit(f"\n{len(failed)} parser test(s) failed")
          print(f"\n{len(cases)}/{len(cases)} passed")
          PY
      - name: 对账只在完整同步时盖戳, 且只报不删 (跨库审计 COR-011)
        working-directory: scripts
        run: |
          python - <<'PY'
          import inspect
          import sync_feishu_notes_to_truth_vault as M

          src = inspect.getsource(M.main)

          # ── ① 「完整同步」的判据必须同时排除三种情况 ──
          #
          # 这是这条改动里唯一会造成**不可逆**错误的地方: 把"这次没看见"
          # 当成"被删了"。--limit 会让循环中途 break; 多表合并里任何一张表
          # 抓失败, 那张表的记录也全都没看见。判据漏掉任何一个, 一次带
          # --limit 的手动同步就能把整个项目标成"消失"。
          assert "truncated_by_limit" in src, "没有记录 --limit 是否截断过"
          assert "fetch_failed" in src, "没有记录哪张飞书表抓失败了"
          assert "full_scan = (not truncated_by_limit) and (not fetch_failed)" in src, \
              "完整同步的判据不对 —— 必须同时排除 limit 截断和抓取失败"
          assert "if full_scan:" in src, "盖戳没有被 full_scan 守住"
          # codex review: 还要排除**逐条处理失败**。一条被 quarantine / transform_row
          # 抛错 / 缺必填的记录没被盖戳, 而它在飞书里明明还在 —— 上一轮盖过戳的话,
          # 这次会被报成"消失了"。对账报错一条就不如不报。
          assert "records_all_ok" in src, \
              "完整同步的判据没有排除逐条处理失败(quarantine / transform 抛错)"
          # 以及**写入失败**。戳是写入 payload 的一部分(必须先盖后写), 所以
          # stamping 那一步算不到 upsert 的失败, 得在对账那侧再挡一次。
          assert "writes_all_ok" in src, "没有挡住「note 没写成功」就去对账"
          print("  ✓ 判据排除 --limit / 抓取失败 / 逐条处理失败 / 写入失败")

          # ── ② 判据只算一次 ——「盖戳」和「对账」必须共用同一个 ──
          # 两处各判一次的话, 迟早出现"盖了戳但没对账"或者反过来。
          assert src.count("full_scan = ") == 1, "full_scan 被算了不止一次"
          print("  ✓ 盖戳与对账共用同一个判据(只算一次)")

          # ── ③ 只报不删 ──
          #
          # notes 有六张表 ON DELETE CASCADE, 另有 synced_to_ssll_at 标着
          # 已经推到三生六部(**另一个数据库**, 没有外键)的行。这个方向的
          # 错误不可逆, 所以对账那段里不许出现任何删除/状态变更。
          recon = src[src.index("对账: 这次完整扫描没见到的"):]
          for forbidden in (".delete(", '"is_deleted"', '"deleted_at"',
                            "tombstone", '.update({"tier"'):
              assert forbidden not in recon, \
                  f"对账里出现了 {forbidden!r} —— 这次刻意只报不删"
          print("  ✓ 对账段里没有任何删除 / 状态变更")

          # ── ④ 「从没经历过完整同步」不算「消失」 ──
          #
          # 迁移当天全库的 last_seen_run_id 都是 NULL。混在一起报的话, 第一
          # 份报告会把整个库列成"消失", 然后没有人会再看这个报告。
          assert "never_seen" in recon and "vanished" in recon, \
              "没有把「从没见过」和「消失了」分开"
          assert 'not r.get("last_seen_run_id")' in recon, "分开的判据不对"
          print("  ✓ 「从没经历过完整同步」与「消失了」分开报")

          # ── ⑤ 下游影响面要一起报 ──
          # 只躺在 TV 里的孤儿, 和已经推去三生六部当参考样本的孤儿, 处理
          # 起来完全是两件事。
          for col in ("synced_to_ssll_at", "synced_to_aw_at", "essence_annotated_at"):
              assert col in recon, f"对账没报 {col} —— 清理时不知道要先撤什么"
          # codex review: 经验卡也是下游, 而且是**最容易漏的那个** —— 它由
          # curate 脚本独立建, 不回写 note 上任何一列, 但 note_id 是 ON DELETE
          # CASCADE。只看 note 上那三个戳, 会把"删了会连带删掉一张馆员正在借阅
          # 的卡"报成"这条没有下游产物"。
          assert "flywheel_lesson_annotations" in recon, \
              "对账没查经验卡 —— 它 CASCADE 于 note, 删了会连带没"
          print("  ✓ 下游影响面含经验卡(CASCADE 于 note, 最容易漏的那个)")

          # ── ⑥ 主判据是 run_id 精确相等, 但 NULL 要算"不等于" ──
          #
          # ⚠️ 这条**改过**: 原来钉的是 `.neq("last_seen_run_id", run_id)`,
          #    而 PostgREST 的 neq 直译成 SQL 的 `<>` —— `NULL <> 'x'` 是
          #    unknown, WHERE 会把它滤掉。于是 last_seen_run_id 为 NULL 的老行
          #    **永远进不了 missing**, never_seen 恒为空, 而把"还没经历过完整
          #    同步"和"消失了"分开正是这个功能的一半。真库实测:
          #        WHERE last_seen_run_id <> 'run-1'             → 只有 stale
          #        WHERE last_seen_run_id IS DISTINCT FROM 'run-1' → legacy + stale
          #    (codex review)
          assert "last_seen_run_id.is.null" in recon, \
              "对账漏了 last_seen_run_id 为 NULL 的行 —— never_seen 会恒为空"
          assert "last_seen_run_id.neq." in recon, "主判据不再是 run_id 相等"
          print("  ✓ 主判据是 run_id, 且 NULL 也算「不是本次见到的」")

          # ── ⑦ 排掉并发同步盖的戳 ──
          # B 在 A 的「写完 → 查对账」窗口里把全库 run_id 覆盖成自己的, A 会把
          # **整个项目**报成消失, 而两次扫描其实都是完整的。(codex review)
          #
          # ⚠️ 判据要钉**那个比较**, 不能只钉变量名 `concurrent` —— 第一版就是
          #    `assert "concurrent" in recon`, 而把它改成 `concurrent = []` 之后
          #    名字还在, 断言照样绿。又一条只认名字不认行为的空转守卫。
          assert "run_started_at" in src, "没有记录本次开跑时刻"
          assert 'last_seen_at"] >= run_started_at' in recon, \
              "没有按「last_seen_at >= 本次开跑时刻」排除并发同步盖的戳"
          assert "missing = [r for r in missing" in recon, "排除结果没有作用回 missing"
          print("  ✓ 排除了并发同步盖的戳(按 last_seen_at >= 本次开跑时刻)")

          # ── ⑧ TIMESTAMPTZ 列要用带偏移的时间串 ──
          # last_seen_at 是 TIMESTAMPTZ; 给它 naive 串, Postgres 按**会话时区**
          # 解释再转 UTC —— 会话时区不是 UTC 时整体偏几小时, 且不报错。
          stamp = src[src.index("if full_scan:"):]
          assert "_iso_now_tz()" in stamp, \
              "last_seen_at(TIMESTAMPTZ)用了 naive 的 _iso_now() —— 会按会话时区偏移"
          print("  ✓ last_seen_at 用 _iso_now_tz()(带 +00:00)")

          # ── ⑨ 每一个被 upsert 写出去的列, 都得在首次部署清单里有来源 ──
          #
          # ⚠️ 这条是**部署契约**, 不是代码正确性: v1_9 给 notes 加了两列, 而
          #    scripts/README.md 的「第一次部署」Step 0 清单当时停在 v1_5。照文档
          #    部署出来的库上, **每一条 note 的 upsert 都会失败**(column does not
          #    exist) —— 不是降级, 是全挂。空库上实测过:
          #        跑到 v1_5 为止 → INSERT ... last_seen_at → column 不存在
          #        补上 v1_9      → 通过
          #    (codex review)
          #
          # 判据钉的是**被禁止的形态**: 脚本写了某列, 而清单里没有任何一条迁移
          # 提到它。以后再加列忘了写文档同样会红。
          import pathlib
          readme = pathlib.Path("README.md").read_text(encoding="utf-8")
          step0 = readme[readme.index("第一次部署"):readme.index("Step 1")]
          for col in ("last_seen_at", "last_seen_run_id"):
              assert col in src, f"脚本不再写 {col}? 那这条断言该改了"
          assert "notes_v1_9" in step0, (
              "v1_9 不在首次部署清单里 —— 照文档部署的库上每条 note upsert 都会"
              "失败(column does not exist)")
          print("  ✓ v1_9 在首次部署清单里(它是硬前置, 不是可选)")

          print("COR-011 自检通过")
          PY
      - name: 评论身份按内容而不是按位置 (跨库审计 COR-013)
        working-directory: scripts
        run: |
          python - <<'PY'
          import sync_comments_from_raw_extra as M

          # 源是运营手工粘贴的自由文本, **没有任何原生 comment id**, 所以原来
          # 拿"第几条"当身份: comment_id = f"{note_id}_c{ordinal}", 且只 insert
          # 不更新。运营在头部插一条, 实测后果:
          #     源 [A,B] → [X,A,B]
          #     _c1 已存在 → 跳过(X 就此丢失) · _c2 已存在 → 跳过
          #     _c3 = B → 当成新评论插进去
          # 新评论静默丢失 + 旧评论写成两条 + comment_order 全错。而随后的 LLM
          # 楼层重建会基于这些行写 parent_comment_id —— 层级建在错的数据上。

          # ⚠️ 假件必须模拟 PostgREST 的 **db-max-rows 静默钳位**(默认 1000)。
          #    不模拟的话, "读已有评论时忘了翻页"这类 bug 在测试里**永远看不见**
          #    —— 而它正是本仓审计反复出现的那一类(COR-006 / ROB-011)。
          #    insert 也按主键去重, 撞了就抛 —— 真库有 PRIMARY KEY (comment_id),
          #    假件不抛的话"重复 mint"会被写成两行而测试全绿。
          MAXROWS = 1000

          class _FakeSB:
              def __init__(s, rows=()):
                  s.rows=[dict(r) for r in rows]; s._op=None; s._eq=None; s._rng=None
              def schema(s,_): return s
              def table(s,n): return s
              def select(s,*a): s._op="select"; s._rng=None; return s
              def eq(s,k,v): s._eq=(k,v); return s
              def order(s,col): s._order=col; return s
              def range(s,a,b): s._rng=(a,b); return s
              def insert(s,rows):
                  ids={r["comment_id"] for r in s.rows}
                  for r in rows:
                      if r["comment_id"] in ids:
                          raise AssertionError(
                              f"主键冲突: {r['comment_id']} 已存在 —— "
                              "重复 mint 了一个已经占着的 id")
                      ids.add(r["comment_id"])
                  s.rows.extend(rows); s._op="insert"; return s
              def update(s,patch): s._op="update"; s._patch=patch; return s
              def execute(s):
                  if s._op=="select":
                      data=sorted((dict(r) for r in s.rows),
                                  key=lambda r: r.get(getattr(s,"_order","comment_id")) or "")
                      if s._rng is not None:
                          data=data[s._rng[0]:s._rng[1]+1]
                      # 服务端上限: 请求再大也只回这么多, 且**不报错**
                      return type("R",(),{"data":data[:MAXROWS]})()
                  if s._op=="update":
                      for r in s.rows:
                          if r["comment_id"]==s._eq[1]: r.update(s._patch)
                  return type("R",(),{"data":s.rows})()

          NOTE, PROJ = "p_note1", "p"

          # ── ① 头部插入: 新的要进去, 旧的不许重复, order 要跟上 ──
          sb = _FakeSB()
          M.write_comments(sb, NOTE, PROJ, [("素人","A"),("素人","B")], dry_run=False)
          M.write_comments(sb, NOTE, PROJ, [("素人","X"),("素人","A"),("素人","B")], dry_run=False)
          vals = [r["content"] for r in sb.rows]
          assert "X" in vals, "头部插入的新评论丢了"
          assert vals.count("B") == 1, f"B 被写了 {vals.count('B')} 遍"
          order = {r["content"]: r["comment_order"] for r in sb.rows}
          assert order == {"X":1,"A":2,"B":3}, f"comment_order 没跟上重排: {order}"
          print("  ✓ 头部插入: 新评论进库 · 无重复 · comment_order 正确")

          # ── ② 向后兼容: 老的 _c{n} 行必须被**认领**, 不许改名 ──
          #
          # comments.parent_comment_id 是自引用外键。给已有行改名 = 把已经
          # 重建好的楼层全打断, 而且改完之后再也对不回来。
          old = [
            {"comment_id":"p_note1_c1","content":"A","comment_role":"素人",
             "comment_order":1,"parent_comment_id":None},
            {"comment_id":"p_note1_c2","content":"B","comment_role":"素人",
             "comment_order":2,"parent_comment_id":"p_note1_c1"},
          ]
          sb = _FakeSB(old)
          M.write_comments(sb, NOTE, PROJ, [("素人","X"),("素人","A"),("素人","B")], dry_run=False)
          ids = {r["content"]: r["comment_id"] for r in sb.rows}
          assert ids["A"] == "p_note1_c1", f"老行 A 被改名成了 {ids['A']}"
          assert ids["B"] == "p_note1_c2", f"老行 B 被改名成了 {ids['B']}"
          b = next(r for r in sb.rows if r["content"]=="B")
          assert b["parent_comment_id"] == "p_note1_c1", "楼层链被打断了"
          assert len(sb.rows) == 3, f"行数不对(有重复?): {len(sb.rows)}"
          print("  ✓ 老的 _c{n} 行被认领而非改名, parent_comment_id 链完好")

          # ── ③ 重复内容不许互相吞 ──
          # "好用" "+1" 这种一模一样的评论在真实数据里很常见。
          sb = _FakeSB()
          M.write_comments(sb, NOTE, PROJ, [("素人","好用"),("素人","好用")], dry_run=False)
          assert len(sb.rows) == 2, f"两条一样的评论塌成了 {len(sb.rows)} 条"
          assert len({r["comment_id"] for r in sb.rows}) == 2, "id 撞了"
          # 重跑必须幂等 —— 不能又插两条
          M.write_comments(sb, NOTE, PROJ, [("素人","好用"),("素人","好用")], dry_run=False)
          assert len(sb.rows) == 2, f"重跑之后变成 {len(sb.rows)} 条"
          print("  ✓ 重复内容各自成行, 且重跑幂等")

          # ── ④ 纯重跑(源没变)不许有任何写入 ──
          sb = _FakeSB()
          M.write_comments(sb, NOTE, PROJ, [("素人","A"),("素人","B")], dry_run=False)
          before = [dict(r) for r in sb.rows]
          n = M.write_comments(sb, NOTE, PROJ, [("素人","A"),("素人","B")], dry_run=False)
          assert n == 0 and sb.rows == before, "源没变却写了东西"
          print("  ✓ 源没变时是干净的 no-op")

          # ── ⑤ 从源里消失的行: 只报不删(见 write_comments 的说明) ──
          sb = _FakeSB()
          M.write_comments(sb, NOTE, PROJ, [("素人","A"),("素人","B")], dry_run=False)
          M.write_comments(sb, NOTE, PROJ, [("素人","A")], dry_run=False)
          assert any(r["content"]=="B" for r in sb.rows), \
              "B 从源里消失就被删了 —— 本次刻意不做删除(comments 没有软删列)"
          print("  ✓ 从源里消失的行保留下来(仅告警), 没有静默删除")

          # ── ⑥ 已有评论超过 db-max-rows 时不许把它们当成"不存在" ──
          #
          # PostgREST 默认 max-rows=1000, 裸 .execute() 会被服务端**静默钳到
          # 1000**。一条爆款笔记的评论轻松过千。被钳掉的行在读取侧"不存在",
          # 于是它们对应的评论会被当成新评论去 mint id —— 而 id 是内容寻址的,
          # mint 出来的正好就是那几行**已经占着的主键** → PK 冲突, 这条 note
          # 的同步就此断掉。vanished 那份报告也会把它们全列成"消失了"。
          #
          # 这条正是本仓审计反复出现的那一类(COR-006 / ROB-011), 而同一个文件
          # 17 行之前的 fetch_notes_with_comments_text 已经在用 fetch_all_pages。
          BIG = [("素人", f"评论{i}") for i in range(MAXROWS + 200)]
          sb = _FakeSB()
          M.write_comments(sb, NOTE, PROJ, BIG, dry_run=False)
          assert len(sb.rows) == len(BIG), f"首轮就没写全: {len(sb.rows)}"
          # 重跑: 全部都该被认领, 一条都不该新插(insert 里的 PK 检查会当场抛)
          n = M.write_comments(sb, NOTE, PROJ, BIG, dry_run=False)
          assert n == 0, f"超过 max-rows 的那些被当成新评论了: 又插了 {n} 条"
          assert len(sb.rows) == len(BIG), f"行数变了: {len(sb.rows)}"
          print(f"  ✓ {len(BIG)} 条(> max-rows {MAXROWS}) 重跑仍是 no-op —— 读取侧翻页了")

          # 读取路径必须走 fetch_all_pages。判据是**被禁止的形态**: 不许再有
          # 裸的 .execute() 直接喂给 existing_comments 的返回。
          import ast, inspect
          src = inspect.getsource(M.existing_comments)
          assert "fetch_all_pages" in src, \
              "existing_comments 没走 fetch_all_pages —— 超过 1000 条就静默截断"
          print("  ✓ existing_comments 走 fetch_all_pages")

          # ══ codex review 四条 ══════════════════════════════════════════

          # ⑦ 重复内容中间被硬删之后, 补的那条不许撞主键
          #
          # _1/_2/_3 都在, 有人删掉 _2, 而源里仍是三次出现 —— 配对认领 _1 和 _3
          # (仅存的两行), 第三次出现若按"源里第几次"算 nth=3, mint 出来正好是
          # 已经被认领的 _3 → 整批 insert 撞主键, 那条缺的反而补不回来。
          sb = _FakeSB()
          M.write_comments(sb, NOTE, PROJ, [("素人","好用")]*3, dry_run=False)
          mid = sorted(r["comment_id"] for r in sb.rows)[1]
          sb.rows = [r for r in sb.rows if r["comment_id"] != mid]   # 硬删中间那条
          n = M.write_comments(sb, NOTE, PROJ, [("素人","好用")]*3, dry_run=False)
          assert n == 1, f"该补回 1 条, 实际 {n}"
          assert len(sb.rows) == 3, f"补完应有 3 条, 实际 {len(sb.rows)}"
          assert len({r["comment_id"] for r in sb.rows}) == 3, "id 撞了"
          print("  ✓ 重复内容中间被硬删: 补回一条, 不撞主键")

          # ⑧ dry-run 必须真的读已有行
          #
          # 强行置空的话, 已经同步过的 note 在 dry-run 下会报一堆并不会发生的
          # insert, 而重排 / 消失这两份报告永远为空。预览失真比没有预览更坏。
          sb = _FakeSB()
          M.write_comments(sb, NOTE, PROJ, [("素人","A"),("素人","B")], dry_run=False)
          n = M.write_comments(sb, NOTE, PROJ, [("素人","A"),("素人","B")], dry_run=True)
          assert n == 0, f"dry-run 把已同步的 note 报成要插 {n} 条"
          print("  ✓ dry-run 读已有行, 不虚报 insert")

          # ⑨ comment_order 更新失败要让整次运行失败
          #
          # 原来只 logger.exception 就接着插新行、照常返回成功, 而 daily-sync 只看
          # 退出码 —— 新行进库、旧行留着错的顺序、工作流全绿、没人被通知。
          # 与 COR-008(指标写失败不计进 exit code)同一个形状。
          class _UpdateFails(_FakeSB):
              def execute(s):
                  if s._op == "update":
                      raise RuntimeError("PostgREST 503")
                  return _FakeSB.execute(s)
          sb = _UpdateFails()
          M.write_comments(sb, NOTE, PROJ, [("素人","A"),("素人","B")], dry_run=False)
          try:
              M.write_comments(sb, NOTE, PROJ,
                               [("素人","X"),("素人","A"),("素人","B")], dry_run=False)
              raise AssertionError("comment_order 更新失败却报了成功")
          except RuntimeError as e:
              assert "comment_order" in str(e), e
          print("  ✓ comment_order 更新失败 → 抛错(退出码非 0), 不静默继续")

          # ⑩ 整块源文本被清空的 note 要被报出来
          #
          # write_comments 的 vanished 只看得见**部分**消失。全清时这条 note 会被
          # fetch_notes_with_comments_text 滤掉、write_comments 又对空解析早返回
          # —— 整条 note 的评论全留在库里, 一句话都不说。判据放在 main 的对账上。
          import inspect
          msrc = inspect.getsource(M.main)
          assert "notes_source_cleared" in msrc, "main 里没有「源被清空」对账"
          # ⚠️ 判据要钉**那一个**闸, 不能钉 "if args.limit:" —— main 里有**两处**
          #    args.limit(前面还有 `notes = notes[:args.limit]`), find() 命中的是
          #    靠前那个, 于是把对账的闸整个拆掉这条断言照样绿。第一版就是这么写的,
          #    靠"新断言必须先红"才发现它在空转。改成钉这一处独有的跳过文案。
          i_guard = msrc.find("跳过「源被清空」对账")
          i_query = msrc.find("with_rows")
          assert i_guard >= 0, "对账没有 --limit 的闸"
          assert i_guard < i_query, (
              "闸排在对账查询后面 —— 部分扫描时 covered 本来就不全, "
              "拿它比会把没轮到处理的 note 全误报成「源被清空」")
          print("  ✓ main 有「源被清空」对账, 且 --limit 时先跳过")

          print("COR-013 自检通过")
          PY

      - name: Essence vocab validator self-check
        working-directory: scripts
        run: |
          python - <<'PY'
          import annotate_essence_pass as a
          # Sanity: vocab sets are non-empty + match expected sizes from
          # docs/05-controlled-vocab.md v0.2.
          assert len(a.EMOTIONAL_LEVERS) == 12, f"levers: {len(a.EMOTIONAL_LEVERS)}"
          assert len(a.HUMAN_TRUTH_ARCHETYPES) == 19, f"archetypes: {len(a.HUMAN_TRUTH_ARCHETYPES)}"
          assert len(a.TREND_DEPENDENCIES) == 10, f"deps: {len(a.TREND_DEPENDENCIES)}"
          assert len(a.CONTENT_FORMATS) == 8, f"formats: {len(a.CONTENT_FORMATS)}"

          # Negative case: lever / valence mismatch
          bad = {"essence": {
              "emotional_lever": "焦虑撬动", "emotional_valence": "positive",
              "emotional_intensity": "high",
              "human_truth_archetype": ["健康焦虑"],
              "trend_dependencies": ["通用"],
              "content_format": "情感叙事",
          }}
          errs = a.validate_essence(bad)
          assert any("negative but valence=positive" in e for e in errs), errs

          # Negative case: 通用 must be exclusive
          bad2 = {"essence": {
              "emotional_lever": "焦虑撬动", "emotional_valence": "negative",
              "emotional_intensity": "high",
              "human_truth_archetype": ["健康焦虑"],
              "trend_dependencies": ["通用", "当代流行词"],
              "content_format": "情感叙事",
          }}
          errs = a.validate_essence(bad2)
          assert any("通用" in e for e in errs), errs

          # Positive case: clean valid record
          good = {"essence": {
              "emotional_lever": "焦虑撬动", "emotional_valence": "negative",
              "emotional_intensity": "high",
              "human_truth_archetype": ["健康焦虑", "育儿焦虑"],
              "trend_dependencies": ["平台话术"],
              "content_format": "情感叙事",
          }}
          assert a.validate_essence(good) == [], a.validate_essence(good)
          print("vocab validator self-check OK")
          PY
      - name: Essence annotator retry + failed_queue self-check
        working-directory: scripts
        run: |
          python - <<'PY'
          import tempfile, json
          from pathlib import Path
          import annotate_essence_pass as a

          # 1. build_retry_prompt embeds errors and the prior raw response
          orig = "Original prompt"
          raw = '{"bad": "json"}'
          retry = a.build_retry_prompt(orig, raw, ["err_a", "err_b"])
          assert "err_a" in retry and "err_b" in retry and raw in retry
          print("  ✓ build_retry_prompt embeds context")

          # 2. _annotate_with_retry: validation fails first, succeeds second
          calls = []
          good_payload = ('{"essence":{"emotional_lever":"焦虑撬动",'
                          '"emotional_valence":"negative","emotional_intensity":"high",'
                          '"human_truth_archetype":["健康焦虑"],'
                          '"trend_dependencies":["平台话术"],"content_format":"情感叙事"},'
                          '"audience":{}}')
          bad_valence = ('{"essence":{"emotional_lever":"焦虑撬动",'
                         '"emotional_valence":"positive","emotional_intensity":"high",'
                         '"human_truth_archetype":["健康焦虑"],'
                         '"trend_dependencies":["平台话术"],"content_format":"情感叙事"},'
                         '"audience":{}}')

          a.call_claude = lambda p, m: (calls.append(p), bad_valence if len(calls) == 1 else good_payload)[1]
          parsed, errs, _, used_retry = a._annotate_with_retry("test", "fake")
          assert parsed is not None and parsed["essence"]["emotional_valence"] == "negative"
          assert len(calls) == 2
          assert used_retry is True, "used_retry should be True after a retry"
          print("  ✓ retry recovers after first-attempt validation failure")

          # 3. Both attempts fail → None
          calls.clear()
          a.call_claude = lambda p, m: (calls.append(p), bad_valence)[1]
          parsed, errs, _, used_retry = a._annotate_with_retry("test", "fake")
          assert parsed is None
          assert used_retry is True
          assert any("emotional_lever" in e or "valence" in e for e in errs), errs
          print("  ✓ returns None when both attempts fail")

          # 4. First attempt returns non-JSON → JSON parse failure → retry succeeds
          calls.clear()
          a.call_claude = lambda p, m: (calls.append(p), "not json" if len(calls) == 1 else good_payload)[1]
          parsed, errs, _, used_retry = a._annotate_with_retry("test", "fake")
          assert parsed is not None
          assert used_retry is True
          print("  ✓ retry recovers from initial JSON parse failure")

          # 4b. First attempt succeeds → used_retry False
          calls.clear()
          a.call_claude = lambda p, m: (calls.append(p), good_payload)[1]
          parsed, errs, _, used_retry = a._annotate_with_retry("test", "fake")
          assert parsed is not None
          assert used_retry is False, "used_retry should be False on a first-shot win"
          assert len(calls) == 1
          print("  ✓ first-shot success records used_retry=False")

          # 5. failed_queue writes valid JSONL
          with tempfile.NamedTemporaryFile(delete=False, suffix=".jsonl", mode="w") as f:
              p = Path(f.name)
          try:
              a._append_failed_queue(p, {"note_id": "N1"}, "P1", ["e1"], "raw")
              a._append_failed_queue(p, {"note_id": "N2"}, "P1", ["e2"], "raw2")
              lines = p.read_text(encoding="utf-8").strip().split("\n")
              assert len(lines) == 2
              r = json.loads(lines[0])
              assert r["note_id"] == "N1" and "attempted_at" in r
          finally:
              p.unlink(missing_ok=True)
          print("  ✓ failed_queue writes valid JSONL")
          print("\nannotate_essence retry + failed_queue: all 5 checks passed")
          PY
      - name: Essence pass exit-code tolerance self-check (单条抽风不拖红 daily-sync)
        working-directory: scripts
        run: |
          python - <<'PY'
          # 回归: NUC_1 首跑 45 条 essence 里 1 条 LLM 抽风(failed_after_retry=1)就让
          # worker 返回 ok=false → 整条 daily-sync 红 + 发邮件。失败行幂等(下轮续标), 不该
          # 拖红。对齐 curate #56「仅全军覆没才判失败」。但 hygiene_failed(label-leakage
          # 卫生断言漂移, D-017/D-028)是系统性 → 任意一条都红。
          import annotate_essence_pass as a
          f = a._exit_code_for_stats

          # 零星单条抽风(NUC_1 批3 实况 ok=14/failed=1)→ 容忍, 返回 0
          assert f({"ok": 14, "failed_after_retry": 1, "hygiene_failed": 0}) == 0
          print("  ✓ 零星 failed_after_retry(ok>0)容忍 → 0")
          # 纯校验抽风(坏 JSON/越界词表, 无 systemic_failed)即便 ok==0 也容忍 → 0(幂等续标)。
          # 修 #55 误判红:近乎标完的项目只剩 1 条卡壳笔记 → 批 ok=0, 但只是单条内容抽风、非系统性。
          assert f({"ok": 0, "failed_after_retry": 1, "hygiene_failed": 0}) == 0
          assert f({"ok": 0, "failed_after_retry": 5, "hygiene_failed": 0}) == 0
          print("  ✓ 纯校验失败(ok==0, 无 systemic_failed)容忍 → 0(修 #55 误判红)")
          # 系统性失败(api_error 或 write_rejected)且无任何成功 → 红(保留 #56 本意)
          assert f({"ok": 0, "failed_after_retry": 5, "systemic_failed": 5, "hygiene_failed": 0}) == 1
          # 所有笔记都被 write_essence_back 拒绝(payload/schema 回归)→ systemic_failed>0 且 ok==0 → 红
