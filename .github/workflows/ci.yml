          # 两边都算"没处理成"。没认领的照样红 —— 行为由 D-053 那个驱动 main() 的 guard 兜底。
          assert 'reason=inh_reason' in src and '_count_quarantined(' in src.split("reason=inh_reason", 1)[1][:400], "判不了必须隔离且走计数"
          # 继承后的行: platform 覆写 + 双留痕
          assert 'note["platform"] = inherit_spec["platform_override"]' in src
          assert '"_content_inherited_from"' in src and '"content_inherited"' in src
          print("  ✓ 只看挨不挨着: 上一条小红书→沿用(素人编号无关); 上一条抖音→判不了点名; 空行→点名; 留痕+platform")

          # ③ ssll: 平台先看笔记自己的 —— 继承来的抖音行是 douyin, 项目是小红书
          src2 = pathlib.Path("sync_truth_vault_baokuan_to_sanshengliubu.py").read_text(encoding="utf-8")
          assert 'note.get("platform") or proj.get("platform")' in src2
          assert 'proj.get("platform") or note.get("platform")' not in src2, "又改回先看项目了"
          assert ssll._platform_for_ssll("douyin") == "抖音"
          # codex review on #122: 优先级翻了但 fetch_pending_baokuan 的 select 没选 note 级 platform,
          # note.get("platform") 永远 None → 等于没翻。把 select 字符串从源码里抠出来, 去掉
          # projects(...) 那个嵌套组, 断言顶层列里有 platform。
          fn = src2.split("def fetch_pending_baokuan", 1)[1].split("def ", 1)[0]
          # 字符串字面量里有 projects(...) 的括号, 所以按「连续的 "..." 字面量」抓, 不按括号抓
          sel = re.search(r'\.select\(((?:\s*"[^"]*"\s*)+)\)', fn, re.S).group(1)
          sel_flat = " ".join(re.findall(r'"([^"]*)"', sel))
          top = re.sub(r"projects\([^)]*\)", "", sel_flat)
          cols = [c.strip() for c in top.split(",") if c.strip()]
          assert "platform" in cols, f"fetch_pending_baokuan 的 select 没选 note 级 platform: {cols}"
          # 功能断言: note 是 douyin、项目是 xiaohongshu → 推给 ssll 的是「抖音」
          note = {
                        "note_id": "TST_P_rec1",
                        "project_id": "TST_P",
                        "raw_content": "title line\nbody continues",
                        "tier": "爆",
                        "intent": "traffic",
                        "publish_url": "https://example.com/x",
                        "target_audience": ["20-29"],
                        "hit_blue_keywords": ["k1"],
                        "platform": "xiaohongshu",
                        "projects": {"brand": "TST", "category": "保健品", "platform": "xiaohongshu"},
