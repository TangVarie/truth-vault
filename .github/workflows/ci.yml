              {"id": "i-done",    "status": "approved", "user_id": "u", "created_at": "2026-09-01",
               "decision_source": "human", "reviewer_id": "rev-1"},
              {"id": "i-stale",   "status": "approved", "user_id": "u", "created_at": "2026-09-01",
               "decision_source": "auto_dedup"},
              # AW 改口径: 已归档成 rule_based/auto_dedup, 现在 AW 说是人审
