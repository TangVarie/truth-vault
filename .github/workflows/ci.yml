            ('CI_D062_v_over',   'CI_D062', 'c', '爆',     '状态字段', 49),
            ('CI_D062_v_ok50',   'CI_D062', 'c', '爆',     '状态字段', 50),
            ('CI_D062_v_soft',   'CI_D062', 'c', '大爆',   '状态字段', 99),
            ('CI_D062_v_ok100',  'CI_D062', 'c', '大爆',   '状态字段', 100),
            ('CI_D062_v_under',  'CI_D062', 'c', '趴',     '状态字段', 50),
            ('CI_D062_v_under2', 'CI_D062', 'c', '评估中', '状态字段', 100),
            ('CI_D062_v_infer',  'CI_D062', 'c', '爆',     '数值推断', 10),
            ('CI_D062_v_nocc',   'CI_D062', 'c', '爆',     '状态字段', NULL);
