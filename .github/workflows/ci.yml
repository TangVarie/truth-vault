          # A: 空池 → 0, 且不能再打老版本那句 "No active positive examples"
          rc, out = run([])
          assert rc == 0, rc
          assert "external_source" in out, out
          print("  ✓ 空结果 → exit 0, 且说明里点名了老盲点")

          # B: 全部测全且健康 → 0。这一条就是当年 NameError 的触发条件:
          #    只要 view 回了任何一行就会崩。
          rc, out = run([row()])
          assert rc == 0, (rc, out)
          assert "All 1 pool(s) measured" in out, out
          print("  ✓ 测全且健康 → exit 0 (渲染循环真的跑通了)")

          # C: 饱和 → 1
          rc, out = run([row(distinct_lever_count=1, top_lever_count=5,
                             dominant_lever_ratio=1.0)])
          assert rc == 1, (rc, out)
          assert "SATURATED" in out, out
          print("  ✓ 饱和 → exit 1")

          # D: 一条都测不到(ratio NULL, 计数列全 NULL) → 2, 不能显示成 ok
          rc, out = run([row(lever_measurable_count=None, distinct_lever_count=None,
                             top_lever_count=0, dominant_lever_ratio=None)])
          assert rc == 2, (rc, out)
          assert "无法评估" in out and "ok" not in out.split("status")[1], out
          assert "n/a" in out, out
          print("  ✓ 全不可测 → exit 2, 且 NULL 计数列不炸 f-string")

          # E: 【部分】可测 —— 5 条里 2 条能测、那 2 条恰好很分散。
          #    ratio 好看, 但另外 3 条完全未知 ⇒ 必须 2 而不是 0。
          #    这是 round-2 引入、round-4 才发现没落到循环里的那条判据。
          rc, out = run([row(lever_measurable_count=2, distinct_lever_count=2,
                             top_lever_count=1, dominant_lever_ratio=0.5)])
          assert rc == 2, (rc, out)
          assert "仅 2/5 条可测" in out, out
          print("  ✓ 部分可测(2/5)且 ratio 好看 → 仍是 exit 2, 不许报健康")

          # F: 饱和优先于没测全 —— 确实测出饱和了就得是 1(可行动) 而不是 2(没数据)
          rc, out = run([row(lever_measurable_count=3, dominant_lever_ratio=1.0,
                             distinct_lever_count=1, top_lever_count=3),
                         row(aw_project_id="33333333-3333-3333-3333-333333333333",
                             lever_measurable_count=1, dominant_lever_ratio=None)])
          assert rc == 1, (rc, out)
          print("  ✓ 同时饱和+没测全 → exit 1 优先(饱和是可行动的)")

          # G: pool_user_id 为 NULL(历史无归属正例) 不能炸, 且要打 "(无归属)"
          rc, out = run([row(pool_user_id=None)])
          assert rc == 0 and "(无归属)" in out, (rc, out)
          print("  ✓ pool_user_id NULL → 打 (无归属), 不炸")

          # H: 行级判据必须和汇总判据一致 —— 任何一行标了"无法评估", 退出码
          #    就不能是 0。round-4 那次错就错在两边判据不同步。
          for kw in ({"dominant_lever_ratio": None},
