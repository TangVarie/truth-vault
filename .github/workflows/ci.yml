      - name: Apply security revoke (anon/authenticated write on public.v_dash_*) (+ idempotency)
        # 纵深防御: 撤 anon/authenticated 对看板视图的写权限(SELECT 保留, 看板服务端要读)。
        # 这些视图今天是聚合视图、PG 重写阶段就拒写, 所以撤的是【未来某天有人加了
        # 单表直通视图会自动继承的】权限 —— 见 SQL 文件头。REVOKE 幂等, 两遍验。
        run: |
          psql -v ON_ERROR_STOP=1 -f schemas/security_revoke_anon_write_dash_views.sql
          psql -v ON_ERROR_STOP=1 -f schemas/security_revoke_anon_write_dash_views.sql
      - name: Sanity-check revoke (v_dash_* 无 anon 写权限 · 且仍可读)
        # 在裸 PG 上先造出 anon/authenticated 角色并【故意 GRANT ALL】(复现 Supabase
        # 建库默认), 再跑一遍 REVOKE, 断言写权限确实没了、SELECT 还在。
        # 不造角色的话上面那步在 CI 里是 no-op —— 那就等于没测。
        run: |
          psql -v ON_ERROR_STOP=1 -c "DO \$\$ BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='anon') THEN CREATE ROLE anon; END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='authenticated') THEN CREATE ROLE authenticated; END IF;
          END \$\$;"
          psql -v ON_ERROR_STOP=1 -c "GRANT ALL ON public.v_dash_overview TO anon, authenticated;"
          psql -v ON_ERROR_STOP=1 -c "SELECT has_table_privilege('anon','public.v_dash_overview','INSERT') AS must_be_true;" \
            | grep -q ' t$' || { echo '前置 GRANT 没生效, 后面的断言就成了假阳性'; exit 1; }
          psql -v ON_ERROR_STOP=1 -f schemas/security_revoke_anon_write_dash_views.sql
          for role in anon authenticated; do
            for priv in INSERT UPDATE DELETE TRUNCATE; do
              got=$(psql -tAX -v ON_ERROR_STOP=1 -c \
                "SELECT has_table_privilege('$role','public.v_dash_overview','$priv');")
              [ "$got" = "f" ] || { echo "::error::$role 仍有 $priv on v_dash_overview"; exit 1; }
            done
            got=$(psql -tAX -v ON_ERROR_STOP=1 -c \
              "SELECT has_table_privilege('$role','public.v_dash_overview','SELECT');")
            [ "$got" = "t" ] || { echo "::error::$role 的 SELECT 被误撤 —— 看板会瞎"; exit 1; }
          done
          echo "  ✓ anon/authenticated: 写权限已撤 · SELECT 保留"
      - name: Sanity-check revoke · 证明这条路径【真的能写穿】(不是假想)
        # 本文件防的是"将来有人加了单表直通的 v_dash_* 视图"。这里就地造一个,
        # 证明: (a) 有权限时 anon 确实能经视图把行写进底表; (b) 跑完 REVOKE 就写不进了。
        # 不做这一步的话, 上面的 has_table_privilege 断言只证明"权限位变了",
        # 证明不了"变了这件事有意义"。
        run: |
          # 先清干净再建: 用 IF NOT EXISTS 的话, 这一步万一被跑第二遍, 底表里会留着
          # 上一轮的 id=42, 下面的 count=1 断言就变成看执行次数而不是看行为。
          psql -v ON_ERROR_STOP=1 -c "
            DROP VIEW IF EXISTS public.v_dash_probe;
            DROP TABLE IF EXISTS public._revoke_probe;
            CREATE TABLE public._revoke_probe(id int, n int);
            CREATE VIEW public.v_dash_probe AS SELECT id, n FROM public._revoke_probe;
            GRANT USAGE ON SCHEMA public TO anon;
            GRANT SELECT, INSERT ON public.v_dash_probe TO anon;
            GRANT SELECT, INSERT ON public._revoke_probe TO anon;"
          # 前提: 单表直通视图确实是 auto-updatable(否则整个担心不成立)
          got=$(psql -tAX -c "SELECT is_insertable_into FROM information_schema.views WHERE table_name='v_dash_probe';")
          [ "$got" = "YES" ] || { echo "::error::v_dash_probe 不是 auto-updatable, 探针失效"; exit 1; }
          # (a) REVOKE 前: 写得进
          PGOPTIONS='-c role=anon' psql -v ON_ERROR_STOP=1 -c "INSERT INTO public.v_dash_probe(id,n) VALUES (42,99);"
          got=$(psql -tAX -c "SELECT count(*) FROM public._revoke_probe WHERE id=42;")
          [ "$got" = "1" ] || { echo "::error::探针没写进去, 后面的对比就没意义了"; exit 1; }
          echo "  ✓ REVOKE 前: anon 经单表直通视图把行写进了底表"
          # (b) REVOKE 后: 写不进
          psql -v ON_ERROR_STOP=1 -f schemas/security_revoke_anon_write_dash_views.sql
          if PGOPTIONS='-c role=anon' psql -v ON_ERROR_STOP=1 -c "INSERT INTO public.v_dash_probe(id,n) VALUES (43,99);" 2>/dev/null; then
            echo "::error::REVOKE 后 anon 仍能经视图写入"; exit 1
          fi
          got=$(psql -tAX -c "SELECT count(*) FROM public._revoke_probe WHERE id=43;")
          [ "$got" = "0" ] || { echo "::error::第二次写居然落库了"; exit 1; }
          # ⚠️ 不能写成 psql -tAX -c "SET ROLE anon; SELECT ..." —— psql 会把 SET 的
          #    状态标签也打到 stdout, 结果是 "SET\n1" 而不是 "1", 断言假红。
          #    用 PGOPTIONS 在连接时设角色, -c 里只留那一条 SELECT。
          got=$(PGOPTIONS='-c role=anon' psql -tAX -c "SELECT count(*) FROM public.v_dash_probe;")
          [ "$got" = "1" ] || { echo "::error::anon 读也被撤了 —— 看板会瞎 (got=$got)"; exit 1; }
          echo "  ✓ REVOKE 后: 写被拒 · 读仍正常"
          psql -v ON_ERROR_STOP=1 -c "DROP VIEW public.v_dash_probe; DROP TABLE public._revoke_probe;"

  yaml:
    name: Mapping yaml lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pyyaml
        run: pip install pyyaml
      - name: Validate every mappings/*.yaml parses + has required keys
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          import yaml

          REQUIRED = {"project_id", "field_mapping"}
          rc = 0
          for f in Path("mappings").glob("*.yaml"):
              if f.name == "_template.yaml":
                  continue
              try:
                  data = yaml.safe_load(f.read_text(encoding="utf-8"))
              except yaml.YAMLError as exc:
                  print(f"{f}: YAML parse error: {exc}")
                  rc = 1
                  continue
              missing = REQUIRED - set(data.keys())
              if missing:
                  print(f"{f}: missing required keys: {missing}")
                  rc = 1
              if data.get("project_id") != f.stem:
                  print(f"{f}: project_id={data.get('project_id')!r} doesn't match filename")
                  rc = 1
              print(f"{f}: OK")
          sys.exit(rc)
          PY
