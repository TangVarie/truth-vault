          for c in candidates:
              by_project.setdefault(c["aw_project_id"], []).append(c)
          selected = []
          for proj, pool in by_project.items():
              pool.sort(key=lambda r: r["injection_score"], reverse=True)
              picks = s.apply_diversity_filter(pool, max_n=5)
              selected.extend(picks)

          # Old global-cap would have given: 5 from A only (since A has all
          # the top scores). New per-project gives: 5 from A + 3 from B + 1 from C = 9
          picked_per_project = {}
          for c in selected:
              picked_per_project[c["aw_project_id"]] = picked_per_project.get(c["aw_project_id"], 0) + 1
          assert picked_per_project == {"A": 5, "B": 3, "C": 1}, picked_per_project
          print(f"  ✓ per-project picks: {picked_per_project} (no starvation)")

          # Each project's picks must respect diversity (when possible)
          a_picks = [c for c in selected if c["aw_project_id"] == "A"]
          a_levers = {c["emotional_lever"] for c in a_picks}
          assert a_levers == {"焦虑", "造梦", "共鸣"}, a_levers
          print(f"  ✓ project A's 5 picks cover all 3 levers ({a_levers})")

          # Global cap round-robin: cap=4 should bring it down fairly
          # (e.g., 2 from A, 1 from B, 1 from C, NOT 4 from A and 0 elsewhere)
          # Replicating the round-robin logic from main()
          GLOBAL_CAP = 4
          selected_ids = {c["note_id"] for c in selected}
          per_proj_queues = [
              [c for c in sorted(by_project[p], key=lambda r: r["injection_score"], reverse=True)
               if c["note_id"] in selected_ids]
              for p in by_project
          ]
          rr = []
          idx = 0
          while len(rr) < GLOBAL_CAP:
              advanced = False
              for q in per_proj_queues:
                  if idx < len(q) and len(rr) < GLOBAL_CAP:
                      rr.append(q[idx])
                      advanced = True
              if not advanced:
                  break
              idx += 1
          rr_per_proj = {}
          for c in rr:
              rr_per_proj[c["aw_project_id"]] = rr_per_proj.get(c["aw_project_id"], 0) + 1
          # Round-robin order: A0, B0, C0, A1 → {A:2, B:1, C:1}
          assert rr_per_proj == {"A": 2, "B": 1, "C": 1}, rr_per_proj
          print(f"  ✓ global cap round-robin: {rr_per_proj} (fair across projects)")
          print("\nper-project quota: 3/3 cases passed")
          PY
      - name: Saturation report 渲染路径冒烟测试 (D-041 round-4)
        working-directory: scripts
        run: |
          python - <<'PY'
          # ⚠️ 这一步存在的理由:
          # check_positive_saturation.py 在 daily-sync.yml:317 是 `|| true` 调用的。
          # 2026-08-22 渲染循环里有过一个 `pool_n` 未赋值的 NameError —— 只要 view
          # 返回任何一行就必崩, 而 `|| true` 把它整个吞掉, 于是 v1_8 专门修的那个
          # 盲点会以另一种形式原样保留(脚本天天"跑过", 天天什么都没测)。
          # 所以: 渲染路径必须在 CI 里被真正执行一次, 不能只靠 py_compile。
          # report() 是纯函数、不碰网络, 就是为这个测试留的口子。
          import io, contextlib
          import check_positive_saturation as c

          def run(rows, threshold=0.6):
              buf = io.StringIO()
              with contextlib.redirect_stdout(buf):
                  rc = c.report(rows, threshold)
              return rc, buf.getvalue()

          def row(**kw):
              base = {
                  "aw_project_id": "11111111-1111-1111-1111-111111111111",
                  "pool_user_id":  "22222222-2222-2222-2222-222222222222",
                  "active_positive_count": 5,
                  "lever_measurable_count": 5,
                  "distinct_lever_count": 3,
                  "top_lever_count": 2,
                  "dominant_lever_ratio": 0.4,
                  "lever_distribution": None,
              }
              base.update(kw)
              return base

          # A: 空池 → 0, 且不能再打老版本那句 "No active positive examples"
          rc, out = run([])
          assert rc == 0, rc
          assert "external_source" in out, out
          print("  ✓ 空结果 → exit 0, 且说明里点名了老盲点")

          # B: 全部测全且健康 → 0。这一条就是当年 NameError 的触发条件:
          #    只要 view 回了任何一行就会崩。
          rc, out = run([row()])
          assert rc == 0, (rc, out)
          assert "All 1 pool(s) measured" in out, out
          print("  ✓ 测全且健康 → exit 0 (渲染循环真的跑通了)")

          # C: 饱和 → 1
          rc, out = run([row(distinct_lever_count=1, top_lever_count=5,
                             dominant_lever_ratio=1.0)])
          assert rc == 1, (rc, out)
          assert "SATURATED" in out, out
          print("  ✓ 饱和 → exit 1")

          # D: 一条都测不到(ratio NULL, 计数列全 NULL) → 2, 不能显示成 ok
          rc, out = run([row(lever_measurable_count=None, distinct_lever_count=None,
                             top_lever_count=0, dominant_lever_ratio=None)])
          assert rc == 2, (rc, out)
          assert "无法评估" in out and "ok" not in out.split("status")[1], out
          assert "n/a" in out, out
          print("  ✓ 全不可测 → exit 2, 且 NULL 计数列不炸 f-string")

          # E: 【部分】可测 —— 5 条里 2 条能测、那 2 条恰好很分散。
          #    ratio 好看, 但另外 3 条完全未知 ⇒ 必须 2 而不是 0。
          #    这是 round-2 引入、round-4 才发现没落到循环里的那条判据。
          rc, out = run([row(lever_measurable_count=2, distinct_lever_count=2,
                             top_lever_count=1, dominant_lever_ratio=0.5)])
          assert rc == 2, (rc, out)
          assert "仅 2/5 条可测" in out, out
          print("  ✓ 部分可测(2/5)且 ratio 好看 → 仍是 exit 2, 不许报健康")

          # F: 饱和优先于没测全 —— 确实测出饱和了就得是 1(可行动) 而不是 2(没数据)
          rc, out = run([row(lever_measurable_count=3, dominant_lever_ratio=1.0,
                             distinct_lever_count=1, top_lever_count=3),
                         row(aw_project_id="33333333-3333-3333-3333-333333333333",
                             lever_measurable_count=1, dominant_lever_ratio=None)])
          assert rc == 1, (rc, out)
          print("  ✓ 同时饱和+没测全 → exit 1 优先(饱和是可行动的)")

          # G: pool_user_id 为 NULL(历史无归属正例) 不能炸, 且要打 "(无归属)"
          rc, out = run([row(pool_user_id=None)])
          assert rc == 0 and "(无归属)" in out, (rc, out)
          print("  ✓ pool_user_id NULL → 打 (无归属), 不炸")

          # H: 行级判据必须和汇总判据一致 —— 任何一行标了"无法评估", 退出码
          #    就不能是 0。round-4 那次错就错在两边判据不同步。
          for kw in ({"dominant_lever_ratio": None},
                     {"lever_measurable_count": 0},
                     {"lever_measurable_count": 4},
                     {"active_positive_count": 9}):
              rc, out = run([row(**kw)])
              assert ("无法评估" in out) == (rc == 2), (kw, rc, out)
          print("  ✓ 行级 unmeasurable 与退出码 2 完全同步")

          print("\ncheck_positive_saturation.report: 8/8 cases passed")
          PY
      - name: Autowriter dup-error detection self-check
        working-directory: scripts
        run: |
          python - <<'PY'
          # _is_duplicate_error decides whether to fall into the dedup-recovery
          # branch in insert_synced_item. Misclassifying any error here would
          # either (a) hide a real schema problem behind silent dedup, or
          # (b) crash the sync on a real duplicate. The substring scan is
          # intentionally permissive because supabase-py wraps PostgREST
          # errors in several shapes; tests pin down the exact shapes we
          # rely on.
          import sync_truth_vault_baokuan_to_autowriter_items as s

          class _E(Exception):
              def __init__(self, msg, code=None):
                  super().__init__(msg)
                  if code: self.code = code

          # Yes-paths (must return True)
          assert s._is_duplicate_error(_E("duplicate key value violates unique constraint"))
          assert s._is_duplicate_error(_E("err 23505 something"))
          assert s._is_duplicate_error(_E("any text", code="23505"))
          print("  ✓ detects 23505 substring + .code")

          # No-paths (must return False) — important: an FK violation or
          # permission denied must NOT be silently swallowed as "dedup"
          assert not s._is_duplicate_error(_E("permission denied"))
          assert not s._is_duplicate_error(_E("violates foreign key constraint", code="23503"))
          assert not s._is_duplicate_error(_E("connection refused"))
          # "duplicate" word alone (not in "duplicate key value violates" phrase)
          # must NOT trigger the dedup path. The 42P01 code is "table does not
          # exist" — a real failure we'd want to surface, not swallow.
          assert not s._is_duplicate_error(_E("relation does not exist; duplicate references unsupported", code="42P01"))
          print("  ✓ does not false-positive on FK / permission / network errors")
          print("\nautowriter dup detection: 2/2 groups passed")
          PY

      - name: fetch_all_pages 分页正确性 (COR-001)
        working-directory: scripts
        run: |
          python - <<'PY'
          # OFFSET 分页跨页时若无【唯一+稳定】ORDER BY, 行会被跳过/重取, 且不报错。
          # 这里用一个假 builder 精确复现 postgrest-py 的两个语义:
          #   · .order() 追加(不是替换)
          #   · .range() 用 params.add() 累积
          # 然后断言 fetch_all_pages 只在循环外 order 一次, 且能抓出"没前进"。
          import _common

          class FakeExec:
              def __init__(self, data): self.data = data

          class FakeQ:
              """记录 .order()/.range() 调用序列; 按 offset 切片吐数据。

              server_cap 模拟 PostgREST 的 max-rows: 服务端把请求钳短, 于是
              每一页都是"短页"但后面还有行 —— 假件不具备这个能力的话,
              "按短页收工"这个 bug 根本测不出来。
              """
              def __init__(self, rows, *, repeat_first_page=False, server_cap=None):
                  self.rows = rows
                  self.order_calls = []
                  self.range_calls = []
                  self.repeat_first_page = repeat_first_page
                  self.server_cap = server_cap
              def order(self, col, **kw):
                  self.order_calls.append(col); return self
              def range(self, lo, hi):
                  self.range_calls.append((lo, hi)); self._lo, self._hi = lo, hi; return self
              def execute(self):
                  if self.repeat_first_page:      # 模拟 PostgREST 改成取第一个 offset
                      return FakeExec(self.rows[0:self._hi - self._lo + 1])
                  page = self.rows[self._lo:self._hi + 1]
                  if self.server_cap is not None:
                      page = page[:self.server_cap]
                  return FakeExec(page)

          rows = [{"id": i, "v": f"r{i}"} for i in range(250)]

          # 1) order_by 必填 —— 漏了必须当场 TypeError, 不能默默按无序翻页
          try:
              _common.fetch_all_pages(FakeQ(rows), page_size=100)
              raise AssertionError("order_by 缺失竟然没报错 —— 关键字必填被改掉了")
          except TypeError:
              print("  ✓ order_by 是必填关键字参数")

          # 2) 正常翻页: 全量、无重复、顺序保持; 且 .order() 只调一次(在循环外)
          q = FakeQ(rows)
          got = _common.fetch_all_pages(q, page_size=100, order_by="id")
          assert [r["id"] for r in got] == list(range(250)), "翻页结果不是全量有序"
          assert q.order_calls == ["id"], f".order() 调了 {q.order_calls} —— 必须循环外只调一次"
          # 250 行 / 每页 100: 100 + 100 + 50 + 空页 = 4 次请求。
          # offset 按实收前进 → 0 → 100 → 200 → 250(最后一次拿到空页收工)。
          assert [lo for lo, _ in q.range_calls] == [0, 100, 200, 250], q.range_calls
          print(f"  ✓ 250 行取全 · order 调用={q.order_calls} · offset 轨迹={[lo for lo,_ in q.range_calls]}")

          # 3) order_by 不在 select 里 → 明确报错(而不是靠 .get() 拿 None 静默去重成 1 行)
          try:
              _common.fetch_all_pages(FakeQ(rows), page_size=100, order_by="note_id")
              raise AssertionError("order_by 不在返回列里竟然没报错")
          except RuntimeError as e:
              assert "不在返回列里" in str(e), e
              print("  ✓ order_by 不在 .select() 里 → RuntimeError")

          # 4) 分页没前进(每页都吐同一批)→ 报错, 绝不死循环
          try:
              _common.fetch_all_pages(FakeQ(rows, repeat_first_page=True),
                                      page_size=100, order_by="id")
              raise AssertionError("每页返回同一批竟然没报错 —— 会死循环")
          except RuntimeError as e:
              assert "分页没有前进" in str(e), e
              print("  ✓ 页面不前进 → RuntimeError(不死循环)")

          # 5) 最后一页不满 → 再拿一次空页才收工(多一次请求, 换与服务端上限无关)
          q = FakeQ(rows[:150])
          got = _common.fetch_all_pages(q, page_size=100, order_by="id")
          assert len(got) == 150, len(got)
          assert len(q.range_calls) == 3, q.range_calls          # 100 + 50 + 空
          # 每页的起点必须正好接上一页的终点(按实收行数前进): 0 → 100 → 150。
          # 断言这条关系而不是写死三元组 —— 写死的话换个 page_size 就得改测试,
          # 而真正要钉死的是"不跳行、不重取"。
          starts = [lo for lo, _ in q.range_calls]
          assert starts == [0, 100, 150], starts
          print(f"  ✓ 末页不满 → 补一次空页收工 · offset 轨迹 {starts}")

          # 6) 【服务端把每页钳短】—— PostgREST max-rows 低于 page_size 时的真实行为。
          #    本库实测 max-rows=1000 而 _DEFAULT_PAGE_SIZE 也是 1000, 零余量;
          #    上限一旦调低, 按"短页收工"就会第一页返回 = 24 个调用点集体静默截断。
          q = FakeQ(rows, server_cap=37)          # 请求 100, 服务端只给 37
          got = _common.fetch_all_pages(q, page_size=100, order_by="id")
          assert [r["id"] for r in got] == list(range(250)), (
              f"服务端钳短时只拿回 {len(got)} 行(应 250) —— 又按短页收工了"
          )
          print(f"  ✓ 服务端每页钳到 37 行时仍取全 250 行({len(q.range_calls)} 次请求)")

          # 7) offset 必须按【实拿到的行数】前进, 不是按 page_size —— 否则钳短时跳行
          assert q.range_calls[1][0] == 37, (
              f"第二页从 offset={q.range_calls[1][0]} 起(应 37) —— 按 page_size 跳会漏行"
          )
          print("  ✓ offset 按实收行数前进, 不按 page_size 跳")
          print("\nfetch_all_pages: 7/7 组通过")
          PY

      - name: 每个 fetch_all_pages 调用点都传了 order_by (AST, 防回归)
        run: |
          python - <<'PY'
          # 用 AST 而不是 grep: grep 会被注释/字符串里的 "order_by=" 骗过去,
          # 也读不出跨行的调用。这条是 COR-001 的防回归闸 —— 新写的调用点漏传
          # order_by 会被 TypeError 挡住(运行时), 但 CI 要在合并前就拦下来。
          import ast, pathlib, sys

          bad = []
          n = 0
          for f in sorted(pathlib.Path("scripts").glob("*.py")):
              tree = ast.parse(f.read_text(encoding="utf-8"), filename=str(f))
              for node in ast.walk(tree):
                  if not isinstance(node, ast.Call):
                      continue
                  fn = node.func
                  name = fn.attr if isinstance(fn, ast.Attribute) else getattr(fn, "id", None)
                  if name != "fetch_all_pages":
                      continue
                  n += 1
                  kws = {k.arg for k in node.keywords if k.arg}
                  has_splat = any(k.arg is None for k in node.keywords)   # **kwargs 转发
                  if "order_by" not in kws and not has_splat:
                      bad.append(f"{f}:{node.lineno}")
          assert n >= 20, f"只扫到 {n} 个调用点 —— AST 扫描八成瞎了, 别让它假绿"
          if bad:
              print("::error::以下 fetch_all_pages 调用点没传 order_by:")
              for b in bad:
                  print(f"  {b}")
              sys.exit(1)
          print(f"  ✓ {n} 个 fetch_all_pages 调用点全部显式传了 order_by")
          PY

      - name: sync_autowriter_decisions 时间窗 created_at OR updated_at (R-034 收尾)
        working-directory: scripts
        run: |
          python - <<'PY'
          # ── sync_autowriter_decisions 时间窗: created_at OR updated_at ─────────
          # 治的病: aw 侧补上 items.updated_at 之前, 本脚本只能按 created_at 过滤,
          # "很久以前创建、今天才被人工改状态"的 item 会被时间窗【静默】筛掉。
          # 用例对多种错误实现都会红, 见每条断言的消息。
          import importlib

          mod = importlib.import_module("sync_autowriter_decisions_to_prepublish")

          SINCE = "2025-08-23T00:00:00"
          ROWS = [
              {"id": "A", "status": "approved",       "created_at": "2024-01-01T00:00:00", "updated_at": "2026-08-22T09:00:00"},
              {"id": "B", "status": "needs_revision", "created_at": "2026-08-20T00:00:00", "updated_at": "2026-08-20T00:00:00"},
              {"id": "C", "status": "approved",       "created_at": "2020-01-01T00:00:00", "updated_at": "2020-01-01T00:00:00"},
              {"id": "D", "status": "approved",       "created_at": "2026-08-21T00:00:00", "updated_at": None},
              {"id": "E", "status": "pending",        "created_at": "2026-08-22T00:00:00", "updated_at": "2026-08-22T00:00:00"},
          ]

          MISSING_COL_ERR = ('{"code":"42703","message":"column items.updated_at '
                             'does not exist"}')


          def run(*, raise_on_or=None):
              """跑一遍 fetch_pending_decisions, 返回 (ids, store)。

              raise_on_or: 不为 None 时, 带 or= 的那次查询抛这个异常 —— 用来模拟
              目标库没有 updated_at 列。
              """
              store = {}

              class FakeQ:
                  """按真实语义求值的假 builder —— 不只记调用串, 真的把谓词跑一遍,
                  这样测的是【筛出来的是不是想要的行】, 而不是字符串长得像不像。"""
                  def __init__(self, rows, table):
                      self.rows, self.table, self.preds = rows, table, []
                      self.used_or = False
                  def select(self, cols):
                      store.setdefault("select", {}).setdefault(self.table, []).append(cols)
                      self.cols = cols
                      return self
                  def in_(self, col, vals):
                      vs = set(vals); self.preds.append(lambda r: r.get(col) in vs); return self
                  def eq(self, col, val):
                      self.preds.append(lambda r: r.get(col) == val); return self
                  def gte(self, col, val):
                      store.setdefault("gte", []).append(col)
                      self.preds.append(
                          lambda r, c=col, v=val: r.get(c) is not None and r[c] >= v)
                      return self
                  def or_(self, expr):
                      store.setdefault("or_", []).append(expr)
                      self.used_or = True
                      terms = []
                      for term in expr.split(","):
                          col, op, val = term.split(".", 2)
                          assert op == "gte", f"用例只认 gte, 实际 {op}"
                          terms.append((col, val.strip('"')))
                      self.preds.append(
                          lambda r, ts=terms: any(
                              r.get(c) is not None and r[c] >= v for c, v in ts))
                      return self
                  def out(self):
                      keep = [c.strip() for c in getattr(self, "cols", "").split(",")]
                      return [{k: v for k, v in r.items() if k in keep}
                              for r in self.rows if all(p(r) for p in self.preds)]

              class FakeSchema:
                  def __init__(self, name): self.name = name
                  def table(self, t):
                      return FakeQ(ROWS if t == "items" else [], t)

              class FakeSB:
                  def schema(self, n): return FakeSchema(n)

              def fake_fetch_all_pages(q, *, order_by, **kw):
                  store.setdefault("order_by", []).append(order_by)
                  if q.used_or and raise_on_or is not None:
                      raise raise_on_or
                  return q.out()

              mod.fetch_all_pages = fake_fetch_all_pages
              got = mod.fetch_pending_decisions(FakeSB(), SINCE)
              return got, store


          # ── 1. 正常路径 ───────────────────────────────────────────────────────
          got, store = run()
          ids = sorted(r["id"] for r in got)

          assert store.get("or_"), "时间窗没走 or= —— 退回单列过滤了"
          expr = store["or_"][0]
          assert "created_at.gte." in expr, f"or= 里缺 created_at 分支: {expr}"
          assert "updated_at.gte." in expr, f"or= 里缺 updated_at 分支: {expr}"
          assert expr.count('"') == 4, f"or= 的值没用双引号包住: {expr}"
          assert "created_at" not in store.get("gte", []), "时间窗又退回 .gte('created_at') 了"
          print("  ✓ 时间窗 = or=(created_at.gte.\"…\",updated_at.gte.\"…\")")

          assert "updated_at" in store["select"]["items"][0], \
              f"items 的 select 少了 updated_at: {store['select']['items'][0]}"
          print("  ✓ select 带 updated_at (创建后被动过的计数才看得见)")

          assert ids == ["A", "B", "D"], f"筛出来的是 {ids}, 期望 ['A','B','D']"
          print("  ✓ A(4年前建·昨天改) 捞回来了 —— 只按 created_at 会漏")
          print("  ✓ D(updated_at=NULL) 仍在 —— 只按 updated_at 会静默丢掉")
          print("  ✓ C 老且没动过 · E status=pending 正确排除")
          assert store["order_by"][0] == "id", f"items 查询的 order_by 变了: {store['order_by']}"
          print("  ✓ order_by 仍是 id")


          # ── 2. 目标库没有 updated_at 列 → 降级, 不是打死 (codex round-1 P1) ──
          #    updated_at 是 aw 仓 migrations/001_deskcore.sql 加的, TV 自己那份
          #    autowriter-migrations/007 建的 items 只有 created_at。
          class _Err(Exception):
              pass


          got2, store2 = run(raise_on_or=_Err(MISSING_COL_ERR))
          ids2 = sorted(r["id"] for r in got2)
          assert ids2 == ["B", "D"], f"降级后筛出 {ids2}, 期望 ['B','D'](= 旧口径)"
          assert "created_at" in store2.get("gte", []), "降级后没走 .gte('created_at')"
          # 2026-09-17 (TV-01): 原来这里断的是"降级形态的 select 精确等于
          # 'id, status, user_id, created_at'"。加了决策来源三列之后这条断言【过度约束】了——
          # "缺 updated_at" 和 "缺 decision_source/reviewer_id/decided_at" 是【两条正交的
          # 降级】: 只缺 updated_at 时, 来源三列仍然该照读。所以改成断真正的不变量:
          # 降级形态不带 updated_at, 且四个基础列一个不少。
          _cols2 = [c.strip() for c in store2["select"]["items"][-1].split(",")]
          assert "updated_at" not in _cols2, \
              f"降级形态的 select 不该带 updated_at: {store2['select']['items'][-1]}"
          assert {"id", "status", "user_id", "created_at"} <= set(_cols2), \
              f"降级形态少了基础列: {store2['select']['items'][-1]}"
          assert all("updated_at" not in r for r in got2), "降级形态的行不该有 updated_at 键"
          print("  ✓ 缺列时降级回旧口径(只按 created_at), 而不是把整条链路打死")

          # 降级判据必须【窄】—— 别的错误照旧抛, 否则就变成"出错了也当成功"
          try:
              run(raise_on_or=_Err("500 Internal Server Error"))
          except _Err:
              print("  ✓ 无关错误照旧抛 —— 降级判据没有宽到吞掉别的故障")
          else:
              raise AssertionError("无关错误被降级路径吞掉了 —— 这正是本仓一路在治的病")

          assert mod._is_missing_updated_at(_Err(MISSING_COL_ERR)) is True
          assert mod._is_missing_updated_at(_Err("column items.nosuchcol does not exist")) is False, \
              "_is_missing_updated_at 认了跟 updated_at 无关的缺列错误"
          assert mod._is_missing_updated_at(_Err("updated_at 超时")) is False, \
              "_is_missing_updated_at 只要看到 updated_at 就认 —— 太宽了"
          print("  ✓ _is_missing_updated_at 只认「updated_at 这一列不存在」")


          # ── 3. "创建后被动过"的计数: 按时间解析比较, 且别名副其实 ─────────────
          #    两列都是 timestamptz, Postgres 只在小数秒非零时渲染小数部分, 于是
          #    同一时刻可能一列 "…:00+00:00"、另一列 "…:00.000000+00:00" ——
          #    字典序下 '+'(0x2B) < '.'(0x2E), 字符串比会把"相等"判成"晚于"。
          _touched = mod._touched_after_create
          CASES = [
              ({"created_at": "2026-08-19T03:07:00.444827+00:00",
                "updated_at": "2026-08-19T03:07:00.444827+00:00"}, False, "完全相等(回填行)"),
              ({"created_at": "2026-08-19T03:07:00+00:00",
                "updated_at": "2026-08-19T03:07:00.000000+00:00"}, False, "同一时刻·小数位渲染不同"),
              ({"created_at": "2024-01-01T00:00:00+00:00",
                "updated_at": "2026-08-22T09:00:00+00:00"}, True, "创建后确实被动过"),
              ({"created_at": "2026-08-21T00:00:00+00:00", "updated_at": None}, False, "updated_at 为 NULL"),
              ({"created_at": None, "updated_at": "2026-08-21T00:00:00+00:00"}, False, "created_at 为 NULL"),
              ({"created_at": "垃圾", "updated_at": "2026-08-21T00:00:00+00:00"}, False, "解析不了 → 不虚报"),
              ({"created_at": "2026-08-21T00:00:00+00:00"}, False, "降级形态(压根没这个键)"),
          ]
          for row, want, why in CASES:
              assert _touched(row) == want, f"_touched_after_create {why}: got {_touched(row)}, want {want}"
          _naive = CASES[1][0]["updated_at"] > CASES[1][0]["created_at"]
          assert _naive is True, "反证失效: 字符串比居然没在这条上虚报, 用例该重挑数据了"
          print("  ✓ 计数按时间解析比较(字符串比会在'同一时刻·小数位不同'上虚报)")

          # 名字必须诚实: 触发器的 WHEN 对 status 和 example_label 都刷 updated_at,
          # 所以这个数【不是】"迟到的审稿决定"的精确计数 (codex round-1 P2)。
          assert not hasattr(mod, "_is_late_decision"), \
              "还叫 _is_late_decision —— 它数的是「创建后被动过」, 含只改了正负例标注的"
          doc = (_touched.__doc__ or "")
          assert "example_label" in doc, "docstring 没讲清它为什么不等于「迟到决策」"
          print("  ✓ 指标名副其实(不再自称「迟到决策」), docstring 讲清了口径")

          print("sync_autowriter_decisions 时间窗自检通过")
          PY

      - name: worker 每脚本互斥锁 + /health 自曝配置 (COR-002 / SUP-001)
        run: |
          pip install -q fastapi 'httpx<0.28' 'starlette' >/dev/null
          python - <<'PY'
          import os, threading, time
          os.environ.pop("WORKER_API_KEY", None)
          from fastapi.testclient import TestClient
          import worker.app as w

          c = TestClient(w.app)

          # ── 没配 key = **锁死**, 不是"谁都能调" (跨库审计 SUP-001) ──
          #
          # ⚠️ 这几条断言以前是反的, 而反的那一版是错的。原文是:
          #        assert h["auth"]["required"] is False
          #        assert "dev" in h["auth"]["mode"]
          #    也就是把"secret 漏配 → 端点对全世界敞开"当成了正确行为, 理由是
          #    "/health 会把它说出来"。那个自曝是对的、保留了, 但它不是防线 ——
          #    没有人会在事故之前去读 /health。
          #
          #    这个 worker 拿 service-role 凭据 subprocess 跑仓库里的脚本。默认
          #    敞开不可接受。现在: 没配 key 且没显式开匿名 → 业务请求一律 401。
          h = c.get("/health").json()
          assert h["ok"] is True, "healthcheck 不能因为没配 key 就红(Railway 靠它起容器)"
          assert h["auth"]["ok"] is False, h["auth"]
          assert h["auth"]["required"] is False, h["auth"]
          assert h["auth"]["anonymous_allowed"] is False, h["auth"]
          assert "locked" in h["auth"]["mode"], h["auth"]["mode"]
          # 而且真的要拒 —— 光在 /health 里说"锁了"不算
          r = c.post("/annotate-essence", json={"project_id": "p"})
          assert r.status_code == 401, f"没配 key 却放行了: {r.status_code}"
          print("  ✓ 未配 key: 业务请求 401(不是静默放行)")

          # 显式开匿名才放行 —— 本地开发的逃生口, 必须是**写出来**的意图
          os.environ["WORKER_ALLOW_ANONYMOUS"] = "1"
          h = c.get("/health").json()
          assert h["auth"]["anonymous_allowed"] is True and h["auth"]["ok"] is False, h["auth"]
          assert "anonymous" in h["auth"]["mode"], h["auth"]["mode"]
          # 半开的值不算开: 只有 1/true/yes/on
          for half in ("0", "false", "no", ""):
              os.environ["WORKER_ALLOW_ANONYMOUS"] = half
              assert c.get("/health").json()["auth"]["anonymous_allowed"] is False, half
          os.environ.pop("WORKER_ALLOW_ANONYMOUS", None)
          print("  ✓ 匿名必须显式开, 且 0/false/no/空 都不算开")

          assert h["config"]["run_timeout_s"] == w._RUN_TIMEOUT_S
          # config 只报"有没有配"的布尔, 不报值(base_url/model 除外, 那俩不是密钥)
          for k in ("supabase_service_role_key", "anthropic_api_key", "supabase_url"):
              assert isinstance(h["config"][k], bool), f"{k} 回显了值而不是布尔: {h['config'][k]!r}"
          print(f"  ✓ 未配 key: ok=True 但 auth.ok=False · mode={h['auth']['mode']!r}")

          os.environ["WORKER_API_KEY"] = "s3cret"
          h = c.get("/health").json()
          assert h["auth"]["ok"] is True and h["auth"]["required"] is True, h["auth"]
          assert "s3cret" not in str(h), "key 泄进了 /health 响应体"
          assert c.post("/annotate-essence", json={"project_id": "p"},
                        headers={"X-Worker-Key": "wrong"}).status_code == 401, "错 key 放行了"
          print("  ✓ 配了 key: auth.ok=True · key 不回显 · 错 key 401")
          del os.environ["WORKER_API_KEY"]

          # /health 无鉴权, 所以 ANTHROPIC_BASE_URL 只能回显 scheme://host ——
          # 中转站 URL 可能带租户路径 / query 凭据 / user:pass@ (codex PR#104 review)。
          os.environ["ANTHROPIC_BASE_URL"] = "https://u:p@gw.example.com:8443/tenant-42/v1?key=SEKRIT"
          h = c.get("/health").json()
          origin = h["config"]["anthropic_base_url_origin"]
          assert origin == "https://gw.example.com:8443", origin
          for leak in ("SEKRIT", "tenant-42", "u:p", "?key="):
              assert leak not in str(h), f"{leak!r} 从 /health 漏出去了: {h['config']}"
          print(f"  ✓ base_url 只回显 origin={origin!r}, 凭据/租户路径都没漏")
          # 解析不了就明说, 绝不 fallback 回原值(那样等于没削)
          os.environ["ANTHROPIC_BASE_URL"] = "::not a url::"
          assert c.get("/health").json()["config"]["anthropic_base_url_origin"] == "(unparseable)"
          del os.environ["ANTHROPIC_BASE_URL"]
          print("  ✓ 无法解析 → (unparseable), 不回落原值")

          # IPv6: urlsplit().hostname 剥掉方括号, 直接拼端口会得到
          # https://2001:db8::1:8443 —— 不合法且分不清端口 (codex PR#104 review)
          for src, want in [
              ("https://[2001:db8::1]:8443/v1", "https://[2001:db8::1]:8443"),
              ("https://[2001:db8::1]/v1",      "https://[2001:db8::1]"),
              ("https://api.anthropic.com",     "https://api.anthropic.com"),
          ]:
              assert w._safe_origin(src) == want, f"{src!r} → {w._safe_origin(src)!r}, 期望 {want!r}"
          print("  ✓ IPv6 字面量保留方括号, 端口不粘连")

          # ── 互斥锁: 同一脚本第二个并发请求必须 409, 不能一起跑 ──
          # 换掉 subprocess.run, 让"跑脚本"变成一个可控的慢操作。
          started = threading.Event()
          release = threading.Event()
          class _P:  returncode = 0; stdout = "ok"; stderr = ""
          def fake_run(cmd, **kw):
              # 只有 essence 那次挂住(用来占住锁); 别的脚本立刻返回 ——
              # 否则它也会在 release 上阻塞, 把 essence 的锁窗口耗光, 后面
              # 对 /health.running 的断言就成了假阴性。
              if "annotate_essence_pass.py" in " ".join(map(str, cmd)):
                  started.set()
                  assert release.wait(30), "release 超时 —— 测试自身卡住了"
              return _P()
          w.subprocess.run = fake_run
          w._SCRIPTS_DIR.mkdir(parents=True, exist_ok=True)

          out = {}
          def first():
              out["a"] = w._run("annotate_essence_pass.py", ["X", "--limit", "1"])
          t = threading.Thread(target=first); t.start()
          assert started.wait(5), "第一个请求没进到 subprocess"

          from fastapi import HTTPException
          try:
              w._run("annotate_essence_pass.py", ["X", "--limit", "1"])
              raise AssertionError("并发第二个请求没被挡 —— 会重复烧 LLM 并互相覆盖 essence")
          except HTTPException as e:
              assert e.status_code == 409, e.status_code
              print(f"  ✓ 同脚本并发第二个 → {e.status_code}")

          # 不同脚本互不阻塞(锁是 per-script, 不是全局)
          w._run("curate_flywheel_lessons.py", ["--limit", "1"])
          print("  ✓ 不同脚本各自一把锁, 不互相阻塞")

          # essence 还占着锁时, /health 必须看得见它在跑
          running = c.get("/health").json()["running"]
          assert "annotate_essence_pass.py" in running, running
          assert "curate_flywheel_lessons.py" not in running, running
          print(f"  ✓ /health.running 暴露在跑的脚本: {running}")


          release.set(); t.join(5)
          assert out["a"]["ok"] is True, out["a"]
          # 锁必须释放, 否则下一轮 cron 永远 409
          w._run("annotate_essence_pass.py", ["X", "--limit", "1"])
          print("  ✓ 跑完锁已释放(下一轮不会被自己挡住)")
          # 边插锁边枚举: _script_lock() 的 setdefault 是【插入】, 边插边遍历同一个
          # dict, CPython 抛 RuntimeError → /health 500 → Railway 重启容器
          # (codex PR#104 review)。
          # 预填一个大锁表把竞态窗口拉宽 —— 小表时每次枚举太快, 8 轮都撞不上,
          # 撞不上不等于安全。本机实测: 裸遍历在 4 万项时稳定复现
          # RuntimeError('dictionary changed size during iteration')。
          saved = dict(w._SCRIPT_LOCKS)
          def _race(fn, preload=40000, rounds=150):
              w._SCRIPT_LOCKS.clear()
              for i in range(preload):
                  w._SCRIPT_LOCKS[f"pre{i}.py"] = threading.Lock()
              err = {}; done = threading.Event()
              def writer():
                  i = 0
                  while not done.is_set() and i < 200000:
                      with w._LOCKS_GUARD:
                          w._SCRIPT_LOCKS.setdefault(f"new{i}.py", threading.Lock())
                      i += 1
              def reader():
                  try:
                      for _ in range(rounds): fn()
                  except Exception as e: err["e"] = repr(e)
                  finally: done.set()
              tw = threading.Thread(target=writer, daemon=True)
              tr = threading.Thread(target=reader)
              tw.start(); tr.start(); tr.join(60); done.set(); tw.join(3)
              return err.get("e")

          # 反证: 裸遍历必须炸 —— 否则这条断言测了个寂寞
          bare = lambda: sorted(n for n, lk in w._SCRIPT_LOCKS.items() if lk.locked())
          assert "changed size" in (_race(bare) or ""), (
              "裸遍历没复现 dict 竞态 —— 本用例失去意义, 别让它假绿"
          )
          print("  ✓ 反证: 裸遍历确实抛 dictionary changed size during iteration")
          assert _race(w._running_scripts) is None, "_running_scripts() 仍然会炸"
          print("  ✓ _running_scripts() 在同样竞态下零异常")
          w._SCRIPT_LOCKS.clear(); w._SCRIPT_LOCKS.update(saved)
          print("\nworker 互斥锁 + health: 全部通过")
          PY

      - name: 指标写失败必须计进 exit code (跨库审计 COR-008)
        working-directory: scripts
        run: |
          python - <<'PY'
          import sync_feishu_notes_to_truth_vault as M

          # 场景就是审计描述的那个: **note 全成功、metric 全失败**。
          # 修之前 upsert_metrics_batch 返回 None、逐行失败只写日志, 而 exit
          # code 只看 note 的失败数 —— 于是指标一条没写进去, 任务照样 exit 0,
          # Done 那行还写着 errors: 0。daily-sync 的聚合闸看到的是绿的。
          #
          # 指标丢了**不可恢复**: 快照的时间窗过去就过去了, 下次同步补不回
          # 24h 那一格。note 丢了至少下次重跑会补上。

          class _Boom:
              """metric_snapshots 的写一律炸; 其它表照常。"""
              def __init__(s, table_name=None): s.t = table_name
              def schema(s, _): return s
              # ⚠️ 用 type(s) 而不是写死 _Boom —— 否则下面的 _OK / _AcctBoom
              #    子类调 .table() 会拿回一个**父类**实例, 照样炸, 于是"全成功"
              #    那条用例永远测不到成功路径(第一版就是这么错的)。
              def table(s, name): return type(s)(name)
              def upsert(s, *a, **k):
                  if s.t == "metric_snapshots":
                      raise RuntimeError("PostgREST 42501: permission denied")
                  return s
              def insert(s, *a, **k): return s.upsert()
              def execute(s): return type("R", (), {"data": []})()

          metrics = [{"note_id": f"p_{i}", "window_label": "24h", "source": "feishu",
                      "likes": i} for i in range(5)]
          written_ids = {m["note_id"] for m in metrics}

          got = M.upsert_metrics_batch(_Boom(), metrics, written_note_ids=written_ids)
          assert isinstance(got, tuple) and len(got) == 2, \
              f"必须返回 (written, failed), 拿到 {type(got).__name__}"
          n_written, failed = got
          assert n_written == 0, n_written
          assert len(failed) == 5, f"5 条全失败却只报了 {len(failed)}"
          print(f"  ✓ 失败集合被还给了调用方: {len(failed)} 条")

          # 全成功时不能误报
          class _OK(_Boom):
              def upsert(s, *a, **k): return s
          n_written, failed = M.upsert_metrics_batch(_OK(), metrics,
                                                     written_note_ids=written_ids)
          assert n_written == 5 and failed == [], (n_written, failed)
          print("  ✓ 全成功时 failed 为空, written 计数正确")

          # 因为 note 没落库而被主动跳过的, **不算**失败 —— 那些 note 已经
          # 计过一次错了, 再算一次就是双重计数。
          n_written, failed = M.upsert_metrics_batch(_OK(), metrics,
                                                     written_note_ids={"p_0"})
          assert n_written == 1 and failed == [], (n_written, failed)
          print("  ✓ 因 FK 跳过的不计进 failed(避免与 note 失败双重计数)")

          # accounts 同一形状
          class _AcctBoom(_Boom):
              def upsert(s, *a, **k):
                  if s.t == "accounts": raise RuntimeError("boom")
                  return s
          M._iso_now = lambda: "2026-01-01T00:00:00Z"
          _orig = M.ensure_account_exists
          M.ensure_account_exists = lambda *a, **k: (_ for _ in ()).throw(RuntimeError("boom"))
          try:
              bad = M.ensure_accounts_batch(_AcctBoom(), {"a1": "xiaohongshu"})
              assert len(bad) == 1, f"account 失败没被返回: {bad}"
          finally:
              M.ensure_account_exists = _orig
          print("  ✓ accounts 的失败也还给了调用方")

          # exit code 的口径: main 里 errors 累加了 metrics/accounts 的失败,
          # 且 return 0 只在 errors == 0 时发生。用源码断言 —— 真跑 main 要
          # 一整套飞书/Supabase 替身, 那反而测不清这一条。
          import inspect
          src = inspect.getsource(M.main)
          assert 'stats["errors"] += len(failed_metrics) + len(failed_accounts)' in src, \
              "main 没把 metric/account 的失败计进 errors —— exit code 仍是假绿"
          assert 'return 0 if stats["errors"] == 0 else 1' in src, "exit code 口径变了"
          assert 'stats["metrics_failed"]' in src, "Done 那行看不到 metrics_failed"
          print("  ✓ exit code 现在会因为指标丢失而变红")

          print("COR-008 自检通过")
          PY

      - name: 三个服务的鉴权闸口径一致且 fail-closed (跨库审计 SUP-001)
        run: |
          pip install -q fastapi 'httpx<0.28' 'starlette' >/dev/null
          python - <<'PY'
          import os
          from fastapi.testclient import TestClient

          # librarian / onboarder 原来**一条鉴权用例都没有**, worker 那条又把
          # fail-open 钉成了正确行为。这一步逐个服务跑同一组断言 —— 三个服务守
          # 的是同一条安全不变量, 就该用同一把尺子量。
          #
          # 它们手里分别有: service-role 读 + LLM(librarian)、未信任输入进模型
          # 且改写 mappings/*.yaml(onboarder)、service-role 凭据 subprocess 跑
          # 仓库脚本(worker)。任何一个默认敞开都不可接受。
          import librarian.app as L
          import onboarder.app as O
          import worker.app as W

          CASES = [
              ("librarian", L, "LIBRARIAN", "X-Librarian-Key", "/librarian"),
              ("onboarder", O, "ONBOARDER", "X-Onboarder-Key", "/onboard"),
              ("worker",    W, "WORKER",    "X-Worker-Key",    "/annotate-essence"),
          ]

          for name, mod, prefix, header, endpoint in CASES:
              for v in (f"{prefix}_API_KEY", f"{prefix}_ALLOW_ANONYMOUS"):
                  os.environ.pop(v, None)
              c = TestClient(mod.app)

              # ① 没配 key、没开匿名 → 业务请求一律 401
              r = c.post(endpoint, json={})
              assert r.status_code == 401, f"{name}: 未配 key 却回 {r.status_code}"
              h = c.get("/health").json()
              assert h["ok"] is True, f"{name}: healthcheck 不该因为没配 key 就红"
              assert h["auth"]["ok"] is False and "locked" in h["auth"]["mode"], h["auth"]

              # ② 配了 key: 对的放行(不再是 401)、错的 401、key 不回显
              os.environ[f"{prefix}_API_KEY"] = "s3cret-" + name
              assert c.post(endpoint, json={},
                            headers={header: "wrong"}).status_code == 401, f"{name}: 错 key 放行"
              assert c.post(endpoint, json={},
                            headers={header: "s3cret-" + name}).status_code != 401, \
                  f"{name}: 对的 key 被拒了 —— 这不是修好, 是拒绝一切"
              h = c.get("/health").json()
              assert h["auth"]["ok"] is True, h["auth"]
              assert "s3cret" not in str(h), f"{name}: key 泄进了 /health"
              del os.environ[f"{prefix}_API_KEY"]

              # ③ 显式开匿名才放行 —— 逃生口必须是写出来的意图
              os.environ[f"{prefix}_ALLOW_ANONYMOUS"] = "1"
              assert c.post(endpoint, json={}).status_code != 401, f"{name}: 开了匿名仍拒"
              h = c.get("/health").json()
              assert h["auth"]["anonymous_allowed"] is True, h["auth"]
              # 匿名能跑, 但**不安全** —— /health 不该把这两件事混为一谈
              assert h["auth"]["ok"] is False, f"{name}: 匿名模式不该报 auth.ok=True"
              del os.environ[f"{prefix}_ALLOW_ANONYMOUS"]

              print(f"  ✓ {name}: 未配→401 · 配了→校验 · 显式匿名→放行且自报不安全")

          print("三个服务的鉴权闸口径一致")

          # ── 比对必须是恒定时间的 ──────────────────────────────────────
          #
          # 裸 `provided != expected` 在**第一个不同的字节**处短路, 耗时因此泄露
          # 「猜对了前几个字符」—— 攻击者可以按字节把 key 试出来, 而不必穷举。
          # 三份旧实现都是裸 !=; 判据收敛成一处之后, 这里把正确写法钉死。
          #
          # 判据是**被禁止的形态**(源码里不许出现对 provided 的裸比较), 不是
          # "现在用的是哪个函数" —— 换等价实现不会假警报, 改回裸 != 会红。
          import ast, inspect, service_auth

          src = inspect.getsource(service_auth)
          bad = []
          for node in ast.walk(ast.parse(src)):
              if not isinstance(node, ast.Compare):
                  continue
              names = {n.id for n in ast.walk(node) if isinstance(n, ast.Name)}
              if {"provided", "expected"} <= names and any(
                      isinstance(op, (ast.Eq, ast.NotEq)) for op in node.ops):
                  bad.append(ast.unparse(node))
          assert not bad, f"密钥用了短路比较(时序侧信道): {bad}"
          assert "compare_digest" in src, "没有任何恒定时间比较 —— 判据是不是被绕过了?"
          print("  ✓ 密钥比对是恒定时间的(源码里没有对 provided 的裸 ==/!=)")

          # 环境里配了**非 ASCII** 的 key 时, 必须照常 401, 不能变成 500。
          #
          # ⚠️ 这条最初写成"把非 ASCII key 当请求头发进来", 跑一遍就红了 ——
          #    HTTP 头值本来就装不下非 ASCII, httpx 在客户端就拒了。所以那个
          #    场景根本不存在, **危险的是另一侧**: expected 来自环境变量, 那里
          #    完全可以是非 ASCII。compare_digest 对 str 参数要求全 ASCII, 裸传
          #    str 会抛 TypeError —— 于是"运维把 key 设成了带中文的字符串"会让
          #    每个请求 500 而不是 401。_key_matches 统一 encode 成 bytes 就是
          #    为了这个。
          os.environ["WORKER_API_KEY"] = "钥匙-¥€"
          cw = TestClient(W.app)
          r = cw.post("/annotate-essence", json={}, headers={"X-Worker-Key": "wrong"})
          assert r.status_code == 401, f"非 ASCII key 把拒绝变成了 {r.status_code}"
          # 完全不带头(provided=None)也要 401, 不能是 AttributeError → 500
          assert cw.post("/annotate-essence", json={}).status_code == 401
          del os.environ["WORKER_API_KEY"]
          print("  ✓ 环境里的 key 是非 ASCII 时照常 401(不是 500)")

          # ── __all__ 里的名字必须真的存在 ──────────────────────────────
          # 这里曾经列着 AuthDecision(早期设计留下的类名, 后来没实现)。
          # `from service_auth import *` 会直接 AttributeError, 而这个模块是三个
          # 服务共用的鉴权闸 —— 导入炸掉就是三个服务一起起不来。(codex review)
          import service_auth as SA
          missing = [n for n in SA.__all__ if not hasattr(SA, n)]
          assert not missing, f"__all__ 里有不存在的名字: {missing}"
          exec("from service_auth import *", {})   # 真的 import 一次
          print(f"  ✓ __all__ 每个名字都取得到: {SA.__all__}")

          # ── key 和 ALLOW_ANONYMOUS 同时在时, /health 不许自相矛盾 ────
          #
          # resolve() 先看 key, 所以匿名**并不生效**; 而 /health 以前照实回
          # anonymous_allowed=True —— 它说"任何人可调", 实际每个不带 key 的请求
          # 都 401。运维照着它排查会往完全错的方向走。(codex review)
          #
          # 但也不能光算成 False 了事: 生产上留着一个失效的 ALLOW_ANONYMOUS,
          # 等哪天有人拿掉 key(轮换/迁移/清环境变量)它就**静默生效**。所以
          # "生效与否"和"设没设"分成两个字段, 别挤在一个布尔里。
          os.environ["WORKER_API_KEY"] = "k"
          os.environ["WORKER_ALLOW_ANONYMOUS"] = "1"
          h = SA.auth_health("WORKER", header="X-Worker-Key")
          assert h["anonymous_allowed"] is False, \
              f"key 压着匿名, /health 却说匿名可用: {h}"
          assert h["anonymous_flag_set"] is True, "失效的匿名开关被完全藏起来了"
          assert "ALLOW_ANONYMOUS" in h["mode"], f"mode 没提醒这个开关还留着: {h['mode']}"
          # 行为要和它说的一致: 不带 key 照样 401
          assert TestClient(W.app).post("/annotate-essence", json={}).status_code == 401
          for _v in ("WORKER_API_KEY", "WORKER_ALLOW_ANONYMOUS"):
              os.environ.pop(_v, None)
          print("  ✓ key+匿名开关同时在: anonymous_allowed=False, 但 mode 点名提醒")
          PY

      - name: 批量接表 —— 链接解析 / 路径穿越闸 / 覆盖闸 / 逐表隔离
        run: |
          pip install -q fastapi 'httpx<0.28' 'starlette' >/dev/null
          python - <<'PY'
          # 接表从"一次一张"变成"一次一批"(onboarder/batch.py + links.py)。批量把三
          # 类原来无所谓的错放大成了会真的咬人的错, 这一步逐条钉住:
          #
          #   ① project_id 当文件名用, 而它来自 workflow_dispatch 的自由文本输入,
          #      随后被 git add + push —— 没有人在中间看一眼。
          #   ② 覆盖已存在的 mapping = 把策略 lead 审过的判断项换成模型的新猜测,
          #      而 diff 里它长得就像一次正常更新。一张表时人还看得见, 一批 6 张
          #      没人逐个核对。
          #   ③ 一张表挂掉不能带走整批 —— 否则第 6 张超时会让前 5 张白跑
          #      (每张都是一次全表扫描 + 一次 LLM 调用)。
          import io, json, os, shutil, sys, tempfile, threading
          from contextlib import redirect_stdout
          from http.server import BaseHTTPRequestHandler, HTTPServer
          from pathlib import Path

          import yaml

          from onboarder import batch, core, links
          from onboarder import vocab as ov

          # ── ① 路径穿越:project_id 只走白名单 ──────────────────────────
          #
          # 判据是**被禁止的形态**能不能落盘到 mappings/ 外面, 不是"正则长什么样"。
          for evil in ("../../.github/workflows/ci", "a/b", "..", "", ".", "-x",
                       "x" * 80, "a\\b"):
              try:
                  links.safe_project_id(evil)
                  raise AssertionError(f"project_id {evil!r} 被放行了 —— 它会当文件名落盘")
              except links.LinkError:
                  pass
          for ok in ("WTG_phase1", "TXQ.phase2", "a"):
              assert links.safe_project_id(ok) == ok
          # 归一化必须贯穿到**拼文件名的那一层**。safe_project_id 会 strip 掉两侧空白,
          # 而 draft() 内部的归一化只影响写进 yaml 的那一行 —— 两边不一致时
          # `--project-id ' TXQ_phase2 '` 产出 `mappings/ TXQ_phase2 .yaml` 而内容是
          # `project_id: TXQ_phase2`, 正好撞本文件末尾那条 mapping lint。(codex review)
          assert links.safe_project_id(" TXQ_phase2 ") == "TXQ_phase2"
          import inspect
          for fn, where in ((core.run_onboarding, "core.run_onboarding"),
                            (batch.run_batch, "batch.run_batch")):
              assert "safe_project_id" in inspect.getsource(fn), \
                  f"{where} 拼文件名之前没过 project_id 闸(纵深:别指望调用方记得校验)"
          print("  ✓ project_id 白名单挡住路径穿越, 且归一化贯穿到落盘那一层")

          # ── ② 链接解析:/base/ 与 /wiki/ 同一条路径 ───────────────────
          got = links.parse_feishu_url("https://x.feishu.cn/base/App1?table=tblA&view=vewB")
          assert (got["kind"], got["token"], got["table_id"]) == ("base", "App1", "tblA"), got
          assert links.parse_feishu_url("https://x.feishu.cn/wiki/wikN?table=tblB")["kind"] == "wiki"
          # 国际版 Lark 的 API 主机不同(open.larksuite.com), 而客户端固定 open.feishu.cn
          # —— 不拦的话表现为"这张表不存在"。
          for bad in ("https://x.larksuite.com/base/App?table=tblA",
                      "https://evil.example.com/base/App?table=tblA",
                      "https://x.feishu.cn/docx/AAA", ""):
              try:
                  links.parse_feishu_url(bad)
                  raise AssertionError(f"{bad!r} 被当成合法飞书表链接了")
              except links.LinkError:
                  pass
          print("  ✓ 链接解析: larksuite / 非飞书域名 / 非表链接 一律拒")

          # /base/ 和 /wiki/ 的 token 都**直接**当 app_token 用 —— 解析阶段一次网都不联,
          # 两种形态走同一条路径(2026-08-28 用户口径修正:飞书两种 token 都收)。
          seen = []
          import onboarder.clients as C
          C.resolve_wiki_node = lambda t: (seen.append(t), "APP_FROM_WIKI")[1]
          for u, want in (("https://x.feishu.cn/base/App?table=tblA", ("App", "tblA")),
                          ("https://x.feishu.cn/wiki/wikN?table=tblB", ("wikN", "tblB"))):
              assert core.resolve_table_ref(url=u) == want, u
          assert seen == [], f"解析阶段就去换 obj_token 了(成功路径上不该有这次调用): {seen}"
          print("  ✓ /base/ 与 /wiki/ 同一条路径, token 直接用, 解析阶段零联网")

          # 兜底只在**第一次取数失败之后**才花那一次调用, 且换成功后**后续取数要用换过的
          # 那个** —— 一半用新一半用旧会表现成"字段拉到了但一行数据都没有"。
          seen.clear()
          used = []
          def _flaky(tok):
              used.append(tok)
              if tok != "APP_FROM_WIKI":
                  raise RuntimeError("NOTEXIST")
              return ["ok"]
          assert core._with_wiki_fallback(_flaky, "wikN") == (["ok"], "APP_FROM_WIKI")
          assert used == ["wikN", "APP_FROM_WIKI"] and seen == ["wikN"], (used, seen)
          # 成功路径:一次就成, 不许再去换
          seen.clear(); used.clear()
          assert core._with_wiki_fallback(lambda t: ["ok"], "App") == (["ok"], "App")
          assert seen == [], "第一次就成功了还去换 obj_token"
          # 两次都失败 → 抛**第一个**异常(权限/表不存在才是要看的, 不是"它不是知识库节点")
          C.resolve_wiki_node = lambda t: (_ for _ in ()).throw(RuntimeError("不是知识库节点"))
          try:
              core._with_wiki_fallback(_flaky, "App")
              raise AssertionError("两次都失败却没抛")
          except RuntimeError as exc:
              assert "NOTEXIST" in str(exc), f"抛的是兜底路径的副产物, 会把人带偏: {exc}"
          print("  ✓ 换 obj_token 只在取数失败后发生 · 换过之后后续取数跟着换 · 报错报第一个")

          # 省了 ?table= 且这个 base 有多张表 → **报错并列候选**, 不猜。猜错的代价是
          # 跑完一整轮飞书全表扫描 + 一次 LLM 调用, 才得到一份接错表的 mapping。
          C.resolve_wiki_node = lambda t: "APP_FROM_WIKI"
          C.list_tables = lambda a: [{"table_id": "tbl1", "name": "投放"},
                                     {"table_id": "tbl2", "name": "结算"}]
          try:
              core.resolve_table_ref(url="https://x.feishu.cn/base/App")
              raise AssertionError("多表 base 省了 ?table= 却猜了一张")
          except links.LinkError as exc:
              # LinkError 而不是 RuntimeError —— 见下面 ③ 的端点状态码断言。
              assert "tbl1" in str(exc) and "tbl2" in str(exc), exc
          C.list_tables = lambda a: [{"table_id": "tblOnly", "name": "投放"}]
          assert core.resolve_table_ref(url="https://x.feishu.cn/base/App") == ("App", "tblOnly")
          print("  ✓ 缺 ?table= 时: 单表自动取, 多表报候选而不猜")

          # 协议 / token 长度:urlsplit 之后拿到的 token 会被原样拼进飞书 API URL。
          for bad in ("javascript://x.feishu.cn/base/App?table=tblA",
                      "file://x.feishu.cn/base/App?table=tblA",
                      "https://x.feishu.cn/base/" + "A" * 200 + "?table=tblB"):
              try:
                  links.parse_feishu_url(bad)
                  raise AssertionError(f"{bad[:40]!r}… 被放行了")
              except links.LinkError:
                  pass
          print("  ✓ 只认 http(s) scheme · token 有长度上限")

          # ── ②-b 输入错 vs 服务坏, 必须是两个状态码 ────────────────────
          #
          # 这两类的**处置完全相反**:400 → 换一条链接; 500 → 去查 Railway / 网关 /
          # 飞书权限。混成一类的话, 批量汇总会把"链接没带 ?table="报成服务故障, 人就
          # 去查完全错的方向。判据钉在**端点的状态码**上, 不是"抛了哪个异常类"
          # —— 换等价异常不假警报, 把这条路径退回 500 会红。(codex review)
          import os as _os
          from fastapi.testclient import TestClient
          import onboarder.app as OA
          _os.environ["ONBOARDER_API_KEY"] = "k"
          _c, _H = TestClient(OA.app), {"X-Onboarder-Key": "k"}
          C.list_tables = lambda a: [{"table_id": "tbl1", "name": "投放"},
                                     {"table_id": "tbl2", "name": "结算"}]
          _r = _c.post("/onboard", json={"project_id": "P_p1",
                                         "url": "https://x.feishu.cn/base/App"}, headers=_H)
          assert _r.status_code == 400, f"歧义链接(调用方能自己修)回了 {_r.status_code}"
          assert "tbl1" in _r.json()["detail"], _r.json()
          def _boom(a):
              raise RuntimeError("Feishu 5xx / bot 无权限")
          C.list_tables = _boom
          assert _c.post("/onboard", json={"project_id": "P_p1",
                                           "url": "https://x.feishu.cn/base/App"},
                         headers=_H).status_code == 500, "真的服务故障被降成了 4xx"
          _os.environ.pop("ONBOARDER_API_KEY", None)
          print("  ✓ 歧义链接=400(带候选表) · 真服务故障=500(两类没混)")

          # ── ②-c 清单的空列不许把畸形条目塌成"另一张合法的表" ──────────
          #
          # `P | AppToken | | 50` 无差别滤空列之后成 `P | AppToken | 50`, 于是 50 被当
          # table_id 收下(前缀检查只是警告), 清单校验还报通过 —— 少一列该是报错, 不是
          # 换个值继续。(codex review)
          _e, _err = links.parse_batch_spec("P_p1 | AppToken | | 50")
          assert not _e and _err, f"畸形 id 式被塌成了合法条目: {_e}"
          _e, _err = links.parse_batch_spec("P_p1 | https://x.feishu.cn/base/A?table=tblB |")
          assert len(_e) == 1 and not _err, ("尾部多打一个 | 不该报错", _e, _err)
          print("  ✓ 中间空列 → 报缺列; 尾部多余的 | 仍容忍")

          # ── ②-e 能本地算出 id 就送 id, 不送 url(服务端版本错配) ───────
          #
          # `url` 是**服务端**(Railway)新加的字段, 而 Railway 是独立部署的 ——
          # 代码 merge 进 GitHub ≠ 那个服务重新部署了。首次真跑(2026-08-28 run#15)
          # 六张表全部拿到 `HTTP 400: missing required field: app_token`, 那是**旧版
          # app.py 的文案**:服务还跑着老代码。
          #
          # 而链接解析是纯客户端、不联网的 —— 链接带了 ?table= 时两个 id 本地就能算出,
          # 送 id 则新旧服务端都认。判据钉在**请求体形状**上:回退成"有 url 就送 url"
          # 会红。
          #
          # ⚠️ 这条断言管的是**入参形状**, 不是"任何 token 都取得到数"。/wiki/ 的 token
          #    能否直接当 app_token 用取决于飞书 —— 新服务端取数失败还能换 obj_token,
          #    旧服务端没那一步, 而客户端补救不了(runner 没有飞书凭证)。那种情况的出路是
          #    重部署 Railway, 不是改这里:送 url 只会让旧服务端 400, 严格更差。(codex review)
          for _u in ("https://x.feishu.cn/base/App1?table=tblA",
                     "https://x.feishu.cn/wiki/wikN?table=tblB"):   # /wiki/ 同样送 id
              _p = batch.build_payload({"project_id": "P_p1", "url": _u, "app_token": None,
                                        "table_id": None, "sample_n": None}, sample_n=30)
              assert "url" not in _p and _p.get("app_token") and _p.get("table_id"), \
                  f"链接自带 ?table= 却送了 url —— 旧版服务端会 400: {_p}"
          # 缺 ?table= 时**只能**送 url:客户端(GH runner)没有飞书凭证, 列不了表。
          _p = batch.build_payload({"project_id": "P_p1", "url": "https://x.feishu.cn/base/AppOnly",
                                    "app_token": None, "table_id": None, "sample_n": None}, sample_n=30)
          assert "url" in _p and "app_token" not in _p, _p
          # 但重跑清单里给人看的仍是他原本贴的**链接**, 不是 id
          assert batch._ref_of({"project_id": "T", "url": "https://x.feishu.cn/base/A?table=tblB",
                                "app_token": None, "table_id": None}).startswith("https://")
          print("  ✓ 链接带 ?table= → 送 id(新旧服务端都认); 缺 ?table= 才送 url")

          # ── ②-f 「待确认」不许系统性报 0 ─────────────────────────────
          #
          # 这个方向的错是**最坏的那种**:汇总里「待确认 0」会让人以为"没什么要拍板的,
          # 可以合了", 而真相恰好相反 —— README 原则 1 那道人工闸门正是靠这些标记提示的。
          #
          # vocab.validate_mapping 的 pending 判的是字段【值】是不是占位符, 而模型的实际
          # 写法是【值填真实词表值 + 把 [待确认] 写进行尾注释】, 注释在 safe_load 之后就
          # 没了。首批真跑(run#16)实测:TUGE 草稿 32 处 [待确认]、ANSHEN 22 处, 汇总那一
          # 列都报 0。(eval_wtg 的文档字符串早写了这个坑, 只是当时只用在别处。)
          _real = ("project_id: P_p1\n"
                   "direction_decomposition:\n"
                   '  "上岸反馈":\n'
                   "    content_format: 情感叙事          # [待确认] 上岸经历分享\n"
                   '    target_audience: ["通用"]         # [待确认]\n')
          _v = ov.validate_mapping(yaml.safe_load(_real), columns=None)
          assert len(_v["pending"]) == 0, \
              "校验器居然看见注释里的 [待确认] 了? 那这条断言的前提变了, 该重写"
          assert batch.count_pending({"mapping_yaml": _real, "pending": _v["pending"]}) == 2, \
              "注释里的 [待确认] 没被数进来 —— 汇总会报 0, 读的人会以为没东西要拍板"
          # 值本身是占位符的那种也不能漏(两条来源取较大者)
          assert batch.count_pending({"mapping_yaml": "a: b\n", "pending": ["x", "y", "z"]}) == 3
          print("  ✓ 「待确认」同时数注释标记与校验器 pending(不会系统性报 0)")

          # ── ②-d 重跑清单必须真的能粘回去 ─────────────────────────────
          #
          # 汇总里那份"重跑清单"是对人的承诺。id 式若被压成 `app_token/table_id` 一列,
          # 粘回去会被判成缺列 —— 照着做才发现不行, 比不给更坏。判据是**往返**:
          # 吐出来的那一行喂回解析器, 必须解出同一张表。(codex review)
          _line = "P_p1 | " + batch._ref_of({"project_id": "P_p1", "url": None,
                                             "app_token": "AppTok", "table_id": "tblB"})
          _e2, _err2 = links.parse_batch_spec(_line)
          assert len(_e2) == 1 and not _err2, (_line, _err2)
          assert (_e2[0]["app_token"], _e2[0]["table_id"]) == ("AppTok", "tblB"), _e2[0]
          print(f"  ✓ id 式失败项的重跑行往返一致: {_line}")

          # ── ③ 清单错 → 整批一张都不跑 ────────────────────────────────
          #
          # 跑一半再报错会留下"部分接进来了"的中间态, 而要靠人去分辨哪几张成了。
          entries, errs = links.parse_batch_spec(
              "A_p1 | https://x.feishu.cn/base/App?table=tblA\n"
              "A_p1 | https://x.feishu.cn/base/App?table=tblB\n"      # 重名 → 后一条会覆盖前一条
              "BAD\n"                                                  # 列数不够
              "../evil | https://x.feishu.cn/base/App?table=tblC\n")   # 路径穿越
          assert len(entries) == 1 and len(errs) == 3, (entries, errs)
          assert any("重复" in e for e in errs), errs
          print("  ✓ 清单里的重名 / 缺列 / 坏 project_id 一次全报(不是报第一条就抛)")

          # ── ④ 端到端:逐表隔离 + 覆盖闸 + 退出码 ──────────────────────
          class H(BaseHTTPRequestHandler):
              def log_message(self, *a): pass
              def do_POST(self):
                  body = json.loads(self.rfile.read(int(self.headers["Content-Length"])))
                  HITS.append(body["project_id"])
                  pid = body["project_id"]
                  if pid == "BOOM_p1":
                      self.send_response(500); self.end_headers()
                      self.wfile.write(b'{"detail":"boom"}'); return
                  clean = pid != "DIRTY_p1"
                  payload = {"mapping_yaml": f"project_id: {pid}\nfield_mapping: {{}}\n",
                             "review_brief": "brief",
                             "errors": [] if clean else ["content_format: 取值 '瞎编' 不在词表内"],
                             "uncovered": [] if clean else ["神秘列"],
                             "pending": ["brand"], "is_error": not clean}
                  raw = json.dumps(payload).encode()
                  self.send_response(200)
                  self.send_header("Content-Length", str(len(raw))); self.end_headers()
                  self.wfile.write(raw)

          HITS = []
          srv = HTTPServer(("127.0.0.1", 0), H)
          threading.Thread(target=srv.serve_forever, daemon=True).start()
          URL = f"http://127.0.0.1:{srv.server_address[1]}"
          out = Path(tempfile.mkdtemp())
          SPEC = ("OK_p1    | https://x.feishu.cn/base/App?table=tbl1\n"
                  "BOOM_p1  | https://x.feishu.cn/base/App?table=tbl2\n"
                  "DIRTY_p1 | https://x.feishu.cn/base/App?table=tbl3\n"
                  "OK2_p1   | https://x.feishu.cn/base/App?table=tbl4\n")

          def run(argv):
              buf = io.StringIO()
              with redirect_stdout(buf):
                  rc = batch.main(argv)
              return rc, buf.getvalue()

          # 中间那张 500, 后面的必须照跑完
          rc, _ = run(["--spec", SPEC, "--remote", URL, "--api-key", "k", "--out-dir", str(out)])
          assert HITS == ["OK_p1", "BOOM_p1", "DIRTY_p1", "OK2_p1"], \
              f"一张表失败带走了后面的: {HITS}"
          assert rc == 1, f"有失败/需修的表却返回 {rc}"
          written = sorted(p.name for p in out.glob("*.yaml"))
          assert written == ["DIRTY_p1.yaml", "OK2_p1.yaml", "OK_p1.yaml"], written
          assert not (out / "BOOM_p1.yaml").exists(), "失败的表也写盘了(半截 mapping 比没有更坏)"
          print("  ✓ 一张 500 不带走整批 · 只为出了草稿的表写盘 · 有问题就非 0 退出")

          # 覆盖闸:已存在 → 跳过, 且**在花钱之前**跳过
          HITS.clear()
          (out / "OK_p1.yaml").write_text("project_id: OK_p1\n# 策略 lead 审过的\n", encoding="utf-8")
          rc, _ = run(["--spec", "OK_p1 | https://x.feishu.cn/base/App?table=tbl1",
                       "--remote", URL, "--api-key", "k", "--out-dir", str(out)])
          assert HITS == [], "已存在的表还是发了请求 —— 白烧一次全表扫描 + 一次 LLM"
          assert "审过的" in (out / "OK_p1.yaml").read_text(encoding="utf-8"), "人审内容被盖掉了"
          assert rc == 1, "跳过了却报成功"
          rc, _ = run(["--spec", "OK_p1 | https://x.feishu.cn/base/App?table=tbl1",
                       "--remote", URL, "--api-key", "k", "--out-dir", str(out), "--overwrite"])
          assert HITS == ["OK_p1"] and rc == 0
          assert "审过的" not in (out / "OK_p1.yaml").read_text(encoding="utf-8")
          print("  ✓ 默认不覆盖已有 mapping(且不发请求), --overwrite 才重写")

          # 清单有错时一个请求都不许发
          HITS.clear()
          rc, _ = run(["--spec", "GOOD_p1 | https://x.feishu.cn/base/App?table=tbl1\n../evil | x",
                       "--remote", URL, "--api-key", "k", "--out-dir", str(out)])
          assert rc == 2 and HITS == [], f"清单有错却开跑了: rc={rc} hits={HITS}"
          # --dry-run 同样零请求、零写盘
          HITS.clear()
          shutil.rmtree(out, ignore_errors=True); out.mkdir(parents=True)
          rc, _ = run(["--spec", SPEC, "--remote", URL, "--dry-run", "--out-dir", str(out)])
          assert rc == 0 and HITS == [] and not list(out.glob("*")), "dry-run 联网/写盘了"
          print("  ✓ 清单错 → exit 2 零请求 · --dry-run 零请求零写盘")
          srv.shutdown()

          # ── ⑤ 汇总表格不许被异常消息撑烂 ─────────────────────────────
          #
          # detail 装的是 HTTP 响应体 / 飞书报错, 里面有 | 和换行是常事。这份表格
          # 是汇总里唯一"一眼看完"的部分, 撑烂了整批结果就没人读了。
          import re
          row = [l for l in batch.render_summary(
              [{"project_id": "X", "status": "failed", "ref": "u",
                "detail": 'HTTP 500: {"a|b"\nmulti-line}' * 20,
                "errors": [], "uncovered": [], "pending": []}]).splitlines()
              if l.startswith("| `X`")][0]
          assert len(re.findall(r"(?<!\\)\|", row)) == 6, f"未转义的 | 把表格撑成了: {row}"
          assert "\n" not in row and len(row) < 250, row
          print("  ✓ 汇总表格对含 | / 换行 / 超长的异常消息是安全的")

          # ── ⑥ 草稿的 project_id 必须等于文件名 ───────────────────────
          #
          # 本文件末尾的 mapping lint 判 `data["project_id"] != 文件名` 直接红。文件名
          # 由请求参数定、yaml 里那一行由模型写 —— 漂了就是一份"其它都对、只有一行
          # 机械字段不对"的草稿在 CI 上红。它是已知输入, 不是判断项。
          assert core._ensure_project_id("project_id: WRONG\nbrand: X\n", "TXQ_p2") \
              .startswith("project_id: TXQ_p2")
          assert core._ensure_project_id("brand: X\n", "TXQ_p2").startswith("project_id: TXQ_p2")
          # 缩进块里的同名键不许被动(它是别的东西, 比如 raw_extra 里的一列)
          assert "  project_id: inner" in core._ensure_project_id(
              "project_id: WRONG\nblk:\n  project_id: inner\n", "TXQ_p2")
          print("  ✓ 草稿的顶层 project_id 被钉成文件名(缩进块里的同名键不动)")
          print("批量接表自检通过")
          PY

      - name: 网关超时不许空转重试, 且报错要自解释 (2026-08-28 实测 524)
        run: |
          python - <<'PY'
          # 2026-08-28 接 LNKT 那张表时, Railway 日志里是:
          #     POST https://tdyun.ai/v1/messages "HTTP/1.1 524"
          #     Retrying request to /v1/messages in 0.469400 seconds
          #     POST https://tdyun.ai/v1/messages "HTTP/1.1 524"
          # 524 是**中转站前面的 Cloudflare**说"源站在我的等待上限内没回话"。三件事错了:
          #
          #   ① 524/522/520 都不在显式的瞬时状态表里, 只是碰巧因为 CF 错误页里有
          #      "timeout" 字样才被判成可重试 —— 靠错误页文案兜底, 换个网关就失效。
          #   ② 重试有**两层**:SDK 默认 2 次 × 这里 4 次 = 12 次, 每次都卡满网关上限。
          #      单张表最坏烧 20 分钟, 六张表的批量跑了 28.5 分钟 —— 时间全花在超时上。
          #   ③ 报错只是个 524, 看的人要重走一遍"到底是飞书、Railway 还是网关在超时"。
          #      (这次就走了两轮:先误判成"Railway 服务挂了", 靠日志才定位到网关。)
          import os, sys, types

          from onboarder import clients

          class Err(Exception):
              def __init__(s, msg, status=None):
                  super().__init__(msg); s.status_code = status

          calls = []

          def fake(status, msg, n_fail=99):
              mod = types.ModuleType("anthropic")
              class Stream:
                  def __enter__(s):
                      calls.append("stream")
                      if status and len([c for c in calls
                                         if c in ("stream", "create")]) <= n_fail:
                          raise Err(msg, status)
                      return s
                  def __exit__(s, *a): return False
                  @property
                  def text_stream(s): return iter(["ok"])
              class C:
                  def __init__(s, **kw): calls.append(kw)
                  @property
                  def messages(s): return s
                  def stream(s, **kw): return Stream()
                  def create(s, **kw):
                      calls.append("create")
                      if len([c for c in calls if c in ("stream", "create")]) <= n_fail:
                          raise Err(msg, status)
                      return types.SimpleNamespace(
                          content=[types.SimpleNamespace(type="text", text="ok")])
              mod.Anthropic = C
              sys.modules["anthropic"] = mod

          clients.time.sleep = lambda s: None      # 别在 CI 里真睡退避
          os.environ.pop("ONBOARDER_STREAM", None)

          # ① 只留一层重试 —— 判据钉在传给 SDK 的参数上
          calls.clear(); fake(524, "524 A timeout occurred")
          try:
              clients.call_anthropic("p", "claude-opus-4-6")
          except RuntimeError:
              pass
          assert calls[0].get("max_retries") == 0, \
              f"没关掉 SDK 自己的重试 —— 会和这里的退避相乘: {calls[0]}"

          # ② 网关超时立刻停。重试没用:它不是抖动, 是这次生成本来就超过了上限。
          #    (数 stream+create 两种 —— 默认走流式, 逃生口下才走 create)
          n = len([c for c in calls if c in ("stream", "create")])
          assert n == 1, f"524 上重试了 {n} 次 —— 每次都会卡满网关的等待上限"

          # ③ 报错必须自解释:说清是谁在超时 + 当时用的模型 + 怎么解
          calls.clear(); fake(524, "524 A timeout occurred")
          try:
              clients.call_anthropic("p", "claude-opus-4-6")
              raise AssertionError("网关超时却没抛")
          except RuntimeError as exc:
              msg = str(exc)
              for must in ("网关超时", "Cloudflare", "claude-opus-4-6", "不是飞书"):
                  assert must in msg, f"报错里没有 {must!r} —— 看的人还得重查一遍是谁超时"
          print("  ✓ 网关超时: 单层重试 · 不空转 · 报错点名是谁超时/什么模型/怎么解")

          # ③-b 默认走**流式**, 且建议要看当前状态给, 不能写死
          #
          # 524 是**读**超时:CF 在 120s 内没收到任何字节才触发("did not return a
          # complete response within the 120-second Proxy Read Timeout window")。
          # 流式下 token 持续外吐, 计时器不触发 —— 这是 524 的标准解。实测(run#19,
          # 已经换成 sonnet 之后)决定成败的是**列数**不是行数:
          #     LNKT 52 列 ❌ · XIWU 31 列 ❌ · SPX 20 列/294 行 ✅ · BJS 15 列 ✅
          # 所以换模型只是把线往后挪, 挪不过宽表。
          calls.clear(); fake(None, "", n_fail=0)
          assert clients.call_anthropic("p", "m") == "ok"
          assert "stream" in calls and "create" not in calls, f"默认没走流式: {calls}"
          # 逃生口:万一中转站不好好代理 SSE, 不改代码就能退回
          os.environ["ONBOARDER_STREAM"] = "0"
          calls.clear(); fake(None, "", n_fail=0)
          assert clients.call_anthropic("p", "m") == "ok"
          assert "create" in calls and "stream" not in calls, f"逃生口失效: {calls}"
          # 非流式下超时 → 要建议"先开流式", **不能**建议换一个已经在用的模型。
          # 第一版就是无条件写着"换成 claude-sonnet-4-6", 而实测那次日志里 model
          # 就是 sonnet-4-6 —— 让人去做他已经做过的事, 比不给建议更浪费时间。
          calls.clear(); fake(524, "524 A timeout occurred")
          try:
              clients.call_anthropic("p", "claude-sonnet-4-6"); raise AssertionError("没抛")
          except RuntimeError as exc:
              msg = str(exc)
              assert "流式=关" in msg and "ONBOARDER_STREAM=0" in msg, msg
              assert "换更快的模型" not in msg, \
                  "还在无条件建议换模型 —— 实测那次已经是 sonnet 了"
          os.environ.pop("ONBOARDER_STREAM", None)
          # 流式下仍超时 → 指向"中转站没真的透传 SSE", 而不是重复上一条建议
          calls.clear(); fake(524, "524 A timeout occurred")
          try:
              clients.call_anthropic("p", "claude-sonnet-4-6"); raise AssertionError("没抛")
          except RuntimeError as exc:
              assert "流式=开" in str(exc) and "透传 SSE" in str(exc), str(exc)
          print("  ✓ 默认流式(524 的标准解)· 有 ONBOARDER_STREAM=0 逃生口 · 建议按当前状态给")

          # ④ 真正的瞬时错误(529 过载)仍然要重试到成功, 别把这条也一起关了
          calls.clear(); fake(529, "529 overloaded", n_fail=2)
          assert clients.call_anthropic("p", "m") == "ok"
          assert len([c for c in calls if c in ("stream", "create")]) == 3
          # ⑤ 非瞬时(401)立刻抛, 别把鉴权错误也重试四遍
          calls.clear(); fake(401, "401 unauthorized")
          try:
              clients.call_anthropic("p", "m"); raise AssertionError("401 没抛")
          except Err:
              pass
          assert len([c for c in calls if c in ("stream", "create")]) == 1
          print("  ✓ 529 仍重试到成功 · 401 立刻抛(没把重试一刀切掉)")
          PY

      - name: 接表 workflow 不把 dispatch 输入插进 shell (脚本注入)
        run: |
          python - <<'PY'
          # onboard-table.yml 手里有 contents:write, 且它的输入是网页表单里的自由
          # 文本(project_id / 飞书链接 / 批量清单)。`${{ inputs.x }}` 直接写进 run:
          # 时, 这些文本是被**当成 shell 源码拼进脚本**的 —— 一条带反引号或分号的
          # "表名"就能在 runner 上执行任意命令并 push。走 env: 之后它只是个变量值。
          #
          # 判据是**被禁止的形态**: 任何 run: 块里不许出现 ${{ inputs.* }} /
          # ${{ github.event.inputs.* }}。secrets 同理(还会顺带泄进日志)。
          import re, sys
          import yaml

          BAD = re.compile(r"\$\{\{\s*(inputs\.|github\.event\.inputs\.|secrets\.)")
          bad = []
          for path in (".github/workflows/onboard-table.yml",):
              wf = yaml.safe_load(open(path, encoding="utf-8"))
              for job_name, job in (wf.get("jobs") or {}).items():
                  for idx, step in enumerate(job.get("steps") or []):
                      script = step.get("run")
                      if script and BAD.search(script):
                          where = step.get("name") or f"step #{idx}"
                          bad.append(f"{path} / {job_name} / {where}: "
                                     f"{BAD.search(script).group(0)}…")
          if bad:
              print("以下 run: 块把不可信输入直接插进了 shell —— 改走 step 的 env::")
              for b in bad:
                  print("  ✗ " + b)
              sys.exit(1)
          print("  ✓ 接表 workflow 的 dispatch 输入 / secrets 都走 env, 没插进 shell")
          PY

      - name: daily-sync 把 409 当瞬时失败 (不拖红 · 配合 worker 互斥锁)
        run: |
          python - <<'PY'
          # worker 忙时回 409。daily-sync 的 worker_fail_kind() 若把它判成 systemic,
          # 第一批就 409 会让整个夜间同步报红 —— 加锁反而制造了告警噪音。
          #
          # ⚠️ daily-sync.yml 里有【多份】worker_fail_kind() 定义(essence 一份、
          #    curate 一份, 各自内联在自己那步的 shell 里)。本测试最初用
          #    re.search 只取第一份 —— 于是 essence 那份补了 409、curate 那份没补,
          #    测试照样全绿。codex PR#104 review 抓到了漏的那份。
          #    现在用 finditer 遍历【每一份】, 并断言份数下限, 少了也当失败。
          import re, subprocess, textwrap, pathlib
          yml = pathlib.Path(".github/workflows/daily-sync.yml").read_text(encoding="utf-8")
          defs = [textwrap.dedent(m.group(0))
                  for m in re.finditer(r"( *)worker_fail_kind\(\) \{.*?\n\1\}", yml, re.S)]
          assert len(defs) >= 2, (
              f"只找到 {len(defs)} 份 worker_fail_kind() —— 期望 essence + curate 各一份。"
              "少了就是有一步不再做失败分类了, 或正则失配, 两种都不能放过。"
          )
          cases = {
              ("0", "409"): "transient",   # worker 忙 → 幂等下轮续
              ("0", "502"): "transient",
              ("28", "000"): "transient",  # curl 超时
              ("0", "401"): "systemic",    # 鉴权坏 → 必须红
              ("0", "404"): "systemic",
              ("6", "000"): "systemic",    # DNS 挂 = URL 配坏
          }
          for i, fn in enumerate(defs, 1):
              for (rc, code), want in cases.items():
                  got = subprocess.run(["bash", "-c", f"{fn}\nworker_fail_kind {rc} {code}"],
                                       capture_output=True, text=True).stdout.strip()
                  assert got == want, (
                      f"第 {i}/{len(defs)} 份分类器: curl_rc={rc} HTTP={code} → {got!r}, 期望 {want!r}"
                  )
              print(f"  ✓ 第 {i}/{len(defs)} 份 worker_fail_kind: {len(cases)}/{len(cases)} 用例通过")
          print(f"\ndaily-sync 失败分类: {len(defs)} 份 × {len(cases)} 用例全通过")
          PY

  sql:
    name: SQL apply (Postgres 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tv_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGPASSWORD: postgres
      PGHOST: localhost
      PGUSER: postgres
      PGDATABASE: tv_ci
    steps:
      - uses: actions/checkout@v4
      - name: Install psql client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Apply truth_vault schema
