          # ② 隔离表按 (project, record, reason) 去重且 ignore_duplicates(保 reviewer 状态)。
          #    reason 恒为 "undeclared_fields" 时, 同一条记录第二次因【另一批新列】被隔离
          #    会被整条丢掉 —— 表里留着的还是上一批列的 raw_row。OKMAN 实测: 9/3~9/4 因
          #    「评论关键词」隔离 346 行, 隔离表里最新一条却停在 8/21「链接文本」(D-051 早已
          #    声明掉的旧列), 于是 D-051 定的动作「按隔离表里的真实值判该怎么声明」拿到过期的错。
          #    ⚠️ 2026-09-11(D-055)起这一段【已被取代】: 未声明列根本不再进隔离表了
          #    (值收进 raw_extra["_undeclared"], 行照常入库), 所以 undeclared_fields:<列名>
