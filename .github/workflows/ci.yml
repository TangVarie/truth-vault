      - name: preflight_mapping projection self-check
        working-directory: scripts
        run: |
          python - <<'PY'
          # preflight_mapping 是接新表前的只读体检, 它的全部价值就是【照着真 sync 投影一遍】。
          # 所以真 sync 的行为一变, 这里必须跟着变, 否则接表流程会按一套早就不存在的规矩
          # 把表拦在门外 —— D-055 起未声明列不再挡行, 值收进 raw_extra._undeclared 照常入库,
          # 于是 r4(有正文 + 未声明列)从 q_undeclared 变成 upsert 且额外计一笔 absorbed。
          # (codex PR#125 review P2: 真 sync 收得下的表, preflight 还在 exit 1)
          # 复用真 transform_row, 用真实 NUC_phase1 mapping + 合成记录 pin 住投影分类:
          #   真笔记→upsert · 空占位/评论碎片→q_empty · 未声明列+正文→upsert + absorbed
          #   · 未知方向→dirs_missing。
          import preflight_mapping as pf
          from _common import load_mapping
          m = load_mapping("NUC_phase1")
          records = [
            {"record_id": "r1", "fields": {"文案": "糖尿病老人营养", "互动量": 1000,
                                           "方向": "糖尿病相关", "状态": "爆贴大爆", "素人编号": "acc1"}},
            {"record_id": "r2", "fields": {"父记录 2": [{"text": "link"}]}},
            {"record_id": "r3", "fields": {"发布时间": 1733300000000, "随贴评论": "好用", "评论状态": "已评"}},
            {"record_id": "r4", "fields": {"文案": "真内容", "某未声明列": "x"}},
            {"record_id": "r5", "fields": {"文案": "内容b", "方向": "不存在的方向", "素人编号": "acc2"}},
          ]
          s = pf.project_rows(m, records, show_cap=8)
          p = s["proj"]
          assert s["n"] == 5, s["n"]
          assert p["upsert"] == 3, dict(p)          # r1 + r5 + r4(带未声明列也照常入库)
          assert p["q_empty"] == 2, dict(p)         # r2 空占位 + r3 评论碎片
          assert p["absorbed"] == 1, dict(p)        # r4 的未声明列被吸收(**但行没丢**)
          assert not p.get("q_undeclared"), \
              f"preflight 还在按整行 quarantine 投影 —— 真 sync 收得下的表会被接表流程拦死: {dict(p)}"
          assert dict(s["undeclared_cols"]) == {"某未声明列": 1}, s["undeclared_cols"]
          assert dict(s["undeclared_with_content"]) == {"某未声明列": 1}, "未声明列没被点出来=待处理清单没了"
          assert s["tiers"].get("大爆") == 1, dict(s["tiers"])
          assert s["dirs_missing"].get("不存在的方向") == 1, dict(s["dirs_missing"])
          assert s["dirs_seen"].get("糖尿病相关") == 1, dict(s["dirs_seen"])
          print("  ✓ upsert=3 / q_empty=2 / absorbed=1(未声明列不再丢行)")
          print("  ✓ 未声明列仍被点名进待处理清单")
          print("  ✓ tier 大爆=1 / 未知方向标缺拆解")
          print("\npreflight_mapping projection: all checks passed")
          PY
