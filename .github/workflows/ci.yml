      - name: 已知待办名单只把红转黄, 一格也不许松开对账 (D-053, owner 2026-09-04)
        working-directory: scripts
        run: |
          python - <<'PY'
          # owner 2026-09-04: SPX 那 27 行(抖音接抖音)维持隔离、等运营理飞书, 但夜跑不能
          # 因此天天红 —— 天天红的 CI 等于没有 CI(OKMAN 静默丢行一个月就是这么来的)。
          # 于是: 隔离表里【人已认领】(status=reviewed/rejected)的行不计 errors。
          #
          # 这道闸最容易出的事故是顺手把对账也松开: 认领只是"我知道这行", 不是"处理成了"。
          # 它照样没被 upsert、照样没盖上本次 last_seen 戳 —— 放它进对账, 会被报成
          # "消失了"(COR-002/COR-011 堵掉的洞)。所以下面【驱动真的 main() 循环】验三件事,
          # 不靠读源码字符串。
          import io, json, logging, os, sys
          os.environ.setdefault("FEISHU_APP_ID", "x"); os.environ.setdefault("FEISHU_APP_SECRET", "y")
          import sync_feishu_notes_to_truth_vault as s

          # ⚠️ 这一行的 发布时间/曝光量/阅读量/互动量/流量状态 是**必须留着**的:
          #    少了它们整批就一个要害字段都产不出, D-056 那道闸会开火, 下面 errors 的
          #    精确断言全部错位 —— 而这道闸要验的是隔离认领, 跟要害字段没关系。
          XHS = {"record_id": "rXHS", "fields": {"素人编号": "1", "笔记内容": "原文案", "方向": "提问贴",
                                                 "笔记链接": {"link": "https://xhs/1", "text": "t"},
                                                 "发布时间": 1788710400000, "流量状态": ["爆贴"],
                                                 "曝光量": 100, "阅读量": 80, "互动量": 12}}
          DY1 = {"record_id": "rDY1", "fields": {"素人编号": "2", "方向": "抖音",
                                                 "笔记链接": {"link": "https://v.douyin.com/a", "text": "t"}}}
          DY2 = {"record_id": "rDY2", "fields": {"素人编号": "3", "方向": "抖音",
                                                 "笔记链接": {"link": "https://v.douyin.com/b", "text": "t"}}}

          def run(acked):
              cap = {}
              class FakeFeishu:
                  def __init__(self, *a, **k): pass
                  def list_records(self, *a, **k): return iter([XHS, DY1, DY2])
              s.FeishuClient = FakeFeishu
              s.get_supabase_client = lambda *a, **k: object()
              s.assert_db_schema_ready = lambda *a, **k: None
              s.ensure_project_exists = lambda *a, **k: None
              s.quarantine_record = lambda *a, **k: None
              s.fetch_acknowledged_quarantine = lambda sb, pid: set(acked)
              s.ensure_accounts_batch = lambda *a, **k: []
              s.upsert_metrics_batch = lambda *a, **k: (0, [])
              s.update_project_date_range = lambda *a, **k: None
              def fake_upsert(sb, notes, dry_run=False):
                  cap["notes"] = notes
                  return [n["note_id"] for n in notes]
              s.upsert_notes_batch = fake_upsert
              buf = io.StringIO(); h = logging.StreamHandler(buf); s.logger.addHandler(h)
              sys.argv = ["x", "SPX_phase1"]
              rc = s.main()
              s.logger.removeHandler(h)
              log = buf.getvalue()
              return rc, json.loads(log.split("Done: ")[1].split("\n")[0]), cap.get("notes", []), log

          # ① 没人认领 → 照常红(名单外的新隔离不许被顺手放过)
          rc, st, _, _ = run([])
          assert rc == 1 and st["errors"] == 1 and st["known_backlog"] == 0, (rc, st)

          # ② 人已认领 → 退出码转绿。
          #    ⚠️ 本 guard 的 supabase 是个裸 object(), 所以 D-058 那个"失败行在库里有没有
          #    note"的前置查询会**查不动** → 按设计退回最保守(当成都有 note)→ 照旧不盖戳。
          #    这里把这条【降级路径】断明白, 否则这几行会变成"因为查库失败才通过"的空跑守卫。
          #    放行那一侧由 COR-002 那道 guard 用能查动的 stub 正面验(两个分支都验)。
          rc, st, notes, log = run([("rDY2", "inherit_prev_row_is_same_kind")])
          assert rc == 0 and st["errors"] == 0 and st["known_backlog"] == 1, (rc, st)
          assert st["quarantined"] == 1, st
          assert "对账前置检查: 读 notes 失败" in log, \
              "查不动库时没走保守降级 —— 放宽对账的前提查不到就不该放宽(D-058)"
          stamped = [n for n in notes if n.get("last_seen_at")]
          assert not stamped, f"查不动库还照样盖戳 —— {len(stamped)} 条被盖了 last_seen 戳, 对账会报假消失"
          assert "不盖 last_seen 戳、也不做对账" in log, "对账闸没挡住"
          assert "其中已知待办 1" in log, "没在告警里说清有几条是已知待办"
          assert "别让它一直挂着" in log, "黄得看不见 = 把红压回去了"

          # ③ 认领的是【另一个 reason】→ 不许被顺带豁免(和隔离表去重键、和带列名的 reason 同一套)
          rc, st, _, _ = run([("rDY2", "undeclared_fields:某列")])
          assert rc == 1 and st["errors"] == 1 and st["known_backlog"] == 0, (rc, st)

          # ④ sync 自己不能把自己豁免掉: 写进去的永远是 pending, 名单只认人改过的 status
          import _common as c
          assert c._QUARANTINE_ACKED_STATUSES == ("reviewed", "rejected"), c._QUARANTINE_ACKED_STATUSES
          assert "pending" not in c._QUARANTINE_ACKED_STATUSES, "pending 进名单 = 隔离自动豁免自己, 这道闸就废了"
          assert "resolved" not in c._QUARANTINE_ACKED_STATUSES, "resolved 又冒出来说明没修好, 得红"
          print("  ✓ 未认领→红 · 已认领→绿但不盖戳不对账 · 换 reason 不顺带豁免 · pending/resolved 不进名单")
          PY
