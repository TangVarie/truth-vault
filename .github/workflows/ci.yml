          GOT4=$(psql -v ON_ERROR_STOP=1 -tA -c "SELECT coalesce(tier_thresholds::text,'NULL')||' '||(mapping_config ? 'tier_thresholds')::text FROM truth_vault.projects WHERE project_id='CI_D062'")
