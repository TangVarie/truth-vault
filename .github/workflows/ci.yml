          FULL = {"素人编号": "1", "文案": "正文", "发布时间": 1788710400000,
                  "反馈链接": {"link": "https://x", "text": "x"}, "方向": "D10-产品贴",
                  "流量状态": ["爆贴"], "曝光量": 100, "阅读量": 80, "互动量": 12,
                  "数据回收情况": "已回收", "观众分析": "性别分布：男性居多",
                  "随贴评论": "评论", "蓝词字段": ["艾时达口溶膜"], "笔记状态": "已发布"}
          FILLED = ["raw_content", "publish_url", "publish_time", "account_id", "impressions",
                    "reads", "interactions", "tier", "content_format", "actual_audience_data",
                    "hit_blue_keywords", "data_quality_status", "intent"]

          def run(fields, ever_filled, *, project="OKMAN_phase1", argv=(), rows=None):
              cap = {}
              class _Q:
                  cols = ""
                  def schema(q, *a): return q
                  def table(q, *a): return q
                  def select(q, c="", **k): q.cols = c; return q
                  def eq(q, *a, **k): return q
              def fake_pages(qb, order_by=None):
                  # PostgREST 会因为 notes 上没这列直接报错 —— 必须照着炸, 否则
                  # 「拿中间量名去 select」这个 bug 在守卫里是看不出来的(它被下面的
                  # 兜底 except 吞掉返回 [], 表现成"没有核心列消失")。
                  bad = [c for c in str(getattr(qb, "cols", "")).split(",") if c.startswith("_")]
                  if bad:
                      raise RuntimeError(f'column notes.{bad[0]} does not exist')
                  return rows if rows is not None else [
                      {"note_id": "n1", **{col: "v" for col in ever_filled}}]
              class F:
                  def __init__(f, *a, **k): pass
                  def list_records(f, *a, **k): return iter([{"record_id": "r", "fields": fields}])
              s.FeishuClient = F
              s.get_supabase_client = lambda *a, **k: _Q()
              s.assert_db_schema_ready = lambda *a, **k: None
              s.ensure_project_exists = lambda *a, **k: None
              s.quarantine_record = lambda *a, **k: None
              s.fetch_acknowledged_quarantine = lambda sb, pid: set()
              s.ensure_accounts_batch = lambda *a, **k: []
              s.upsert_metrics_batch = lambda *a, **k: (0, [])
              s.update_project_date_range = lambda *a, **k: None
              s.fetch_all_pages = fake_pages
              def up(sb, notes, dry_run=False):
                  cap["notes"] = notes; return [n["note_id"] for n in notes]
              s.upsert_notes_batch = up
              buf = io.StringIO(); h = logging.StreamHandler(buf); s.logger.addHandler(h)
              sys.argv = ["x", project, *argv]; rc = s.main(); s.logger.removeHandler(h)
              log = buf.getvalue()
              return rc, json.loads(log.split("Done: ")[1].split("\n")[0]), cap.get("notes", []), log

          # ① 新增非核心列 → 吸收, 行照常入库, 不红, 且有黄色待办清单
          rc, st, notes, log = run(dict(FULL, **{"运营新加的列": "15"}), FILLED)
          assert rc == 0 and st["errors"] == 0 and st["upserted"] == 1, st
          assert notes[0]["raw_extra"]["_undeclared"] == {"运营新加的列": "15"}, notes[0].get("raw_extra")
          assert notes[0]["raw_content"] == "正文" and notes[0]["publish_url"], \
              "同一行的核心数据必须照常进来 —— 这正是要换掉整行隔离的理由"
          assert "运营新加了 1 个未声明列" in log and "raw_extra._undeclared" in log, \
              "待处理清单没打出来, '攒着等大更新'就会变成'攒着没人记得'"

          # ② 核心列被改名 + 该列以前填过 → 红, 并点名像改名
          renamed = {k: v for k, v in FULL.items() if k != "发布时间"}
          renamed["发布日期"] = 1788710400000
          rc, st, _, log = run(renamed, FILLED)
          assert rc == 1 and st["missing_core_columns"] == 1, st
          assert "核心列消失" in log and "发布时间" in log, log[-400:]
          assert "很可能就是上面那几列被【改名】了" in log, "没点名改名嫌疑(owner 2026-09-11 明确要这个)"

          # ③ 【防误报】常空的核心列不见了 → 不报。没有这条, 十几个项目天天红。
          #    用「观众分析」而不是「阅读量」举例: 阅读量同属这一类(LNKT 的 reads 就是全空),
          #    但它另外还被 D-056 的要害字段名单管着, 拿它做例子会把两道闸搅在一起。
          rc, st, _, _ = run({k: v for k, v in FULL.items() if k != "观众分析"},
                             [col for col in FILLED if col != "actual_audience_data"])
          assert rc == 0 and st["missing_core_columns"] == 0, \
              f"从来没填过的核心列不见了也报 → 会天天误报(LNKT reads / ANSHEN 曝光 就是这种): {st}"

          # ④ 核心列消失但这轮没有新列 → 红, 且说清是删列不是改名
          rc, st, _, log = run({k: v for k, v in FULL.items() if k != "反馈链接"}, FILLED)
          assert rc == 1 and st["missing_core_columns"] == 1, st
          assert "是【删列】或者运营不再填了" in log, log[-400:]

          # ── 下面四条是 codex PR#125 review 逐条验证后改的, 都直接调探针本体 ──
          # 用【真的 mapping】而不是造一份, 因为这三个 bug 全是真表的形状触发的。
          from _common import load_mapping as _lm
          def probe(project, seen, rows):
              class _Q:
                  cols = ""
                  def schema(q, *a): return q
                  def table(q, *a): return q
                  def select(q, c="", **k): q.cols = c; return q
                  def eq(q, *a, **k): return q
              def pages(qb, order_by=None):
                  bad = [c for c in str(qb.cols).split(",") if c.startswith("_")]
                  if bad: raise RuntimeError(f"column notes.{bad[0]} does not exist")
                  return rows
              s.fetch_all_pages = pages
              return s._detect_missing_core_columns(_Q(), _lm(project), set(seen))

          # ⑤ 一个目标有多个源列时, 只要还有一个源列在, 就不算断源。
          #    RIO 同期两张表列名不一样(表1「曝光量」/表2「曝光数」, mapping 自己注了
          #    「表1 无这些列、表2 无上面的量列」)。实测库里存的原始行: 曝光数 186 行、
          #    曝光量 0 行 —— 按单列判的话 RIO 每晚都报「曝光量消失了」, 红 + 停对账。
          rio_t2 = ["素人编号", "文案", "发布时间", "反馈链接", "方向",
                    "状态", "曝光数", "阅读数", "互动数", "数据回收情况"]
          got = probe("RIO_phase1", rio_t2, [{"note_id": "n1", "impressions": 1, "reads": 1,
                                              "interactions": 1, "tier": "爆", "tier_source": "状态字段",
                                              "data_quality_status": "已回收"}])
          assert got == [], f"表2 的列名在场却报表1 的旧列名消失 → RIO 每晚红且停对账: {got}"

          # ⑥ tier 可以【不靠源列】产生: 互动量过阈值 → tier_source='数值推断'。
          #    TGV 的 14 条 tier 全部是这么来的(它的「笔记阶段」列在飞书里是空的),
          #    拿"tier 有值"当"那列填过"的证据 → 那列一消失就误报。
          okman_no_status = [c for c in _lm("OKMAN_phase1")["field_mapping"] if c != "流量状态"]
          got = probe("OKMAN_phase1", okman_no_status,
                      [{"note_id": "n1", "tier": "爆", "tier_source": "数值推断"}])
          assert got == [], f"把数值推断出来的 tier 当成源列填过的证据(TGV 就会这样误报): {got}"
          got = probe("OKMAN_phase1", okman_no_status,
                      [{"note_id": "n1", "tier": "爆", "tier_source": "状态字段"}])
          assert got == ["流量状态"], f"tier 真是那列产的, 它消失了却不报: {got}"

          # ⑦ field_mapping 里 _ 开头的中间量不在白名单时【不监控】。回退成拿中间量名去
          #    select 的话 PostgREST 直接报错 → 被兜底 except 吞掉返回 [] → 整道闸静默失效,
          #    同一轮真有核心列被改名也不会报。HXZ/NUC/NRT/LNKT 都有这种中间量。
          hxz = [c for c in _lm("HXZ_FB")["field_mapping"]
                 if c not in ("随贴评论素人", "发布时间")]
          got = probe("HXZ_FB", hxz, [{"note_id": "n1", "publish_time": "2026-01-01"}])
          assert got == ["发布时间"], \
              f"未知中间量把 select 毒化了 → 探针整个静默失效, 真的改名也报不出来: {got}"

          # ⑧ dry-run 也要查。部署流程要求先手动 dry-run 一遍再真跑, 在那一步放过
          #    「核心列被改名」, 等于把这道闸从最该拦的时刻挪开。
          rc, st, _, _ = run(renamed, FILLED, argv=("--dry-run",))
          assert st["missing_core_columns"] == 1, f"dry-run 把核心列改名检测整个跳过了: {st}"

          # ⑨ _undeclared 是【当前这一行的镜像】, 不跨轮累积 —— 这是选定的口径, 钉住它。
          #    (codex PR#125 review 提议跨轮 merge, 没采纳: 飞书按行省略空字段, 所以"这轮
          #     没返回 A"多数时候意味着运营把 A 删了或清空了 —— merge 会让库里留着一个源头
          #     已经没有的值, 而且没有任何一条路径会再把它清掉。待处理清单靠每轮的
          #     ::warning 维持, 不依赖累积。要存档另起一张观察日志表, 不该挂在 note 上。)
          _, _, n1, _ = run(dict(FULL, **{"新列A": "a1"}), FILLED)
          _, _, n2, _ = run(dict(FULL, **{"新列B": "b1"}), FILLED)
          assert n1[0]["raw_extra"]["_undeclared"] == {"新列A": "a1"}, n1[0]["raw_extra"]
          assert n2[0]["raw_extra"]["_undeclared"] == {"新列B": "b1"}, \
              f"_undeclared 跨轮累积了 —— 运营删掉的列会永远留在库里且没人清: {n2[0]['raw_extra']}"

          print("  ✓ 非核心列吸收不拖红(值留 _undeclared) · 核心列消失才红 · 常空列不误报 · "
                "改名/删列分得开 · 多源列不误报 · 数值推断 tier 不算证据 · 未知中间量不毒化探针 · dry-run 也查")
          PY
      - name: 要害字段整列产不出来 → 直接红, 不给认领 (D-056, owner 2026-09-11)
        working-directory: scripts
        run: |
          python - <<'PY'
          # owner 2026-09-11: "我发现有表连我们常规要看的列都没有?比如数据什么的?这种肯定就
          # 没意义了啊, 这种最关键的如果 mapping 的时候没有纳入, 应该需要有兜底的报错,
          # 然后让运营去查表改表" + "全部需要在库里面算的都要盯上, 而且不能只是单一指标是
          # 全部指标" + "直接红, 不给认领"。
          #
          # 为什么 D-055 那道闸兜不住: 它只报【以前填过、现在不见了】。ANSHEN 的曝光/阅读/
          # 互动**从来就没映过**, 在那套判据里"一列都没有"和"一列都没变"长得一模一样 ——
          # 这道闸就是专门补那个盲区的, 所以下面每一条都得真的驱动 main() 来证。
          import io, json, logging, os, sys
          os.environ.setdefault("FEISHU_APP_ID", "x"); os.environ.setdefault("FEISHU_APP_SECRET", "y")
          import sync_feishu_notes_to_truth_vault as s

          FULL = {"素人编号": "1", "文案": "正文", "发布时间": 1788710400000,
                  "反馈链接": {"link": "https://x", "text": "x"}, "方向": "D10-产品贴",
                  "流量状态": ["爆贴"], "曝光量": 100, "阅读量": 80, "互动量": 12,
                  "数据回收情况": "已回收", "观众分析": "性别分布：男性居多",
                  "随贴评论": "评论", "蓝词字段": ["艾时达口溶膜"], "笔记状态": "已发布"}
          # 存量库里填过哪些列 —— 只用来喂 D-055 那道闸, 让它在本守卫里全程闭嘴,
          # 免得两道闸的红搅在一起分不清是谁报的。
          NEVER_FILLED: list[str] = []
          _LM0 = s.load_mapping

          def run(rows, *, argv=("OKMAN_phase1",), acked=frozenset(), platform=None):
              cap = {}
              if platform:
                  # 换掉 mapping 的 platform, 其余照旧 —— 专门验【main() 真把 platform
                  # 传下去了】。上面那几条单元断言只证明函数本身对, 调用点漏传照样绿。
                  _real_lm = s.load_mapping
                  s.load_mapping = lambda pid: {**_real_lm(pid), "platform": platform}
              else:
                  s.load_mapping = _LM0
              class _Q:
                  def schema(q, *a): return q
                  def table(q, *a): return q
                  def select(q, *a, **k): return q
                  def eq(q, *a, **k): return q
              class F:
                  def __init__(f, *a, **k): pass
                  def list_records(f, *a, **k):
                      return iter([{"record_id": f"r{i}", "fields": r}
                                   for i, r in enumerate(rows)])
              s.FeishuClient = F
              s.get_supabase_client = lambda *a, **k: _Q()
              s.assert_db_schema_ready = lambda *a, **k: None
              s.ensure_project_exists = lambda *a, **k: None
              s.quarantine_record = lambda *a, **k: None
              # 「认领过」的极端情形: 隔离表里什么都认领了。要害字段照样得红。
              s.fetch_acknowledged_quarantine = lambda sb, pid: set(acked)
              s.ensure_accounts_batch = lambda *a, **k: []
              s.upsert_metrics_batch = lambda *a, **k: (0, [])
              s.update_project_date_range = lambda *a, **k: None
              s.fetch_all_pages = lambda qb, order_by=None: [
                  {"note_id": "n1", **{c: "v" for c in NEVER_FILLED}}]
              def up(sb, notes, dry_run=False):
                  cap["notes"] = notes; return [n["note_id"] for n in notes]
              s.upsert_notes_batch = up
              buf = io.StringIO(); h = logging.StreamHandler(buf); s.logger.addHandler(h)
              sys.argv = ["x", *argv]; rc = s.main(); s.logger.removeHandler(h)
              log = buf.getvalue()
              return rc, json.loads(log.split("Done: ")[1].split("\n")[0]), cap.get("notes", []), log

          drop = lambda *cols: {k: v for k, v in FULL.items() if k not in cols}

          # ① 一切正常 → 不报。这条是其余各条的对照组。
          rc, st, notes, _ = run([FULL])
          assert rc == 0 and st["missing_capabilities"] == [], st

          # ② ANSHEN 形: 三个指标一列都没有 → 红, 且**三个都点名**
          #    (owner: "不能只是单一指标是全部指标")
          rc, st, _, log = run([drop("曝光量", "阅读量", "互动量")])
          assert rc == 1, f"整表没有任何指标却跑绿了: {st}"
          assert set(st["missing_capabilities"]) == {"impressions", "reads", "interactions"}, st
          for zh in ("曝光量", "阅读量", "互动量"):
              assert zh in log, f"只点名了一部分指标, {zh} 没点到 —— owner 要的是全部: {log[-500:]}"
          assert "去飞书查表" in log, "没告诉运营该去干什么, 报了也落不了地"

          # ③ LNKT 形: 只缺一个指标(阅读量) → 照样红。
          #    "有曝光有互动就算有数据"那种写法会在这里绿掉。
          rc, st, _, _ = run([drop("阅读量")])
          assert rc == 1 and st["missing_capabilities"] == ["reads"], \
              f"三个指标只缺一个就放过 → 等于承认可以只看单一指标: {st}"

          # ④ 【防误报】整表曝光都是 0 → 不报。0 是数据(这条笔记真的没人看),
          #    写成 `if n.get(col)` 的话这里会绿转红。
          rc, st, _, _ = run([dict(FULL, 曝光量=0, 阅读量=0, 互动量=0)])
          assert rc == 0 and st["missing_capabilities"] == [], \
              f"把 0 当成空 → 一张全是 0 的表会被报成产不出指标, 这是误报: {st}"

          # ⑤ tier 的"空"是 '未知' 不是 NULL —— 全表判不出档必须报。按 NULL 数的话这里会绿。
          #    2026-09-17 (D-062) 之前这条用 OKMAN 真实的「评估中 → 未知」规则造 '未知'; 现在
          #    评估中 是正式档位(评论数 20~50), 全库没有哪条规则再产 '未知' 了。但这个性质仍要守
          #    (库里还有 115 行历史 '未知', 而且哪张表若把待定状态映成 未知, 不能算它有 tier),
          #    所以临时给 mapping 注入一条「观察中 → 未知」规则来造它。OKMAN 没有评论数列,
          #    数值推断(只看 comments_count)不会把它推上去, 落地就是一张全 '未知' 的表。
          _LM_real = _LM0
          _LM0 = lambda pid: (lambda m: {**m, "tier_extraction": {**m["tier_extraction"],
                     "rules": [{"match_contains": ["观察中"], "tier": "未知"}, *m["tier_extraction"]["rules"]]}})(_LM_real(pid))
          rc, st, notes, _ = run([dict(FULL, 流量状态=["观察中"])])
          _LM0 = _LM_real
          assert notes and notes[0].get("tier") == "未知", \
              f"这条用例没造出 '未知' tier, 下面那句断言就是空跑: {notes[0].get('tier') if notes else None}"
          assert rc == 1 and "tier" in st["missing_capabilities"], \
              f"全表 tier 都是 '未知' 却算有 tier —— 飞轮就没有正负样本了: {st}"
          #    评估中 是真档位: 一张全 评估中 的表【算有 tier】, 不得误报成产不出要害字段。
          rc, st, notes, _ = run([dict(FULL, 流量状态=["评估中"])])
          assert notes and notes[0].get("tier") == "评估中", notes[0].get("tier") if notes else None
          assert "tier" not in st["missing_capabilities"], f"评估中 被当成空 tier 误报了 (D-062): {st}"
          #    tier 整个没映(NULL)当然也得报。
          rc, st, _, _ = run([drop("流量状态")])
          assert rc == 1 and "tier" in st["missing_capabilities"], st

          # ⑥ 不给认领(owner 原话): 隔离表里全认领了, 要害字段照样计 errors,
          #    一条也不许挪进 known_backlog 变成黄的。
          rc, st, _, _ = run([drop("曝光量", "阅读量", "互动量")],
                             acked={("r0", "x"), ("r0", "undeclared_fields")})
          assert rc == 1 and st["known_backlog"] == 0 and st["errors"] >= 3, \
              f"要害字段被路由进「已知待办」→ 红转黄, 然后就没人看了(D-056 明确不给认领): {st}"

          # ⑦ 【防误报】--limit 截断时不报: 只扫了一页, "整列没值"根本没依据。
          rc, st, _, _ = run([drop("曝光量", "阅读量", "互动量"), FULL],
                             argv=("OKMAN_phase1", "--limit", "1"))
          assert st["missing_capabilities"] == [], \
              f"--limit 截断也报 → 每次抽样调试都红: {st}"

          # ⑧ 「全部指标」按**平台**算。抖音创作者面板只有播放量, 没有曝光/阅读之分 ——
          #    实测 LNKT(全库唯一 platform: douyin)的「数据汇总」20 项里没有阅读量, 也不可能有。
          #    要求它 = 让运营去填一个平台不产出的数字, 永久红在谁也改不好的地方。
          #    小红书一项不减: 同一份缺阅读量的数据换成小红书项目照样红。
          from _common import load_mapping as _lm8
          assert _lm8("LNKT_phase1")["platform"] == "douyin", "LNKT 不再是抖音表, 这条用例的前提没了"
          dy = [{"impressions": 1, "interactions": 1, "tier": "爆", "publish_time": "2026-01-01",
                 "content_format": "情感叙事", "account_id": "a1"}]          # 无 reads
          assert s._detect_missing_capabilities(dy, "douyin") == [], \
              f"对抖音表要阅读量 —— 运营改不好, 夜跑会永久红: {s._detect_missing_capabilities(dy, 'douyin')}"
          assert [c for c, _ in s._detect_missing_capabilities(dy, "xiaohongshu")] == ["reads"], \
              "小红书也不要阅读量了 —— 减项减过头, 15 张小红书表全失守"
          assert [c for c, _ in s._detect_missing_capabilities(dy)] == ["reads"], \
              "不传平台时默认放过 —— 新平台接进来会静默失守, 默认必须是全量要求"
          # 抖音也**只**减阅读量这一项, 别顺手把曝光互动也放了
          assert set(c for c, _ in s._detect_missing_capabilities(
              [{"tier": "爆", "publish_time": "x", "content_format": "y", "account_id": "z"}],
              "douyin")) == {"impressions", "interactions"}, "抖音减项减多了"
          #    ——— 上面三条只验函数; 下面这两条驱动真的 main(), 验【调用点真把 platform 传了】。
          rc, st, _, _ = run([drop("阅读量")], platform="douyin")
          assert rc == 0 and st["missing_capabilities"] == [], \
              f"main() 没把 platform 传给自检 —— 抖音表照样被要阅读量: {st}"
          rc, st, _, _ = run([drop("阅读量")])          # 同一批数据, 小红书 → 照样红
          assert rc == 1 and st["missing_capabilities"] == ["reads"], st

          # ⑨ 报了错**不许**顺手把对账也停掉。这条是位置的守卫:
          #    "这张表没有阅读量"和"这一轮扫得完不完整"无关, 把自检塞到 full_scan
          #    前面去的话, LNKT 会从此永久停对账(SPX 已经 11 天没对过账了)。
          rc, st, notes, _ = run([drop("曝光量", "阅读量", "互动量")])
          assert rc == 1 and notes and notes[0].get("last_seen_at"), \
              "要害字段报错把 last_seen/对账 一起拦了 —— 孤儿行会攒到没人收得动"

          print("  ✓ 三指标全要 · 0 不算空 · tier 未知算空 · 不给认领 · 截断不误报 · 按平台减项 · 不拦对账")
          PY
      - name: 运营改列名要改 field_mapping, 不是塞 raw_extra (D-054, ANSHEN 9/10 全表隔离)
        working-directory: scripts
        run: |
          python - <<'PY'
          # 2026-09-10: 运营把 ANSHEN 飞书表里三列【就地改名】(同一张表 tblObopEQwBvMF41):
          #   发布日期→发布时间 · 笔记链接→反馈链接 · 流量状况→流量状态
          # 旧名在飞书返回里一行都不剩, mapping 还指着旧名 → 268 行整表隔离。
          #
          # 这道守卫盯的是【修法】而不只是"别隔离": 把改名后的列塞进 raw_extra 也能让
          # undeclared 变空、夜跑转绿, 但 publish_time / publish_url / tier 源会全部变 NULL,
          # 而且没有任何症状 —— 正是 D-053 E 段记的 LNKT 教训(预声明关掉报警器)。
          # 所以断的是【值真的落到了目标字段】, 不是断 mapping 里有没有那个 key。
          import _common as c, sync_feishu_notes_to_truth_vault as s
          mp = c.load_mapping("ANSHEN_phase1")

          # 9/10 隔离行的真实三种形状(143 行全套 20 列 / 69 行只带下次巡查时间 / 56 行只带发布时间)
          full20 = ["下次巡查时间","反馈链接","发布时间","实时数据.评论数","巡查状态","已确认存活",
                    "平台","排队刷新","是否巡查","最近检查时间","流量状态","置顶状态","评论关键词",
                    "评论区快照","评论状态","诊断信息","负面状态","负面评论快照","负面词","连续失败次数"]
          base = ["素人编号","笔记内容","方向","笔记状态","随贴评论","主页链接","账号名",
                  "笔记配图","品牌反馈","随贴评论配图","相关截图"]

          def mk(extra):
              r = {k: "v" for k in base + extra}
              r["笔记内容"] = "正文"
              if "反馈链接" in r: r["反馈链接"] = {"link": "https://xhs/1", "text": "x"}
              if "发布时间" in r: r["发布时间"] = 1788710400000
              if "流量状态" in r: r["流量状态"] = ["爆贴"]
              return r

          for name, extra in [("143行全套", full20), ("69行", ["下次巡查时间"]), ("56行", ["发布时间"])]:
              note, _, und = s.transform_row(mp, "r", mk(extra))
              assert und == [], (name, und)

          # ① 改名的三列必须【落到目标字段】, 不是躺在 raw_extra 里
          note, _, _ = s.transform_row(mp, "r", mk(full20))
          assert note.get("publish_time"), "发布时间 没接上 publish_time"
          assert note.get("publish_url"), "反馈链接 没接上 publish_url"
          assert note.get("tier") == "爆", f"流量状态 没接上 tier 源: tier={note.get('tier')}"
          for col, field in (("发布时间", "publish_time"), ("反馈链接", "publish_url"), ("流量状态", "tier")):
              assert col not in (note.get("raw_extra") or {}), \
                  f"{col} 被塞进了 raw_extra —— {field} 会变 NULL 且没有任何症状(D-053 E 段 LNKT 教训)"

          # ② 旧名已经不存在了, 不许再留在 mapping 里假装还能用
          fm = mp["field_mapping"]
          for dead in ("发布日期", "笔记链接", "流量状况"):
              assert dead not in fm, f"mapping 还指着已经不存在的旧列名 {dead}"
          for live, tgt in (("发布时间", "publish_time"), ("反馈链接", "publish_url"), ("流量状态", "_status_raw")):
              assert fm.get(live) == tgt, f"{live} 应该映到 {tgt}, 实际 {fm.get(live)!r}"

          # ③ 2026-09-11: owner 按 D-056 的报错去飞书建了「数据整理」键值文本列
          #    (曝光量：X；阅读量：Y；互动量：Z, 与 BJS 同名列同格式, 实测 123 行有值)。
          #    这里断的同样是【值真的落到了三个指标字段】—— 只把它声明进 raw_extra 的话,
          #    undeclared 会变空、夜跑转绿, 而 impressions/reads/interactions 仍旧全 NULL,
          #    D-056 那道闸也就白设了。
          row = mk(full20); row["数据整理"] = "曝光量：107；阅读量：7；互动量：1"
          note, metric, und = s.transform_row(mp, "r", row)
          assert und == [], f"数据整理 没声明: {und}"
          assert (note.get("impressions"), note.get("reads"), note.get("interactions")) == (107, 7, 1),               ("数据整理 没接上三个指标字段, 只是躺在 raw_extra 里 —— "
               f"impressions={note.get('impressions')} reads={note.get('reads')} "
               f"interactions={note.get('interactions')}")
          assert metric.get("impressions") == 107, "指标没同时进 metric_snapshots"
          #    接上指标【不会】触发数值推断: D-062 起数值推断只看 comments_count, 与互动量无关。
          #    下面这条断的是"人工标了无水花, 数字再好也不能翻案"。
          note2, _, _ = s.transform_row(mp, "r", dict(
              row, 流量状态=["无水花"], 数据整理="曝光量：2417；阅读量：300；互动量：12"))
          assert note2["tier"] == "趴", (
              f"运营标了无水花, 却被数字推成 {note2['tier']} —— 数值推断不该覆盖人工判定")

          # ── ④ 2026-09-15/16(D-059): SPX 重演同一幕 ──────────────────────────
          # 运营把 SPX 的「笔记链接」就地改名成「反馈链接」(与 ANSHEN 9/10 同一套全库通用
          # 命名), 同期加了一族巡查列。9/16 夜跑实测 488 行里已有 35 行 publish_url 变 NULL。
          # 断的还是那件事: 值真的落到 publish_url, 不是躺在 raw_extra。
          spx = c.load_mapping("SPX_phase1")
          patrol = ["巡查状态", "是否巡查", "是否截图", "已确认存活", "最近检查时间", "下次检查时间",
                    "连续失败次数", "排队刷新", "诊断信息", "置顶状态", "评论状态", "评论关键词",
                    "评论区快照", "负面状态", "负面词", "负面评论快照", "实时数据.评论数",
                    "上次评论数", "关注情况"]
          spx_row = {"素人编号": "1", "笔记内容": "正文", "发布时间": 1788710400000,
                     "方向": "提问贴", "流量状态": ["爆贴"], "曝光量": 100, "阅读量": 80,
                     "互动量": 12,
                     # text 故意写成一个【不是链接】的显示文字 —— 取错字段当场露馅
                     "反馈链接": {"link": "http://xhslink.cn/o/2FfDKWygsav", "text": "看笔记"},
                     **{k: "v" for k in patrol}}
          note3, _, und3 = s.transform_row(spx, "rSPX", spx_row)
          assert und3 == [], f"SPX 巡查列族没声明全: {und3}"
          # ⚠️ 断【等于那个 URL】而不是断真值。飞书 URL 列返回 {"link":…, "text":…},
          #    取 text 的话这里会存成显示文字("看笔记")—— 一个用不了的 label, 而 truthy
          #    断言照样过。fixture 故意让 text ≠ link 把这条钉死。(codex PR#127 review P1)
          assert note3.get("publish_url") == "http://xhslink.cn/o/2FfDKWygsav", (
              f"反馈链接 没接上 publish_url 的真地址, 实际 {note3.get('publish_url')!r} —— "
              "要么被塞进 raw_extra(链接静默变 NULL, D-054 教训), 要么取成了显示文字")
          #    纯文本 URL 列(没有 link 键)照样收, 并且首尾空白要去掉 ——
          #    实测全库 5661 条 publish_url 里 738 条前后带空白, 带空格的 URL 下游用不了。
          note4, _, _ = s.transform_row(spx, "rSPX2", dict(
              spx_row, 反馈链接=" http://xhslink.com/o/4syvukVmfI0 "))
          assert note4["publish_url"] == "http://xhslink.com/o/4syvukVmfI0", (
              f"纯文本 URL 列没收好或首尾空白没去掉: {note4['publish_url']!r}")
          #    只有 text 没有 link 的字典(非 URL 类型的单元格映到了这一列)也得收住 ——
          #    只认 link 的话这类行会静默变 NULL。
          note5, _, _ = s.transform_row(spx, "rSPX3", dict(
              spx_row, 反馈链接={"text": " http://xhslink.com/o/onlytext "}))
          assert note5["publish_url"] == "http://xhslink.com/o/onlytext", (
              f"没有 link 键的字典没回退到 text: {note5.get('publish_url')!r}")
          assert "反馈链接" not in (note3.get("raw_extra") or {}), "反馈链接 被塞进了 raw_extra"
          assert "笔记链接" not in spx["field_mapping"], "mapping 还指着已经不存在的旧列名 笔记链接"
          assert spx["field_mapping"].get("反馈链接") == "publish_url", spx["field_mapping"].get("反馈链接")

          print("  ✓ ANSHEN 三种真实行形状 undeclared=[] · 改名三列真的落到 publish_time/publish_url/tier · 旧名已摘")
          print("  ✓ SPX 同一幕(笔记链接→反馈链接)也接上了 publish_url, 巡查列族已声明")

          # ── ⑤ 2026-09-16 owner 定: 「反馈链接」是全库标准列名 ─────────────────
          # 运营在按这套命名逐张改表(ANSHEN 9/10 → SPX 9/15)。每张表被改到时都红一晚,
          # 这道守卫把口径钉住, 并且要求落后的表把新名【并列声明】成别名 —— 两个源列
          # 映同一个目标是既有用法(RIO 曝光量/曝光数), 而 D-058 的核心列消失检测按目标
          # 分组, 只有两个名字都不见了才报。所以改名对已经并列声明的表是无感的。
          import glob, yaml as _y
          legacy = []
          for _f in sorted(glob.glob("../mappings/*.yaml")):
              _m = _y.safe_load(open(_f, encoding="utf-8")) or {}
              _fm = _m.get("field_mapping") or {}
              _srcs = [k for k, v in _fm.items() if v == "publish_url"]
              if not _srcs:
                  continue                      # 本表不映 publish_url, 不管
              _name = _m.get("project_id") or _f
              assert "反馈链接" in _srcs, (
                  f"{_name} 的 publish_url 源列是 {_srcs}, 没有「反馈链接」。"
                  "owner 2026-09-16 定它是全库标准列名 —— 旧名可以保留成别名并列声明, "
                  "但新名必须在, 否则运营改到这张表时会红一晚(ANSHEN/SPX 各踩过一次)。")
              if len(_srcs) > 1:
                  legacy.append((_name, _srcs))
                  assert _srcs[-1] == "反馈链接", (
                      f"{_name} 把「反馈链接」声明在旧名之前 —— transform 按声明序覆盖, "
                      f"两名同时在场时会取到旧名: {_srcs}")
          print(f"  ✓ 全库 publish_url 都认「反馈链接」; 仍带旧名别名的 {len(legacy)} 张: "
                f"{[n for n, _ in legacy]}")
          PY
      - name: 库结构前置闸:代码写的列必须先落库 (D-046, 2026-08-27 实测连红 4 天)
        working-directory: scripts
        run: |
          python - <<'PY'
          # 2026-08-27: PR #109 让每条 note upsert 都带 notes.last_seen_at, 而迁移
          # notes_v1_9 从没在生产库跑过 → 【每一条 upsert 各失败一次】(不是降级),
          # 几百条一样的 traceback 淹掉唯一有用那行, daily sync 连红 4 天才被发现。
          # 本 guard 守的是那道闸: 缺列必须在【开跑前】一次性点名, 且说清该跑哪个迁移。
          import inspect, _common as c

          # ① 清单本身别退化成空(有人删空了 = 闸门失效, 但测试仍会"通过")
          assert len(c._REQUIRED_COLUMNS) >= 6, "必核的表少于 6 张, 清单八成被删残了"
          notes_cols = c._REQUIRED_COLUMNS["notes"]
          assert len(notes_cols) >= 30, f"notes 只列了 {len(notes_cols)} 列, 太少"
          for must in ("last_seen_at", "last_seen_run_id", "raw_content", "tier"):
              assert must in notes_cols, f"notes 必核列漏了 {must}"

          # ② 用假 client 精确复现那次事故, 断言"会红"
          class FakeQ:
              def __init__(s, have): s.have = have
              def select(s, cols): s.req = cols.split(","); return s
              def limit(s, n): return s
              def execute(s):
                  miss = [x for x in s.req if x not in s.have]
                  if miss: raise RuntimeError(f"column does not exist: {miss[0]}")
                  return {"data": []}
          class FakeClient:
              def __init__(s, m): s.m = m
              def schema(s, _): return s
              def table(s, t): return FakeQ(s.m.get(t, set()))

          full = {t: set(v) for t, v in c._REQUIRED_COLUMNS.items()}
          c.assert_db_schema_ready(FakeClient(full))          # 列齐 → 必须静默通过

          broken = {t: set(v) for t, v in c._REQUIRED_COLUMNS.items()}
          broken["notes"] -= {"last_seen_at", "last_seen_run_id"}
          try:
              c.assert_db_schema_ready(FakeClient(broken))
              raise SystemExit("✗ 空转: 缺列没被拦 —— 这正是 4 天没人发现的那个场景")
          except RuntimeError as e:
              msg = str(e)
              # 两个列都要点名: PostgREST 一次只报第一个, 逐列复探就是为了这个
              assert "last_seen_at" in msg and "last_seen_run_id" in msg, \
                  f"没把缺的列点全(只报第一个 = 一次修一个, 要来回好几轮): {msg}"
              assert "notes_v1_9_last_seen_reconcile.sql" in msg, "没说清该跑哪个迁移文件"
          print("  ✓ 复现 2026-08-27 事故 → 被拦, 两列都点名 + 指出迁移文件")

          # ③ 未知来源的缺列不能静默 —— 要落回 README Step 0 提示
          b2 = {t: set(v) for t, v in c._REQUIRED_COLUMNS.items()}
          b2["comments"] -= {"comment_role"}
          try:
              c.assert_db_schema_ready(FakeClient(b2)); raise SystemExit("✗ 空转")
          except RuntimeError as e:
              assert "comments.comment_role" in str(e) and "Step 0" in str(e)
          print("  ✓ 不在迁移映射里的缺列: 仍点名 + 落回 Step 0 提示")

          # ④ 闸必须真的接在 sync 的 main() 上, 且在【写入之前】——
          #    只写函数不接线, 是这类护栏最常见的死法。
          import sync_feishu_notes_to_truth_vault as s
          src = inspect.getsource(s.main)
          assert "assert_db_schema_ready" in src, "sync main() 没调用这道闸"
          assert src.index("assert_db_schema_ready") < src.index("ensure_project_exists"), \
              "闸必须在第一次写库(ensure_project_exists)之前"
          print("  ✓ 已接在 sync main() 里, 且排在第一次写库之前")
          print("\n库结构前置闸: all checks passed")
          PY
      - name: tier 规则列序:短针不许遮死长针 (2026-08-28)
        working-directory: scripts
        run: |
          python - <<'PY'
          # `_first_matching_tier` 取首个命中 → 短针排在长针前面 = 长针整条不可达。
          # BJS_phase1 起草稿实测踩到: 「爆帖」(→爆) 排在 「伪爆帖」(→数据异常) 前面,
          # 于是运营手标的假数据「伪爆帖500」被判成【爆】。纯静态可查, 故做成 load_mapping 的 lint。
          import glob, pathlib, _common
          # ① 全部既有 mapping 必须仍 load 得过(零误报, 否则这 lint 会挡住所有 sync)
          ok = 0
          for f in sorted(glob.glob('../mappings/*.yaml')):
              pid = pathlib.Path(f).stem
              if pid.startswith('_'):
                  continue
              _common.load_mapping(pid)
              ok += 1
          assert ok >= 10, f"只扫到 {ok} 个 mapping, 路径不对?"
          print(f"  ✓ {ok} 个既有 mapping 零误报")
          # ② 非空转证明: 出问题的那个列序必须被拒
          bad = [{"match_contains": ["爆贴", "爆帖"], "tier": "爆"},
                 {"match_contains": ["伪爆帖", "伪20评"], "tier": "数据异常"}]
          try:
              _common._reject_shadowed_tier_rules("x.yaml", bad)
              raise SystemExit("✗ 空转: 被遮死的列序没被拒")
          except ValueError as e:
              assert "伪爆帖" in str(e) and "上移" in str(e), f"报错没说清怎么修: {e}"
          print("  ✓ 遮死的列序被拒, 且报错直接给出修法")
          # ③ 修好的列序(长针上移)必须放行 —— 别把 lint 写成"永远拒"
          _common._reject_shadowed_tier_rules("x.yaml", [
              {"match_contains": ["伪爆帖", "伪20评"], "tier": "数据异常"},
              {"match_contains": ["爆贴", "爆帖"], "tier": "爆"}])
          # ④ 同针重复出现在多条规则里不算遮死(prev == needle 时跳过)
          _common._reject_shadowed_tier_rules("x.yaml", [
              {"match_contains": ["爆贴"], "tier": "爆"},
              {"match_contains": ["爆贴"], "tier": "爆"}])
          print("  ✓ 列序修好后放行 / 同针重复不误报")
          print("\ntier 规则列序 lint: all checks passed")
          PY
