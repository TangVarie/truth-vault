          DECLARE ra RECORD; rb RECORD; n_rows INT;
          BEGIN
              SELECT count(*) INTO n_rows
                FROM truth_vault.v_autowriter_positive_pool_saturation
               WHERE aw_project_id = '00000000-0000-0000-0000-000000aaaa03'::uuid;
              IF n_rows != 2 THEN
                  RAISE EXCEPTION 'expected one row per user (2), got % — view is not partitioned by user', n_rows;
              END IF;

              SELECT * INTO ra FROM truth_vault.v_autowriter_positive_pool_saturation
               WHERE aw_project_id = '00000000-0000-0000-0000-000000aaaa03'::uuid
                 AND pool_user_id = '00000000-0000-0000-0000-00000000000a'::uuid;
              SELECT * INTO rb FROM truth_vault.v_autowriter_positive_pool_saturation
               WHERE aw_project_id = '00000000-0000-0000-0000-000000aaaa03'::uuid
                 AND pool_user_id = '00000000-0000-0000-0000-00000000000b'::uuid;

              IF ra.active_positive_count != 3 OR ABS(ra.dominant_lever_ratio - 1.00) > 0.01 THEN
                  RAISE EXCEPTION 'user a pool wrong: pool=% ratio=% (expected 3 / 1.00 saturated)',
                      ra.active_positive_count, ra.dominant_lever_ratio;
              END IF;
              IF rb.active_positive_count != 3 OR ABS(rb.dominant_lever_ratio - 0.33) > 0.02 THEN
                  RAISE EXCEPTION 'user b pool wrong: pool=% ratio=% (expected 3 / 0.33 healthy)',
                      rb.active_positive_count, rb.dominant_lever_ratio;
              END IF;
              RAISE NOTICE 'v1_8 per-user partition OK (a=1.00 saturated, b=0.33 healthy; '
                           'mixing them would have reported 0.60 — a number neither user sees)';
          END $$;
          SQL
      - name: v1.8 rollback path actually works (codex review)
        # 本文件给视图追加了 4 列, 而 CREATE OR REPLACE VIEW 不能删列。
        # 后果不只是"回滚说明写错": 在已应用 v1_8 的库上【重跑基线
        # notes_v1_2_cross_schema_views.sql 会 ERROR: cannot drop columns from view】——
        # 而那个文件是按可重复执行设计的。所以 v1_8 改成了 DROP + CREATE,
        # 这一步把"回滚→再前滚"的整条路钉死, 免得以后有人改回 CREATE OR REPLACE。
        run: |
          set -e
          cols() {
            psql -tAc "SELECT count(*) FROM information_schema.columns
                        WHERE table_schema='truth_vault'
                          AND table_name='v_autowriter_positive_pool_saturation';" | tr -d ' '
          }
          [ "$(cols)" = "10" ] || { echo "前置状态应为 v1_8 的 10 列, 实际 $(cols)"; exit 1; }

          echo "— 回滚: DROP 后重跑基线, 应回到 6 列"
          psql -v ON_ERROR_STOP=1 -c "DROP VIEW IF EXISTS truth_vault.v_autowriter_positive_pool_saturation;"
          psql -v ON_ERROR_STOP=1 -f schemas/notes_v1_2_cross_schema_views.sql
          [ "$(cols)" = "6" ] || { echo "回滚后应为 6 列, 实际 $(cols)"; exit 1; }

          echo "— 再前滚: 重新应用 v1_8, 应回到 10 列"
          psql -v ON_ERROR_STOP=1 -f schemas/notes_v1_8_positive_pool_saturation_fix.sql
          [ "$(cols)" = "10" ] || { echo "再前滚后应为 10 列, 实际 $(cols)"; exit 1; }

          echo "— 反证: 不先 DROP 直接重跑基线【必须失败】"
          if psql -v ON_ERROR_STOP=1 -f schemas/notes_v1_2_cross_schema_views.sql 2>/dev/null; then
            echo "基线在 v1_8 之上竟然应用成功了 —— v1_8 大概被改回 CREATE OR REPLACE 了?"
            echo "(那样回滚路径和基线重跑都会静默留下错误的列集)"
            exit 1
          fi
          echo "  ok: 如预期报 cannot drop columns from view"

          echo "— 收尾: 恢复到 v1_8 状态供后续步骤使用"
          psql -v ON_ERROR_STOP=1 -c "DROP VIEW IF EXISTS truth_vault.v_autowriter_positive_pool_saturation;"
          psql -v ON_ERROR_STOP=1 -f schemas/notes_v1_2_cross_schema_views.sql
          psql -v ON_ERROR_STOP=1 -f schemas/notes_v1_8_positive_pool_saturation_fix.sql
          [ "$(cols)" = "10" ] || { echo "收尾后应为 10 列"; exit 1; }
          echo "v1_8 rollback round-trip OK"
      - name: Apply dashboard system pulse view v5 (+ idempotency)
        # public.v_dash_system_pulse: 接口状态 / 数据新鲜度单行视图。跨 truth_vault.notes /
        # metric_snapshots / audit_log / projects + public.pipeline_runs(上面 cross-schema 步骤
        # 已 stub),故置于 pipeline_runs 建好之后。CREATE OR REPLACE VIEW;GRANT 包 IF EXISTS。两遍验幂等。
        run: |
          psql -v ON_ERROR_STOP=1 -f schemas/dashboard_views_v5_pulse.sql
          psql -v ON_ERROR_STOP=1 -f schemas/dashboard_views_v5_pulse.sql
      - name: Sanity-check system pulse view (single row, cross-table subqueries execute)
        run: |
          psql -v ON_ERROR_STOP=1 -c "SELECT notes_total, feishu_n, annotated_n, ssll_n, aw_n, snaps_n, pipeline_runs_n, server_now FROM public.v_dash_system_pulse;"
      - name: Apply security revoke (anon/authenticated write on public.* ) (+ idempotency)
        # 撤 anon/authenticated 对 5 张 public 表的写权限(读保留,不开 RLS)。
        # guarded:表/角色不存在则跳过 → 裸 PG / CI 为 no-op。REVOKE 幂等,两遍验。
        run: |
          psql -v ON_ERROR_STOP=1 -f schemas/security_revoke_anon_write_public_tables.sql
          psql -v ON_ERROR_STOP=1 -f schemas/security_revoke_anon_write_public_tables.sql
      - name: Apply dashboard timeseries views v6 (+ idempotency)
        # public.v_dash_monthly / v_dash_pub_activity:真实月度时间序列 + 投放热力(仅依赖 truth_vault.notes.publish_time)。
        # CREATE OR REPLACE VIEW;GRANT 包 IF EXISTS。两遍验幂等。
        run: |
          psql -v ON_ERROR_STOP=1 -f schemas/dashboard_views_v6_timeseries.sql
          psql -v ON_ERROR_STOP=1 -f schemas/dashboard_views_v6_timeseries.sql
      - name: Sanity-check timeseries views (selectable)
        run: |
          psql -v ON_ERROR_STOP=1 -c "SELECT ym, notes, impressions, hits, cum_impressions FROM public.v_dash_monthly LIMIT 0;"
          psql -v ON_ERROR_STOP=1 -c "SELECT ym, dow, n FROM public.v_dash_pub_activity LIMIT 0;"
      - name: Apply security revoke (anon/authenticated write on public.v_dash_*) (+ idempotency)
        # 纵深防御: 撤 anon/authenticated 对看板视图的写权限(SELECT 保留, 看板服务端要读)。
        # 这些视图今天是聚合视图、PG 重写阶段就拒写, 所以撤的是【未来某天有人加了
        # 单表直通视图会自动继承的】权限 —— 见 SQL 文件头。REVOKE 幂等, 两遍验。
        run: |
          psql -v ON_ERROR_STOP=1 -f schemas/security_revoke_anon_write_dash_views.sql
          psql -v ON_ERROR_STOP=1 -f schemas/security_revoke_anon_write_dash_views.sql
      - name: Sanity-check revoke (v_dash_* 无 anon 写权限 · 且仍可读)
        # 在裸 PG 上先造出 anon/authenticated 角色并【故意 GRANT ALL】(复现 Supabase
        # 建库默认), 再跑一遍 REVOKE, 断言写权限确实没了、SELECT 还在。
        # 不造角色的话上面那步在 CI 里是 no-op —— 那就等于没测。
        run: |
          psql -v ON_ERROR_STOP=1 -c "DO \$\$ BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='anon') THEN CREATE ROLE anon; END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='authenticated') THEN CREATE ROLE authenticated; END IF;
          END \$\$;"
          psql -v ON_ERROR_STOP=1 -c "GRANT ALL ON public.v_dash_overview TO anon, authenticated;"
          psql -v ON_ERROR_STOP=1 -c "SELECT has_table_privilege('anon','public.v_dash_overview','INSERT') AS must_be_true;" \
            | grep -q ' t$' || { echo '前置 GRANT 没生效, 后面的断言就成了假阳性'; exit 1; }
          psql -v ON_ERROR_STOP=1 -f schemas/security_revoke_anon_write_dash_views.sql
          for role in anon authenticated; do
            for priv in INSERT UPDATE DELETE TRUNCATE; do
              got=$(psql -tAX -v ON_ERROR_STOP=1 -c \
                "SELECT has_table_privilege('$role','public.v_dash_overview','$priv');")
              [ "$got" = "f" ] || { echo "::error::$role 仍有 $priv on v_dash_overview"; exit 1; }
            done
            got=$(psql -tAX -v ON_ERROR_STOP=1 -c \
              "SELECT has_table_privilege('$role','public.v_dash_overview','SELECT');")
            [ "$got" = "t" ] || { echo "::error::$role 的 SELECT 被误撤 —— 看板会瞎"; exit 1; }
          done
          echo "  ✓ anon/authenticated: 写权限已撤 · SELECT 保留"
      - name: Sanity-check revoke · 证明这条路径【真的能写穿】(不是假想)
        # 本文件防的是"将来有人加了单表直通的 v_dash_* 视图"。这里就地造一个,
        # 证明: (a) 有权限时 anon 确实能经视图把行写进底表; (b) 跑完 REVOKE 就写不进了。
        # 不做这一步的话, 上面的 has_table_privilege 断言只证明"权限位变了",
        # 证明不了"变了这件事有意义"。
        run: |
          # 先清干净再建: 用 IF NOT EXISTS 的话, 这一步万一被跑第二遍, 底表里会留着
          # 上一轮的 id=42, 下面的 count=1 断言就变成看执行次数而不是看行为。
          psql -v ON_ERROR_STOP=1 -c "
            DROP VIEW IF EXISTS public.v_dash_probe;
            DROP TABLE IF EXISTS public._revoke_probe;
            CREATE TABLE public._revoke_probe(id int, n int);
            CREATE VIEW public.v_dash_probe AS SELECT id, n FROM public._revoke_probe;
            GRANT USAGE ON SCHEMA public TO anon;
            GRANT SELECT, INSERT ON public.v_dash_probe TO anon;
            GRANT SELECT, INSERT ON public._revoke_probe TO anon;"
          # 前提: 单表直通视图确实是 auto-updatable(否则整个担心不成立)
          got=$(psql -tAX -c "SELECT is_insertable_into FROM information_schema.views WHERE table_name='v_dash_probe';")
          [ "$got" = "YES" ] || { echo "::error::v_dash_probe 不是 auto-updatable, 探针失效"; exit 1; }
          # (a) REVOKE 前: 写得进
          PGOPTIONS='-c role=anon' psql -v ON_ERROR_STOP=1 -c "INSERT INTO public.v_dash_probe(id,n) VALUES (42,99);"
          got=$(psql -tAX -c "SELECT count(*) FROM public._revoke_probe WHERE id=42;")
          [ "$got" = "1" ] || { echo "::error::探针没写进去, 后面的对比就没意义了"; exit 1; }
          echo "  ✓ REVOKE 前: anon 经单表直通视图把行写进了底表"
          # (b) REVOKE 后: 写不进
          psql -v ON_ERROR_STOP=1 -f schemas/security_revoke_anon_write_dash_views.sql
          if PGOPTIONS='-c role=anon' psql -v ON_ERROR_STOP=1 -c "INSERT INTO public.v_dash_probe(id,n) VALUES (43,99);" 2>/dev/null; then
            echo "::error::REVOKE 后 anon 仍能经视图写入"; exit 1
          fi
          got=$(psql -tAX -c "SELECT count(*) FROM public._revoke_probe WHERE id=43;")
          [ "$got" = "0" ] || { echo "::error::第二次写居然落库了"; exit 1; }
          # ⚠️ 不能写成 psql -tAX -c "SET ROLE anon; SELECT ..." —— psql 会把 SET 的
          #    状态标签也打到 stdout, 结果是 "SET\n1" 而不是 "1", 断言假红。
          #    用 PGOPTIONS 在连接时设角色, -c 里只留那一条 SELECT。
          got=$(PGOPTIONS='-c role=anon' psql -tAX -c "SELECT count(*) FROM public.v_dash_probe;")
          [ "$got" = "1" ] || { echo "::error::anon 读也被撤了 —— 看板会瞎 (got=$got)"; exit 1; }
          echo "  ✓ REVOKE 后: 写被拒 · 读仍正常"
          psql -v ON_ERROR_STOP=1 -c "DROP VIEW public.v_dash_probe; DROP TABLE public._revoke_probe;"

  yaml:
    name: Mapping yaml lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pyyaml
        run: pip install pyyaml
      - name: Validate every mappings/*.yaml parses + has required keys
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          import yaml

          REQUIRED = {"project_id", "field_mapping"}
          rc = 0
          for f in Path("mappings").glob("*.yaml"):
              if f.name == "_template.yaml":
                  continue
              try:
                  data = yaml.safe_load(f.read_text(encoding="utf-8"))
              except yaml.YAMLError as exc:
                  print(f"{f}: YAML parse error: {exc}")
                  rc = 1
                  continue
              missing = REQUIRED - set(data.keys())
              if missing:
                  print(f"{f}: missing required keys: {missing}")
                  rc = 1
              if data.get("project_id") != f.stem:
                  print(f"{f}: project_id={data.get('project_id')!r} doesn't match filename")
                  rc = 1
              print(f"{f}: OK")
          sys.exit(rc)
          PY
