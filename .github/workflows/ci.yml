      - name: transform_row tier fallback + metric-only stripping self-check
        working-directory: scripts
        run: |
          python - <<'PY'
          # Two regressions the new tests defend against:
          #   1. Item 2 — tier="未知" (mapped from "评估中") + interactions over
          #      threshold should auto-promote to 爆/大爆, not stay 未知.
          #   2. Item 3 — metric-only cols (likes/saves/shares/comments_count/
          #      search_rank/keyword_rank) must NOT end up in the notes payload,
          #      they only belong in metric_snapshots.
          import sync_feishu_notes_to_truth_vault as s

          mapping = {
              "project_id": "TEST_P",
              "platform": "xiaohongshu",
              "field_mapping": {
                  "文案":   "raw_content",
                  "互动量": "interactions",
                  "点赞":   "likes",
                  "收藏":   "saves",
                  "评论数": "comments_count",
                  "状态":   "_status_raw",
              },
              "tier_thresholds": {"爆": 100, "大爆": 1000},
              "tier_extraction": {
                  "source": "状态字段",
                  "rules": [
                      {"match_contains": ["大爆"], "tier": "大爆"},
                      {"match_contains": ["评估中"], "tier": "未知"},
                  ],
              },
          }

          # Case A: 评估中 + interactions=500 (over 爆 threshold) → must promote to 爆.
          # The old code only fired numeric fallback when tier was None; "评估中"
          # mapped to "未知" so it stayed there forever.
          note_a, metric_a, _ = s.transform_row(
              mapping, "recA",
              {"文案": "content", "状态": "评估中", "互动量": 500, "点赞": 12, "收藏": 3, "评论数": 7},
          )
          assert note_a["tier"] == "爆", f"expected '爆' after numeric fallback, got {note_a.get('tier')!r}"
          assert note_a["tier_source"] == "数值推断", note_a.get("tier_source")
          print("  ✓ 评估中 + interactions>=爆 threshold promotes to 爆")

          # Case B: 评估中 + interactions=2000 (over 大爆) → must promote to 大爆
          note_b, _, _ = s.transform_row(
              mapping, "recB",
              {"文案": "c", "状态": "评估中", "互动量": 2000},
          )
          assert note_b["tier"] == "大爆", note_b.get("tier")
          print("  ✓ 评估中 + interactions>=大爆 threshold promotes to 大爆")

          # Case C: 评估中 + interactions=50 (below 爆) → stays 未知
          note_c, _, _ = s.transform_row(
              mapping, "recC",
              {"文案": "c", "状态": "评估中", "互动量": 50},
          )
          assert note_c["tier"] == "未知", note_c.get("tier")
          # tier_source should NOT be overwritten to 数值推断 since no promotion happened
          assert note_c.get("tier_source") != "数值推断", note_c.get("tier_source")
          print("  ✓ below-threshold 未知 stays 未知 (no false promotion)")

          # Case D: tier_source for an explicit 大爆 rule fire (not numeric fallback)
          note_d, _, _ = s.transform_row(
              mapping, "recD",
              {"文案": "c", "状态": "大爆", "互动量": 50},
          )
          assert note_d["tier"] == "大爆" and note_d["tier_source"] == "状态字段", note_d
          print("  ✓ explicit 状态字段 rule wins over numeric fallback")

          # Case E: metric-only cols (likes/saves/comments_count) belong in
          # metric_snapshots but NEVER in the notes payload (notes table has no
          # such columns; a future direct mapping would crash UPSERT). interactions
          # IS a valid notes column AND a metric_snapshot column, so it stays.
          assert "likes" not in note_a, "likes leaked into note payload"
          assert "saves" not in note_a, "saves leaked into note payload"
          assert "comments_count" not in note_a, "comments_count leaked into note payload"
          assert "interactions" in note_a, "interactions is a real notes column, should remain"
          assert metric_a["likes"] == 12 and metric_a["saves"] == 3 and metric_a["comments_count"] == 7
          assert metric_a["interactions"] == 500
          print("  ✓ metric-only cols stripped from note payload, retained in metric snapshot")

          # Case F (PR#51/#52 regression): Feishu 可能把「发布笔记」返回成 LIST
          # (多选 / list[str]) — map_intent 必须经 _direction_key 展平,不能直接拿
          # list 做 dict-key 查找而 `TypeError: unhashable type: 'list'`
          # (NRT_2 全表 sync 失败的根因)。
          mapping_intent = {
              "project_id": "TEST_I", "platform": "xiaohongshu",
              "field_mapping": {"文案": "raw_content", "发布笔记": "_intent_raw"},
              "intent_mapping": {"钓鱼帖": "traffic", "直给笔记": "conversion"},
          }
          note_f1, _, _ = s.transform_row(mapping_intent, "recF1", {"文案": "c", "发布笔记": ["钓鱼帖"]})
          assert note_f1.get("intent") == "traffic", note_f1.get("intent")
          note_f2, _, _ = s.transform_row(mapping_intent, "recF2", {"文案": "c", "发布笔记": [{"text": "直给笔记"}]})
          assert note_f2.get("intent") == "conversion", note_f2.get("intent")
          note_f3, _, _ = s.transform_row(mapping_intent, "recF3", {"文案": "c", "发布笔记": "钓鱼帖"})
          assert note_f3.get("intent") == "traffic", note_f3.get("intent")
          # 多选(2 个不同 intent)→ 收敛为合法 enum 'mixed',绝不写非法拼接串(撞 notes.intent CHECK)
          note_f4, _, _ = s.transform_row(mapping_intent, "recF4", {"文案": "c", "发布笔记": ["钓鱼帖", "直给笔记"]})
          assert note_f4.get("intent") == "mixed", note_f4.get("intent")
          # 未知值 → 'other'(合法 enum),不原样写中文
          note_f5, _, _ = s.transform_row(mapping_intent, "recF5", {"文案": "c", "发布笔记": ["说书帖"]})
          assert note_f5.get("intent") == "other", note_f5.get("intent")
          # 不变量:任何非空 intent 都必须落在 notes.intent CHECK 的合法 enum 内
          _ENUM = {"traffic", "conversion", "educational", "mixed", "other"}
          for nf in (note_f1, note_f2, note_f3, note_f4, note_f5):
              assert nf.get("intent") in _ENUM, nf.get("intent")
          print("  ✓ list[str]/list[dict]/str + 多选→mixed + 未知→other,intent 恒为合法 enum(不崩不撞 CHECK)")

          # Case G (PR#60 / D-036 审计): 方向级 tier_threshold_override 覆盖项目级阈值
          # (docs/04 + _template 写了此项, 但此前代码从不读 → 设了也静默无效)。
          mapping_thr = {
              "project_id": "TEST_THR", "platform": "xiaohongshu",
              "field_mapping": {"文案": "raw_content", "互动量": "interactions", "方向": "_direction_raw"},
              "tier_thresholds": {"爆": 100, "大爆": 1000},
              "direction_decomposition": {
                  "高门槛方向": {"content_format": "直给推荐", "target_audience": ["通用"],
                              "tier_threshold_override": {"爆": 500}},
                  "普通方向":   {"content_format": "直给推荐", "target_audience": ["通用"]},
              },
          }
          # 高门槛方向: override 爆=500 → 互动 200 不升级, 600 升级到 爆
          note_g1, _, _ = s.transform_row(mapping_thr, "recG1", {"文案": "c", "方向": "高门槛方向", "互动量": 200})
          assert note_g1.get("tier") is None, ("override 应让 200<500 不 promote, got", note_g1.get("tier"))
          note_g2, _, _ = s.transform_row(mapping_thr, "recG2", {"文案": "c", "方向": "高门槛方向", "互动量": 600})
          assert note_g2.get("tier") == "爆", note_g2.get("tier")
          # 普通方向(无 override): 用项目级 爆=100 → 互动 200 升级到 爆
          note_g3, _, _ = s.transform_row(mapping_thr, "recG3", {"文案": "c", "方向": "普通方向", "互动量": 200})
          assert note_g3.get("tier") == "爆", note_g3.get("tier")
          # 含 sub_directions 的【粗方向】也要 honor override(codex PR#60: 之前嵌在单方向守卫内 → 失效)
          mapping_thr["direction_decomposition"]["粗方向"] = {
              "tier_threshold_override": {"爆": 500},
              "sub_directions": [{"name": "子A", "content_format": "情感叙事", "target_audience": ["通用"]}],
          }
          note_g4, _, _ = s.transform_row(mapping_thr, "recG4", {"文案": "c", "方向": "粗方向", "互动量": 200})
          assert note_g4.get("tier") is None, ("含 sub_directions 的方向也应 honor override(200<500)", note_g4.get("tier"))
          note_g5, _, _ = s.transform_row(mapping_thr, "recG5", {"文案": "c", "方向": "粗方向", "互动量": 600})
          assert note_g5.get("tier") == "爆", note_g5.get("tier")
          print("  ✓ tier_threshold_override: 单方向 + 含 sub_directions 粗方向都 honor 方向级阈值(普通用项目级)")

          print("\ntransform_row tier+metric+intent+threshold_override: all 7 checks passed")
          PY
