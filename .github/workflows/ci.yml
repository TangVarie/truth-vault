          # ⚠️ 这一步存在的理由:
          # check_positive_saturation.py 在 daily-sync.yml:317 是 `|| true` 调用的。
          # 2026-08-22 渲染循环里有过一个 `pool_n` 未赋值的 NameError —— 只要 view
          # 返回任何一行就必崩, 而 `|| true` 把它整个吞掉, 于是 v1_8 专门修的那个
          # 盲点会以另一种形式原样保留(脚本天天"跑过", 天天什么都没测)。
          # 所以: 渲染路径必须在 CI 里被真正执行一次, 不能只靠 py_compile。
          # report() 是纯函数、不碰网络, 就是为这个测试留的口子。
          import io, contextlib
          import check_positive_saturation as c

          def run(rows, threshold=0.6):
              buf = io.StringIO()
              with contextlib.redirect_stdout(buf):
                  rc = c.report(rows, threshold)
              return rc, buf.getvalue()

          def row(**kw):
              base = {
                  "aw_project_id": "11111111-1111-1111-1111-111111111111",
                  "pool_user_id":  "22222222-2222-2222-2222-222222222222",
                  "active_positive_count": 5,
