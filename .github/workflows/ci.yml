          UPDATE truth_vault.notes SET body = 'updated' WHERE note_id = 'CI_AUDIT_r1';
          UPDATE truth_vault.notes SET tier = '爆' WHERE note_id = 'CI_AUDIT_r1';
          DELETE FROM truth_vault.notes WHERE note_id = 'CI_AUDIT_r1';
