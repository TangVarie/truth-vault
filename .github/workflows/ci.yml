          assert f({"ok": 40, "failed_after_retry": 0, "hygiene_failed": 1}) == 1
          assert f({"ok": 40, "failed_after_retry": 2, "hygiene_failed": 1}) == 1
          print("  ✓ hygiene_failed 任意一条 → 1(label-leakage 系统性)")
          # 干净成功 / no-op 空跑 → 0
          assert f({"ok": 15, "failed_after_retry": 0, "hygiene_failed": 0}) == 0
          assert f({"ok": 0, "failed_after_retry": 0, "hygiene_failed": 0}) == 0
          print("  ✓ 干净成功 + no-op 空跑 → 0")
          print("\nessence exit-code tolerance: all checks passed")
          PY
      - name: Essence annotator sub_direction classification self-check
