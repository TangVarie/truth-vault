              #   收敛其中一条、收敛不了另一条 —— 唯一一种"永远修不好"的漂移, 要红。
              {"id": "j", "status": "approved", "user_id": "author-j", "created_at": "2026-09-01",
               "decision_source": "human", "reviewer_id": "rev-1"},
          ]
          AUDIT_EVALS = [
              {"evaluation_id": "1", "autowriter_item_id": "a", "evaluator_type": "human",      "evaluator_id": "rev-1"},
              {"evaluation_id": "2", "autowriter_item_id": "b", "evaluator_type": "human",      "evaluator_id": None},
              {"evaluation_id": "3", "autowriter_item_id": "c", "evaluator_type": "human",      "evaluator_id": "author-c"},
              {"evaluation_id": "4", "autowriter_item_id": "d", "evaluator_type": "human",      "evaluator_id": "author-d"},
              {"evaluation_id": "5", "autowriter_item_id": "e", "evaluator_type": "human",      "evaluator_id": "author-e"},
              {"evaluation_id": "6", "autowriter_item_id": "f", "evaluator_type": "unverified", "evaluator_id": None},
              {"evaluation_id": "7", "autowriter_item_id": "g", "evaluator_type": "human",      "evaluator_id": "rev-9"},
              {"evaluation_id": "8", "autowriter_item_id": "h", "evaluator_type": "human",      "evaluator_id": "author-h"},
              {"evaluation_id": "9", "autowriter_item_id": "j", "evaluator_type": "human",      "evaluator_id": "rev-1"},
              {"evaluation_id": "10", "autowriter_item_id": "j", "evaluator_type": "unverified", "evaluator_id": None},
          ]
          class SB3:
              def schema(self, name): self._s = name; return self
              def table(self, _): return PQ(AUDIT_ITEMS if self._s == "autowriter" else AUDIT_EVALS)
          fail_n, warn_n = m.audit_archived_provenance(SB3(), None)
          assert fail_n == 5, f"c/d/e/g 四条身份造假 + j 一条重复同步行, 必须判 FAIL, 实得 {fail_n}"
          assert warn_n == 2, f"f 自愈漂移 + h 上游自审, 只该 WARN, 实得 warn={warn_n}"
          # 每个用例单独跑一遍, 免得一条判据顺手兜住另一条(这一串抓过两次空断言)。
          def audit_only(*ids):
              class SBx:
                  def schema(self, name): self._s = name; return self
                  def table(self, _):
                      return PQ([i for i in AUDIT_ITEMS if i["id"] in ids] if self._s == "autowriter"
                                else [e for e in AUDIT_EVALS if e["autowriter_item_id"] in ids])
              return m.audit_archived_provenance(SBx(), None)
          assert audit_only("h") == (0, 1), "上游自审: 相等短路不能把它吞掉, 也不能判成造假"
          assert audit_only("j") == (1, 0), "同一 item 两条同步行: 唯一一种修不好的漂移, 要红"
          assert audit_only("e") == (1, 0), "作者被填成 reviewer 而 AW 没这么说: 造假"
          assert audit_only("g") == (1, 0), "机器判定顶着人工身份(evaluator_id 不是作者): 造假"
          assert audit_only("f") == (0, 1), "unverified 后来补了来源: 只 WARN"

          # 合法的两条【绝不能】被判成问题 —— 尤其 b: 运营用 review_drafts 之后,
          # 真人审稿会合法地产生 human 行, 判据不能把第一次真人审稿当事故。
          class SBOK:
              def schema(self, name): self._s = name; return self
              def table(self, _):
                  return PQ([i for i in AUDIT_ITEMS if i["id"] in ("a", "b")]
                            if self._s == "autowriter"
                            else [e for e in AUDIT_EVALS if e["autowriter_item_id"] in ("a", "b")])
          assert m.audit_archived_provenance(SBOK(), None) == (0, 0), \
              "带 reviewer 的人审 + AW 没记 reviewer 的人审, 都是合法的, 不许报"

          # ⑦-b 复核在"没有 updated_at 列"的库上也要真的跑(codex review on #130, P2):
          #    README 那份 fresh-install 建库脚本里 items 没有这一列; 同步主流程会降级,
          #    复核第一版却把这个 42703 吞成 (0, 0) —— 每晚报"复核干净", 其实一行没查。
          class PQNoUpd(PQ):
              def select(self, cols):
                  if "updated_at" in cols:
                      raise Exception("column items.updated_at does not exist (42703)")
                  return self
          class SB5:
              def schema(self, name): self._s = name; return self
              def table(self, _):
                  return PQNoUpd(AUDIT_ITEMS) if self._s == "autowriter" else PQ(AUDIT_EVALS)
          assert m.audit_archived_provenance(SB5(), None) == (5, 2), \
              "缺 updated_at 列时复核必须降级后照常复核, 不能吞成 (0, 0)"
          # 别的错不许吞 —— 吞成 (0, 0) 就是"没查却报干净"。判据只认那一种缺列。
          class PQBoom(PQ):
              def select(self, cols): raise Exception("connection timeout")
          class SB6:
              def schema(self, name): self._s = name; return self
              def table(self, _):
                  return PQBoom(AUDIT_ITEMS) if self._s == "autowriter" else PQ(AUDIT_EVALS)
          try:
              m.audit_archived_provenance(SB6(), None)
          except Exception as exc:
              assert "timeout" in str(exc), exc
          else:
              raise AssertionError("复核把无关错误吞成了'干净' —— 降级判据必须窄")
          # 缺来源三列 → 没有可比的口径, 跳过但要喊(主流程已按 unverified 归档)
          class PQNoProv(PQ):
              def select(self, cols):
                  if "decision_source" in cols:
                      raise Exception("column items.decision_source does not exist (42703)")
                  return self
          class SB7:
              def schema(self, name): self._s = name; return self
              def table(self, _):
                  return PQNoProv(AUDIT_ITEMS) if self._s == "autowriter" else PQ(AUDIT_EVALS)
          assert m.audit_archived_provenance(SB7(), None) == (0, 0), \
              "缺来源列时没有可比口径, 只能跳过(主流程那边已经告警)"

          # ⑧ 复核判 FAIL 必须真的能把这一步打红(它在夜跑的聚合失败闸里)。
          import unittest.mock as _mock
          with _mock.patch.object(m, "get_supabase_client", lambda: SB3()), \
               _mock.patch.object(m, "fetch_pending_decisions", lambda sb, since: []), \
               _mock.patch.object(_sys, "argv", ["x", "--dry-run"]):
              assert m.main() == 1, "复核发现身份造假时, main 必须返回非 0 让夜跑变红"
          with _mock.patch.object(m, "get_supabase_client", lambda: SBOK()), \
               _mock.patch.object(m, "fetch_pending_decisions", lambda sb, since: []), \
               _mock.patch.object(_sys, "argv", ["x", "--dry-run"]):
              assert m.main() == 0, "干净库不许红"

          print("TV-01 评价来源: all checks passed")
          PY
      - name: 换候选必须换缓存版本 + 策展要看得见 synthetic (TV-03 / TV-05)
        working-directory: .
        run: |
          python - <<'PY'
          # TV-03: library_version 原来只有 (候选数, max curated_at, 月份)。50 张换 1 张、
          #   且被换掉的不是最新那张时, 三项全不变 → 缓存键不变 → 已退出候选的旧卡
          #   继续被返回且不重新选。评测方隔离复现确认过。
          # TV-05: 策展 select 没取 synthetic, 策展模型看不见"指标是不是假的"
          #   (馆员的 fetch_candidates 一直取了 —— 同一个证据边界两头不一致)。
          import sys, inspect
          sys.path.insert(0, "scripts")
          from librarian.core import library_version
          import curate_flywheel_lessons as cur

          base = [{"source_note_id": f"n{i}", "curated_at": "2026-09-01"} for i in range(50)]
          swap = base[:-1] + [{"source_note_id": "n999", "curated_at": "2026-09-01"}]
          assert len(base) == len(swap), "前提: 候选数不变"
          assert max(c["curated_at"] for c in base) == max(c["curated_at"] for c in swap), "前提: 最大 curated_at 不变"
          assert library_version(base) != library_version(swap), \
              "候选数与最大时间都不变时换 1 张卡, 版本必须变 —— 否则旧缓存继续供不合格结果 (TV-03)"
          assert library_version(base) == library_version(list(reversed(base))), \
              "候选顺序抖动不该换版本, 否则 rank_score 连续重排会把缓存命中率打光"

          assert '"synthetic"' in inspect.getsource(cur.fetch_uncurated_cards), \
              "策展 select 必须含 synthetic (TV-05)"
          real = cur.build_curator_prompt({"tier": "爆", "raw_excerpt": "x", "synthetic": False})
          fake = cur.build_curator_prompt({"tier": "爆", "raw_excerpt": "x", "synthetic": True})
          assert "不可信" in fake, "synthetic 卡必须明确告诉策展模型指标不可信 (TV-05)"
          assert "不可信" not in real, real[:200]
          # ⚠️ false 那一侧【不能】断言"指标为真实回收数据"(codex review P2):
          #    synthetic 是三态压成两态 —— true / 显式 false / 压根没判过, 而视图的
          #    COALESCE(...,'false') 把第三种也变成 false。生产实测 332 张卡里 189 张
          #    (57%) data_quality_flags 整个为 NULL, 旧文案等于对一多半的卡断言了
          #    一件我们根本没核过的事。
          for txt in (real, cur.build_curator_prompt({"tier": "爆", "raw_excerpt": "x"})):
              assert "真实回收数据" not in txt, \
                  f"没被标假 ≠ 已核验为真, 不得对策展模型这么说: {txt[:200]}"
              assert "未经逐条核验" in txt, txt[:200]
          ref = cur.build_curator_prompt({"tier": "参考", "raw_excerpt": "x", "synthetic": False})
          assert "人工挑" in ref, "参考是人工挑的, 不是数据达标进来的, 得说清楚"
          print("TV-03 / TV-05: all checks passed")
          PY
      - name: 馆员不得阻塞事件循环, 空结果与故障要分得开 (TV-06)
        working-directory: .
        run: |
          pip install -q fastapi 'httpx<0.28' starlette >/dev/null
          python - <<'PY'
          # TV-06: ① async 路由里直接调同步选卡(同步 DB + 同步模型请求)会占住事件循环;
          #        ② 内部错误被吞成 HTTP 200 + 空 selected, 与"没有相关卡"完全一样。
          import os, sys, time, asyncio
          os.environ["LIBRARIAN_API_KEY"] = "test-key"
          sys.path.insert(0, ".")
          from librarian import core
          import librarian.app as app_mod
          import httpx

          def fake(brief, *, model=None, _status_out=None, **kw):
              mode = brief.get("_mode")
              st = {"degraded": core.STATUS_DEGRADED, "empty": core.STATUS_NO_MATCH}.get(mode, core.STATUS_OK)
              if _status_out is not None:
                  _status_out["status"] = st
              return [] if mode in ("degraded", "empty") else [{"source_note_id": "n1"}]
          # ①b 模型挑了卡但【一条都不在候选里】= 契约失败, 不是"库里没货"。
          #     旧实现静默丢掉全部 → 返回 [] → 报成 no_match 【并进缓存】,
          #     同一个 brief 之后再也不调模型, 契约失败被固化成"这个库对你没货"。
          CARDS = [{"source_note_id": "real-1", "curated_at": "2026-09-01", "tier": "爆"}]
          core.fetch_candidates = lambda sb, **kw: list(CARDS)
          core.get_supabase = lambda *a, **k: object()
          core.get_cache = lambda sb, key: None
          cached_writes = []
          core.put_cache = lambda sb, key, brief, lib_v, sel: cached_writes.append(key)

          core.call_anthropic = lambda *a, **k: '{"selected": [{"source_note_id": "made-up-1"}]}'
          st = {}
          assert core.librarian_select({"consumer": "t"}, _status_out=st) == []
          assert st["status"] == "degraded", \
              f"全是编造 id 必须报 degraded 而不是 no_match: {st}"
          assert not cached_writes, "契约失败的空结果【不得】进缓存 (codex review P2)"

          # 真的没货(模型规规矩矩返回空) 仍然是 no_match, 且照常缓存 —— 不能矫枉过正。
          core.call_anthropic = lambda *a, **k: '{"selected": []}'
          st = {}
          assert core.librarian_select({"consumer": "t"}, _status_out=st) == []
          assert st["status"] == "no_match", st
          assert cached_writes, "真正的 no_match 仍应进缓存"

          # 部分编造: 留下真的那条, 不整单作废。
          core.call_anthropic = lambda *a, **k: (
              '{"selected": [{"source_note_id": "made-up-1"}, {"source_note_id": "real-1"}]}')
          st = {}
          out = core.librarian_select({"consumer": "t"}, _status_out=st)
          assert [c["source_note_id"] for c in out] == ["real-1"] and st["status"] == "ok", (out, st)

          core.librarian_select = fake
          assert core.librarian_select_detailed({"_mode": "ok"})[1] == "ok"
          assert core.librarian_select_detailed({"_mode": "empty"})[1] == "no_match"
          assert core.librarian_select_detailed({"_mode": "degraded"})[1] == "degraded"

          def det(brief):
              if brief.get("_mode") == "crash":
                  raise RuntimeError("boom")
              return core.librarian_select_detailed(brief)
          app_mod.librarian_select_detailed = det

          async def _run():
              tr = httpx.ASGITransport(app=app_mod.app)
              async with httpx.AsyncClient(transport=tr, base_url="http://t",
                                           headers={"X-Librarian-Key": "test-key"}) as ac:
                  out = {}
                  for mode in ("ok", "empty", "degraded", "crash"):
                      out[mode] = (await ac.post("/librarian", json={"_mode": mode})).json()
                  return out
          r = asyncio.run(_run())
          assert r["ok"]["status"] == "ok" and r["ok"]["selected"]
          assert r["empty"]["status"] == "no_match"
          assert r["degraded"]["status"] == "degraded"
          assert r["crash"]["status"] == "error"
          for m in ("empty", "degraded", "crash"):
              assert r[m]["selected"] == [], "selected 形状必须不变(老消费方不受影响)"
          assert len({r[m]["status"] for m in ("empty", "degraded", "crash")}) == 3, \
              "没匹配 / 降级 / 崩溃 必须分得开 —— 之前三者都是 200 + 空 selected (TV-06)"

          # 慢调用不得堵住同事件循环上的其它请求。
          # ⚠️ 这条第一版用 TestClient + 两个线程写, 反证时【没变红】—— TestClient 每次调用
          #    自带 portal, 两线程根本不在同一个事件循环上。而且计时起点必须在 gather
          #    【之外】: 写在协程里, 循环被堵时快请求还没开始计时, 只会量到自己的 0.00s。
          def slow(brief):
              if brief.get("_mode") == "slow":
                  time.sleep(1.2)
              return ([], "no_match")
          app_mod.librarian_select_detailed = slow

          async def _conc():
              tr = httpx.ASGITransport(app=app_mod.app)
              async with httpx.AsyncClient(transport=tr, base_url="http://t",
                                           headers={"X-Librarian-Key": "test-key"}) as ac:
                  t0 = time.monotonic()
                  async def hit(mode):
                      await ac.post("/librarian", json={"_mode": mode})
                      return time.monotonic() - t0
                  return await asyncio.gather(hit("slow"), hit("fast"))
          slow_t, fast_t = asyncio.run(_conc())
          assert slow_t > 1.0, f"前提不成立: 慢请求只用了 {slow_t:.2f}s"
          assert fast_t < 0.5, \
              f"快请求被慢请求堵了 {fast_t:.2f}s —— 同步调用还在事件循环里, 线程池没生效 (TV-06)"
          print(f"TV-06: 状态四分 + 慢 {slow_t:.2f}s 期间快请求 {fast_t:.2f}s —— all checks passed")
          PY
      - name: 对外合成层不得泄进 /console (TV-04)
        working-directory: .
        run: |
          python - <<'PY'
          # TV-04: 合成展示数据本身是【有意的产品决策】(团队知情), 不删。
          # 但它的边界必须守住: /console 是内部验收口径, 一旦它引了合成层,
          # 用来判断"做得怎么样"的数字就假了。
          # 顺带钉住模块注释说实话 —— 上一版写"only imported by app/board/page.tsx",
          # 而首页 app/page.tsx 同样引了它, 外部评测就是被这句注释误导的。
          import pathlib, re
          app_dir = pathlib.Path("dashboard/app")
          importers = sorted(
              str(p.relative_to("dashboard")) for p in app_dir.rglob("*.tsx")
              if "applyPublicBoardAdjustments" in p.read_text(encoding="utf-8")
          )
          assert importers, "前提不成立: 没找到任何引用方"
          leaked = [f for f in importers if "/console/" in f]
          assert not leaked, f"/console 引了对外合成层, 内部验收口径被污染: {leaked}"

          doc = pathlib.Path("dashboard/lib/public-board-adjustments.ts").read_text(encoding="utf-8")
          assert "imported only by" not in doc, \
              "注释又写回了'only imported by …' —— 它是假的, 首页也引了 (TV-04)"
          for f in importers:
              stem = f.split("/")[-2] if f.endswith("page.tsx") else f
              assert stem in doc or f in doc, \
                  f"引用方 {f} 没有写进模块注释 —— 注释与实际引用方必须一致 (TV-04)"
          print(f"TV-04: 引用方 {importers}; /console 干净; 注释与实际一致")
          PY
      - name: on_demand 闸对【每一个】自动处理步骤都生效 (D-047)
        working-directory: scripts
        run: |
          python - <<'PY'
          # 那道闸的本意是"没经 preflight 验证的表不许被夜间 cron 自动处理"。
          # 2026-08-30 之前它只挡住了【入库】: essence 那步是裸 `for f in mappings/*.yaml`
          # 全遍历, sync_interval 在整个 essence 路径里一次都没出现。后果不是多跑一点 ——
          # 笔记一落库, 当晚就被 LLM 按【还没拍板】的方向拆解标注, 而标注按
          # essence_annotated_at IS NULL 取, 标完即固化, 再顺着经验卡 → 三生六部 →
          # autowriter 传下去。判断权那道人工闸(README 原则 1)就这么被绕过了。
          import os, subprocess, sys, yaml, pathlib
          import _common as c

          # ① 判据必须只有【一份】—— 入库那步用的和 essence 那步用的是同一个函数
          import sync_feishu_notes_to_truth_vault as s
          assert s._skip_on_demand_on_cron is c.skip_on_demand_on_cron, \
              "入库那步没用 _common 里那份判据 —— 两份判据迟早漂开, 而漂开没有症状"

          # ② 真值表
          f = c.skip_on_demand_on_cron
          assert f("on_demand", True)  is True,  "cron + on_demand → 必须跳过"
          assert f("on_demand", False) is False, "显式 dispatch → 不许挡人工"
          assert f("daily", True)      is False, "daily 项目照跑"
          assert f(None, True)         is False, "没写 sync_interval → 保守照跑"
          print("  ✓ 判据单一来源 + 真值表")

          # ③ CLI shim 的退出码语义(bash 循环按它分支)
          env = dict(os.environ, PYTHONPATH=os.getcwd())
          def rc(project, scheduled):
              e = dict(env); e["TV_SCHEDULED_RUN"] = "true" if scheduled else ""
              return subprocess.run([sys.executable, "skip_on_cron.py", project],
                                    capture_output=True, env=e).returncode
          on_demand = next(p.stem for p in pathlib.Path("../mappings").glob("*.yaml")
                           if not p.stem.startswith("_")
                           and ((yaml.safe_load(p.read_text()).get("sync_config") or {})
                                .get("sync_interval") == "on_demand"))
          daily = next(p.stem for p in pathlib.Path("../mappings").glob("*.yaml")
                       if not p.stem.startswith("_")
                       and ((yaml.safe_load(p.read_text()).get("sync_config") or {})
                            .get("sync_interval") == "daily"))
          assert rc(on_demand, True)  == 0, "on_demand + cron 应 exit 0(跳过)"
          assert rc(on_demand, False) == 1, "on_demand + 显式 应 exit 1(照跑)"
          assert rc(daily, True)      == 1, "daily + cron 应 exit 1(照跑)"
          # 判不了时【照跑】而不是【跳过】: 静默少干活查不出来, 多干一次是幂等的
          assert rc("NO_SUCH_PROJECT_xyz", True) == 2, "读不出 mapping 应 exit 2"
          print("  ✓ CLI 退出码: 0=跳过 / 1=照跑 / 2=判不了(调用方照跑)")

          # ④ essence 那一步真的接上了这道闸 —— 只写工具不接线是这类护栏最常见的死法
          wf = yaml.safe_load(pathlib.Path("../.github/workflows/daily-sync.yml").read_text())
          steps = [s for s in wf["jobs"]["sync"]["steps"] if s.get("run")]
          ess = [s for s in steps if "annotate-essence" in s["run"]]
          assert ess, "找不到 essence 那一步"
          body = ess[0]["run"]
          assert "skip_on_cron.py" in body, "essence 步骤没接 on_demand 闸(D-047 回归)"
          assert body.index("skip_on_cron.py") < body.index("annotate-essence"), \
              "闸必须在真正发起标注请求之前"
          print("  ✓ daily-sync 的 essence 步骤已接闸, 且在发请求之前")

          # ⑤ curate 是同一泄漏口的【第二张嘴】—— 它的候选视图 v_flywheel_lesson_cards
          #    不要求 essence(WHERE 只有 tier/tier_source/publish_time), 所以 essence
          #    那道闸挡不住它。只挡一张嘴比不挡更危险: 会让人以为已经挡住了。
          cur = [s for s in steps if "/curate" in s["run"]]
          assert cur, "找不到 curate 那一步"
          cbody = cur[0]["run"]
          assert "skip_on_cron.py" in cbody, "curate 步骤没接 on_demand 闸(D-047 回归)"
          # 判据钉在【真正发请求那一行】上, 不是任何出现 "/curate" 的地方 ——
          # 注释里也会提到 /curate, 拿它比位置会把守卫变成在考注释怎么写。
          POST = '-X POST "${WORKER_URL%/}/curate"'
          assert POST in cbody, "找不到 curate 的 curl 请求行(改了写法就同步改这条守卫)"
          assert cbody.index("skip_on_cron.py") < cbody.index(POST), \
              "闸必须在真正发起 curate 请求之前"
          # 必须是【按项目循环】: 全局单次调用没法排除某些项目(/curate 只收单个 project)
          assert 'for f in ../mappings/*.yaml' in cbody, "curate 必须按项目循环, 否则闸无处可插"
          assert '\\"project\\":\\"$p\\"' in cbody, "循环里必须把当前项目传给 /curate"
          # 预算必须【共享】而不是每项目各给一份 —— 加闸门不该顺手把账单乘以项目数
          assert "remaining=$CUR_LIMIT" in cbody, "curate 预算要全局共享(remaining), 不是每项目各 CUR_LIMIT"
          assert "remaining - n" in cbody or "remaining-n" in cbody, "预算没有随实际策展数递减"
          # 预算截断不许静默 —— 必须说清谁被推迟到下轮
          assert "deferred" in cbody and "留到下轮" in cbody, "预算用完要点名哪些项目被推迟, 不许静默截断"
          # 一个项目挂了不该带走其余项目, 但收尾仍要判红
          assert "fail_count" in cbody and "exit 1" in cbody, "curate 失败要计数并在收尾判红"
          print("  ✓ curate 步骤: 已接闸 / 按项目循环 / 预算共享递减 / 截断不静默 / 逐项目隔离")

          # ⑥ 通道1(TV 爆款 → 三生六部 reference_samples)是【第三张嘴】, 也是唯一跨库的一张。
          #    前两张的后果还留在 truth_vault 自己家里, 这张把内容写进另一个 Supabase 的
          #    检索池、直接喂写作引擎 —— 推过去就追不回来(只有 synthetic 有自愈回收路径)。
          #    它在 daily-sync 里【连项目循环都没有】: 一句全局调用, 而 fetch_pending_baokuan
          #    只按 tier/publish_time/synced_to_ssll_at 取, sync_interval 全程不出现。
          ssll = [s for s in steps if "sync_truth_vault_baokuan_to_sanshengliubu.py" in s["run"]]
          assert ssll, "找不到通道1(→ 三生六部)那一步"
          sbody = ssll[0]["run"]
          # workflow 的 project 输入写着"只跑某个项目" —— 这一步以前不认, 定向跑也全局推
          assert "PROJECT_FILTER" in sbody and "--project" in sbody, \
              "通道1 步骤要认 PROJECT_FILTER(workflow 的 project 输入承诺了'只跑某个项目')"
          import sync_truth_vault_baokuan_to_sanshengliubu as ss
          import inspect
          m = inspect.getsource(ss.main)
          for probe in ("retract_stale_synthetic_from_ssll(", "drop_on_demand_projects(",
                        "insert_reference_sample("):
              assert probe in m, f"main() 里找不到 {probe} —— 改了结构就同步改这条守卫"
          assert m.index("drop_on_demand_projects(") < m.index("insert_reference_sample("), \
              "闸必须在真正往三生六部写之前"
          # 回收【不】受闸管: 闸挡的是"往外推", 不是"把推错的拉回来"
          assert m.index("retract_stale_synthetic_from_ssll(") < m.index("drop_on_demand_projects("), \
              "synthetic 回收不该被 on_demand 闸挡住(任何时候都该跑)"

          #    行为(非空跑): 拿真 mappings 里的 on_demand / daily 各一个项目对拍。
          rows = [{"project_id": on_demand, "note_id": "a"},
                  {"project_id": daily, "note_id": "b"},
                  {"project_id": "NO_SUCH_PROJECT_xyz", "note_id": "c"}]
          # 与 essence/curate 那两道【故意不同】: 这一道跨库单向, 不看是不是 cron ——
          # 手动触发不会让 mapping 里的 [待确认] 变成已拍板。默认(不带豁免)就该拦。
          kept, gated = ss.drop_on_demand_projects(rows)
          assert [n["note_id"] for n in kept] == ["b", "c"], \
              "on_demand 项目任何时候都不推(不只是 cron);判不了的要【照推】(静默少推查不出来)"
          assert gated == {on_demand: 1}, f"被拦下的项目要点名报出来, 实际 {gated}"
          # 豁免必须是【指名道姓的那一个开关】, 不能被 --project 顺手带出来
          kept, gated = ss.drop_on_demand_projects(rows, include_on_demand=True)
          assert len(kept) == 3 and gated == {}, "--include-on-demand 应放行全部"
          argv = inspect.getsource(ss.main)
          assert "--include-on-demand" in argv, "豁免开关没在 CLI 上暴露"
          assert "args.include_on_demand" in argv, "豁免开关没接到闸上"
          assert "args.project" not in argv.split("drop_on_demand_projects(")[1].split(")")[0], \
              "--project 不许自带豁免: 一个开关一个意思, 免得'定向跑一下'变成'同意推进写作引擎'"
          print("  ✓ 通道1(跨库)步骤: 认 PROJECT_FILTER / 闸在写入前 / 回收不受闸管 /"
                " 任何一次跑都拦 on_demand 且点名 / 判不了照推 / 豁免不被 --project 带出")
          print("\non_demand 闸覆盖: all checks passed")
          PY
      - name: 指标藏在键值文本里的表 —— 解析口径 + 别顺手激活占位阈值 (D-048)
        working-directory: scripts
        run: |
          python - <<'PY'
          # 2026-08-31: 给 LNKT_phase1(抖音)把「数据汇总-第N次」文本里的指标解析上了。
          # 这一步真正的风险不在解析本身, 而在【解析成功的那一刻, 原本"不生效的占位阈值"
          # 会立刻变成生效的】—— LNKT 当时挂着 爆:50, 而实测运营标「无水花」的行互动最高
          # 到 555, 一上线就会把一大批趴自动升成爆。这道守卫把这个连带关系钉死。
          import yaml, pathlib, inspect
          import _common as c
          import sync_feishu_notes_to_truth_vault as s

          # ① parse_numeric: 中文数量级后缀。补它是因为「1.4万」以前会 ValueError → None,
          #    也就是【静默丢掉】, 而且丢的偏偏是数大到显示成万的高分行。
          assert c.parse_numeric("1.4万") == 14000.0
          assert c.parse_numeric("3.2w") == 32000.0
          assert c.parse_numeric("1.2亿") == 120000000.0
          # 边界: 裸后缀 / 带字母 / bool 仍必须 None(不能因为补后缀而放宽)
          for bad in ("万", "abc万", "", "无", "/", True, None, ["x"]):
              assert c.parse_numeric(bad) is None, bad
          # 原本解析得出来的值一个都不许变
          assert c.parse_numeric("2187") == 2187.0 and c.parse_numeric("1,234") == 1234.0
          assert c.parse_numeric("１２３") == 123.0 and c.parse_numeric(12.5) == 12.5
          # 非有限数必须拒绝 (审计 COR-018): NaN/Inf(含字符串 "nan"/"inf"/"1e999" 溢出)
          # 会炸掉下游 int()/写库, 或把脏值写进指标列。一律当"无数据"。
          import math
          for bad in (float("nan"), float("inf"), float("-inf"),
                      "nan", "inf", "-inf", "Infinity", "1e999"):
              assert c.parse_numeric(bad) is None, bad
          assert math.isfinite(c.parse_numeric(12.5))
          print("  ✓ parse_numeric 万/w/亿 + 边界 + 旧行为不变")

          # ② parse_kv_metrics: 只收纯数值键, 【比率键一律跳过】。
          #    计数键和比率键混在同一段文本里, 若把 "49.18%" 当 49.18 收进来, 下游会拿
          #    一个百分数去和互动量比阈值。
          m = c.parse_kv_metrics("播放量：2187；点赞量：77；划走率：49.18%；文案完读率：75%")
          assert m == {"播放量": 2187.0, "点赞量": 77.0}, m
          # ⚠️ 上面那条【测不到】比率跳过这一层: 今天的 parse_numeric 对 "49.18%" 本来
          #    就返回 None, 所以把 % 跳过删掉这条断言照样过(实测确认过)。真正要防的是
          #    "哪天有人给全仓共用的 parse_numeric 加上识别百分号" —— 那时比率会静默流进
          #    计数指标。所以把 parse_numeric 换成会吃 % 的版本, 专门测这一层还在。
          _orig = c.parse_numeric
          try:
              c.parse_numeric = lambda v: _orig(str(v).rstrip("%")) if isinstance(v, str) else _orig(v)
              assert c.parse_numeric("49.18%") == 49.18      # 先确认 patch 真的生效了
              m2 = c.parse_kv_metrics("播放量：2187；划走率：49.18%；文案完读率：75%")
              assert m2 == {"播放量": 2187.0}, ("比率键漏进计数指标了", m2)
          finally:
              c.parse_numeric = _orig
          assert c.parse_kv_metrics("") == {} and c.parse_kv_metrics(None) == {}
          assert c.parse_kv_metrics("播放量：；点赞量：无；评论量：5") == {"评论量": 5.0}
          # 富文本(list[dict{text}])要能归一 —— 与 parse_audience_analysis 同一条路
          assert c.parse_kv_metrics([{"text": "播放量：12；"}, {"text": "点赞量：3"}]) == {
              "播放量": 12.0, "点赞量": 3.0}
          print("  ✓ parse_kv_metrics 只收计数键 / 跳过比率 / 富文本归一 / 空段")

          # ③ 取值规则: 取【最后一个有值的快照】, 不取各键最大值。
          #    理由(实测): 154 行三次都有的里 12 行"晚的快照反而更小", 成因至少三种;
          #    取最大值会把其中"第1次之后塌掉"那种(1202→104)放大成 1202 = 凭空造爆款。
          mp = c.load_mapping("LNKT_phase1")
          BASE = {"笔记内容": "【标题】t 【正文】v", "方向": "流量贴", "人群方向": "都市打工人"}
          S = lambda p, z: f"播放量：{p}；点赞量：{z}；评论量：0；分享量：0；收藏量：0；划走率：9%"
          def run(**snaps):
              n, _, _ = s.transform_row(mp, "rec", {**BASE, **snaps})
              return n
          n = run(**{"数据汇总-第1次": S(1202, 40), "数据汇总-第2次": S(96, 2), "数据汇总-第3次": S(104, 3)})
          assert n["impressions"] == 104, n["impressions"]      # 取最后一次, 不是 1202
          reg = (n.get("data_quality_flags") or {}).get("metrics_snapshot_regressed")
          assert reg and reg["max_seen"] == 1202 and reg["picked_value"] == 104, reg
          # 中间快照为空要能跳过, 取到真正最后一个有值的
          n = run(**{"数据汇总-第1次": S(10, 1), "数据汇总-第2次": "", "数据汇总-第3次": S(900, 30)})
          assert n["impressions"] == 900 and "metrics_snapshot_regressed" not in (
              n.get("data_quality_flags") or {})
          # 一行的各项指标必须同源(都来自被选中的那个快照), 不许逐键取最大
          n = run(**{"数据汇总-第1次": S(1202, 400), "数据汇总-第3次": S(104, 3)})
          assert n["impressions"] == 104 and n["interactions"] == 3, (n["impressions"], n["interactions"])
          # 完全没有指标文本 → 【整个键都不写】(不是写成 None, 更不是写 0 冒充有数据)。
          # 用 .get() 而不是 [] —— 断言的是"没有这个键", 拿 [] 取会 KeyError 而不是断言失败。
          empty = run()
          assert "impressions" not in empty and "interactions" not in empty, sorted(empty)
          print("  ✓ 取最后一次快照 / 跳过空快照 / 各指标同源 / 无数据不写 0 / 回退要标记")

          # ④ 配了 metrics_from_kv_text 的项目: 配置本身要完整。
          #    (D-062 之前这里还断言"不能同时配 tier_thresholds" —— 那个键已整个作废,
          #     yaml job 的 mapping 守卫拒绝它, 这里不再重复。解析出的互动量不再参与判 tier。)
          for f in sorted(pathlib.Path("../mappings").glob("*.yaml")):
              if f.stem.startswith("_"):
                  continue
              d = yaml.safe_load(f.read_text()) or {}
              if not d.get("metrics_from_kv_text"):
                  continue
              spec = d["metrics_from_kv_text"]
              assert spec.get("sources") and spec.get("extract"), f"{f.stem} 配置不完整"
              assert isinstance(spec["sources"], list) and len(spec["sources"]) >= 1
          print("  ✓ 配了指标解析的项目配置完整")
          print("\n指标键值文本解析: all checks passed")
          PY
      - name: 方向列被写坏时的正文兜底 —— 只兜底、不越权 (D-049)
        working-directory: scripts
        run: |
          python - <<'PY'
          import pathlib, yaml
          import _common as c
          import sync_feishu_notes_to_truth_vault as s

          SPEC = {"default": "流量贴",
                  "rules": [{"direction": "产品贴",
                             "require": ["西屋", "GT33"],
                             "unless": ["求推荐", "纠结"]}]}

          # ① 规则语义: require 是【任一命中】, unless 是【任一命中就作废】。
          r = c.infer_direction_from_content("我家的西屋GT33用了三天", SPEC)
          assert r["direction"] == "产品贴" and r["rule"] == 0 and r["matched"] == ["西屋", "GT33"], r
          # 点了名但还在纠结 → unless 作废这条规则 → 落 default。这一条是整套判据的
          # 关键: 没买的人在正文里把 GT33 当候选款报价, 照样点名。
          r = c.infer_direction_from_content("看了下西屋GT33七千, 纠结要不要买", SPEC)
          assert r["direction"] == "流量贴" and r["rule"] == "default", r
          assert c.infer_direction_from_content("求推荐一款按摩椅", SPEC)["direction"] == "流量贴"
          # 没配 spec / 正文为空 → 什么都不做(老项目行为必须一字不变)
          assert c.infer_direction_from_content("西屋GT33", None) is None
          assert c.infer_direction_from_content("", SPEC) is None
          assert c.infer_direction_from_content(None, SPEC) is None
          # default 都没给 → 宁可不判
          assert c.infer_direction_from_content("随便一段话", {"rules": []}) is None
          print("  ✓ require/unless/default 语义 + 没配就不动")

          # ② 【本守卫的重点】: 运营填对了的方向, 一行都不许被推断覆盖。
          mp = c.load_mapping("XIWU_phase1")
          assert mp.get("direction_from_content"), "XIWU 的 direction_from_content 没了"
          BASE = {"素人编号": "T1", "文案": "【标题】t 【正文】我家西屋GT33用了三天",
                  "发布时间": "2026-08-24", "反馈链接": "https://x", "流量状态": "无水花"}
          def run(**extra):
              n, _, _ = s.transform_row(mp, "rec", {**BASE, **extra})
              return n
          # 正文长得像产品贴, 但方向列明明白白写着「流量贴」→ 必须听运营的
          n = run(**{"方向": "流量贴"})
          assert n["content_format"] == "提问求助", n["content_format"]
          assert "_direction_inferred" not in (n.get("raw_extra") or {}), n["raw_extra"]
          assert "direction_unmapped" not in (n.get("data_quality_flags") or {})
          print("  ✓ 方向填对的行不碰(推断不覆盖运营)")

          # ③ 方向列是脏值 → 才走正文, 且【必须留下出处】。
          n = run(**{"方向": "已发布"})
          assert n["content_format"] == "场景植入", n.get("content_format")
          inf = (n.get("raw_extra") or {}).get("_direction_inferred")
          assert inf and inf["direction"] == "产品贴" and inf["by"] == "正文推断", inf
          flag = (n.get("data_quality_flags") or {}).get("direction_unmapped")
          assert flag == {"raw": "已发布", "inferred": "产品贴"}, flag
          # 脏方向 + 正文是提问求助 → 落 default 流量贴, 同样留出处
          n2 = run(**{"方向": "已发布", "文案": "【标题】t 【正文】姐妹们求推荐按摩椅"})
          assert n2["content_format"] == "提问求助", n2.get("content_format")
          assert (n2["raw_extra"]["_direction_inferred"]["direction"]) == "流量贴"
          print("  ✓ 脏方向才走正文 + raw_extra/flags 双留痕")

          # ④ 推断【不许】碰 tier —— 同 D-048 的口径: tier 是钱字段。
          #    脏方向那行 tier 只能来自「流量状态」, tier_source 不能变。
          assert n["tier_source"] == "状态字段" and n["tier"] == "趴", (n["tier_source"], n["tier"])
          # 代码层面也钉住: excluded_directions 用的是【原始】方向, 不是推断出来的那个。
          # 改坏了这一行, 推断就能间接改 tier。(方向级 tier_threshold_override 已随 D-062 作废,
          # 引擎里不得再出现; 项目级 tier_thresholds 同理。)
          src = pathlib.Path("sync_feishu_notes_to_truth_vault.py").read_text()
          body = src.split('if "_direction_raw" in intermediates:', 1)[1].split("# ── Numeric tier fallback", 1)[0]
          needle = 'if excluded.get("direction") == dir_key:'
          assert needle in body, f"excluded_directions 被改成了推断值? 找不到: {needle}"
          assert "tier_threshold_override" not in src, "方向级阈值覆盖已废(D-062), 引擎里不该再读它"
          assert 'mapping.get("tier_thresholds")' not in src, "项目级互动量阈值已废(D-062), 引擎里不该再读它"
          assert "lifted" in body and body.index("lifted = decomposition") < body.index(
              'if lifted is not None and "sub_directions" not in lifted'), "兜底顺序被改了"
          print("  ✓ 推断只 lift content_format 那几列, 不参与 tier 判定")

          # ⑤ 配了 direction_from_content 的项目, 它指到的方向必须真的在
          #    direction_decomposition 里 —— 否则推断出来是个查不到的名字, 白推。
          for f in sorted(pathlib.Path("../mappings").glob("*.yaml")):
              if f.stem.startswith("_"):
                  continue
              d = yaml.safe_load(f.read_text()) or {}
              spec = d.get("direction_from_content")
              if not spec:
                  continue
              dd = d.get("direction_decomposition") or {}
              names = [r.get("direction") for r in (spec.get("rules") or [])]
              if spec.get("default"):
                  names.append(spec["default"])
              assert names, f"{f.stem} 的 direction_from_content 一个方向都没给"
              for name in names:
                  assert name in dd, (
                      f"{f.stem} 的正文兜底会推出「{name}」, 但 direction_decomposition "
                      f"里没有它 → 推了也拿不到 content_format。")
          print("  ✓ 兜底推出来的方向都能在 direction_decomposition 里查到")
          print("\n方向正文兜底: all checks passed")
          PY
      - name: on_demand 闸在 bash -e 下不许把「照跑」当崩溃 (D-051, 8/31~9/2 essence/curate 连红三晚)
        working-directory: scripts
        run: |
          python - <<'PY'
          import os, pathlib, re, subprocess, sys, yaml
          wf = pathlib.Path("../.github/workflows/daily-sync.yml").read_text(encoding="utf-8")
          gate_lines = [l.strip() for l in wf.splitlines()
                        if "skip_on_cron.py" in l and not l.strip().startswith("#")]
          assert len(gate_lines) >= 2, f"essence/curate 两步都该接闸, 只找到 {gate_lines}"
          # ① 形态: 裸调 `cmd; rc=$?` 在 bash -e 下, 退出码 1(=照跑)会先把整步掐死。
          #    D-047 的守卫只查了 "skip_on_cron.py" 这个字符串在不在, 没查退出码怎么被消费 —— 空跑了。
          for l in gate_lines:
              assert not re.search(r'skip_on_cron\.py\s+"\$p"\s*;\s*rc=\$\?', l), \
                  f"又写成裸调了(bash -e 会在 rc=\\$? 之前退出): {l}"
              assert ("|| rc=$?" in l) or l.startswith("if "), f"退出码没被 || / if 接住: {l}"
          # ② 【真的跑】: 把 workflow 里那一行原样丢进 bash -e, 后面跟一个哨兵。
          #    daily+cron → 闸说 1(照跑), 哨兵必须打印; on_demand+cron → 0; 读不出 → 2。
          def sub(m): return m.get("sync_config", {}).get("sync_interval")
          maps = {p.stem: yaml.safe_load(p.read_text()) or {} for p in pathlib.Path("../mappings").glob("*.yaml")
                  if not p.stem.startswith("_")}
          daily = next(k for k, m in maps.items() if sub(m) == "daily")
          on_demand = next(k for k, m in maps.items() if sub(m) == "on_demand")
          line = gate_lines[0]
          def run(project, scheduled):
              env = dict(os.environ, TV_SCHEDULED_RUN="true" if scheduled else "", p=project)
              r = subprocess.run(["bash", "-e", "-c", line + '; echo "SENTINEL rc=$rc"'],
                                 capture_output=True, text=True, env=env)
              m = re.search(r"SENTINEL rc=(\d)", r.stdout)
              return (int(m.group(1)) if m else None), r.returncode
          assert run(daily, True)     == (1, 0), f"daily+cron 该走到哨兵且 rc=1, 实际 {run(daily, True)}"
          assert run(on_demand, True) == (0, 0), f"on_demand+cron 该 rc=0, 实际 {run(on_demand, True)}"
          assert run("NO_SUCH_PROJECT_xyz", True) == (2, 0), "读不出 mapping 该 rc=2 且不掐步"
          assert run(daily, False)    == (1, 0), "显式 dispatch 也是照跑(1), 同样不能掐步"
          print(f"  ✓ 闸行原样在 bash -e 下跑通: daily/cron→1, on_demand/cron→0, 读不出→2 ({daily}/{on_demand})")
          print("\non_demand 闸 bash -e: all checks passed")
          PY
