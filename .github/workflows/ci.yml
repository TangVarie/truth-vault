      - name: v1.8 rollback path actually works (codex review)
        # 本文件给视图追加了 4 列, 而 CREATE OR REPLACE VIEW 不能删列。
        # 后果不只是"回滚说明写错": 在已应用 v1_8 的库上【重跑基线
        # notes_v1_2_cross_schema_views.sql 会 ERROR: cannot drop columns from view】——
        # 而那个文件是按可重复执行设计的。所以 v1_8 改成了 DROP + CREATE,
        # 这一步把"回滚→再前滚"的整条路钉死, 免得以后有人改回 CREATE OR REPLACE。
        run: |
          set -e
          cols() {
            psql -tAc "SELECT count(*) FROM information_schema.columns
                        WHERE table_schema='truth_vault'
                          AND table_name='v_autowriter_positive_pool_saturation';" | tr -d ' '
          }
          [ "$(cols)" = "10" ] || { echo "前置状态应为 v1_8 的 10 列, 实际 $(cols)"; exit 1; }

          echo "— 回滚: DROP 后重跑基线, 应回到 6 列"
          psql -v ON_ERROR_STOP=1 -c "DROP VIEW IF EXISTS truth_vault.v_autowriter_positive_pool_saturation;"
          psql -v ON_ERROR_STOP=1 -f schemas/notes_v1_2_cross_schema_views.sql
          [ "$(cols)" = "6" ] || { echo "回滚后应为 6 列, 实际 $(cols)"; exit 1; }

          echo "— 再前滚: 重新应用 v1_8, 应回到 10 列"
          psql -v ON_ERROR_STOP=1 -f schemas/notes_v1_8_positive_pool_saturation_fix.sql
          [ "$(cols)" = "10" ] || { echo "再前滚后应为 10 列, 实际 $(cols)"; exit 1; }

          echo "— 反证: 不先 DROP 直接重跑基线【必须失败】"
          if psql -v ON_ERROR_STOP=1 -f schemas/notes_v1_2_cross_schema_views.sql 2>/dev/null; then
            echo "基线在 v1_8 之上竟然应用成功了 —— v1_8 大概被改回 CREATE OR REPLACE 了?"
            echo "(那样回滚路径和基线重跑都会静默留下错误的列集)"
            exit 1
          fi
          echo "  ok: 如预期报 cannot drop columns from view"

          echo "— 收尾: 恢复到 v1_8 状态供后续步骤使用"
          psql -v ON_ERROR_STOP=1 -c "DROP VIEW IF EXISTS truth_vault.v_autowriter_positive_pool_saturation;"
          psql -v ON_ERROR_STOP=1 -f schemas/notes_v1_2_cross_schema_views.sql
          psql -v ON_ERROR_STOP=1 -f schemas/notes_v1_8_positive_pool_saturation_fix.sql
          [ "$(cols)" = "10" ] || { echo "收尾后应为 10 列"; exit 1; }
          echo "v1_8 rollback round-trip OK"
