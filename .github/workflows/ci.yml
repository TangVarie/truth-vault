          #   未知 被推; ③ 只向上推; ④ 人工 tier 永远压过推断; ⑤ comments_count 同时进 notes
          #   和 metric_snapshots, 其余 metric-only 列(likes/saves/…)仍不得漏进 notes payload。
          import sync_feishu_notes_to_truth_vault as s

          # 门槛常数与 notes_v1_12 里 v_tier_discrepancy 的 50/100 是同一对数字(sql job 用
          # 49/50/99/100 四个边界钉着视图)。改这里必须同步改视图和那组夹具 —— 判据两处各写一份
          # 是 D-061 的老毛病, 但视图是只读复核、不是第二个写入口, 所以允许, 只是要钉死。
          assert (s._COMMENT_TIER_BAO, s._COMMENT_TIER_DABAO) == (50, 100), \
              "评论数门槛变了: 同步改 schemas/notes_v1_12_comment_tier.sql 的 v_tier_discrepancy + CI sql 夹具 ⑦"

          mapping = {
              "project_id": "TEST_P", "platform": "xiaohongshu",
              "field_mapping": {
                  "文案": "raw_content", "互动量": "interactions",
                  "点赞": "likes", "收藏": "saves",
                  "实时数据.评论数": "comments_count",
                  "状态": "_status_raw",
              },
              "tier_extraction": {"source": "状态字段", "rules": [
                  {"match_contains": ["大爆"], "tier": "大爆"},
                  {"match_contains": ["评估中"], "tier": "评估中"},
                  {"default": None},
              ]},
          }
          def row(**kw):
              r = {"文案": "c"}; r.update(kw); return r

          # ① 没有人工 tier + 评论数过线 → 推 爆 / 大爆, tier_source=数值推断 (边界含 50/100, 运营: ≥)
          n, m, _ = s.transform_row(mapping, "r1", row(**{"实时数据.评论数": 60, "互动量": 5, "点赞": 1, "收藏": 2}))
          assert n["tier"] == "爆" and n["tier_source"] == "数值推断", (n.get("tier"), n.get("tier_source"))
          n, _, _ = s.transform_row(mapping, "r2", row(**{"实时数据.评论数": 120}))
          assert n["tier"] == "大爆" and n["tier_source"] == "数值推断", n.get("tier")
          assert s.transform_row(mapping, "r2b", row(**{"实时数据.评论数": 50}))[0]["tier"] == "爆"
          assert s.transform_row(mapping, "r2c", row(**{"实时数据.评论数": 100}))[0]["tier"] == "大爆"
          print("  ✓ 评论数 ≥50 → 爆, ≥100 → 大爆 (数值推断)")

          # ② 互动量再高, 没有评论数就【不推】—— 互动量不是判爆依据。
          #    (反证: 把旧的 interactions 分支放回去, 这条会红)
          n, _, _ = s.transform_row(mapping, "r3", row(**{"互动量": 5000}))
          assert n.get("tier") is None and n.get("tier_source") != "数值推断", \
              f"没有评论数却被推了 tier={n.get('tier')} —— 又拿互动量当尺子了 (D-062)"
          print("  ✓ 互动量 5000 但无评论数 → 不推断")

          # ③ 评估中 是正式档位: 映成 评估中, 且评论数过线也【不】被推 ——
          #    运营明说 20~50 条的帖不用动; 评论数涨过 50 由运营改标, 脚本不越权。
          n, _, _ = s.transform_row(mapping, "r4", row(**{"状态": "评估中", "实时数据.评论数": 60}))
          assert n["tier"] == "评估中" and n["tier_source"] == "状态字段", (n.get("tier"), n.get("tier_source"))
          print("  ✓ 评估中 保持 评估中, 不被数值推断越权")

          # ④ 只向上推: 评论数不够线不推 趴/评估中 (新帖评论数天然少)
          for c in (30, 0):
              n, _, _ = s.transform_row(mapping, f"r5_{c}", row(**{"实时数据.评论数": c}))
              assert n.get("tier") is None, f"评论数 {c} 不该被推成 {n.get('tier')}"
          print("  ✓ 不够线不推 趴/评估中")

          # ⑤ 人工 tier 永远压过推断 (评论数只有 10 也是大爆, 因为运营这么标)
          n, _, _ = s.transform_row(mapping, "r6", row(**{"状态": "大爆", "实时数据.评论数": 10}))
          assert n["tier"] == "大爆" and n["tier_source"] == "状态字段", n
          print("  ✓ 状态字段 压过数值推断")

          # ⑥ comments_count 是 notes 的 typed 列(notes_v1_12), 也扇出到 metric_snapshots;
          #    likes/saves 仍是 metric-only, 不得漏进 notes payload。
          n, m, _ = s.transform_row(mapping, "r7", row(**{"实时数据.评论数": 7, "互动量": 500, "点赞": 12, "收藏": 3}))
          assert n.get("comments_count") == 7, f"comments_count 没进 notes payload: {sorted(n)}"
          assert m["comments_count"] == 7 and m["interactions"] == 500 and m["likes"] == 12 and m["saves"] == 3
          assert "likes" not in n and "saves" not in n, "metric-only 列漏进 notes payload"
          assert "interactions" in n
          print("  ✓ comments_count 进 notes + metric; likes/saves 只进 metric")

          # Case F (PR#51/#52 regression): Feishu 可能把「发布笔记」返回成 LIST
          # (多选 / list[str]) — map_intent 必须经 _direction_key 展平,不能直接拿
          # list 做 dict-key 查找而 `TypeError: unhashable type: 'list'`
          # (NRT_2 全表 sync 失败的根因)。
          mapping_intent = {
              "project_id": "TEST_I", "platform": "xiaohongshu",
              "field_mapping": {"文案": "raw_content", "发布笔记": "_intent_raw"},
              "intent_mapping": {"钓鱼帖": "traffic", "直给笔记": "conversion"},
          }
          note_f1, _, _ = s.transform_row(mapping_intent, "recF1", {"文案": "c", "发布笔记": ["钓鱼帖"]})
          assert note_f1.get("intent") == "traffic", note_f1.get("intent")
          note_f2, _, _ = s.transform_row(mapping_intent, "recF2", {"文案": "c", "发布笔记": [{"text": "直给笔记"}]})
          assert note_f2.get("intent") == "conversion", note_f2.get("intent")
          note_f3, _, _ = s.transform_row(mapping_intent, "recF3", {"文案": "c", "发布笔记": "钓鱼帖"})
          assert note_f3.get("intent") == "traffic", note_f3.get("intent")
          # 多选(2 个不同 intent)→ 收敛为合法 enum 'mixed',绝不写非法拼接串(撞 notes.intent CHECK)
          note_f4, _, _ = s.transform_row(mapping_intent, "recF4", {"文案": "c", "发布笔记": ["钓鱼帖", "直给笔记"]})
          assert note_f4.get("intent") == "mixed", note_f4.get("intent")
          # 未知值 → 'other'(合法 enum),不原样写中文
          note_f5, _, _ = s.transform_row(mapping_intent, "recF5", {"文案": "c", "发布笔记": ["说书帖"]})
          assert note_f5.get("intent") == "other", note_f5.get("intent")
          # 不变量:任何非空 intent 都必须落在 notes.intent CHECK 的合法 enum 内
          _ENUM = {"traffic", "conversion", "educational", "mixed", "other"}
          for nf in (note_f1, note_f2, note_f3, note_f4, note_f5):
              assert nf.get("intent") in _ENUM, nf.get("intent")
          print("  ✓ list[str]/list[dict]/str + 多选→mixed + 未知→other,intent 恒为合法 enum(不崩不撞 CHECK)")

          # ⑦ ensure_project_exists 每轮把已废的 tier_thresholds【显式】写 NULL(codex review on #130 P2
          #   的延伸): notes_v1_12 清过一次, 但合并前主干旧代码若再跑一次夜跑, 会按旧 yaml 把它写回,
          #   而迁移不会跑第二次回填 —— 靠"不送这列"收敛不了, 每轮写 NULL 才自愈。
          #   用一份还带着 tier_thresholds 的旧式 mapping 喂它(模拟主干上的旧 yaml)。
          import _common as C
          captured = {}
          class _T:
              def upsert(self, row, **k): captured.update(row); return self
              def execute(self): return None
          class _SB:
              def schema(self, _): return self
              def table(self, _): return _T()
          C.ensure_project_exists(_SB(), {"project_id": "P_old", "brand": "b", "product": "p",
                                          "category": "其他", "tier_thresholds": {"爆": 30, "大爆": 100},
                                          "tier_extraction": {"source": "状态字段", "rules": []}})
          assert "tier_thresholds" in captured and captured["tier_thresholds"] is None, \
              f"已废的 tier_thresholds 必须显式写 NULL(每轮自愈), 实得 {captured.get('tier_thresholds', '<未送>')!r}"
          assert "tier_thresholds" not in captured["mapping_config"], \
              "mapping_config 快照不该再带 tier_thresholds"
          print("  ✓ ensure_project_exists 每轮把已废 tier_thresholds 写 NULL, 快照不再带这个键")
          print("\ntransform_row tier(评论数尺子)+metric+intent: all checks passed")
          PY
