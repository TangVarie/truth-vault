              FROM truth_vault.v_tier_discrepancy WHERE project_id='CI_D062'")
          WANT5="over=over_marked soft=over_marked_soft under=under_marked under2=under_marked"
          [ "$GOT5" = "$WANT5" ] || { echo "❌ v_tier_discrepancy 没按评论数口径判。期望 [$WANT5] 实得 [$GOT5]"; exit 1; }
          echo "✓ v1.12: comments_count 在 / 评估中 可写 / 瞎写仍被拒 / 回填三条路径 + 首次判据 + 幂等 / 阈值清空 / 视图评论数口径"
