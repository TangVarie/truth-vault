          note["platform"] = None
          assert ssll.build_reference_sample(note, [])["platform"] == "小红书", "note 没 platform 时回落到项目"
          print("  ✓ ssll 平台取值: 笔记优先于项目, 且 select 真的选了 note 级 platform")
          print("\n名册行/抖音行继承: all checks passed")
