          python - <<'PY'
          # 2026-09-17 (D-062, 运营对齐 Q1): 判爆【只看评论数】, 全项目统一 爆≥50 / 大爆≥100。
          #   旧版按互动量过项目级 tier_thresholds 推断 —— 那是另一把尺子: 43 条推断里 12 条
