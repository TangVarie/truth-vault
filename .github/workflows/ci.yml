      - name: 假爆款最后一道网:伪爆帖/伪爆贴 帖贴混写都要标 synthetic (2026-08-28)
        working-directory: scripts
        run: |
          python - <<'PY'
          # 运营在「流量状态」里手写的假数据标记 —— 命中就必须 synthetic=true, 否则人工假爆款
          # 【以真爆款身份】进飞轮 + 进看板爆款率。这道网【独立】于 tier 取值, 正因为 tier 规则的
          # match_contains「爆帖」会把「伪爆帖500」先命中成 爆(BJS_phase1 实测)。
          # 本 guard 的非空转证明: 旧实现是 `"伪爆贴" in s`, 对下面标 ← 的两个用例返回 False,
          # 断言会红 —— 帖/贴 是两个字, 运营两种都写(库里 mapping 的 tier 规则早就两个都收)。
          import re, sync_feishu_notes_to_truth_vault as s
          RE = s._SYNTHETIC_TIER_SRC_RE
          hit = [
              "伪爆贴500",   # RIO 式(旧实现也认)
              "伪爆帖500",   # ← BJS/SPX 实测写法, 旧实现漏
              "伪20评",      # ← 人工补的假评论数, 旧实现漏
              "伪50评",
              "无水花 / 伪爆帖500",   # 多选串里也要认
          ]
          miss = ["无水花", "爆贴", "爆帖", "蓝词", "评估中", "大爆", "无水花 / 爆贴", ""]
          bad = [v for v in hit if not RE.search(v)] + [v for v in miss if RE.search(v)]
          assert not bad, f"synthetic 标记判定错: {bad}"
          # 旧实现确实漏 —— 证明本 guard 不是空转
          legacy_missed = [v for v in hit if "伪爆贴" not in v]
          assert legacy_missed, "旧实现 `'伪爆贴' in s` 应至少漏一个用例, 否则本 guard 无意义"
          print(f"  ✓ 命中 {len(hit)} / 放行 {len(miss)}; 旧实现会漏 {legacy_missed}")

          # synthetic_reason 要点名命中的原串(排查时不用回飞书翻)
          import inspect
          src = inspect.getsource(s.transform_row)
          assert "_SYNTHETIC_TIER_SRC_RE" in src, "transform_row 必须走这个正则, 不许再写死字符串"
          assert '"伪爆贴" in tier_src_str' not in src, "旧的写死判定没删干净"
          print("  ✓ transform_row 走 _SYNTHETIC_TIER_SRC_RE, 无写死字符串残留")
          print("\nsynthetic 伪爆帖/伪爆贴: all checks passed")
          PY
      - name: comment_maintained 分来路记录, 与 synthetic 正交 (D-060)
        working-directory: scripts
        run: |
          python - <<'PY'
          # owner 2026-09-16: "评论数过了50, 但这有可能是我们刷的, 所以其真实的流量一般般"
          #
          # 第一版只写一个布尔, 被 codex PR#128 P1 指出内部矛盾。查实测(爆款内按来路分):
          #     ① 铺评工单   n=28  中位互动 13
          #     ② 起量后干预 n=39  中位互动 856~1225
          #     ④ 无干预信号 n=306 中位互动 303
          # ② 比【完全没有干预信号】的爆款还高 3~4 倍 —— 是真赢家(对已爆的帖做二次运营)。
          # 所以 codex 建议的"把 comment_maintained=true 整体剔出训练集"是【错的】,
          # 那会删掉 39 条最真的爆款。真正的问题是一个布尔拆不开两种相反语义 → 改记 routes。
          #
          # 本守卫钉住四件事, 全部断行为不断源码字符串(D-051):
          #   (1) 两条来路必须【分开】记, 不许合并;
          #   (2) 爆帖控评置顶 / 爆帖置顶评论 两列必须认(codex P2: 此前完全漏网);
          #   (3) routes 顺序必须【跨进程】确定, 否则 upsert 每晚写出不同 JSON;
          #   (4) 不许并进 synthetic —— 真爆贴也会控评。
          import os, sys, json, subprocess
          import sync_feishu_notes_to_truth_vault as s
          TICKET, POSTHOC = s._CM_ROUTE_TICKET, s._CM_ROUTE_POSTHOC

          BASE = {
              "project_id": "TEST_CM", "platform": "xiaohongshu",
              "field_mapping": {"文案": "raw_content", "互动量": "interactions", "状态": "_status_raw"},
              "tier_extraction": {"source": "状态字段", "rules": [
                  {"match_contains": ["伪爆贴"], "tier": "爆"},
                  {"match_contains": ["爆贴"], "tier": "爆"},
                  {"match_contains": ["无水花"], "tier": "趴"}]},
              "project_specific_fields_to_raw_extra": [
                  "维护评论50条", "评论铺设情况", "爆帖控评置顶", "爆帖置顶评论", "评论状态"],
          }
          def f(n): return n.get("data_quality_flags") or {}
          def rt(n): return f(n).get("comment_maintained_routes")

          # ① tier 源含「控评」→ 起量后干预; synthetic 仍 false; tier 不变
          n1, _, _ = s.transform_row(BASE, "r1", {"文案": "c", "状态": "爆贴 控评✅", "互动量": 500})
          assert rt(n1) == [POSTHOC], rt(n1)
          assert f(n1).get("synthetic") is False, f"控评被误判成假爆款, 真赢家会被删出飞轮: {f(n1)}"
          assert n1["tier"] == "爆", f"这个标记不该动 tier: {n1.get('tier')!r}"

          # ② 铺评工单列 → 铺评工单(必须与 ① 分开)
          for col in s._CM_TICKET_COLS:
              n, _, _ = s.transform_row(BASE, "r2", {"文案": "c", "状态": "爆贴", col: "评论1 评论2"})
              assert rt(n) == [TICKET], f"{col} 该走铺评工单而非起量后干预: {rt(n)}"
              n0, _, _ = s.transform_row(BASE, "r2b", {"文案": "c", "状态": "爆贴", col: ""})
              assert "comment_maintained" not in f(n0), f"{col} 为空不该命中: {f(n0)}"

          # ③ 爆帖控评/置顶列 → 起量后干预 (codex P2: HXZ_QD 3 行全漏, HXZ_FB 9 行漏 5)
          for col in s._CM_POSTHOC_COLS:
              n, _, _ = s.transform_row(BASE, "r3", {"文案": "c", "状态": "爆贴", col: "x"})
              assert rt(n) == [POSTHOC], f"{col} 该走起量后干预: {rt(n)}"

          # ④ 评论状态: 只认后验干预值, 常规值放行
          for v in s._COMMENT_MAINTAINED_STATUS:
              n, _, _ = s.transform_row(BASE, "r4", {"文案": "c", "状态": "爆贴", "评论状态": v})
              assert rt(n) == [POSTHOC], f"{v}: {rt(n)}"
          for v in ("没有显示", "显示评论", "正常发布", "待评论", "无需控评"):
              n, _, _ = s.transform_row(BASE, "r4b", {"文案": "c", "状态": "爆贴", "评论状态": v})
              assert "comment_maintained" not in f(n), f"{v} 是常规状态, 不该命中: {f(n)}"

          # ⑤ 两条来路同时在场 → 都记, 且顺序【跨进程】确定。
          #    set 的迭代序随 PYTHONHASHSEED 变, 单进程内测不出来 —— 第一版这条断言写成
          #    `rt == sorted(rt)`, 反证(把 sorted 换成 list)时【没有变红】, 因为单次运行里
          #    set 序恰好等于排序序。必须起子进程换种子才测得到。
          n5, _, _ = s.transform_row(BASE, "r5", {"文案": "c", "状态": "爆贴 控评✅", "维护评论50条": "x"})
          assert set(rt(n5)) == {TICKET, POSTHOC}, rt(n5)
          probe = (
              "import sys;sys.path.insert(0,%r);import sync_feishu_notes_to_truth_vault as s,json;"
              "n,_,_=s.transform_row(%r,'p',{'文案':'c','状态':'爆贴 控评✅','维护评论50条':'x'});"
              "print(json.dumps(n['data_quality_flags']['comment_maintained_routes'],ensure_ascii=False))"
          ) % (os.getcwd(), BASE)
          outs = set()
          for seed in ("0", "1", "42", "12345"):
              env = {**os.environ, "PYTHONHASHSEED": seed}
              outs.add(subprocess.run([sys.executable, "-c", probe], capture_output=True,
                                      text=True, env=env, check=True).stdout.strip())
          assert len(outs) == 1, f"routes 顺序随 PYTHONHASHSEED 变, upsert 每晚会写出不同 JSON: {outs}"
          assert json.loads(outs.pop()) == sorted([TICKET, POSTHOC]), "routes 必须排序后写"

          # ⑥ 飞书多选回的是 list —— 库里「评论状态」实际存成 '["二次评论"]'
          n6, _, _ = s.transform_row(BASE, "r6", {"文案": "c", "状态": "爆贴", "评论状态": ["二次评论"]})
          assert rt(n6) == [POSTHOC], f"list 形态漏判(库里就是这个形态): {rt(n6)}"

          # ⑦ 未声明列路径(D-055 _undeclared) —— BJS/SPX 的「评论状态」就是未声明的
          M7 = dict(BASE); M7["project_specific_fields_to_raw_extra"] = []
          n7, _, und7 = s.transform_row(M7, "r7", {"文案": "c", "状态": "爆贴", "爆帖置顶评论": "x"})
          assert "爆帖置顶评论" in und7, f"前提不成立(该列应落入 undeclared): {und7}"
          assert rt(n7) == [POSTHOC], f"_undeclared 路径漏判: {rt(n7)}"

          # ⑧ 三路都不在场 → 缺键, 不是 false。
          #    写 false = 用"这张表没有控评列"冒充"这条没被控评", 是假阴性。
          n8, _, _ = s.transform_row(BASE, "r8", {"文案": "c", "状态": "无水花", "互动量": 2})
          assert "comment_maintained" not in f(n8) and "comment_maintained_routes" not in f(n8), \
              f"缺信号时必须缺键, 不许写 false: {f(n8)}"
          assert f(n8).get("synthetic") is False, f"synthetic 的显式 false 不受影响: {f(n8)}"

          # ⑨ 两个 flag 同时在场时互不干扰
          n9, _, _ = s.transform_row(BASE, "r9", {"文案": "c", "状态": "伪爆贴500 控评✅", "互动量": 500})
          assert f(n9).get("synthetic") is True and f(n9).get("comment_maintained") is True, f(n9)
          assert rt(n9) == [POSTHOC], rt(n9)
          assert "伪爆贴" in f(n9).get("synthetic_reason", ""), f(n9)

          # ⑩ typed 列 pinned_comment 非空 → 起量后干预 (D-062, owner 拍板并入 route ②)。
          #    模板把「爆帖置顶评论」映成 typed 列, raw_extra 里查不到那一列 —— 上面按列名找的
          #    循环会漏掉它(生产 127 行, 126 行是爆款)。运营确认这列记的是"第一屏有没有置顶显示",
          #    置顶只有作者能做 → 属起量后动作。
          #    ⚠️ 夹具要把这列【从 allowlist 里拿掉】: BASE 为了测 HXZ 那种未映射的表把它列在
          #    raw_extra allowlist 里, 留着的话值会同时落进 raw_extra, 上面按列名找的循环就把它
          #    兜住了 —— 反证时去掉 typed 分支 flag 照样 True, 断言变成空跑(第一版就是这样)。
          MP10 = dict(BASE, field_mapping={**BASE["field_mapping"], "爆帖置顶评论": "pinned_comment"},
                      project_specific_fields_to_raw_extra=[c for c in BASE.get("project_specific_fields_to_raw_extra", [])
                                                            if c != "爆帖置顶评论"])
          n10, _, _ = s.transform_row(MP10, "r10", {"文案": "c", "状态": "爆贴", "互动量": 300, "爆帖置顶评论": "第一条置顶"})
          assert f(n10).get("comment_maintained") is True and rt(n10) == [POSTHOC], f(n10)
          assert "pinned_comment" in f(n10).get("comment_maintained_reason", ""), f(n10)
          n10b, _, _ = s.transform_row(MP10, "r10b", {"文案": "c", "状态": "爆贴", "互动量": 300, "爆帖置顶评论": ""})
          assert "comment_maintained" not in f(n10b), f"置顶列为空不该算干预: {f(n10b)}"

          print("comment_maintained 分来路 × synthetic 正交: all checks passed")
          PY
      - name: 评价来源不得伪造成人工 (TV-01)
        working-directory: scripts
        run: |
          python - <<'PY'
          # 2026-09-17 外部评测 TV-01 (P1): 旧实现把【所有】AW 决策一律写成
          # evaluator_type='human', evaluator_id=item.user_id(稿件作者)。
          # AW 的 autowriter.items 早有 decision_source/reviewer_id/decided_at, 一个没读。
          # 生产核过: 598 条评价全是 human, 而对应 item 的 decision_source 全为 NULL ——
          # "机器判定被洗成人工"还没真发生, 但 AW 一开始写那列就会静默发生。
          import sys as _sys
          import sync_autowriter_decisions_to_prepublish as m

          # ① 来源 → 身份映射。'不认识就不猜', 绝不默认成人工。
          cases = [
              ({"decision_source": "human", "reviewer_id": "rev-1", "user_id": "author-1"}, ("human", "rev-1")),
              ({"decision_source": "human", "reviewer_id": None, "user_id": "author-1"}, ("human", None)),
              ({"decision_source": "auto_dedup", "user_id": "author-1"}, ("rule_based", "auto_dedup")),
              ({"decision_source": "auto_hard_rule", "user_id": "a"}, ("rule_based", "auto_hard_rule")),
              ({"decision_source": "system", "user_id": "a"}, ("rule_based", "system")),
              ({"decision_source": None, "user_id": "author-1"}, ("unverified", None)),
              ({"decision_source": "", "user_id": "author-1"}, ("unverified", None)),
              ({"decision_source": "   ", "user_id": "author-1"}, ("unverified", None)),
              ({"decision_source": "brand_new_source_2027", "user_id": "a"}, ("unverified", "brand_new_source_2027")),
              ({"user_id": "author-1"}, ("unverified", None)),
          ]
          for item, want in cases:
              got = m._provenance(item)
              assert got == want, f"{item.get('decision_source')!r} → {got}, 期望 {want}"
          # ② 作者【永远】不能出现在 evaluator_id 里 —— 作者不是审稿人。
          for item, _ in cases:
              assert m._provenance(item)[1] != item.get("user_id"), f"作者被当成评价人: {item}"

          # ③ 降级判据必须窄: 只认"缺那三列", 不能把别的错一起吞成降级。
          class E(Exception): pass
          assert m._is_missing_provenance(E("column items.decision_source does not exist (42703)"))
          assert m._is_missing_provenance(E("42703: column reviewer_id does not exist"))
          assert not m._is_missing_provenance(E("connection timeout"))
          assert not m._is_missing_provenance(E("permission denied for table items"))
          assert not m._is_missing_provenance(E("column updated_at does not exist")), \
              "updated_at 的错该走它自己的降级路径, 不能被这条吞掉"
          # 判据里不能有光秃秃的 "column" —— 本机 PG16 实测这条是 42702 而不是缺列,
          # 旧写法会把它吞成"缺列"并静默降级。updated_at 那条同款, 一起钉住。
          assert not m._is_missing_provenance(E('column reference "decision_source" is ambiguous')), \
              "42702 列名歧义不是缺列, 不能吞成降级 (codex review P2)"
          assert not m._is_missing_updated_at(E('column reference "updated_at" is ambiguous'))
          assert m._is_missing_updated_at(E("column items.updated_at does not exist")), \
              "真正的缺列必须仍然判得出来"

          # ④ 真正写出去的行
          rows = []
          class T:
              def insert(self, r): rows.append(("insert", r)); return self
              def update(self, r): rows.append(("update", r)); return self
              def eq(self, *a, **k): return self
              def execute(self): return type("R", (), {"data": []})()
          class SB:
              def schema(self, _): return self
              def table(self, _): return T()

          m.insert_evaluation(SB(), {"id": "i1", "status": "needs_revision", "user_id": "author-1",
                                     "decision_source": "auto_dedup", "decided_at": "2026-09-01T00:00:00Z"})
          kind, r = rows[-1]
          assert kind == "insert" and r["evaluator_type"] == "rule_based", r
          assert r["evaluator_id"] == "auto_dedup" != "author-1"
          assert r["created_at"] == "2026-09-01T00:00:00Z", f"应记决策时刻而非同步时刻: {r}"

          m.insert_evaluation(SB(), {"id": "i2", "status": "approved", "user_id": "author-2"})
          _, r = rows[-1]
          assert r["evaluator_type"] == "unverified" and r["evaluator_id"] is None, r

          # ⑤ 来源补上之后【就地升级】此前的 unverified 行, 不另插 —— 另插会在校准表里数两次。
          m.insert_evaluation(SB(), {"id": "i3", "status": "approved", "user_id": "a",
                                     "decision_source": "human", "reviewer_id": "rev-9",
                                     "_upgrade_evaluation_id": "ev-77"})
          kind, r = rows[-1]
          assert kind == "update", f"应 UPDATE 升级而不是 INSERT: {kind}"
          # 升级要把整行对齐: decision 也可能过期(approved→needs_revision),
          # 只换身份会在校准表里留着旧判决, 比"没这行"更糟 —— 看着像已核对过。
          assert r.get("decision") == "pass", f"升级必须同时刷新 decision: {r}"
          assert r["evaluator_type"] == "human" and r["evaluator_id"] == "rev-9", r
          assert "created_at" not in r, f"decided_at 缺席时不该拿同步时刻去覆盖旧时间: {r}"
          m.insert_evaluation(SB(), {"id": "i4", "status": "needs_revision", "user_id": "a",
                                     "decision_source": "auto_dedup",
                                     "decided_at": "2026-08-08T00:00:00Z",
                                     "_upgrade_evaluation_id": "ev-78"})
          _, r = rows[-1]
          assert r.get("decision") == "revise", f"升级必须同时刷新 decision: {r}"
          assert r["created_at"] == "2026-08-08T00:00:00Z", \
              f"拿到 decided_at 就该把当初退而求其次的同步时刻纠正过来: {r}"

          # ⑥ 别家链路的评价(persona/critic/model)【不得】把决策同步顶掉。
          #    放宽 existing 查询的类型时引入过这个回归: have 非空 → elif have: continue
          #    → 有 persona 评价的 item 永远进不了校准表。
          class PQ:
              def __init__(self, rows): self.rows, self.f = rows, []
              def select(self, _): return self
              def in_(self, col, vals): self.f.append((col, list(vals))); return self
              def or_(self, *a, **k): return self
              def gte(self, *a, **k): return self
              def order(self, _): return self
              def range(self, a, b):
                  rs = self.rows
                  for col, vals in self.f:
                      rs = [r for r in rs if r.get(col) in vals]
                  self.page = rs[a:b + 1]; return self
              def execute(self): return type("R", (), {"data": self.page})()
          ITEMS = [
              {"id": "i-persona", "status": "approved", "user_id": "u", "created_at": "2026-09-01",
