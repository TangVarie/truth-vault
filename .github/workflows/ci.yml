               "decision_source": "human", "reviewer_id": "rev-2"},
              # 换 reviewer: 已归档 human/rev-1, 现在 AW 记的是 rev-2
              {"id": "i-rev",     "status": "approved", "user_id": "u", "created_at": "2026-09-01",
               "decision_source": "human", "reviewer_id": "rev-2"},
          ]
          EVALS = [
              {"evaluation_id": "e1", "autowriter_item_id": "i-persona",
               "evaluator_type": "persona", "evaluator_id": "p1"},
              {"evaluation_id": "e2", "autowriter_item_id": "i-persona",
               "evaluator_type": "model", "evaluator_id": None},
              {"evaluation_id": "e3", "autowriter_item_id": "i-done",
               "evaluator_type": "human", "evaluator_id": "rev-1"},
              {"evaluation_id": "e4", "autowriter_item_id": "i-stale",
               "evaluator_type": "unverified", "evaluator_id": None},
