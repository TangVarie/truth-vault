          out, meta, why = s.inherit_content_from_previous_row(dy, xhs, "recXHS", spec, col)
          assert why is None and out[col] == xhs[col] and out["方向"] == xhs["方向"], (why, out)
          assert meta == {"from": "recXHS", "overrides": {"方向": "抖音"}}, meta
          assert dy["方向"] == "抖音" and col not in dy, "不许改入参"
