# ════════════════════════════════════════════════════════════════════
# 禁词表 fw-v1（全局 · 硬拦）—— owner 2026-09-24 给的 7 个词，D-084 B3
# ════════════════════════════════════════════════════════════════════
#
# 这是什么: 写作台成稿【不许出现】的词。全局生效, 不分项目; 项目级的合规要求仍在各 mapping 的
# compliance.custom_red_flags 里, 两者是并集。
#
# 谁在用: scripts/compliance_words.py 是唯一的读法 (find_hits / sql_regex), 守卫 9 钉着它。
# 写作台 (autowriter 仓) 要用就原样 vendor 本文件并记校验和, 不手抄 (同 D-041 对词表的纪律)。
# ⚠️ 今天 TV 仓里没有任何一步在成稿前跑这个检查 —— 硬拦要写作台那边接 (D-084 B3)。
#
# 规则字段:
#   match: 原样子串。
#   except_followed_by: 紧跟这些字时【不算】—— owner 的口径: 「最」只拦绝对化搭配 (最好/最有效/最安全),
#     「最近/最后/最终/最初」这种时间和顺序用法放行。「第一」照同一个道理放行序数用法 (第一次/第一天);
#     这一条是 TV 类推的, 不是 owner 原话 —— 见 DECISIONS D-084 续。
#   note: 为什么。
#
# 改本表 = version +1, 记 DECISIONS。

version: fw-v1
scope: global
source: owner 2026-09-24（运营回填件 Q5 的 7 个词）

words:
  - match: 最
    except_followed_by: [近, 后, 终, 初, 开, 先, 早, 晚, 起, 里, 外, 上, 下, 前, 底, 边, 中, 多, 少]
    note: 只拦绝对化搭配（最好 / 最有效 / 最安全 / 最便宜 / 最强）；时间、方位、数量的「最」放行。
  - match: 第一
    except_followed_by: [次, 天, 周, 个, 回, 年, 月, 步, 眼, 件, 篇, 口, 批, 波, 句, 时, 段, 位, 排, 行, 页, 层, 站, 秒, 分]
    note: 只拦「第一品牌 / 第一名 / 第一选择」这类排位宣称；「第一次 / 第一天」是序数。TV 类推的口径，待 owner 确认。
  - match: "100%"
    note: 绝对化数字，任何位置都拦（含全角 １００％ 见 aliases）。
    aliases: ["１００％", "100％", "一百分之百", "百分之百", "百分百"]
  - match: 根治
    note: 疗效绝对化。
  - match: 治愈
    note: 疗效绝对化。
  - match: 空窗
    note: 运营给的；全库唯一命中是途鸽的「就业空窗期」（与医美无关），照 owner 拍的全局拦。
  - match: 绝对
    note: 「绝对不会 / 绝对安全」；「绝对值」这种几乎不会出现在稿里，不设例外。
